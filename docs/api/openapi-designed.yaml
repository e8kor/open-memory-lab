      tags: [simulations]
      operationId: getSimulation
      summary: One simulation — audience, rows written, sim-derived taints outside it.
      description: 'Requires: admin key role.'
      parameters: [{ name: simulation_id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: The simulation.
          headers:
            X-Request-Id: { $ref: 'openapi.yaml#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                simulation_id: sim_01JB2YC4E6G8J1L3N5Q7S9VXZB
                state: open
                audience:
                - key_id: 4b155359-710a-4417-811c-904cc3959fcc
                - key_id: d405428e-4c99-426d-8826-76d28436e423
                label: q1-2027 negotiation dry run
                opened_at: '2026-10-29T15:05:00Z'
                ended_at: null
                warnings: []
              schema: { $ref: '#/components/schemas/Simulation' }
        '404': { $ref: 'openapi.yaml#/components/responses/NotFound' }
        default: { $ref: 'openapi.yaml#/components/responses/Error' }

  /v2/simulations/{simulation_id}/audience:
    post:
      tags: [simulations]
      operationId: changeSimulationAudience
      summary: Correct a live simulation's audience — the only recovery from the fail-closed no-dreamer state short of ending it.
      description: 'Requires: admin key role. Journals simulation.audience_changed; the audience at any seq is the fold of simulation.opened plus every audience_changed since. Removal takes effect on the next read; past reads stand in the read log.'
      parameters:
        - { name: simulation_id, in: path, required: true, schema: { type: string } }
        - { $ref: 'openapi.yaml#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            example:
              add:
              - key_id: d405428e-4c99-426d-8826-76d28436e423
              remove: []
              reason: no dreamer in the audience; nothing could promote
            schema:
              type: object
              description: At least one of add/remove must be non-empty (request.validation otherwise).
              properties:
                add:
                  type: array
                  items: { $ref: '#/components/schemas/AudienceEntry' }
                remove:
                  type: array
                  items: { $ref: '#/components/schemas/AudienceEntry' }
                reason: { type: string }
      responses:
        '200':
          description: The resulting audience; carries the same warnings field as creation when it still holds no dreamer key.
          headers:
            X-Request-Id: { $ref: 'openapi.yaml#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                simulation_id: sim_01JB2YC4E6G8J1L3N5Q7S9VXZB
                state: open
                audience:
                - key_id: 4b155359-710a-4417-811c-904cc3959fcc
                - key_id: d405428e-4c99-426d-8826-76d28436e423
                label: q1-2027 negotiation dry run
                opened_at: '2026-10-29T15:05:00Z'
                ended_at: null
                warnings: []
              schema: { $ref: '#/components/schemas/Simulation' }
        '404': { $ref: 'openapi.yaml#/components/responses/NotFound' }
        '409': { $ref: 'openapi.yaml#/components/responses/Conflict' }
        '415': { $ref: 'openapi.yaml#/components/responses/UnsupportedMedia' }
        default: { $ref: 'openapi.yaml#/components/responses/Error' }

  /v2/simulations/{simulation_id}/end:
    post:
      tags: [simulations]
      operationId: endSimulation
      summary: Journalled end — demotes the simulation's rows and triggers re-review of tainted claims; dry_run lists everything the end would touch.
      description: 'Requires: admin key role.'
      parameters:
        - { name: simulation_id, in: path, required: true, schema: { type: string } }
        - { $ref: 'openapi.yaml#/components/parameters/IdempotencyKey' }
      requestBody:
        required: false
        content:
          application/json:
            example:
              dry_run: false
            schema:
              type: object
              properties:
                dry_run: { type: boolean, default: false }
      responses:
        '202':
          description: End journalled; demotion closure proceeding (or the dry-run listing).
          headers:
            X-Request-Id: { $ref: 'openapi.yaml#/components/headers/XRequestId' }
          content:
            application/json:
              example:
