openapi: 3.1.0
info:
  title: Open Memory Lab HTTP API, designed operations
  version: 0.7.3-design
  summary: >-
    The designed annex of the OML HTTP API: decided, not routed. Nothing is generated from it.
  description: >-
    Status: designed, not built. This annex holds under paths the 54 operations the design
    decides and the server does not route, and under x-oml-designed-fields, keyed by
    operationId, the designed fields of operations that openapi.yaml serves (ADR-0039 d9). No
    SDK and no server code is generated from it, and a call to any operation here answers 404
    until the change that serves it moves its entry to openapi.yaml; a designed field sent to a
    served operation answers its v0.3.0 code until then. Every convention of openapi.yaml holds
    here: its authorization model, idempotency, pagination, names and ids, error envelope and
    ErrorCode enum, which this document references rather than repeats. docs/api/http-api.md
    describes both documents, marking each endpoint served or designed, and
    scripts/check_contract_sync.py fails on a path declared in both or on a designed field the
    served operation also declares. Each x-oml-designed-fields entry names its operation's
    request or response and lists the fields' schemas as the operation would declare them.
servers:
  - url: /
    description: Deployment-relative; OML is deployed per installation, there is no central host.
security:
  - bearerAuth: []
tags:
  - name: memories
  - name: claim-administration
  - name: attachments
  - name: edges
  - name: workareas
  - name: vocab
  - name: review
  - name: keys
  - name: bans
  - name: simulations
  - name: exports
  - name: settings
  - name: tenants
  - name: web

paths:
  /v2/memories/{artifact_id}/lineage:
    get:
      tags: [memories]
      operationId: getLineage
      summary: The derivation closure, pending and ratified edges, serialized as stored.
      description: 'Requires: reader effective access. Serialize, don''t compute (D13); out-of-scope nodes are elided to redacted ids.'
      parameters: [{ $ref: 'openapi.yaml#/components/parameters/ArtifactId' }]
      responses:
        '200':
          description: The lineage closure.
          headers:
            X-Request-Id: { $ref: 'openapi.yaml#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                artifact_id: art_01JB2XJH8K1M3P5R7T9W2YA4CE
                nodes:
                - artifact_id: art_01JB2XJH8K1M3P5R7T9W2YA4CE
                  claim_key: accra-metals-price-anchor
                  version: 1
                - artifact_id: art_01JB2XF2R7M9W4K6T8Y1QZ3VH5
                  claim_key: supplier-quote-am-7741
                  version: 1
                - artifact_id: art_01JB2M4N6P8R1T3V5X7Z9BD2FH
                  redacted: true
                edges:
                - from_artifact_id: art_01JB2XJH8K1M3P5R7T9W2YA4CE
                  to_artifact_id: art_01JB2XF2R7M9W4K6T8Y1QZ3VH5
                  kind: derives_from
                  state: ratified
                - from_artifact_id: art_01JB2XF2R7M9W4K6T8Y1QZ3VH5
                  to_artifact_id: art_01JB2M4N6P8R1T3V5X7Z9BD2FH
                  kind: claim_edge
                  state: pending
              schema: { $ref: '#/components/schemas/Lineage' }
        default: { $ref: 'openapi.yaml#/components/responses/Error' }

  /v2/memories/{artifact_id}/reassign:
    post:
      tags: [claim-administration]
      operationId: reassignClaim
      summary: Journalled move between workareas, recording both policy snapshots.
      description: 'Requires: admin key role. Stricter-policy destination re-enters held; refused into validated (workarea.frozen); claim_key collision refused without re_key.'
      parameters:
        - { $ref: 'openapi.yaml#/components/parameters/ArtifactId' }
        - { $ref: 'openapi.yaml#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            example:
              workarea_id: a4497daf-cfc8-4ddc-a0e5-4817efdb56c8
              dry_run: false
            schema: { $ref: '#/components/schemas/ReassignRequest' }
      responses:
        '200':
          description: Moved (or the dry-run preview).
          headers:
            X-Request-Id: { $ref: 'openapi.yaml#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                journal_seq: 4305
                event_id: evt_01JB2YR7S9UB2DX4FZ6H8KM1P3
                dry_run: false
              schema: { $ref: '#/components/schemas/ActResult' }
        '409': { $ref: 'openapi.yaml#/components/responses/Conflict' }
        '415': { $ref: 'openapi.yaml#/components/responses/UnsupportedMedia' }
        default: { $ref: 'openapi.yaml#/components/responses/Error' }

  /v2/memories/{artifact_id}/demote:
    post:
      tags: [claim-administration]
      operationId: demoteClaim
      summary: Journalled demotion; bytes are kept (R4).
      description: 'Requires: admin key role.'
      parameters:
        - { $ref: 'openapi.yaml#/components/parameters/ArtifactId' }
        - { $ref: 'openapi.yaml#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            example:
              version: 2
              reason: quote withdrawn by supplier
            schema: { $ref: '#/components/schemas/DemoteRequest' }
      responses:
        '200':
          description: Demoted.
          headers:
            X-Request-Id: { $ref: 'openapi.yaml#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                journal_seq: 4311
                event_id: evt_01JB2YS8TA1CW3EY5G7J9LN2Q4
                dry_run: false
              schema: { $ref: '#/components/schemas/ActResult' }
        '415': { $ref: 'openapi.yaml#/components/responses/UnsupportedMedia' }
        default: { $ref: 'openapi.yaml#/components/responses/Error' }

  /v2/memories/{artifact_id}/erase:
    post:
      tags: [claim-administration]
      operationId: eraseClaim
      summary: Journalled crypto-shred — erase event plus DEK destruction, scoped to body and attachment bytes.
      description: 'Requires: admin key role. dry_run returns the erasure inventory per copy class. Attribution metadata survives — #146.'
      parameters:
        - { $ref: 'openapi.yaml#/components/parameters/ArtifactId' }
        - { $ref: 'openapi.yaml#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            example:
              dry_run: true
            schema: { $ref: '#/components/schemas/EraseRequest' }
      responses:
        '202':
          description: Erase journalled, DEK destroyed (or the dry-run inventory).
          headers:
            X-Request-Id: { $ref: 'openapi.yaml#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                journal_seq: null
                event_id: null
                dry_run: true
                preview:
                  copy_classes:
                  - copy_class: postgres_body
                    disposition: unreadable on DEK destruction
                  - copy_class: attachment_objects
                    count: 1
                    disposition: unreadable on DEK destruction
                  - copy_class: lake_derived
                    disposition: unreadable on DEK destruction
              schema: { $ref: '#/components/schemas/ActResult' }
        '415': { $ref: 'openapi.yaml#/components/responses/UnsupportedMedia' }
        default: { $ref: 'openapi.yaml#/components/responses/Error' }

  /v2/claims/tip-override:
    post:
      tags: [claim-administration]
      operationId: tipOverride
      summary: Designate an earlier promoted version as the served tip — explicit and journalled, never a silent re-rank.
      description: 'Requires: admin key role. Journals lifecycle.tip_override. Refused with simulation.tip_refused when the designated version is tainted — taint never captures the default tip.'
      parameters: [{ $ref: 'openapi.yaml#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            example:
              workarea_id: fbbb41c5-9630-4274-ae53-166f562f5286
              claim_key: supplier-quote-am-7741
              to_version: 1
              reason: revised quote promoted in error; serve v1 while it is re-reviewed
            schema: { $ref: '#/components/schemas/TipOverrideRequest' }
      responses:
        '200':
          description: Tip overridden.
          headers:
            X-Request-Id: { $ref: 'openapi.yaml#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                journal_seq: 4330
                event_id: evt_01JB2YT9UB2DX4FZ6H8KM1P3R5
                dry_run: false
              schema: { $ref: '#/components/schemas/ActResult' }
        '415': { $ref: 'openapi.yaml#/components/responses/UnsupportedMedia' }
        default: { $ref: 'openapi.yaml#/components/responses/Error' }

  /v1/attachments/uploads:
    post:
      tags: [attachments]
      operationId: createUploadSession
      summary: Open a resumable upload session recording the expected plaintext digest up front.
      description: 'Requires: writer effective access. The session is scoped to the uploading key and expires (D3).'
      parameters: [{ $ref: 'openapi.yaml#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            example:
              expected_digest: sha256:9f2c41aa7d0e8b64c3f2a19e5d87b4610c3e9f2a84d7b1c6e0f5a382947d1c5b
              size_bytes: 184233
              media_type: application/pdf
            schema: { $ref: '#/components/schemas/UploadSessionCreate' }
      responses:
        '201':
          description: The session.
          headers:
            X-Request-Id: { $ref: 'openapi.yaml#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                session_id: ups_01JB2XD9W6E4T2Y8U1O3PA5SKF
                expected_digest: sha256:9f2c41aa7d0e8b64c3f2a19e5d87b4610c3e9f2a84d7b1c6e0f5a382947d1c5b
                size_bytes: 184233
                media_type: application/pdf
                state: open
                parts: []
                expires_at: '2026-10-29T18:40:00Z'
              schema: { $ref: '#/components/schemas/UploadSession' }
        '415': { $ref: 'openapi.yaml#/components/responses/UnsupportedMedia' }
        '429': { $ref: 'openapi.yaml#/components/responses/RateLimited' }
        default: { $ref: 'openapi.yaml#/components/responses/Error' }

  /v1/attachments/uploads/{session_id}/parts/{part_number}:
    put:
      tags: [attachments]
      operationId: putUploadPart
      summary: Upload one part; replaying a part is harmless (verified by digest at completion).
      description: 'Requires: writer, session owner. No Idempotency-Key — a part is addressed by (session, part_number). Parts are 5–64 MiB (http-api.md Limits); an oversized part answers 413 request.payload_too_large.'
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: string } }
        - { name: part_number, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '204':
          description: Part stored.
          headers:
            X-Request-Id: { $ref: 'openapi.yaml#/components/headers/XRequestId' }
        '409': { $ref: 'openapi.yaml#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '415': { $ref: 'openapi.yaml#/components/responses/UnsupportedMedia' }
        '429': { $ref: 'openapi.yaml#/components/responses/RateLimited' }
        default: { $ref: 'openapi.yaml#/components/responses/Error' }

  /v1/attachments/uploads/{session_id}/complete:
    post:
      tags: [attachments]
      operationId: completeUploadSession
      summary: Assemble, hash, compare against the expected digest; store encrypted on match.
      description: 'Requires: writer, session owner. upload.digest_mismatch when the bytes are not what the session promised.'
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: string } }
        - { $ref: 'openapi.yaml#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Content-addressed attachment stored, inert until a submission binds it.
          headers:
            X-Request-Id: { $ref: 'openapi.yaml#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                digest: sha256:9f2c41aa7d0e8b64c3f2a19e5d87b4610c3e9f2a84d7b1c6e0f5a382947d1c5b
                ciphertext_digest: sha256:52b8e04d7a1f3c96e2d50b84a7c91e36f40d82b5c6a1973e0f5d24c8a9b1e670
                state: complete
              schema: { $ref: '#/components/schemas/UploadComplete' }
        '409': { $ref: 'openapi.yaml#/components/responses/Conflict' }
        '422': { $ref: 'openapi.yaml#/components/responses/Unprocessable' }
        '429': { $ref: 'openapi.yaml#/components/responses/RateLimited' }
        default: { $ref: 'openapi.yaml#/components/responses/Error' }

  /v1/attachments/{digest}:
    get:
      tags: [attachments]
      operationId: getAttachment
      summary: Fetch attachment bytes, decrypted on the serving path, plaintext digest verified before serving.
      description: 'Requires: reader access to a promoted claim binding the digest; the author for own held; a reviewer under a valid serve_id. Logged as a read.'
      parameters:
        - { name: digest, in: path, required: true, schema: { $ref: 'openapi.yaml#/components/schemas/Digest' } }
        - { name: serve_id, in: query, schema: { type: string }, description: Reviewer fetch under a serve binding. }
      responses:
        '200':
          description: The plaintext bytes.
          headers:
            X-Request-Id: { $ref: 'openapi.yaml#/components/headers/XRequestId' }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: 'openapi.yaml#/components/responses/NotFound' }
        '410': { $ref: 'openapi.yaml#/components/responses/Gone' }
        '429': { $ref: 'openapi.yaml#/components/responses/RateLimited' }
        default: { $ref: 'openapi.yaml#/components/responses/Error' }

  /v2/workareas:
    get:
      tags: [workareas]
      operationId: resolveWorkarea
      summary: Resolve a workarea node by derived path (grants bind to node ids, never paths).
      description: 'Requires: reader effective access on the node, or the admin key role, which reads the structure of every workarea in its tenant without grants and never claim content (docs/architecture/roles-and-keys.md, permission matrix footnote 6; ADR-0026 d15).'
      parameters:
        - { name: path, in: query, required: true, schema: { type: string }, description: 'Derived ltree path. The one lookup by path: no reference field accepts a path (ADR-0026 d7).' }
      responses:
        '200':
          description: The node.
          headers:
            X-Request-Id: { $ref: 'openapi.yaml#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                id: fbbb41c5-9630-4274-ae53-166f562f5286
                name: metals-crew
                parent_id: 1351b2b6-5c7c-492d-9aff-630bc95035db
                path: universe.procurement.metals-crew
                status: committed
                crew:
                  crew_id: d10bcbe9-032d-4080-aa0c-cc06f8acd89f
                  name: metals-crew
                  charter_uri: https://crews.example.com/metals/charter.md
                  external_manager: crewd.example.com
                created_at: '2026-09-02T09:14:33Z'
              schema: { $ref: 'openapi.yaml#/components/schemas/Workarea' }
        '404': { $ref: 'openapi.yaml#/components/responses/NotFound' }
        default: { $ref: 'openapi.yaml#/components/responses/Error' }

  /v2/workareas/{workarea}/reparent:
    post:
      tags: [workareas]
      operationId: reparentWorkarea
      summary: Journalled single-transaction descendant path rewrite; dry_run previews paths and grants affected.
      description: 'Requires: admin key role. Re-parenting into a validated destination is refused (workarea.frozen).'
      parameters:
        - { $ref: 'openapi.yaml#/components/parameters/WorkareaId' }
        - { $ref: 'openapi.yaml#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            example:
              new_parent_id: 1351b2b6-5c7c-492d-9aff-630bc95035db
              dry_run: true
            schema: { $ref: '#/components/schemas/ReparentRequest' }
      responses:
        '200':
          description: Re-parented (or the dry-run preview).
          headers:
            X-Request-Id: { $ref: 'openapi.yaml#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                journal_seq: null
                event_id: null
                dry_run: true
                preview:
                  paths_rewritten: 2
                  grants_affected: []
              schema: { $ref: '#/components/schemas/ActResult' }
        '409': { $ref: 'openapi.yaml#/components/responses/Conflict' }
        '415': { $ref: 'openapi.yaml#/components/responses/UnsupportedMedia' }
        default: { $ref: 'openapi.yaml#/components/responses/Error' }

  /v2/vocab/suggest:
    get:
      tags: [vocab]
      operationId: suggestTerms
      summary: Deterministic prefix+label typeahead over granted vocabulary workareas — matching, never interpretation.
      description: 'Requires: reader effective access on the vocabulary workarea(s) searched; vocabularies outside scope are absent (fail closed).'
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: workarea_id, in: query, schema: { $ref: 'openapi.yaml#/components/schemas/WorkareaRef' }, description: Restrict to one vocabulary workarea. }
        - { $ref: 'openapi.yaml#/components/parameters/Limit' }
        - { $ref: 'openapi.yaml#/components/parameters/Cursor' }
      responses:
        '200':
          description: One page of suggestions.
          headers:
            X-Request-Id: { $ref: 'openapi.yaml#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                items:
                - curie: proc:price-quote
                  label: price quote
                  term_status: active
                - curie: proc:supplier-quote
                  label: supplier quote
                  term_status: deprecated
                next_cursor: null
              schema: { $ref: '#/components/schemas/VocabSuggestPage' }
        '429': { $ref: 'openapi.yaml#/components/responses/RateLimited' }
        default: { $ref: 'openapi.yaml#/components/responses/Error' }

  /v2/vocab/terms/{curie}:
    get:
      tags: [vocab]
      operationId: getTerm
      summary: One term record — status, successors, the releases its tip appears in.
      description: 'Requires: reader effective access on the owning vocabulary workarea. Unknown and out-of-scope CURIEs answer 404 access.not_found, indistinguishable (fail closed).'
      parameters: [{ $ref: '#/components/parameters/Curie' }]
      responses:
        '200':
          description: The term.
          headers:
            X-Request-Id: { $ref: 'openapi.yaml#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                curie: proc:supplier-quote
                workarea_id: 408324c0-55dd-4eb7-b39f-2d7f7147dc66
                version: 4
                term_status: deprecated
                definition_state: present
                successors:
                - curie: proc:price-quote
                  relation: replaced_by
                releases:
                - rel_01JB2Z2D4F6H8K1M3P5R7TVXZB
              schema: { $ref: '#/components/schemas/VocabTerm' }
        '404': { $ref: 'openapi.yaml#/components/responses/NotFound' }
        default: { $ref: 'openapi.yaml#/components/responses/Error' }

  /v2/vocab/terms/{curie}/hierarchy:
    get:
      tags: [vocab]
      operationId: getTermHierarchy
      summary: Parents, children, ancestors or descendants over ratified is_a — a lookup over the per-release closure, never a traversal.
      description: 'Requires: reader effective access on the owning vocabulary workarea. Closure rows are materialized at release ratification (serialize, don''t compute — ADR-0021); release defaults to the owning vocabulary''s latest ratified release.'
      parameters:
        - { $ref: '#/components/parameters/Curie' }
        - { name: direction, in: query, required: true, schema: { type: string, enum: [parents, children, ancestors, descendants] } }
        - { name: release, in: query, schema: { type: string }, description: A vocab_release id; defaults to the owning vocabulary's latest ratified release. }
        - { $ref: 'openapi.yaml#/components/parameters/Limit' }
        - { $ref: 'openapi.yaml#/components/parameters/Cursor' }
      responses:
        '200':
          description: One page of related terms, naming the release the closure was read from.
          headers:
            X-Request-Id: { $ref: 'openapi.yaml#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                items:
                - curie: proc:quote
                  label: quote
                  term_status: active
                release: rel_01JB2Z2D4F6H8K1M3P5R7TVXZB
                next_cursor: null
              schema: { $ref: '#/components/schemas/VocabHierarchyPage' }
        '404': { $ref: 'openapi.yaml#/components/responses/NotFound' }
        default: { $ref: 'openapi.yaml#/components/responses/Error' }

  /v2/vocab/mappings:
    get:
      tags: [vocab]
      operationId: listTermMappings
      summary: Ratified SSSOM-shaped mappings touching a term; both endpoints persist — a mapping never merges.
      description: 'Requires: reader effective access on the queried term''s vocabulary; mapping rows outside the key''s read scope are absent (fail closed).'
      parameters:
        - { name: term, in: query, required: true, schema: { $ref: '#/components/schemas/Curie' } }
        - { $ref: 'openapi.yaml#/components/parameters/Limit' }
        - { $ref: 'openapi.yaml#/components/parameters/Cursor' }
      responses:
        '200':
          description: One page of mappings.
          headers:
            X-Request-Id: { $ref: 'openapi.yaml#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                items:
                - subject: proc:price-quote
                  object: fin:quotation
                  predicate: closeMatch
                  justification: human-curated
                  note: fin:quotation covers bids; proc:price-quote is supplier-issued only
                  ratified_at: '2026-10-20T11:02:44Z'
                next_cursor: null
              schema: { $ref: '#/components/schemas/TermMappingPage' }
        default: { $ref: 'openapi.yaml#/components/responses/Error' }

  /v2/review/reopen:
    post:
      tags: [review]
      operationId: reopenRejection
      summary: Non-author reopen of a rejection — a journalled verb, not a resubmission.
      description: 'Requires: dreamer(review); the original author is refused (review.author_in_lineage). A held_by: service key is refused with access.verb_ceiling before any lookup (ADR-0025 d1). A reopen that would put a second live version under one claim_key and ordinal is refused with 409 submission.claim_key_conflict (docs/architecture/audit-and-lineage.md, Supersession chains, claim_key and the tip; ADR-0025 d18).'
      parameters: [{ $ref: 'openapi.yaml#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            example:
              artifact_id: art_01JB2M4N6P8R1T3V5X7Z9BD2FH
              version: 1
              reason: rejection cited a stale source; re-review against the revised quote
            schema: { $ref: '#/components/schemas/ReopenRequest' }
      responses:
        '200':
          description: Returned to the review queue.
          headers:
            X-Request-Id: { $ref: 'openapi.yaml#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                journal_seq: 4351
                event_id: evt_01JB2YV1CW3EY5G7J9LN2Q4S6
                dry_run: false
              schema: { $ref: '#/components/schemas/ActResult' }
        '403': { $ref: 'openapi.yaml#/components/responses/Forbidden' }
        '409': { $ref: 'openapi.yaml#/components/responses/Conflict' }
        '415': { $ref: 'openapi.yaml#/components/responses/UnsupportedMedia' }
        default: { $ref: 'openapi.yaml#/components/responses/Error' }

  /v2/keys/{key}/revoke:
    post:
      tags: [keys]
      operationId: revokeKey
      summary: Journalled revocation, effective at the key's next request served by the lead, and after replication lag on a follower.
      description: 'Requires: admin key role.'
      parameters:
        - { $ref: 'openapi.yaml#/components/parameters/KeyId' }
        - { $ref: 'openapi.yaml#/components/parameters/IdempotencyKey' }
      requestBody:
        required: false
        content:
          application/json:
            example:
              reason: agent decommissioned
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200':
          description: Revoked.
          headers:
            X-Request-Id: { $ref: 'openapi.yaml#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                journal_seq: 4360
                event_id: evt_01JB2YW2DX4FZ6H8KM1P3R5T7
                dry_run: false
              schema: { $ref: '#/components/schemas/ActResult' }
        '415': { $ref: 'openapi.yaml#/components/responses/UnsupportedMedia' }
        default: { $ref: 'openapi.yaml#/components/responses/Error' }

  /v2/keys/{key}/rotate:
    post:
      tags: [keys]
      operationId: rotateKey
      summary: Mint a successor key (new key_id, linked by rotated_from, grants reproduced from the journalled records); the old key enters a bounded grace window, then is revoked.
      description: 'Requires: admin key role. One journalled act (key.rotated) carries both key ids, the successor''s name and the grace deadline; at the deadline the old key is revoked (journalled, epoch bump). The successor takes its own name (409 name.taken when held), since both keys are live through the grace window, and carries the old key''s crew (ADR-0026 d9). A connector key is not rotated: 422 oauth.connect_refused with details.reason connector_key, because a successor''s value would make it a bearer key; a fresh connection is a new connect code, a fresh identity a new connector key (ADR-0031 d7). Per key in v1; bulk crew rotation is open — #120.'
      parameters:
        - { $ref: 'openapi.yaml#/components/parameters/KeyId' }
        - { $ref: 'openapi.yaml#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: procure-agent-7-r2
              grace: 72h
            schema: { $ref: '#/components/schemas/KeyRotateRequest' }
      responses:
        '201':
          description: The successor key, value shown once, rotated_from naming the old key.
          headers:
            X-Request-Id: { $ref: 'openapi.yaml#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                key_id: 080b4bed-308d-48f7-8b3e-90b6f403e2e3
                name: procure-agent-7-r2
                role: writer
                principal: crew-procure/agent-7
                crew_id: d10bcbe9-032d-4080-aa0c-cc06f8acd89f
                default_workarea_id: fbbb41c5-9630-4274-ae53-166f562f5286
                held_by: agent
                label: procure agent 7
                expiry: null
                revoked_at: null
                rotated_from: 4b155359-710a-4417-811c-904cc3959fcc
                grants:
                - workarea_node_id: fbbb41c5-9630-4274-ae53-166f562f5286
                  role: writer
                  grant_id: gr_01JB2YX3EY5G7J9LN2Q4S6U8W1
                  epoch: 8
                denials: []
                epoch: 8
                value: oml_9rT2wXq5bD0eG7hJ4kM8vN3pL6sU1yZaC4fQ7xT9mK2
              schema: { $ref: 'openapi.yaml#/components/schemas/KeyIssued' }
        '415': { $ref: 'openapi.yaml#/components/responses/UnsupportedMedia' }
        '422': { $ref: 'openapi.yaml#/components/responses/Unprocessable' }
        default: { $ref: 'openapi.yaml#/components/responses/Error' }

  /v2/keys/{key}/grants:
    post:
      tags: [keys]
      operationId: addGrant
      summary: Bind the key to a workarea node, by id or name (never a path), with optional per-grant deny masks; epoch bump.
      description: 'Requires: admin key role. A grant''s role must be admissible under the key''s role (the admissibility table in docs/architecture/roles-and-keys.md; access.issuer_ceiling with details {role, admissible} otherwise — one grant, so no grant_index); a dreamer-class grant on an admin key is refused first (access.role_exclusive — the two-key rule). The grant''s epoch is its grant.issued journal seq.'
      parameters:
        - { $ref: 'openapi.yaml#/components/parameters/KeyId' }
        - { $ref: 'openapi.yaml#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            example:
              workarea: q1-2027
              role: writer
            schema: { $ref: 'openapi.yaml#/components/schemas/GrantRequest' }
      responses:
        '201':
          description: The grant.
          headers:
            X-Request-Id: { $ref: 'openapi.yaml#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                workarea_node_id: a4497daf-cfc8-4ddc-a0e5-4817efdb56c8
                role: writer
                grant_id: gr_01JB2YQ6R8TA1CW3EY5G7J9LN2
                epoch: 9
              schema: { $ref: 'openapi.yaml#/components/schemas/Grant' }
        '415': { $ref: 'openapi.yaml#/components/responses/UnsupportedMedia' }
        default: { $ref: 'openapi.yaml#/components/responses/Error' }

  /v2/keys/{key}/grants/{grant_id}/revoke:
    post:
      tags: [keys]
      operationId: revokeGrant
      summary: Journalled grant removal; epoch bump.
      description: 'Requires: admin key role.'
      parameters:
        - { $ref: 'openapi.yaml#/components/parameters/KeyId' }
        - { name: grant_id, in: path, required: true, schema: { type: string } }
        - { $ref: 'openapi.yaml#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Revoked.
          headers:
            X-Request-Id: { $ref: 'openapi.yaml#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                journal_seq: 4364
                event_id: evt_01JB2YY4FZ6H8KM1P3R5T7V9X2
                dry_run: false
              schema: { $ref: '#/components/schemas/ActResult' }
        default: { $ref: 'openapi.yaml#/components/responses/Error' }

  /v2/keys/{key}/denials/{denial_id}/lift:
    post:
      tags: [keys]
