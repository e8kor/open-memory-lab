              example:
                key_id: 4b155359-710a-4417-811c-904cc3959fcc
                name: procure-agent-7
                role: writer
                principal: crew-procure/agent-7
                crew_id: d10bcbe9-032d-4080-aa0c-cc06f8acd89f
                default_workarea_id: fbbb41c5-9630-4274-ae53-166f562f5286
                held_by: agent
                label: procure agent 7
                expiry: null
                revoked_at: null
                rotated_from: null
                grants:
                - workarea_node_id: fbbb41c5-9630-4274-ae53-166f562f5286
                  role: writer
                  grant_id: gr_01JB2YQ6R8TA1CW3EY5G7J9LN2
                  epoch: 814
                - workarea_node_id: fbbb41c5-9630-4274-ae53-166f562f5286
                  role: reader
                  grant_id: gr_01JB2YQ7S9UB2DX4FZ6H8K1MP3
                  epoch: 815
                denials: []
                epoch: 815
                value: oml_4fQ7xT9mK2pL8vR3nW6zA1cY5bD0eG7hJ4kM9sU2wXq
              schema: { $ref: '#/components/schemas/KeyIssued' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        default: { $ref: '#/components/responses/Error' }

  /v2/whoami:
    get:
      tags: [keys]
      operationId: whoami
      parameters: [{ $ref: '#/components/parameters/XRequestId' }, { $ref: '#/components/parameters/XCorrelationId' }, { $ref: '#/components/parameters/Traceparent' }]
      summary: The calling key's own record — role, name, tenant, default workarea, crew and grants. Never its denials or deny masks.
      description: >-
        Requires: any live key; it reads only its own record. Each reference is {id, name} and the
        default workarea carries its derived path. The key's denials and its grants' per-grant deny
        masks, which name subtrees it may not read, are omitted; the read journals nothing, since it reads no claim. A revoked or
        unknown key answers auth.invalid as on every route (docs/api/http-api.md, Whoami;
        ADR-0039 d15).
      responses:
