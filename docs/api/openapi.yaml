                key_id: key_01JB2W1A3C5E7G9J2L4N6Q8SUW
                role: dreamer
                principal: crew-review/agent-3
                default_workarea_id: wa_01JB2XCQ4T8Z9K2M5P7R1VH3ND
                held_by: agent
                label: metals review agent
                expiry: null
                revoked_at: null
                rotated_from: null
                grants:
                - workarea_node_id: wa_01JB2XCQ4T8Z9K2M5P7R1VH3ND
                  role: dreamer
                  grant_id: gr_01JB2YG8J1L3N5Q7S9UA2CW4FZ
                  epoch: 41
                denials: []
                epoch: 41
              schema: { $ref: '#/components/schemas/Key' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /v2/keys/{key_id}/revoke:
    post:
      tags: [keys]
      operationId: revokeKey
      summary: Journalled revocation, effective at the key's next request served by the lead, and after replication lag on a follower.
      description: 'Requires: admin key role.'
      parameters:
        - { $ref: '#/components/parameters/KeyId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: false
        content:
          application/json:
            example:
              reason: agent decommissioned
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200':
          description: Revoked.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                journal_seq: 4360
                event_id: evt_01JB2YW2DX4FZ6H8KM1P3R5T7
                dry_run: false
              schema: { $ref: '#/components/schemas/ActResult' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        default: { $ref: '#/components/responses/Error' }

  /v2/keys/{key_id}/rotate:
    post:
      tags: [keys]
      operationId: rotateKey
      summary: Mint a successor key (new key_id, linked by rotated_from, grants reproduced from the journalled records); the old key enters a bounded grace window, then is revoked.
      description: 'Requires: admin key role. One journalled act (key.rotated) carries both key ids and the grace deadline; at the deadline the old key is revoked (journalled, epoch bump). Per key in v1; bulk crew rotation is open — FR-6.'
      parameters:
        - { $ref: '#/components/parameters/KeyId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: false
        content:
          application/json:
            example:
              grace: 72h
            schema:
              type: object
              properties:
                grace: { type: string, description: 'Bounded grace window before the old key is revoked, e.g. "72h".' }
      responses:
        '201':
          description: The successor key, value shown once, rotated_from naming the old key.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                key_id: key_01JB2WX8D1F3H5K7M9P2R4TVXZ
                role: writer
                principal: crew-procure/agent-7
                default_workarea_id: wa_01JB2XCQ4T8Z9K2M5P7R1VH3ND
                held_by: agent
                label: procure agent 7
                expiry: null
                revoked_at: null
                rotated_from: key_01JB2WR4A6C8E1G3J5L7N9QSUW
                grants:
                - workarea_node_id: wa_01JB2XCQ4T8Z9K2M5P7R1VH3ND
                  role: writer
                  grant_id: gr_01JB2YX3EY5G7J9LN2Q4S6U8W1
                  epoch: 8
                denials: []
                epoch: 8
                value: oml_9rT2wXq5bD0eG7hJ4kM8vN3pL6sU1yZaC4fQ7xT9mK2
              schema: { $ref: '#/components/schemas/KeyIssued' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        default: { $ref: '#/components/responses/Error' }

  /v2/keys/{key_id}/grants:
    post:
      tags: [keys]
      operationId: addGrant
      summary: Bind the key to a workarea node id (never a path) with optional per-grant deny masks; epoch bump.
      description: 'Requires: admin key role. A grant''s role must be admissible under the key''s role (the admissibility table in docs/architecture/roles-and-keys.md; access.issuer_ceiling with details {role, admissible} otherwise — one grant, so no grant_index); a dreamer-class grant on an admin key is refused first (access.role_exclusive — the two-key rule). The grant''s epoch is its grant.issued journal seq.'
      parameters:
        - { $ref: '#/components/parameters/KeyId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            example:
              workarea_node_id: wa_01JB2Y5R7T9V2X4Z6BD8FH1KM3
              role: writer
            schema: { $ref: '#/components/schemas/GrantRequest' }
      responses:
        '201':
          description: The grant.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                workarea_node_id: wa_01JB2Y5R7T9V2X4Z6BD8FH1KM3
                role: writer
                grant_id: gr_01JB2YQ6R8TA1CW3EY5G7J9LN2
                epoch: 9
              schema: { $ref: '#/components/schemas/Grant' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        default: { $ref: '#/components/responses/Error' }

  /v2/keys/{key_id}/grants/{grant_id}/revoke:
    post:
      tags: [keys]
      operationId: revokeGrant
      summary: Journalled grant removal; epoch bump.
      description: 'Requires: admin key role.'
      parameters:
        - { $ref: '#/components/parameters/KeyId' }
        - { name: grant_id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Revoked.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                journal_seq: 4364
                event_id: evt_01JB2YY4FZ6H8KM1P3R5T7V9X2
                dry_run: false
              schema: { $ref: '#/components/schemas/ActResult' }
        default: { $ref: '#/components/responses/Error' }

  /v2/keys/{key_id}/denials:
    post:
      tags: [keys]
      operationId: addDenial
      summary: Create or extend the key's global deny object — deny-wins across all its grants.
      description: 'Requires: admin key role. Distinct from a per-grant deny mask. Journalled as key.denied; the denial''s epoch is that event''s journal seq.'
      parameters:
        - { $ref: '#/components/parameters/KeyId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            example:
              workarea_node_id: wa_01JB2Y5R7T9V2X4Z6BD8FH1KM3
              reason: quarantine the q1-2027 subtree during incident 44
            schema: { $ref: '#/components/schemas/DenialRequest' }
      responses:
        '201':
          description: The denial.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                denial_id: dn_01JB2YH9K2M4P6R8TA1CV3EX5G
                workarea_node_id: wa_01JB2Y5R7T9V2X4Z6BD8FH1KM3
                epoch: 10
                lifted: false
              schema: { $ref: '#/components/schemas/Denial' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        default: { $ref: '#/components/responses/Error' }

  /v2/keys/{key_id}/denials/{denial_id}/lift:
    post:
      tags: [keys]
      operationId: liftDenial
      summary: Journalled lift of a global denial.
      description: 'Requires: admin key role.'
      parameters:
        - { $ref: '#/components/parameters/KeyId' }
        - { name: denial_id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Lifted.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                journal_seq: 4371
                event_id: evt_01JB2YZ5G7J9LN2Q4S6U8W1Y3A
                dry_run: false
              schema: { $ref: '#/components/schemas/ActResult' }
        default: { $ref: '#/components/responses/Error' }

  /v2/keys/{key_id}/effective-access:
    get:
      tags: [keys]
      operationId: getEffectiveAccess
      summary: The resolved answer — what this key may do where, and which deny produced each hole.
