                simulation_id: sim_01JB2YC4E6G8J1L3N5Q7S9VXZB
                state: open
                audience:
                - key_id: key_01JB2WR4A6C8E1G3J5L7N9QSUW
                - key_id: key_01JB2W1A3C5E7G9J2L4N6Q8SUW
                label: q1-2027 negotiation dry run
                opened_at: '2026-10-29T15:05:00Z'
                ended_at: null
                warnings: []
              schema: { $ref: '#/components/schemas/Simulation' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        default: { $ref: '#/components/responses/Error' }

  /v2/simulations/{simulation_id}:
    get:
      tags: [simulations]
      operationId: getSimulation
      summary: One simulation — audience, rows written, sim-derived taints outside it.
      description: 'Requires: admin key role.'
