        - { $ref: '#/components/parameters/Traceparent' }
        - name: workarea
          in: query
          required: false
          schema: { type: string }
          description: The scope node, by id or name, within the key's grants; omitted, the key's default workarea.
      summary: The guardrails in force at the scope node, under the key's reader access and guardrail scope; never in recall.
      description: >-
        Requires: reader on the scope node. Serves the promoted guardrail tips on the node and,
        under guardrail_scope ancestors, on each ancestor the key reads; the scope is the key's,
        set at issuance, and any parameter other than workarea, guardrail_scope included, is
        request.validation naming it (docs/api/http-api.md, Guardrails; ADR-0037 d4, d5,
        d7; since v0.5.1).
      responses:
