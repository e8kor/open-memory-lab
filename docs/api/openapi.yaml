openapi: 3.1.0
info:
  title: Open Memory Lab HTTP API
  version: 0.5.1-design
  summary: >-
    The two-ring JSON API of OML, an agentic external memory provider: /v1 the provider ring,
    /v2 the memory lab.
  description: >-
    Status: served. This document declares exactly the operations the server routes, each with only
    the fields the build accepts, and the complete ErrorCode enum (ADR-0039 d9). The designed
    operations, and the designed fields of served operations under x-oml-designed-fields, are
    declared in openapi-designed.yaml, from which nothing is generated; an entry moves here in the
    change that serves it, and a designed field sent to a served operation answers its v0.3.0 code.
    Together the two documents are the machine-readable form of docs/api/http-api.md and declare the
    same contract; the typed error taxonomy is declared in docs/api/errors.md and mirrored here as
    the ErrorCode enum. One keyed listener carries two stability rings (ADR-0022): /v1 is the memory
    provider foundation — submit, read own and promoted, recall and supersede here, with the
    reserved POST /v1/memories:batch of FR-12 and the designed attachment upload/fetch flow beside
    them — under the v1 compatibility covenant: once FR-21 declares v1 stable, v1 changes are
    additive only (no field removed, no semantic changed, no status code repurposed); anything that
    would break a v1 client is, by definition, a v2 capability. /v2 is the memory lab — review,
    workarea, crew and key administration, whoami, bootstrap and the events tail here, and in the
    designed document the ratification ceremonies, edges, claim administration, simulations,
    exports, settings, tenants and vocabularies — and evolves; it may re-version without ever
    touching /v1. On the provider ring a request names its workarea in one field, workarea, in the
    body of a write or a recall and in the query of a listing or the events tail; omitted, it
    resolves from the key's journalled default_workarea (request.workarea_unresolved when the key
    has none), and v0.3.0's X-OML-Workarea header is refused naming it (ADR-0039 d4, d7); /v2
    keeps explicit workarea references in paths and bodies. Workareas, crews, keys and tenants are named
    (ADR-0026): every request field, path parameter, query parameter and header that names one of
    them takes the row's id (RFC 9562 hex-and-dash UUID text, never version 8) or its name (the
    NameRef schema, the reference grammar; creation bodies take Name, the creation grammar),
    resolved server-side by substituting the id before any check that reads state, so an unknown or
    unreadable name answers exactly what its id would; responses carry ids, and each of the four
    objects carries its name (docs/api/http-api.md, Names and ids). Authorization model: bearer API
    keys carrying one role (reader, writer, dreamer, admin, operator); tenant is derived server-side
    from the key, never from the request. Roles do not nest. Read verbs require reader effective
    access on the named workarea; write verbs writer; propose/review verbs dreamer (two capability
    classes, one role); admin and operator verbs require that key role itself — the per-operation
    description states the ceiling ("Requires: ..."). A key's role admits a fixed set of grant
    roles, and every workarea-scoped verb refuses in one order (verb_ceiling, grant_refused on a
    readable node, not_found otherwise — declared in docs/architecture/roles-and-keys.md, ADR-0025
    d1). The verb ceiling is constitutional (R1): no agent-facing role reaches promote, sign,
    demote, delete or any admin verb. Reads fail closed as absence (404 access.not_found). Every
    state-creating POST requires an Idempotency-Key header; replays return the stored response with
    header Idempotency-Replay: true. Field spellings are design identifiers — normative in shape,
    adjustable at implementation without a design change. Every response, success and error alike,
    carries the X-Request-Id and X-Correlation-Id headers (declared in components.headers and
    attached to every 2xx; error bodies repeat the request id as request_id), and every operation
    reads the optional X-Request-Id, X-Correlation-Id and traceparent request headers (declared in
    components.parameters; ADR-0042 d4-d6, d13). An operation with a fixed request media type (application/json
    everywhere except the octet-stream part upload) refuses any other request media type with 415
    request.unsupported_media. 429 limit.rate / limit.quota may be answered by any operation; it is
    declared explicitly only on the v1 ring and high-traffic v2 surfaces. Connections (ADR-0031),
    where the deployment sets oauth.issuer: the RFC 9728 and RFC 8414 discovery documents and the
    /oauth/* endpoints are served unversioned, unauthenticated and outside both rings, speaking
    their RFCs' wire shapes and carrying the oauth error family inside RFC error bodies; unset,
    each answers 404 as an unknown path does. /mcp, whose contract is docs/api/mcp-tools.json,
    accepts a connection's access token beside a key and answers a 401 with the RFC 9728
    challenge; the token is a credential nowhere else. The connect-code and connection routes
    under /v2/keys are served whether or not oauth.issuer is set, minting a code only where it is.
servers:
  - url: /
    description: Deployment-relative; OML is deployed per installation, there is no central host.
security:
  - bearerAuth: []
tags:
  - name: memories
  - name: workareas
  - name: crews
  - name: edges
  - name: events
  - name: review
  - name: keys
  - name: oauth
  - name: web
  - name: admin
  - name: health

paths:
  /v1/memories:
    post:
      tags: [memories]
      operationId: submitMemory
      summary: Submit a memory (remember or learn); held on arrival, scanned same-call.
      description: 'Requires: writer effective access on the resolved workarea; every derives_from ancestor must be readable by the key — promoted within its reader effective access, or its own row in any state — else 404 access.not_found, indistinguishable from a nonexistent id (ADR-0025 d3); lineage is attribution, not a verb of its own. The target workarea is the body''s workarea, by id or name, honoured only within the key''s grants, else the key''s default_workarea; request.workarea_unresolved with neither, and an X-OML-Workarea header is request.validation naming /workarea in details.renamed_to (ADR-0039 d7). Journals submission.remember or submission.learn; verb learn with an empty or omitted derives_from is refused (submission.lineage_required).'
      parameters:
        - { $ref: '#/components/parameters/XRequestId' }
        - { $ref: '#/components/parameters/XCorrelationId' }
        - { $ref: '#/components/parameters/Traceparent' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            example:
              verb: remember
              claim_key: supplier-quote-am-7741
              kind: memory
              body: Supplier Accra Metals quoted 412 USD/t for Q1-2027 delivery, valid until 2026-11-15. Quote ref AM-7741.
              derives_from:
              - art_01JB2WYT5H8K3N6Q9S2VX4ZC7B
            schema: { $ref: '#/components/schemas/SubmitRequest' }
      responses:
        '202':
          description: Held, visible to no one else until ratified (R3).
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              example:
                artifact_id: art_01JB2XF2R7M9W4K6T8Y1QZ3VH5
                claim_key: supplier-quote-am-7741
                version: 1
                state: held
                workarea_id: fbbb41c5-9630-4274-ae53-166f562f5286
                retirement: false
                replaces: null
                plaintext_digest: sha256:7c0f3e91ab5d2c48e6f1a09b83d47c25e9b160fa4d8c72035b1e6f94a2d8c310
                scan:
                  result: pass
                  scanner_version: ruleset-2026.10
                journal_seq: 4182
              schema: { $ref: '#/components/schemas/SubmitAccepted' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
    get:
      tags: [memories]
      operationId: listMemories
      summary: Structured, paginated listing of memory summaries.
      description: 'Requires: reader effective access; own=true admits any tenant role except operator (access.verb_ceiling) for its own rows only — every row the calling key authored, in every state, across all workareas minus its globally denied subtrees, no grant needed (ADR-0025 d13). With own=true and no workarea it lists every workarea the key wrote in. Without own, the listing returns promoted served tips within reader effective access in the workarea''s subtree, defaulting to the key''s default_workarea (ADR-0039 d4) — a self_signed version only when the scope node is its own workarea; a retired claim''s tip, its retirement version, among them, flagged retirement true; others'' held rows are never returned (R3). workarea is the subtree read (see the parameter); v0.3.0''s workarea_id parameter and X-OML-Workarea header are request.validation naming workarea in details.renamed_to (ADR-0039 d7). Ordered created_at descending, then artifact_id descending; the cursor is bound to the calling key and expires under api.cursor_ttl.'
      parameters:
        - { $ref: '#/components/parameters/XRequestId' }
        - { $ref: '#/components/parameters/XCorrelationId' }
        - { $ref: '#/components/parameters/Traceparent' }
        - { name: workarea, in: query, schema: { $ref: '#/components/schemas/WorkareaRef' }, description: "The subtree read, by id or name, which must name a node the key may be told about, else access.not_found, indistinguishable from a nonexistent node (ADR-0039 d4, d7). With own=true, a node the key holds some role on (the naming rule, docs/architecture/roles-and-keys.md, Own); it narrows the listing to the key's rows in that subtree whatever the key holds below it, and omitted the listing reads every workarea the key wrote in. Without own, the scope: a node where reader is effective, and omitted the key's default_workarea (request.workarea_unresolved for a key with neither)." }
        - { name: claim_key, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string, enum: [held, promoted, demoted, rejected, erased] } }
        - { name: kind, in: query, schema: { type: string, enum: [memory, derived_fact, steering, term, term_mapping, vocab_release] } }
        - { name: own, in: query, schema: { type: boolean, default: false } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: One page of memory summaries.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              example:
                items:
                - artifact_id: art_01JB2XF2R7M9W4K6T8Y1QZ3VH5
                  claim_key: supplier-quote-am-7741
                  version: 1
                  tip: true
                  workarea_id: fbbb41c5-9630-4274-ae53-166f562f5286
                  workarea_path: universe.procurement.metals-crew
                  kind: memory
                  state: promoted
                  principal: crew-procure/agent-7
                  provenance: agent
                  simulation_id: null
                  self_signed: false
                  plaintext_digest: sha256:7c0f3e91ab5d2c48e6f1a09b83d47c25e9b160fa4d8c72035b1e6f94a2d8c310
                  tokens: 26
                  retirement: false
                  replaces: null
                  held_expires_at: null
                  derives_from:
                  - art_01JB2WYT5H8K3N6Q9S2VX4ZC7B
                  attachments:
                  - digest: sha256:9f2c41aa7d0e8b64c3f2a19e5d87b4610c3e9f2a84d7b1c6e0f5a382947d1c5b
                    media_type: application/pdf
                    size_bytes: 184233
                  created_at: '2026-10-27T13:58:20Z'
                  promoted_at: '2026-10-27T14:11:08Z'
                next_cursor: null
              schema: { $ref: '#/components/schemas/MemoryPage' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }

  /v1/memories/recall:
    post:
      tags: [memories]
      operationId: recallMemories
      parameters: [{ $ref: '#/components/parameters/XRequestId' }, { $ref: '#/components/parameters/XCorrelationId' }, { $ref: '#/components/parameters/Traceparent' }]
      summary: Ranked retrieval (FTS + vector) over promoted rows; steering rows precede hits, unranked.
      description: 'Requires: reader effective access on the subtree. The scope is the subtree of the body''s workarea, by id or name, else of the key''s default_workarea (ADR-0039 d4); neither answers request.workarea_unresolved, with no tenant-wide fallback, and an X-OML-Workarea header is request.validation naming /workarea in details.renamed_to (ADR-0039 d7). Read-shaped POST: no Idempotency-Key. Applicable steering, the total hit order, own held rows and the max_tokens cut are declared in docs/architecture/retrieval.md (ADR-0025 d4, d7, d8). Logged with the ids served after truncation and the canonical request digest (D12, ADR-0025 d9). Recall quality unmeasured — FR-4.'
      requestBody:
        required: true
        content:
          application/json:
            example:
              query: current aluminium quote Accra Metals validity
              k: 8
            schema: { $ref: '#/components/schemas/RecallRequest' }
      responses:
        '200':
          description: Steering first and never ranked, then scored hits.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              example:
                steering:
                - artifact_id: art_01JB2V8K3M6P9R2T5W8Z1CF4HQ
                  claim_key: quote-validity-steering
                  version: 1
                  tip: true
                  workarea_id: 1351b2b6-5c7c-492d-9aff-630bc95035db
                  workarea_path: universe.procurement
                  kind: steering
                  state: promoted
                  tokens: 20
                  retirement: false
                  replaces: null
                  held_expires_at: null
                  created_at: '2026-10-02T09:20:41Z'
                  promoted_at: '2026-10-02T11:05:12Z'
                  text: Prefer quotes with an explicit validity date; treat undated quotes as expired.
                hits:
                - memory:
                    artifact_id: art_01JB2XF2R7M9W4K6T8Y1QZ3VH5
                    claim_key: supplier-quote-am-7741
                    version: 1
                    tip: true
                    workarea_id: fbbb41c5-9630-4274-ae53-166f562f5286
                    workarea_path: universe.procurement.metals-crew
                    kind: memory
                    state: promoted
                    principal: crew-procure/agent-7
                    provenance: agent
                    simulation_id: null
                    self_signed: false
                    plaintext_digest: sha256:7c0f3e91ab5d2c48e6f1a09b83d47c25e9b160fa4d8c72035b1e6f94a2d8c310
                    derives_from:
                    - art_01JB2WYT5H8K3N6Q9S2VX4ZC7B
                    attachments:
                    - digest: sha256:9f2c41aa7d0e8b64c3f2a19e5d87b4610c3e9f2a84d7b1c6e0f5a382947d1c5b
                      media_type: application/pdf
                      size_bytes: 184233
                    created_at: '2026-10-27T13:58:20Z'
                    promoted_at: '2026-10-27T14:11:08Z'
                    tokens: 26
                    retirement: false
                    replaces: null
                    held_expires_at: null
                    text: Supplier Accra Metals quoted 412 USD/t for Q1-2027 delivery, valid until 2026-11-15. Quote ref AM-7741.
                  score: 0.83
                query_digest: sha256:c4a91e0b7d2f6358a1c0e94d72b85f31d6c2e8a90b4f7135c8d0e2a6951b4d7f
              schema: { $ref: '#/components/schemas/RecallResponse' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }

  /v1/memories/{artifact_id}:
    get:
      tags: [memories]
      operationId: getMemory
      summary: One memory with its text (decrypted on the serving path) and attachment descriptors.
      description: 'The calling key may fetch its own rows in any state, with no grant needed (global denials still mask). Anyone else needs reader effective access on the row''s workarea and sees promoted versions only — superseded versions and every version of a retired claim stay fetchable as history. Get takes the row''s own workarea as its implicit scope, so a non-own self_signed version is served to a key with reader effective access there. Anything else answers access.not_found (ADR-0025 d3). Erased answers 410 lifecycle.erased only to a key that could read the version immediately before its erasure — its author''s key set, or, when it was promoted then, a key with reader effective access on its workarea; readability is checked first, and every other key gets access.not_found. Resolves no workarea: an X-OML-Workarea header is request.validation, details.field X-OML-Workarea. derives_from lists only ancestors the caller can read, replaces is null when the caller cannot read the replaced version, and workarea_id is null on an own row whose node the key holds no role on.'
      parameters: [{ $ref: '#/components/parameters/XRequestId' }, { $ref: '#/components/parameters/XCorrelationId' }, { $ref: '#/components/parameters/Traceparent' }, { $ref: '#/components/parameters/ArtifactId' }]
      responses:
        '200':
          description: The memory.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              example:
                artifact_id: art_01JB2XF2R7M9W4K6T8Y1QZ3VH5
                claim_key: supplier-quote-am-7741
                version: 1
                tip: true
                workarea_id: fbbb41c5-9630-4274-ae53-166f562f5286
                workarea_path: universe.procurement.metals-crew
                kind: memory
                state: promoted
                principal: crew-procure/agent-7
                provenance: agent
                simulation_id: null
                self_signed: false
                plaintext_digest: sha256:7c0f3e91ab5d2c48e6f1a09b83d47c25e9b160fa4d8c72035b1e6f94a2d8c310
                derives_from:
                - art_01JB2WYT5H8K3N6Q9S2VX4ZC7B
                attachments:
                - digest: sha256:9f2c41aa7d0e8b64c3f2a19e5d87b4610c3e9f2a84d7b1c6e0f5a382947d1c5b
                  media_type: application/pdf
                  size_bytes: 184233
                created_at: '2026-10-27T13:58:20Z'
                promoted_at: '2026-10-27T14:11:08Z'
                tokens: 26
                retirement: false
                replaces: null
                held_expires_at: null
                text: Supplier Accra Metals quoted 412 USD/t for Q1-2027 delivery, valid until 2026-11-15. Quote ref AM-7741.
              schema: { $ref: '#/components/schemas/Memory' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }

  /v1/memories/{artifact_id}/supersede:
    post:
      tags: [memories]
      operationId: supersedeMemory
      summary: Propose a replacement version, or with retirement true propose retiring the claim; a new attributed submission, held like any write.
      description: 'Requires: the supersede rule declared in docs/architecture/roles-and-keys.md (Grant admissibility and refusal order) — a writer on a target version it authored, a dreamer through edit-as-proposal. The target must be the current served tip: submission.tip_conflict, with details.current_tip when the caller can read it. The tip moves only at ratification, by compare-and-set; the tip, version-ordinal, competing-successor, retirement and retired-claim rules are declared in docs/architecture/audit-and-lineage.md (ADR-0025 d10, d11). The body''s workarea, if sent, must equal the target''s workarea (request.validation, details.field /workarea, otherwise), and an X-OML-Workarea header is request.validation naming /workarea in details.renamed_to (ADR-0039 d7); that check, the tip, the kind and retirement checks and workarea.frozen are answered only after the target is known readable, in the order of step 5 of the supersede rule. Idempotency-Key is scoped to the key with a nil workarea; the record is looked up after step 1 of that rule and before step 2, so a committed supersession replays its stored response whatever the target''s state or the key''s access now, and it is claimed only after step 2 passes. Only kind is inherited from the target. The designed attachment, simulation and vocabulary fields of a successor are declared in openapi-designed.yaml (ADR-0039 d9).'
      parameters:
        - { $ref: '#/components/parameters/XRequestId' }
        - { $ref: '#/components/parameters/XCorrelationId' }
        - { $ref: '#/components/parameters/Traceparent' }
        - { $ref: '#/components/parameters/ArtifactId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            examples:
              revise:
                value:
                  body: Supplier Accra Metals revised the quote to 408 USD/t for Q1-2027 delivery, valid until 2026-12-01. Quote ref AM-7741-r2.
                  reason: supplier issued a revised quote
              retire:
                value:
                  body: Superseded by the 2026 runbook; stop serving.
                  retirement: true
            schema: { $ref: '#/components/schemas/SupersedeRequest' }
      responses:
        '202':
          description: The proposed replacement, held.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              example:
                artifact_id: art_01JB2YN4P6R8TA1CW3EY5G7J9L
                claim_key: supplier-quote-am-7741
                version: 2
                state: held
                workarea_id: fbbb41c5-9630-4274-ae53-166f562f5286
                retirement: false
                replaces:
                  artifact_id: art_01JB2XF2R7M9W4K6T8Y1QZ3VH5
                  version: 1
                plaintext_digest: sha256:8d2c5f70e1a94b36c7d21e85f03a6b94d5c8e217a0f4b63d92c1e5a78f0b3c64
                journal_seq: 4293
              schema: { $ref: '#/components/schemas/SubmitAccepted' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        default: { $ref: '#/components/responses/Error' }

  /v1/guardrails:
    get:
      tags: [memories]
      operationId: getGuardrails
      parameters:
        - { $ref: '#/components/parameters/XRequestId' }
        - { $ref: '#/components/parameters/XCorrelationId' }
        - { $ref: '#/components/parameters/Traceparent' }
        - name: workarea
          in: query
          required: false
          schema: { type: string }
          description: The scope node, by id or name, within the key's grants; omitted, the key's default workarea.
      summary: The guardrails in force at the scope node, under the key's reader access and guardrail scope; never in recall.
      description: >-
        Requires: reader on the scope node. Serves the promoted guardrail tips on the node and,
        under guardrail_scope ancestors, on each ancestor the key reads; the scope is the key's,
        set at issuance, and any parameter other than workarea, guardrail_scope included, is
        request.validation naming it (docs/api/http-api.md, Guardrails; ADR-0037 d4, d5,
        d7; since v0.5.1).
      responses:
        '200':
          description: The set, its digest and the caller's own held guardrails.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuardrailSet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }

  /v2/workareas:
    post:
      tags: [workareas]
      operationId: createWorkarea
      summary: Create a child workarea in development.
      description: 'Requires: admin key role. parent and crew each take an id or a name, and parent_id, the v0.3.0 spelling, is refused with request.validation, details.renamed_to /parent (ADR-0039 d7); a crew that names no crew record of the tenant answers access.not_found, checked after the parent and before name.taken. name must be unique in the tenant (409 name.taken, checked after every other check; universe is always taken, by the root). Refused under a validated parent (workarea.frozen); universe cannot be created or deleted.'
      parameters: [{ $ref: '#/components/parameters/XRequestId' }, { $ref: '#/components/parameters/XCorrelationId' }, { $ref: '#/components/parameters/Traceparent' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            example:
              parent: metals-crew
              name: q1-2027
              crew: metals-crew
            schema: { $ref: '#/components/schemas/WorkareaCreate' }
      responses:
        '201':
          description: The new node.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              example:
