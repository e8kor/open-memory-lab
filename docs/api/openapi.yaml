              example:
                status: ok
                checks:
                  postgres: ok
                  fork_check: ok
                oauth_issuer: https://oml.example.com
                build:
                  version: 0.2.0
                  commit: 779e7e4c1f0d8a5b2e6c9f3a7d1b4e8c2a5f9d03
                  commit_time: '2026-10-30T21:52:41Z'
                  build_time: '2026-10-30T22:40:12Z'
                  rustc: rustc 1.99.1 (4c7d2e1a9 2026-09-17)
                  target: x86_64-unknown-linux-gnu
                  profile: release
              schema: { $ref: '#/components/schemas/Ready' }
        '503':
          description: Not ready, with per-check detail and the build that answered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ready' }

  /v2/web/emails:
    get:
      tags: [web]
      operationId: listWebEmails
      summary: The tenant's email allowlist — who may sign in to the user and admin pages, as which user, and whether as an admin.
      description: 'Requires: admin key role (ADR-0045 d2). Each entry is {email, user, admin}, in the order of the email''s digest; the provider subjects pinned at first sign-in are not served. Since v0.5.0.'
      parameters:
        - { $ref: '#/components/parameters/XRequestId' }
        - { $ref: '#/components/parameters/XCorrelationId' }
        - { $ref: '#/components/parameters/Traceparent' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: cursor, in: query, required: false, schema: { type: string, pattern: '^[0-9a-f]{64}$' }, description: 'The next_cursor of the page before: the digest of its last entry''s email, never an address.' }
      responses:
        '200':
          description: The allowlist.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              example:
                items:
                - email: alice@example.com
                  user: alice
                  admin: true
                next_cursor: null
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/WebEmail' }
                  next_cursor: { type: [string, 'null'] }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [web]
      operationId: allowWebEmail
      summary: Add an email to the allowlist, or change the user or admin flag of one already there.
      description: 'Requires: admin key role (ADR-0045 d2). The email is unique in the deployment and compared ASCII case-insensitively (409 name.taken, details.kind email); user is a name under the creation grammar of at most 56 characters, refused 409 name.taken when a shared workarea holds it or when a key holds one of the names <user>-web, <user>-review, <user>-curate, <user>-admin. Journalled as web.email_allowed or web.email_changed with an email digest, never the address. A change ends the entry''s sessions. Since v0.5.0.'
      parameters:
        - { $ref: '#/components/parameters/XRequestId' }
        - { $ref: '#/components/parameters/XCorrelationId' }
        - { $ref: '#/components/parameters/Traceparent' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            example:
              email: alice@example.com
              user: alice
              admin: true
            schema: { $ref: '#/components/schemas/WebEmail' }
      responses:
        '200':
          description: The entry as stored.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebEmail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        default: { $ref: '#/components/responses/Error' }

  /v2/web/emails/remove:
    post:
      tags: [web]
      operationId: removeWebEmail
      summary: Remove an email from the allowlist, ending its sessions; the user's agent keys keep working.
      description: 'Requires: admin key role (ADR-0045 d2, d13). The email is in the body, never the path, so no proxy log records it. Journalled as web.email_removed with an email digest. An email not on the list answers access.not_found. Since v0.5.0.'
      parameters:
        - { $ref: '#/components/parameters/XRequestId' }
        - { $ref: '#/components/parameters/XCorrelationId' }
        - { $ref: '#/components/parameters/Traceparent' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            example:
              email: alice@example.com
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, maxLength: 254 }
      responses:
        '200':
          description: Removed.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema:
                type: object
                required: [journal_seq, event_id, dry_run]
                properties:
                  journal_seq: { type: integer, description: The seq of the web.email_removed event. }
                  event_id: { type: string, format: uuid }
                  dry_run: { type: boolean, const: false }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /web:
    get:
      tags: [web]
      operationId: userPage
      summary: The sign-in page without a session; the user page with one.
      description: 'Authenticated by the __Host-oml_session cookie alone; an Authorization header is refused with access.verb_ceiling, details.reason web_is_human_only (ADR-0045 d7). Views by query: view (keys, setup, memories, workarea, review), q, memory, workarea. Served with the connect page''s headers (ADR-0045 d8). Routed only on the lead and only where oauth.issuer and a sign-in provider are set. Since v0.5.0.'
      security: []
      parameters:
        - { name: view, in: query, required: false, schema: { type: string, enum: [keys, setup, memories, workarea, review] } }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 512 } }
        - { name: memory, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: The page.
          content:
            text/html:
              schema: { type: string }
    post:
      tags: [web]
      operationId: userPageAct
      summary: One act of the user page, named by action.
      description: 'Requires a session, csrf_token and the same-origin check (oauth.origin_refused; request.validation with details.field csrf_token). action is one of issue_key, connect_key, connect_code, cut_off, create_workarea, review_next, verdict, sign_out; review_next and verdict run as the session''s <user>-review key, which holds dreamer and reader on the person''s own root from the first sign-in, R2 checked on that key and the lineage closure; every other action runs as <user>-web; no field names who acts, and a field the action does not define is request.validation (ADR-0045 d6, d9). An issued key''s value or connect code is shown once on the answering page, never in a redirect. Since v0.5.0.'
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [action, csrf_token]
              properties:
                action: { type: string, enum: [issue_key, connect_key, connect_code, cut_off, create_workarea, review_next, verdict, sign_out] }
                csrf_token: { type: string }
      responses:
        '200':
          description: The page after the act.
          content:
            text/html:
              schema: { type: string }
        '303':
          description: After sign_out, to /web.

  /web/sign-in:
    post:
      tags: [web]
      operationId: webSignIn
      summary: Start a provider's sign-in — the code flow with S256 PKCE, state and, for Google, a nonce.
      description: 'The same-origin check of POST /oauth/authorize, then a 303 to the provider with the sealed __Host-oml_signin cookie set (SameSite=Lax, ten minutes). Writes no row (ADR-0045 d3). Since v0.5.0.'
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [provider]
              properties:
                provider: { type: string, enum: [google, github] }
      responses:
        '303':
          description: To the provider's authorization endpoint.
        '403':
          description: oauth.origin_refused, on a page.
          content:
            text/html:
              schema: { type: string }

  /web/callback/{provider}:
    get:
      tags: [web]
      operationId: webCallback
      summary: The provider's redirect; admits a listed, verified email and starts a session.
      description: 'Refused before any outbound call unless the sealed cookie opens, is under ten minutes old, names this provider and carries the query''s state. Google: the ID token from the token endpoint over TLS, iss, aud, exp, nonce and email_verified checked. GitHub: the primary verified address of /user/emails. The provider subject is pinned per entry at first sign-in. Refusals are pages, auth.invalid with details.reason not_allowed, email_unverified, state_mismatch, identity_changed or provider_refused; limit.rate past the provider-call cap. The query is never logged (ADR-0045 d3, d4, d5, d14). Since v0.5.0.'
      security: []
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [google, github] } }
        - { name: code, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: false, schema: { type: string } }
      responses:
        '303':
          description: To /web, setting the __Host-oml_session cookie.
        '401':
          description: A sign-in refusal page.
          content:
            text/html:
              schema: { type: string }
        '429':
          description: limit.rate on a page.
          content:
            text/html:
              schema: { type: string }

  /web/admin:
    get:
      tags: [web]
      operationId: adminPage
      summary: The admin page, for a session whose allowlist entry is an admin's.
      description: 'Any other session answers access.not_found. Views by query: view (people, queue, review, curate, memories), q, memory. The memories view and one memory''s attribution are the admin read (POST /v2/admin/memories/search, GET /v2/admin/memories/{artifact_id}) as <user>-admin: every memory''s text and attribution, each read journalled (ADR-0045 d10, d21). Since v0.5.0.'
      security: []
      parameters:
        - { name: view, in: query, required: false, schema: { type: string, enum: [people, queue, review, curate, memories] } }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 512 } }
        - { name: memory, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: The page.
          content:
            text/html:
              schema: { type: string }
        '404':
          description: access.not_found, on a page.
          content:
            text/html:
              schema: { type: string }
    post:
      tags: [web]
      operationId: adminPageAct
      summary: One act of the admin page, named by action, run as the capacity it needs.
      description: 'Requires an admin session, csrf_token and the same-origin check. allow_email, remove_email, set_admin, grant_review and grant_curation run as <user>-admin; review_next, verdict and supersede (dreamer propose) as <user>-review; curate and supersede of the curator''s own universe claims as <user>-curate; demote, planned for v0.6.0, as <user>-admin. R2 is enforced on the reviewing key and the lineage closure; the admin key is never offered a verdict (ADR-0045 d10, d11, d12). Since v0.5.0.'
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [action, csrf_token]
              properties:
                action: { type: string, enum: [allow_email, remove_email, set_admin, grant_review, grant_curation, review_next, verdict, curate, supersede, cut_off] }
                csrf_token: { type: string }
      responses:
        '200':
          description: The page after the act.
          content:
            text/html:
              schema: { type: string }

  /v2/admin/memories/search:
    post:
      tags: [admin]
      operationId: adminSearchMemories
      parameters:
        - { $ref: '#/components/parameters/XRequestId' }
        - { $ref: '#/components/parameters/XCorrelationId' }
        - { $ref: '#/components/parameters/Traceparent' }
      summary: Search every memory of the tenant, in every state, workarea and user root, with its text and attribution.
      description: 'Requires: admin key role (ADR-0045 d21); the operator and every other role answer access.verb_ceiling. query is the recall full-text search without the visibility filter; state and workarea narrow it. A POST so that the query travels in a body, never a path or query string. Each answer journals one memory.admin_read event naming the admin key, the artifact_ids served and a query_digest, never the text or the query. Served on the lead only. Records no verdict, creates no serve binding. Since v0.5.0.'
      requestBody:
        required: true
        content:
          application/json:
            example:
              query: deploy window
              state: held
            schema:
              type: object
              additionalProperties: false
              properties:
                query: { type: string, maxLength: 512 }
                workarea: { type: string }
                state: { type: string, enum: [held, promoted, rejected, superseded, demoted] }
                limit: { type: integer, minimum: 1, maximum: 100 }
                cursor: { type: string }
      responses:
        '200':
          description: A page of memories with text and attribution.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AdminMemory' }
                  next_cursor: { type: [string, 'null'], description: 'The last item''s created_at and id; send it back as cursor.' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }

  /v2/admin/memories/{artifact_id}:
    get:
      tags: [admin]
      operationId: adminReadMemory
      summary: One memory of the tenant with its text and full attribution, a universe claim with its source.
      description: 'Requires: admin key role (ADR-0045 d21). The fields of the search plus derives_from, replaces, every verdict with its reviewing key, principal, reason and time, and plaintext_digest; ADR-0044 d9''s served view does not apply. Journalled as memory.admin_read with the one artifact_id. Served on the lead only. Since v0.5.0.'
      parameters:
        - { $ref: '#/components/parameters/XRequestId' }
        - { $ref: '#/components/parameters/XCorrelationId' }
        - { $ref: '#/components/parameters/Traceparent' }
        - { name: artifact_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The memory with its attribution.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/AdminMemory' }
                  - type: object
                    properties:
                      derives_from: { type: array, items: { type: string } }
                      replaces: { type: [string, 'null'] }
                      plaintext_digest: { type: string }
                      verdicts:
                        type: array
                        items:
                          type: object
                          properties:
                            verdict: { type: string }
                            key: { type: string }
                            principal: { type: [string, 'null'] }
                            reason: { type: [string, 'null'] }
                            at: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OML API key
      description: >-
        One key, one role (reader | writer | dreamer | admin | operator), grants scoping it to
        workarea subtrees. Tenant derives from the key server-side. Each operation's description
        states its ceiling; refusals are typed (access.verb_ceiling, access.grant_refused,
        access.not_found) per docs/api/errors.md. Key wire format: "oml_" followed by 43
        base62 characters (256 bits of randomness). At rest the service stores only the plain
        SHA-256 of the full key — defensible without salt or stretching because the key is
        high-entropy random, and it enables the UNIQUE-index lookup at authentication.

  parameters:
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      description: >-
        A request id the caller chose: honoured when it is one instance of 1 to 128 characters
        from A-Z, a-z, 0-9, '-', '_', '.' and ':'; otherwise replaced by a minted one, and the
        request goes on. Never an idempotency key nor an input to any decision (ADR-0042 d4, d5).
      schema: { type: string, pattern: '^[A-Za-z0-9._:-]{1,128}$' }
    XCorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: >-
        A task id grouping several requests, under the X-Request-Id rule; absent or not
        admitted, the correlation id is the request id (ADR-0042 d6).
      schema: { type: string, pattern: '^[A-Za-z0-9._:-]{1,128}$' }
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: >-
        W3C Trace Context, version 00, read only while the deployment exports traces
        (server.otlp_endpoint): a valid value makes the server's span its child, an invalid one
        starts a new trace. tracestate is not read, and no response carries traceparent
        (ADR-0042 d13).
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, maxLength: 256 }
      description: >-
        Claims an idempotency record (key_id, workarea, idem_key) before side effects. On the
        provider ring the workarea component is the RESOLVED target — the body's workarea, else the
        key's default_workarea (ADR-0039 d7); for supersede the workarea component is the
        fixed nil value (ADR-0025 d10), and the record is looked up after step 1 of the supersede
        rule and before step 2, so a committed supersession always replays, and claimed only after
        step 2 passes. The request digest is SHA-256 over the RFC 8785 JSON of {method, route,
        path_params, body} (docs/api/http-api.md, Idempotency). Replay of
        the same request returns the stored response with header Idempotency-Replay: true; the
        same key with a different request digest is refused (idempotency.digest_mismatch). A
        committed record is retained for at least 24 hours — the replay-window setting may only
        raise that floor — and after it expires the same key is processed as a fresh request
        (expiry-then-reprocess is documented behavior, not a defect).
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      description: >-
        Page size, at most 200. Unless an endpoint states otherwise, listings order by
        created_at descending; the events tail is the deliberate exception (seq ascending).
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
      description: >-
        Opaque, from the previous page's next_cursor. Cursors are positional, not snapshots —
        rows written between pages can appear in later pages. A cursor is scoped to the key
        that obtained it and expires (the TTL is a named deployment setting); a stale or
        foreign cursor answers 400 request.validation.
    ArtifactId:
      name: artifact_id
      in: path
      required: true
      schema: { type: string }
    WorkareaId:
      name: workarea
      in: path
      required: true
      schema: { $ref: '#/components/schemas/WorkareaRef' }
    ConnectionId:
      name: connection_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    KeyId:
      name: key
      in: path
      required: true
      schema: { $ref: '#/components/schemas/KeyRef' }
    CrewId:
      name: crew
      in: path
      required: true
      schema: { $ref: '#/components/schemas/CrewRef' }

  headers:
    XRequestId:
      description: >-
        The request's id. Every response carries it: the inbound X-Request-Id when the rule
        admits it, else one the server mints as req_ and 32 hex digits. Error bodies and a /mcp
        tool refusal repeat it as request_id. A caller's id is a label, not unique and never an
        authority (http-api.md request ids; ADR-0042 d4, d5).
      schema: { type: string, pattern: '^[A-Za-z0-9._:-]{1,128}$' }
    XCorrelationId:
      description: >-
        The request's correlation id: the inbound X-Correlation-Id when the rule admits it, else
        the request id. Every response carries it (ADR-0042 d6).
      schema: { type: string, pattern: '^[A-Za-z0-9._:-]{1,128}$' }
    RetryAfter:
      description: Seconds to wait before retrying; present on every retryable refusal.
      schema: { type: integer, minimum: 0 }

  responses:
    Error:
      description: Typed error envelope; code is one of ErrorCode (docs/api/errors.md).
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: auth.missing or auth.invalid.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: A 403-class refusal naming its rule (access.*, review.*, simulation.audience_refused).
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: access.not_found — absent or outside read scope, indistinguishable by design.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: A 409-class conflict (idempotency.*, submission.tip_conflict, workarea.frozen, review.serve_invalid, …).
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Gone:
      description: lifecycle.erased — a journalled crypto-shred, never a silent deletion.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unprocessable:
      description: A 422-class refusal (submission.scan_veto, upload.digest_mismatch, settings.*, …).
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RateLimited:
      description: 429 limit.rate or limit.quota — retryable; Retry-After says when.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    UnsupportedMedia:
      description: >-
        415 request.unsupported_media — the request body's media type is not the
        application/json the operation declares; not retryable as sent.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  schemas:
    AdminMemory:
      type: object
      description: 'A memory as the admin read serves it (ADR-0045 d21): its text and who wrote it, in every state.'
      required: [artifact_id, claim_key, version, state, workarea_path, text, key, created_at]
      properties:
        artifact_id: { type: string }
        claim_key: { type: string }
        version: { type: integer }
        state: { type: string, enum: [held, promoted, rejected, superseded, demoted] }
        workarea_path: { type: string }
        text: { type: string }
        key: { type: string, description: The authoring key's name. }
        principal: { type: [string, 'null'] }
        user: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }

    WebEmail:
      type: object
      additionalProperties: false
      description: 'An allowlist entry (ADR-0045 d2): an email a person may sign in with, the ADR-0044 user it signs in as, and whether it opens the admin page.'
      required: [email, user, admin]
      properties:
        email: { type: string, maxLength: 254 }
        user: { type: string, pattern: '^[a-z]([a-z0-9-]{0,54}[a-z0-9])?$', description: 'A name under the creation grammar, at most 56 characters.' }
        admin: { type: boolean }

    Digest:
      type: string
      pattern: '^sha256:[0-9a-f]{64}$'
      description: SHA-256 of plaintext unless a field says ciphertext.

    Id:
      type: string
      pattern: '^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-79A-Fa-f][0-9A-Fa-f]{3}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
      description: >-
        The id of a workarea, crew, key or tenant: RFC 9562 section 4 hex-and-dash UUID text,
        either case accepted, lowercase served, whose version digit (the first of the third
        group) is not 8. The server mints these ids as version 4; version 8 is reserved for the
        unresolved value of a name that names no row, so a hex-and-dash value of version 8 is
        neither an id nor a name and is refused (request.validation). A value in this form is
        always an id (docs/api/http-api.md, Names and ids; ADR-0026 d3, d4).

    Name:
      type: string
      minLength: 1
      maxLength: 63
      pattern: '^(?![0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$)(?![0-9a-f]{32}$)(?!(?:tenant|wa|crew|key)-[0-9a-f]{32}$)[a-z](?:[a-z0-9-]{0,61}[a-z0-9])?$'
      description: >-
        A new name, in a creation body: the creation grammar. A lowercase RFC 1035 label, 1-63
        characters, that is not in the id form, not 32 hexadecimal digits and not the derived
        form, which only rows that predate names hold; a creation that sends that form is
        request.validation. Unique in its namespace, immutable, never released; compared byte
        for byte, never lowercased (docs/api/http-api.md, Names and ids; ADR-0026 d1, d2).
        References use NameRef.

    NameRef:
      type: string
      minLength: 1
      maxLength: 63
      pattern: '^(?![0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$)(?![0-9a-f]{32}$)[a-z](?:[a-z0-9-]{0,61}[a-z0-9])?$'
      description: >-
        A name in a reference: the reference grammar. A lowercase RFC 1035 label, 1-63
        characters, that is not in the id form and not 32 hexadecimal digits. The derived form
        (tenant-, wa-, crew- or key- followed by 32 hexadecimal digits) is a name here: it
        addresses the row ADR-0026 d11 named (docs/api/http-api.md, Names and ids; ADR-0026 d2,
        d3).

    WorkareaRef:
      description: >-
        A workarea, by its node id, its name or its qualified name. Resolved server-side before
        any check that reads state; an unknown name answers exactly what an unknown id answers.
        A user key resolves a bare name in its own user root's namespace, plus universe and its
        root's name; every other key in the shared namespace (ADR-0044 d5). A derived path, a
        value of three or more labels or one whose first label is universe, is neither, and is
        refused (request.validation).
      anyOf:
        - { $ref: '#/components/schemas/Id' }
        - { $ref: '#/components/schemas/NameRef' }
        - { $ref: '#/components/schemas/QualifiedName' }

    QualifiedName:
      type: string
      maxLength: 127
      pattern: '^(?!universe\.)[a-z](?:[a-z0-9-]{0,61}[a-z0-9])?\.[a-z](?:[a-z0-9-]{0,61}[a-z0-9])?$'
      description: >-
        <user>.<name>: the workarea named name in the namespace of the user root named user,
        unique in the tenant and never changed, since nothing crosses a user root's boundary;
        exactly two reference-grammar labels joined by one '.', the first not universe
        (docs/api/http-api.md, Names and ids; ADR-0044 d5).

    CrewRef:
      description: A crew record, by its id or its name, resolved server-side like every reference (ADR-0026 d4).
      anyOf:
        - { $ref: '#/components/schemas/Id' }
        - { $ref: '#/components/schemas/NameRef' }

    KeyRef:
      description: A key, by its id or its name, resolved server-side like every reference; a revoked or expired key's name still resolves (ADR-0026 d4, d10).
      anyOf:
        - { $ref: '#/components/schemas/Id' }
        - { $ref: '#/components/schemas/NameRef' }

    TenantRef:
      description: A tenant, by its id or its name, resolved in the deployment's namespace (ADR-0026 d4).
      anyOf:
        - { $ref: '#/components/schemas/Id' }
        - { $ref: '#/components/schemas/NameRef' }

    Role:
      type: string
      enum: [reader, writer, dreamer, admin, operator]

    ErrorCode:
      type: string
      description: The closed error vocabulary; identical to docs/api/errors.md by construction. The oauth codes other than oauth.connect_refused and oauth.attach_refused travel inside RFC error bodies on the OAuth endpoints, at the start of error_description, or on the authorization page; oauth.connect_refused answers on /v2 in this envelope, and oauth.attach_refused, an /mcp tool result, is answered by no served tool since oml_attach left the catalog (ADR-0031, ADR-0039 d2, d9).
      enum:
        - auth.missing
        - auth.invalid
        - access.verb_ceiling
        - access.grant_refused
        - access.not_found
        - access.author_only
        - access.issuer_ceiling
        - access.role_exclusive
        - access.banned
        - request.validation
        - request.idempotency_key_required
        - request.payload_too_large
        - request.workarea_unresolved
        - request.unsupported_media
        - oauth.client_invalid
        - oauth.redirect_refused
        - oauth.pkce_required
        - oauth.resource_mismatch
        - oauth.authorization_expired
        - oauth.connect_code_invalid
        - oauth.authorization_code_invalid
        - oauth.refresh_invalid
        - oauth.origin_refused
        - oauth.attach_refused
        - oauth.connect_refused
        - idempotency.in_progress
        - idempotency.digest_mismatch
        - submission.scan_veto
        - submission.attachment_missing
        - submission.simulation_id_required
        - submission.lineage_required
        - submission.tip_conflict
        - submission.claim_key_conflict
        - submission.universe_refused
        - workarea.frozen
        - workarea.transition_refused
        - review.author_in_lineage
        - review.ratifier_is_proposer
        - review.serve_invalid
        - simulation.audience_refused
        - simulation.ended
        - simulation.taint_refused
        - simulation.tip_refused
        - vocab.cycle_refused
        - vocab.prefix_conflict
        - vocab.unknown_curie
        - vocab.inactive_curie
        - upload.session_invalid
        - upload.digest_mismatch
        - lifecycle.erased
        - name.taken
        - limit.rate
        - limit.quota
        - export.not_ready
        - settings.retired_key
        - settings.invalid
        - system.internal
        - system.unavailable

    ErrorEnvelope:
      type: object
      required: [error, request_id]
      properties:
        error:
          type: object
          required: [code, message, rule, retryable]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string, description: "Human-readable; unstable, never parsed." }
            rule: { type: string, description: The design rule the refusal names; stable per code. }
            details: { type: object, additionalProperties: true }
            retryable: { type: boolean, description: True only where the identical request can succeed later (Retry-After header present). }
        request_id: { type: string, description: Mirrors the X-Request-Id response header. }

    SubmitRequest:
      type: object
      description: >-
        The target is workarea, else the key's default_workarea; neither present is refused
        with request.workarea_unresolved (ADR-0039 d4, d7). This body, and its nested objects,
        stay open: ADR-0025 d16 closes the recall, supersede, key-issuance and grant bodies only. The designed attachment,
        simulation and vocabulary fields are declared under x-oml-designed-fields in
        openapi-designed.yaml; each sent here answers its v0.3.0 code (ADR-0039 d9).
      required: [body]
      properties:
        verb: { type: string, enum: [remember, learn], description: "Omitted, learn when derives_from is non-empty and remember otherwise (ADR-0039 d3); a sent verb is honoured. learn requires non-empty derives_from — refused with submission.lineage_required otherwise; a derived conclusion without nameable lineage is remember with kind derived_fact." }
        claim_key: { type: string, description: "Groups versions of one claim; one live claim per (tenant, workarea): a new claim collides with a held, promoted or demoted version (submission.claim_key_conflict), and a claim whose every version is rejected or erased releases the key (docs/architecture/audit-and-lineage.md). Omitted, the server derives auto- plus the first 16 lowercase hex digits of SHA-256(the key's id, a zero byte, the NFC body), so a conflict only ever names the writer's own rows; a sent claim_key starting auto- is refused with request.validation, details.field /claim_key (ADR-0039 d6)." }
        kind: { type: string, enum: [memory, derived_fact, steering, term, term_mapping, vocab_release, guardrail], default: memory, description: "guardrail requires severity and admits rule (ADR-0037 d10; since v0.5.1)." }
        severity: { $ref: '#/components/schemas/Severity' }
        rule: { $ref: '#/components/schemas/GuardrailRule' }
        body: { type: string, description: 'Text body — claim text, at most submission.max_body_size (shipped 1 MiB) UTF-8 bytes of the NFC-normalized body; larger is 413 request.payload_too_large (http-api.md Limits). Binary content goes through the designed attachments (openapi-designed.yaml).' }
        workarea: { $ref: '#/components/schemas/WorkareaRef', description: "The workarea written in, by id or name, honoured only within the key's grants; omitted, the key's default_workarea (ADR-0039 d4, d7)." }
        derives_from:
          type: array
          items: { type: string }
          description: Artifact ids; the declared lineage (omission is undetectable — honesty rule).

    SubmitAccepted:
      type: object
      required: [artifact_id, claim_key, version, state, workarea_id, retirement, replaces]
      properties:
        artifact_id: { type: string }
        claim_key: { type: string }
        version: { type: integer, description: 'The ordinal within the claim_key; for a successor, 1 + the greatest version of the claim_key in any state, so it counts versions the key may not read — a stated residual, FR-31 (docs/architecture/audit-and-lineage.md).' }
        state: { type: string, const: held }
        workarea_id: { type: string, description: "The workarea the submission was captured in — the resolved target, or a supersession target's workarea." }
        retirement: { type: boolean, default: false, description: True when the submission is a retirement version. }
        replaces:
          type: [object, 'null']
          description: For a supersession, the version it replaces; null for a version 1.
          properties:
            artifact_id: { type: string }
            version: { type: integer }
        plaintext_digest: { $ref: '#/components/schemas/Digest' }
        scan:
          type: object
          properties:
            result: { type: string }
            scanner_version: { type: string }
        journal_seq: { type: integer }

    AttachmentDescriptor:
      type: object
      properties:
        digest: { $ref: '#/components/schemas/Digest' }
        media_type: { type: string }
        size_bytes: { type: integer }

    MemorySummary:
      type: object
      required: [artifact_id, claim_key, version, tip, workarea_id, workarea_path, kind, state, tokens, retirement, replaces, held_expires_at, created_at, promoted_at]
      properties:
        artifact_id: { type: string }
        claim_key: { type: string }
        version: { type: integer }
        tip: { type: boolean, description: "Whether this version is the served tip of its claim for the calling key, audience-scoped: for a key in a simulation's audience an overlay tip that shadows the default tip, which then reads tip false; for every other key the default tip (docs/architecture/audit-and-lineage.md). A superseded version is state promoted, tip false." }
        workarea_id: { type: [string, 'null'], description: "Null when the calling key holds no role on the node (naming a node, docs/architecture/roles-and-keys.md, Own) — possible only on an own row an admin moved there (ADR-0025 d3)." }
        workarea_path: { type: [string, 'null'], description: "Derived at read time; grants bind to node ids. Null wherever workarea_id is." }
        kind: { type: string, enum: [memory, derived_fact, steering, term, term_mapping, vocab_release, guardrail] }
        state: { type: string, enum: [held, promoted, demoted, rejected, erased] }
        severity: { type: string, enum: [never, must, should], description: "On kind guardrail alone, except a retirement version (ADR-0037 d2)." }
        rule: { description: "On kind guardrail alone: its oml-gr/1 rule, or null when it has none (ADR-0037 d8)." }
        load_warning: { type: string, description: "On a held guardrail alone: every reader of it is told that every key reading its workarea will load the rule once it binds (ADR-0037 d10)." }
        principal: { type: [string, 'null'], description: "The authoring principal; null on a version in universe served to a key outside its authoring key set, which is served with derives_from empty and workarea_path universe, so no field names its source (ADR-0044 d9)." }
        provenance: { type: string, enum: [agent, human, connector, simulation] }
        simulation_id: { type: [string, 'null'] }
        self_signed: { type: boolean, description: Marked rows under the bounded development exception; never promote beyond their workarea. }
        plaintext_digest: { $ref: '#/components/schemas/Digest' }
        derives_from: { type: array, items: { type: string }, description: "On get, recall and every listing, only the ancestors the caller can read — its own rows in any state, promoted rows within its reader effective access (ADR-0025 d3); the lineage read shows the full closure, elided where unreadable." }
        attachments: { type: array, items: { $ref: '#/components/schemas/AttachmentDescriptor' } }
        tokens: { type: integer, minimum: 0, description: 'Budget tokens of the body (counter oml-tc/1): ceil(UTF-8 bytes of the NFC body / 4); not any model''s count (docs/architecture/retrieval.md, Token budgets).' }
        retirement: { type: boolean, default: false, description: 'True on a retirement version; a claim whose served tip is one is a retired claim, which recall does not serve.' }
        replaces:
          type: [object, 'null']
          description: >-
            For a supersession, the version it replaces; null for a version 1. It obeys the same
            readability test as derives_from on every read, so it is also null when the caller
            cannot read the replaced version — after an admin moved that version into another
            workarea or back into held, say (ADR-0025 d3).
          properties:
            artifact_id: { type: string }
            version: { type: integer }
        held_expires_at: { type: [string, 'null'], format: date-time, description: 'For a held row, when held-item expiry dead-letters it under the workarea''s review policy; null on every other row, and on every row while held-item expiry is unbuilt (ADR-0025 d13).' }
        created_at: { type: string, format: date-time }
        promoted_at: { type: [string, 'null'], format: date-time }

    Memory:
      allOf:
        - { $ref: '#/components/schemas/MemorySummary' }
        - type: object
          properties:
            text: { type: string, description: "The claim's text, decrypted on the serving path only; v0.3.0 named it body (ADR-0039 d7). Absent from a recall item sent with include_text false." }

    MemoryPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/MemorySummary' } }
        next_cursor: { type: [string, 'null'] }

    RecallRequest:
      type: object
      additionalProperties: false
      description: >-
        The scope is workarea's subtree, else the key's default_workarea's (ADR-0039 d4). Unknown
        fields are refused (request.validation), and so are the designed vocabulary filter's terms
        and expand_terms, declared in openapi-designed.yaml (ADR-0039 d9); v0.3.0's
        include_bodies and include_own_held are request.validation naming include_text and
        include_unreviewed in details.renamed_to (ADR-0039 d7).
      required: [query]
      properties:
        query: { type: string }
        workarea: { $ref: '#/components/schemas/WorkareaRef', description: "The subtree recalled, by id or name; omitted, the key's default_workarea (ADR-0039 d4)." }
        k: { type: integer, minimum: 1, maximum: 100, default: 8 }
        kinds: { type: array, minItems: 1, items: { type: string, enum: [memory, derived_fact] }, description: 'Filters hits only; an empty array is refused (request.validation), so only an absent kinds means no filter. Deliberately excludes steering (never ranked, always first) and the vocabulary kinds (excluded from the shared recall indexes by default — ADR-0021 d9); where a vocabulary workarea''s journalled policy opts them in, they are hits only of a recall that omits kinds.' }
        include_text: { type: boolean, default: true, description: Whether each served item carries its text (ADR-0039 d7). }
        include_unreviewed:
          type: boolean
          default: false
          description: >-
            When true, the calling key's own held rows (kind memory or derived_fact, never steering
            or retirement versions) inside subtree(scope) ∩ reader effective access, admitted by
            the kinds filter when one is sent as promoted hits are, join the hits, ranked in the
            same order, with memory.state held; they count against k and max_tokens.
            Rules: docs/architecture/retrieval.md.
        max_tokens:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: >-
            Recall budget in budget tokens (counter oml-tc/1), at most 2^53 - 1, the largest
            integer the request digest canonicalizes exactly under RFC 8785. Steering is never cut;
            hits are the longest rank prefix that fits. Refused with include_text false. Rules:
            docs/architecture/retrieval.md, Token budgets.

    RecallResponse:
      type: object
      required: [steering, hits]
      properties:
        steering:
          type: array
          items: { $ref: '#/components/schemas/Memory' }
          description: 'Applicable steering, ordered structurally and never cut by a budget — membership and order declared in docs/architecture/retrieval.md (ADR-0025 d8).'
        hits:
          type: array
          items:
            type: object
            required: [memory, score]
            properties:
              memory: { $ref: '#/components/schemas/Memory' }
              score: { type: number, description: The store rank; ties break by artifact_id ascending. }
        budget:
          $ref: '#/components/schemas/RecallBudget'
          description: Present if and only if max_tokens was sent.
        query_digest: { $ref: '#/components/schemas/Digest' }

    RecallBudget:
      type: object
      additionalProperties: false
      description: >-
        How the max_tokens cut was applied (docs/architecture/retrieval.md, Token budgets). The
        example is steering [120] and hits [300, 250, 90] under max_tokens 500: one hit is served,
        and the 90-token hit is not, because the cut is a strict rank prefix.
      required: [max_tokens, counter, steering_tokens, used_tokens, truncated, hits_omitted, next_hit_tokens]
      properties:
        max_tokens: { type: integer, minimum: 1, maximum: 9007199254740991 }
        counter: { type: string, enum: [oml-tc/1] }
        steering_tokens: { type: integer, minimum: 0 }
        used_tokens: { type: integer, minimum: 0, description: Exceeds max_tokens only when steering alone does. }
        truncated: { type: boolean }
        hits_omitted: { type: integer, minimum: 0 }
        next_hit_tokens: { type: [integer, 'null'], description: Budget tokens of the first hit not served; null when nothing was cut. }
      example:
        max_tokens: 500
        counter: oml-tc/1
        steering_tokens: 120
        used_tokens: 420
        truncated: true
        hits_omitted: 2
        next_hit_tokens: 250

    SupersedeRequest:
      type: object
      additionalProperties: false
      description: >-
        Unknown fields are refused (request.validation; ADR-0025 d16). The designed successor fields
        — attachments, simulation_id, simulated_time, mapping and the term fields — are declared
        under x-oml-designed-fields in openapi-designed.yaml, and each sent here answers its v0.3.0
        code rather than the unknown-field refusal (ADR-0039 d9).
      required: [body]
      properties:
        body: { type: string, description: 'Claim text, at most submission.max_body_size (shipped 1 MiB) UTF-8 bytes of the NFC-normalized body; larger is 413 request.payload_too_large (http-api.md Limits). With retirement true, why the claim is retired.' }
        workarea: { $ref: '#/components/schemas/WorkareaRef', description: "When sent, the target's workarea, by id or name; any other is request.validation, details.field /workarea (ADR-0039 d7)." }
        retirement: { type: boolean, default: false, description: 'true proposes retiring the claim, and body states why. Refused with request.validation when the target''s kind is term (terms deprecate), or when a kind is sent that differs from the target''s.' }
        kind: { type: string, enum: [memory, derived_fact, steering, term, term_mapping, vocab_release, guardrail], description: 'Omitted, the successor takes the target''s kind — the one field inherited from the target. A memory, derived_fact or steering target admits any of those three; a vocabulary-kind target and a retirement keep the target''s kind; anything else is request.validation (docs/architecture/audit-and-lineage.md).' }
        derives_from: { type: array, items: { type: string }, description: The superseded target is included implicitly. }
        reason: { type: string }
        severity: { $ref: '#/components/schemas/Severity' }
        rule: { $ref: '#/components/schemas/GuardrailRule' }

    Crew:
      type: object
      description: A named crew record — recorded, not operated; OML never contacts the external manager (docs/architecture/workareas.md, Crews; ADR-0026 d8).
      required: [crew_id, name]
      properties:
        crew_id: { type: string }
        name: { type: string, description: Unique in the tenant and never changed. }
        charter_uri: { type: [string, 'null'] }
        external_manager: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }

    CrewCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { $ref: '#/components/schemas/Name' }
        charter_uri: { type: string }
        external_manager: { type: string }

    CrewUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: At least one field; the name is not updatable.
      properties:
        charter_uri: { type: string }
        external_manager: { type: string }

    CrewPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Crew' } }
        next_cursor: { type: [string, 'null'] }

    WorkareaCrewUpdate:
      type: object
      additionalProperties: false
      required: [crew]
      properties:
        crew: { $ref: '#/components/schemas/CrewRef' }

    Workarea:
      type: object
      required: [id, name, parent_id, path, status]
      properties:
        id: { type: string }
        name: { type: string, description: 'Unique in the tenant and never changed; universe for the root (ADR-0026 d1, d6).' }
        parent_id: { type: [string, 'null'], description: Null only for the tenant universe root. }
        path: { type: string, description: 'Derived ltree path, the names from universe joined with "."; never the grant target, and never accepted as a reference.' }
        status: { type: string, enum: [development, committed, validated] }
        crew:
          description: The crew record the workarea names, or null.
          oneOf:
            - { $ref: '#/components/schemas/Crew' }
            - { type: 'null' }
        user_root: { type: boolean, description: "Whether the node is a user root, universe.<user>, which only the issuance of the first key naming its user creates (ADR-0044 d1, d11)." }
        created_at: { type: string, format: date-time }

    WorkareaView:
      description: One node with the calling key's view of it; every value below is relative to that key, and children outside read access are absent (ADR-0025 d14).
      allOf:
        - { $ref: '#/components/schemas/Workarea' }
        - type: object
          required: [children, edges, my_effective_verbs, permission_epoch, policy, pending_transitions, brief]
          properties:
            children:
              type: array
              description: The readable immediate children, ordered by path_leaf ascending in byte order, then id; a child's path_leaf is its name.
              items:
                type: object
                additionalProperties: false
                required: [id, path_leaf, status]
                properties:
                  id: { type: string }
                  path_leaf: { type: string }
                  status: { type: string, enum: [development, committed, validated] }
            edges:
              type: array
              description: The workarea edges touching the node whose other endpoint the key can read, in either direction, ordered by edge_id ascending; edge_id is the id the events tail reports.
              items:
                type: object
                additionalProperties: false
                required: [edge_id, from, to, label, state]
                properties:
                  edge_id: { type: string }
                  from: { type: string }
                  to: { type: string }
                  label: { type: string, enum: [relates_to, continues, derived_from, mirrors] }
                  state: { type: string, enum: [pending, ratified] }
            my_effective_verbs:
              type: array
              description: The effective-verbs table of docs/architecture/roles-and-keys.md, unioned over the grant roles effective on the node and listed in table order (the reader, writer and dreamer rows, each left to right) without duplicates; the access conferred, not what this server build serves.
              items: { type: string, enum: [recall, read, graph_read, events_tail, remember, learn, attach, supersede, propose, review] }
            permission_epoch: { type: integer, description: 'The calling key''s permission epoch as declared in docs/architecture/workareas.md (ADR-0025 d14).' }
            policy: { $ref: '#/components/schemas/ReviewPolicy' }
            pending_transitions:
              type: array
              description: The node's live proposals in proposal order, the pending rows whose from is the node's status (ADR-0039 d9; ADR-0046 d3).
              items: { $ref: '#/components/schemas/Transition' }
            brief: { $ref: '#/components/schemas/Brief' }

    TransitionProposal:
      type: object
      additionalProperties: false
      required: [to]
      properties:
        to: { type: string, enum: [committed, validated], description: 'Forward only; backward transitions do not exist, and a user root climbs to committed at most (ADR-0046 d1).' }

    Transition:
      type: object
      required: [transition_id, workarea_id, from, to, state, proposed_by_key_id, ratified_by_key_id]
      properties:
        transition_id: { type: string }
        workarea_id: { type: string }
        from: { type: string, enum: [development, committed] }
        to: { type: string, enum: [committed, validated] }
        state: { type: string, enum: [pending, ratified] }
        proposed_by_key_id: { type: [string, 'null'], description: 'The proposing key, served only to that key; null to every other reader, an admin key included (ADR-0025 d15).' }
        ratified_by_key_id: { type: [string, 'null'], description: 'Null on this build''s answers; the journal''s workarea.status_transition names the ratifier.' }

    ReviewPolicy:
      type: object
      description: The review policy in force, the one a transition's policy_snapshot records (ADR-0009 d3).
      properties:
        k: { type: integer }
        required_roles: { type: array, items: { type: string } }

    Brief:
      type: object
      additionalProperties: false
      description: The workarea's ratified brief as this key reads it, in ratification order, cut by brief.max_tokens; empty for an admin key (ADR-0046 d8, d9).
      required: [items, budget]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Memory' } }
        budget: { $ref: '#/components/schemas/RecallBudget' }

    ClaimEdgeProposal:
      type: object
      additionalProperties: false
      required: [kind, from_artifact_id, to_artifact_id, label]
      properties:
        kind: { type: string, const: claim }
        from_artifact_id: { type: string }
        to_artifact_id: { type: string }
        label: { type: string, description: 'Open; supports, contradicts, relates_to and continues are recommended, and oml: labels join terms only (ADR-0046 d6).' }

    BriefEdgeProposal:
      type: object
      additionalProperties: false
      required: [kind, from_artifact_id, to_workarea_id]
      properties:
        kind: { type: string, const: brief }
        from_artifact_id: { type: string }
        to_workarea_id: { $ref: '#/components/schemas/WorkareaRef' }

    EdgeProposal:
      description: One proposal body for the served edge kinds, chosen by kind (ADR-0039 d9; ADR-0046 d7).
      oneOf:
        - { $ref: '#/components/schemas/ClaimEdgeProposal' }
        - { $ref: '#/components/schemas/BriefEdgeProposal' }
      discriminator:
        propertyName: kind
        mapping:
          claim: '#/components/schemas/ClaimEdgeProposal'
          brief: '#/components/schemas/BriefEdgeProposal'

    ClaimEdge:
      type: object
      required: [kind, edge_id, from_artifact_id, to_artifact_id, label, state, proposer_key_id, ratifier_key_id]
      properties:
        kind: { type: string, const: claim }
        edge_id: { type: string }
        from_artifact_id: { type: string }
        to_artifact_id: { type: string }
        label: { type: string }
        state: { type: string, enum: [pending, ratified] }
        proposer_key_id: { type: string }
        ratifier_key_id: { type: [string, 'null'] }

    BriefEdge:
      type: object
      required: [kind, edge_id, from_artifact_id, to_workarea_id, label, state, proposer_key_id, ratifier_key_id]
      properties:
        kind: { type: string, const: brief }
        edge_id: { type: string }
        from_artifact_id: { type: string }
        to_workarea_id: { type: string }
        label: { type: string, const: brief }
        state: { type: string, enum: [pending, ratified] }
        proposer_key_id: { type: string }
        ratifier_key_id: { type: [string, 'null'] }

    Edge:
      description: An edge of a served kind, carrying its kind (ADR-0039 d9; ADR-0046 d7).
      oneOf:
        - { $ref: '#/components/schemas/ClaimEdge' }
        - { $ref: '#/components/schemas/BriefEdge' }
      discriminator:
        propertyName: kind
        mapping:
          claim: '#/components/schemas/ClaimEdge'
          brief: '#/components/schemas/BriefEdge'

    EdgePage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Edge' }, description: Edges of the one kind the read named. }
        next_cursor: { type: [string, 'null'] }

    WorkareaCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        parent: { $ref: '#/components/schemas/WorkareaRef', description: "The parent. Omitted, a user key's own root; every other key sends it (request.workarea_unresolved otherwise). A writer user key creates under a parent inside its root where its effective access confers writer (ADR-0044 d6)." }
        name: { $ref: '#/components/schemas/Name' }
        crew: { $ref: '#/components/schemas/CrewRef' }

    WorkareaPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Workarea' } }
        next_cursor: { type: [string, 'null'] }

    JournalEvent:
      type: object
      description: The event-catalog envelope; payloads are digest-only, never body plaintext (D1).
      required: [seq, event_id, event_type, at]
      properties:
        seq: { type: integer }
        event_id: { type: string }
        event_type: { type: string }
        prev_hash: { type: string }
        hash: { type: string }
        sig: { type: string }
        principal: { type: [string, 'null'], description: "Null on the events tail for a key outside the actor's own key set (docs/api/http-api.md, Events tail)." }
        api_key_id: { type: [string, 'null'], description: "The actor's key; null on the events tail for a key outside the actor's own key set, as is every payload field naming a key." }
        at: { type: string, format: date-time }
        payload: { type: object, additionalProperties: true }

    EventsPage:
      type: object
      required: [items, head_seq, next_after_seq]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/JournalEvent' } }
        head_seq: { type: integer, description: "Current per-tenant chain head, for measuring lag." }
        next_after_seq: { type: integer, minimum: 0, description: "The resume point declared in docs/api/http-api.md, Events tail — pass it back verbatim as after_seq. It advances even when every scanned event was filtered out." }

    ServedDigests:
      type: object
      properties:
        body: { $ref: '#/components/schemas/Digest' }
        attachments: { type: array, items: { $ref: '#/components/schemas/Digest' } }
        replaces: { $ref: '#/components/schemas/Digest' }

    Serve:
      type: object
      required: [serve_id, expires_at, item, served_digests]
      properties:
        serve_id: { type: string, description: "Bound server-side to (reviewer key, artifact version, attachment digest set); consumed by its first verdict." }
        expires_at: { type: string, format: date-time }
        item: { $ref: '#/components/schemas/Memory' }
        replaces: { $ref: '#/components/schemas/Memory', description: "For a supersession, the version it replaces." }
        served_digests: { $ref: '#/components/schemas/ServedDigests' }

    VerdictRequest:
      type: object
      required: [verdict]
      properties:
        serve_id: { type: string, description: "The serve review next answered. Omitted, the one item this key has claimed; refused naming serve_id when it holds none or several (ADR-0039 d10)." }
        verdict: { type: string, enum: [approve, reject] }
        reason: { type: string, description: Required to reject. }

    VerdictResult:
      type: object
      required: [artifact_id, version, verdict, state]
      properties:
        artifact_id: { type: string }
        version: { type: integer }
        verdict: { type: string, enum: [approve, reject] }
        state: { type: string, enum: [promoted, held, rejected], description: held means the policy's k needs more verdicts. }
        ratification_event_id: { type: [string, 'null'] }

    GrantRequest:
      type: object
      additionalProperties: false
      required: [workarea, role]
      properties:
        workarea: { $ref: '#/components/schemas/WorkareaRef', description: "The node, by id or name, never a path; stored as the id." }
        role: { type: string, enum: [reader, writer, dreamer], description: "A grant role, admissible under the key's role (the admissibility table in docs/architecture/roles-and-keys.md); never admin or operator." }
        deny:
          type: array
          items:
            type: object
            required: [workarea]
            additionalProperties: false
            properties:
              workarea: { $ref: '#/components/schemas/WorkareaRef' }
          description: Per-grant masks; each masks a subtree within this grant only and must lie inside it (request.validation otherwise). A node grant takes none (request.validation, details.field /grants/<i>/deny).
        covers: { type: string, enum: [subtree, node], default: subtree, description: "subtree covers the node and every descendant; node covers the node alone (ADR-0044 d4)." }

    Grant:
      type: object
      description: A stored grant, as echoed at issuance and listed on a key.
      required: [grant_id, workarea_node_id, role, epoch]
      properties:
        grant_id: { type: string }
        workarea_node_id: { type: string, description: "Node id, never a path." }
        role: { type: string, enum: [reader, writer, dreamer] }
        deny:
          type: array
          items:
            type: object
            properties:
              subtree_node_id: { type: string }
        covers: { type: string, enum: [subtree, node], description: "The node's subtree, or the node alone (ADR-0044 d4)." }
        epoch: { type: integer, description: "The journal seq of this grant's grant.issued event." }

    DenialRequest:
      type: object
      additionalProperties: false
      required: [workarea]
      properties:
        workarea: { $ref: '#/components/schemas/WorkareaRef' }
        reason: { type: string }

    Denial:
      type: object
      required: [denial_id, workarea_node_id, epoch]
      properties:
        denial_id: { type: string }
        workarea_node_id: { type: string }
        epoch: { type: integer }
        lifted: { type: boolean }

    KeyIssueRequest:
      type: object
      additionalProperties: false
      required: [role, name]
      properties:
        role: { $ref: '#/components/schemas/Role' }
        name: { $ref: '#/components/schemas/Name', description: "The key's name: unique in its namespace (409 name.taken), never changed, never released; distinct from principal and label (ADR-0026 d9)." }
        grants: { type: array, items: { $ref: '#/components/schemas/GrantRequest' }, description: "Taken exactly as sent, except that a user key also gets a reader grant on the universe node alone (ADR-0025 d2; ADR-0044 d3). The CLI's reader grant beside a writer grant is sent here like any other (ADR-0028 d2)." }
        user: { $ref: '#/components/schemas/Name', description: "The person the key acts for, by the user's name: a user key, whose every grant must lie in its user root universe.<user> (403 access.issuer_ceiling, details user) and whose workarea references resolve in that root's namespace. The first key naming a user creates the root; a name a shared workarea holds is 409 name.taken. Refused on admin and operator keys, on held_by service and for universe (request.validation, details.field /user) (ADR-0044 d2, d3)." }
        default_workarea: { $ref: '#/components/schemas/WorkareaRef', description: "The provider-ring target (ADR-0022 d4), by id or name; its validation and its default when omitted are declared in the issuance order of docs/architecture/roles-and-keys.md." }
        held_by: { type: string, enum: [agent, human, service], description: "The issuing admin's journalled attestation (ADR-0021); never verified as fact." }
        crew: { $ref: '#/components/schemas/CrewRef', description: "The key's crew record, by id or name, journalled as crew_id and fixed for the key's life; one that names no crew record of the tenant answers access.not_found at step 4 of the issuance order (ADR-0026 d8)." }
        label: { type: string, description: A free-text note; unique nowhere. }
        principal: { type: string, description: 'Who acts — the attribution identity, shared across one identity''s keys; free text.' }
        guardrail_scope: { $ref: '#/components/schemas/GuardrailScope' }
        connect_code: { type: boolean, default: false, description: "Issue a connector key (ADR-0031 d7): no bearer value is minted, and the 201 carries connect_code in place of value. Refused with 422 oauth.connect_refused for an admin or operator role (role), held_by service (held_by_service), or a deployment without oauth.issuer (not_configured)." }

    Key:
      type: object
      required: [key_id, name, role, default_workarea_id, held_by]
      properties:
        key_id: { type: string }
        name: { type: string, description: "Unique in the key's namespace, never changed, never released (ADR-0026 d1, d10)." }
        role: { $ref: '#/components/schemas/Role' }
        principal: { type: string }
        crew_id: { type: [string, 'null'], description: "The key's crew record, as key.issued journals it; null when none was named (ADR-0026 d8)." }
        user:
          description: "The key's user root, by id and name; null for a tenant key (ADR-0044 d11)."
          oneOf:
            - { $ref: '#/components/schemas/WhoamiRef' }
            - { type: 'null' }
        default_workarea_id: { type: [string, 'null'], description: "The key's default workarea; for an issued key, as key.issued journals it — the one sent, else the first grant's node, null for a zero-grant key (docs/architecture/roles-and-keys.md, issuance order; ADR-0025 d2). The provider-ring target when a request names no workarea (ADR-0039 d4)." }
        held_by: { type: [string, 'null'], enum: [agent, human, service, null], description: "The issuing admin's attestation; for an issued key, as key.issued journals it, null when none was sent (ADR-0025 d2)." }
        label: { type: string }
        expiry: { type: [string, 'null'], format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }
        rotated_from: { type: [string, 'null'], description: 'The key_id this key succeeded by rotation, if any (key.rotated links the two).' }
        grants: { type: array, items: { $ref: '#/components/schemas/Grant' } }
        denials: { type: array, items: { $ref: '#/components/schemas/Denial' } }
        epoch: { type: integer }
        credential: { type: string, enum: [bearer, connection, session], description: "bearer: the key has a value presented as Authorization: Bearer. connection: a connector key with no value, reachable only through a connection at /mcp (ADR-0031 d7). session: a key the server holds for a person and acts with only from their web session, no value (ADR-0045 d6)." }
        guardrail_scope: { $ref: '#/components/schemas/GuardrailScope' }
        connections: { type: array, items: { $ref: '#/components/schemas/Connection' }, description: "A connector key's open and revoked connections in creation order, at most one open; an authorized one, between Connect and the token exchange, is not listed. Empty for a bearer key (ADR-0031 d11)." }

    Severity:
      type: string
      enum: [never, must, should]
      description: "A guardrail's severity: never and must bind, should is the reviewed default, and it orders the set first; required on kind guardrail except a retirement, refused on every other kind (request.validation, details.field /severity; ADR-0037 d2, d10; since v0.5.1)."

    GuardrailRule:
      type: object
      description: >-
        A guardrail's optional rule in the oml-gr/1 grammar: one tool class, its match and an
        effect, deny or ask, never allow; should takes ask only. Refused on every other kind and
        on a retirement (request.validation, details.field /rule); a rule outside the grammar, or
        over 160 bytes, is vetoed as submission.scan_veto with guardrail.rule_unparsable or
        guardrail.too_long (ADR-0037 d8, d10; since v0.5.1).
      required: [rule, tool, effect]
      properties:
        rule: { type: string, enum: [oml-gr/1] }
        tool: { type: string, enum: [shell, edit, read, fetch, mcp] }
        command: { type: array, items: { type: string }, description: "shell: word globs matched against each segment of a command." }
        path: { type: string, description: "edit and read: a path glob." }
        host: { type: string, description: "fetch: an exact host or a *. suffix, in its WHATWG serialisation." }
        name: { type: string, description: "mcp: a glob against the tool name." }
        effect: { type: string, enum: [deny, ask] }

    GuardrailScope:
      type: string
      enum: [workarea, ancestors]
      description: "Which applicable guardrails the key loads: workarea, the scope node's alone; ancestors, the node's and every ancestor's the key reads. Set at issuance, ancestors when omitted, journalled in key.issued; no request changes it, and any other value is request.validation, details.field /guardrail_scope (ADR-0037 d4; since v0.5.1)."

    GuardrailSet:
      type: object
      description: The guardrails in force at the scope node under the key's reader access and guardrail scope (ADR-0037 d3, d4, d5, d7).
      required: [scope_node, scope_path, guardrail_scope, set_digest, over_cap, guardrails, own_held]
      additionalProperties: false
      properties:
        scope_node: { type: string }
        scope_path: { type: string, description: "The scope node's derived path, root first; the hook's header names it." }
        guardrail_scope: { $ref: '#/components/schemas/GuardrailScope' }
        set_digest: { type: string, description: "Opaque; a client only compares it." }
        over_cap: { type: boolean, description: "More than twelve apply; the set is still served whole." }
        guardrails: { type: array, items: { $ref: '#/components/schemas/ServedGuardrail' }, description: "Ordered by severity, depth from the root, promoted_at and artifact_id; never by a query." }
        own_held:
          type: array
          maxItems: 5
          description: The caller's own held guardrails in the chain, by key and version, never by text.
          items:
            type: object
            required: [claim_key, version]
            additionalProperties: false
            properties:
              claim_key: { type: string }
              version: { type: integer }

    ServedGuardrail:
      type: object
      required: [artifact_id, claim_key, version, workarea_id, workarea_path, depth, severity, text, rule, tokens, promoted_at, verdicts, conflict]
      additionalProperties: false
      properties:
        artifact_id: { type: string }
        claim_key: { type: string }
        version: { type: integer }
        workarea_id: { type: string }
        workarea_path: { type: [string, 'null'] }
        depth: { type: integer, minimum: 0, description: "The node's depth from the root, the root at 0." }
        severity: { $ref: '#/components/schemas/Severity' }
        text: { type: string }
        rule: { description: "Its oml-gr/1 rule, or null." }
        tokens: { type: integer, minimum: 0 }
        promoted_at: { type: string, format: date-time }
        verdicts:
          type: array
          description: Each approving verdict's reviewer attestation and time, never the reviewer's key (ADR-0025 d15).
          items:
            type: object
            required: [held_by, at]
            additionalProperties: false
            properties:
              held_by: { type: string, enum: [agent, human, service] }
              at: { type: string, format: date-time }
        conflict: { type: array, items: { type: string }, description: "The artifact_ids of the served rows of this claim_key with another severity; empty when none." }

    WhoamiRef:
      type: object
      description: A row the calling key's record references, by its id and its name (ADR-0039 d15).
      required: [id, name]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string }

    WhoamiWorkarea:
      type: object
      description: The calling key's default workarea, by its id and its name, with the path derived from its ancestry, root first (ADR-0039 d15).
      required: [id, name, path]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string }
        path: { type: string, description: "The names from the root to the node, joined by '.'; derived, never stored." }

    WhoamiGrant:
      type: object
      description: A stored grant as whoami serves it, without its per-grant deny masks, which name subtrees the key may not read through it (ADR-0039 d15).
      required: [grant_id, workarea_node_id, role, epoch]
      additionalProperties: false
      properties:
        grant_id: { type: string }
        workarea_node_id: { type: string, description: "Node id, never a path." }
        role: { type: string, enum: [reader, writer, dreamer] }
        covers: { type: string, enum: [subtree, node], description: "The node's subtree, or the node alone (ADR-0044 d4)." }
        epoch: { type: integer, description: "The journal seq of this grant's grant.issued event." }

    Whoami:
      type: object
      description: >-
        The calling key's own record (GET /v2/whoami): everything a client derives from its URL
        and key alone. Never the key's value, its denials or its grants' deny masks (ADR-0039 d15).
      required: [key_id, name, role, principal, held_by, tenant, default_workarea, crew, user, grants]
      additionalProperties: false
      properties:
        key_id: { type: string }
        name: { type: [string, 'null'], description: "The key's name; null only for a key that predates names, which the lead names before it serves (ADR-0026 d11)." }
        role: { $ref: '#/components/schemas/Role' }
        principal: { type: string }
        held_by: { type: string, enum: [agent, human, service], description: "As the key's row stores it: the issuing admin's attestation, agent when none was sent." }
        tenant:
          description: The key's tenant; null for an operator key, which no tenant holds.
          oneOf:
            - { $ref: '#/components/schemas/WhoamiRef' }
            - { type: 'null' }
        default_workarea:
          description: The key's journalled default workarea; null when it has none.
          oneOf:
            - { $ref: '#/components/schemas/WhoamiWorkarea' }
            - { type: 'null' }
        crew:
          description: The key's crew record, fixed for its life; null when none was named.
          oneOf:
            - { $ref: '#/components/schemas/WhoamiRef' }
            - { type: 'null' }
        user:
          description: The key's user root, from which a client learns its root; null for a tenant key (ADR-0044 d11).
          oneOf:
            - { $ref: '#/components/schemas/WhoamiRef' }
            - { type: 'null' }
        grants: { type: array, items: { $ref: '#/components/schemas/WhoamiGrant' }, description: "The key's stored grants, each with its epoch and without its deny masks." }
        guardrail_scope: { $ref: '#/components/schemas/GuardrailScope' }

    KeyIssued:
      allOf:
        - { $ref: '#/components/schemas/Key' }
        - type: object
          description: A fresh 201 carries exactly one of value (a bearer key) and connect_code (a connector key).
          properties:
            value: { type: string, description: "The secret — returned exactly once, journalled as issued-without-value." }
            connect_code: { $ref: '#/components/schemas/ConnectCode' }

    ConnectCode:
      type: object
      required: [code_id, expires_at, connector_url]
      properties:
        code_id: { type: string }
        code: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{4}$', description: 'Twelve Crockford base32 symbols (60 bits) in three groups of four — shown exactly once, never journalled, stored only as the SHA-256 of the normalized symbols (ADR-0031 d8).' }
        expires_at: { type: string, format: date-time }
        connector_url: { type: string, description: 'The URL to enter as the custom connector: <issuer>/mcp, from oauth.issuer, not from the address the CLI used.' }

    Connection:
      type: object
      required: [connection_id, client_id, client_kind, redirect_uri, resource, state]
      description: "One of a connector key's connections, never a token or a digest of one. Whether it is live, the client's name and its opening and revocation times are designed (docs/api/http-api.md, Keys)."
      properties:
        connection_id: { type: string }
        client_id: { type: string, description: The metadata-document URL or the registered client id. }
        client_kind: { type: string, enum: [cimd, dcr] }
        redirect_uri: { type: string }
        resource: { type: string, description: '<issuer>/mcp when the connection was created; its tokens work only while this is the current <issuer>/mcp.' }
        state: { type: string, enum: [open, revoked] }
        revoked_cause: { type: [string, 'null'], enum: [admin, refresh_reuse, code_reuse, replaced, null] }

    ProtectedResourceMetadata:
      type: object
      required: [resource, authorization_servers]
      properties:
        resource: { type: string, description: 'Exactly <issuer>/mcp (RFC 9728 §3.3).' }
        authorization_servers: { type: array, items: { type: string }, minItems: 1, maxItems: 1 }
        scopes_supported: { type: array, items: { type: string, enum: [mcp] } }
        bearer_methods_supported: { type: array, items: { type: string, enum: [header] } }
        resource_name: { type: string }

    AuthorizationServerMetadata:
      type: object
      required: [issuer, authorization_endpoint, token_endpoint, response_types_supported, code_challenge_methods_supported]
      properties:
        issuer: { type: string }
        authorization_endpoint: { type: string }
        token_endpoint: { type: string }
        registration_endpoint: { type: string }
        response_types_supported: { type: array, items: { type: string, enum: [code] } }
        grant_types_supported: { type: array, items: { type: string, enum: [authorization_code, refresh_token] } }
        code_challenge_methods_supported: { type: array, items: { type: string, enum: [S256] } }
        token_endpoint_auth_methods_supported: { type: array, items: { type: string, enum: [none] } }
        scopes_supported: { type: array, items: { type: string, enum: [mcp] } }
        client_id_metadata_document_supported: { type: boolean, enum: [true] }
        authorization_response_iss_parameter_supported: { type: boolean, enum: [true], description: 'RFC 9207 §3: every authorization response, success or error, carries iss.' }

    TokenRequest:
      type: object
      required: [grant_type, client_id]
      properties:
        grant_type: { type: string, enum: [authorization_code, refresh_token] }
        client_id: { type: string }
        code: { type: string, description: authorization_code only. }
        redirect_uri: { type: string, description: "authorization_code only. Required exactly when the authorize request carried it, and then equal to it; when that request omitted it, omitted or equal to the client's one registered URI; otherwise oauth.authorization_code_invalid." }
        code_verifier: { type: string, description: authorization_code only; S256 against the authorization request's code_challenge. }
        refresh_token: { type: string, description: refresh_token only. }
        resource: { type: string, description: 'When sent, exactly <issuer>/mcp.' }
        scope: { type: string, enum: [mcp] }

    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, refresh_token, scope]
      properties:
        access_token: { type: string, pattern: '^oml_at_[A-Za-z0-9]{43}$', description: 'Opaque; the server stores only its SHA-256. A credential at /mcp alone, where it acts as exactly its connection''s key (ADR-0031 d11).' }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer, description: Seconds; the oauth.access_token_ttl setting. }
        refresh_token: { type: string, pattern: '^oml_rt_[A-Za-z0-9]{43}$', description: 'Opaque, single-use; rotated by every refresh.' }
        scope: { type: string, enum: [mcp] }

    OAuthError:
      type: object
      required: [error]
      description: 'RFC 6749 §5.2 / RFC 7591 §3.2.2 error body. error is the RFC code a client branches on; error_description begins with the OML code (ErrorCode) and its rule (docs/api/errors.md, the oauth family).'
      properties:
        error: { type: string, enum: [invalid_request, invalid_client, invalid_grant, unsupported_grant_type, invalid_scope, invalid_target, invalid_redirect_uri, invalid_client_metadata] }
        error_description: { type: string }

    ClientRegistrationRequest:
      type: object
      required: [redirect_uris, client_name]
      properties:
        redirect_uris: { type: array, minItems: 1, items: { type: string }, description: 'Each inside the allowlist: exactly https://claude.ai/api/mcp/auth_callback, matched byte for byte on the JSON string value, never after URL parsing or any further decoding.' }
        client_name: { type: string, description: 'Required, since the authorization page shows it; absent, it is request.validation (invalid_client_metadata).' }
        token_endpoint_auth_method: { type: string, enum: [none], description: 'Absent, it is registered as none and echoed as none; any other value is request.validation (invalid_client_metadata).' }
        grant_types: { type: array, items: { type: string, enum: [authorization_code, refresh_token] } }
        response_types: { type: array, items: { type: string, enum: [code] } }

    ClientRegistration:
      allOf:
        - { $ref: '#/components/schemas/ClientRegistrationRequest' }
        - type: object
          required: [client_id, client_id_issued_at]
          properties:
            client_id: { type: string }
            client_id_issued_at: { type: integer }

    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, const: ok }

    Ready:
      type: object
      required: [status, checks, oauth_issuer, build]
      properties:
        status: { type: string, enum: [ok, unavailable] }
        checks:
          type: object
          additionalProperties: { type: string }
          description: Per-check detail, e.g. postgres, fork_check.
        oauth_issuer:
          type: [string, 'null']
          description: >-
            The lead's oauth.issuer, or null where connections are off; doctor reads whether
            connections are on here, not from the discovery paths it checks (ADR-0031 d14).
        build: { $ref: '#/components/schemas/Build' }

    Build:
      type: object
      description: >-
        The build that answered (http-api.md "Health"). Times are UTC, YYYY-MM-DDTHH:MM:SSZ; a
        field nothing could supply is the string unknown.
      required: [version, commit, commit_time, build_time, rustc, target, profile]
      additionalProperties: false
      properties:
        version: { type: string, description: The workspace version the binary was built at. }
        commit: { type: string, description: 'The full 40-hex commit, or unknown.' }
        commit_time: { type: string, description: 'The commit''s committer time, or unknown.' }
        build_time: { type: string, description: When the build captured these fields; SOURCE_DATE_EPOCH fixes it when set. }
        rustc: { type: string, description: The compiler's rustc -V line. }
        target: { type: string, description: The target triple. }
        profile: { type: string, enum: [release, debug, unknown] }
