      parameters:
        - { name: ban_id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Lifted.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                ban_id: ban_01JB2YE6G8J1L3N5Q7S9UB2DXF
                subject_kind: principal
                subject: crew-procure/agent-4
                reason: repeated fabricated quote references
                imposed_by_key_id: key_01JB2WT6B8D1F3H5K7M9P2RTVX
