                - key_id: key_01JB2W1A3C5E7G9J2L4N6Q8SUW
                label: q1-2027 negotiation dry run
                opened_at: '2026-10-29T15:05:00Z'
                ended_at: null
                warnings: []
              schema: { $ref: '#/components/schemas/Simulation' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /v2/bootstrap/claim:
    post:
      tags: [keys]
      operationId: bootstrapClaim
      summary: Exchange the deployment's single-use enrollment token for the root operator key — the bootstrap ceremony's one API call.
      description: 'Authenticated by the enrollment token itself (no API key exists yet). The token is minted by the Helm bootstrap job, consumed on first use; a consumed, expired or unknown token answers auth.invalid with details.reason naming which. Journalled as issued-without-value in the provider chain.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              enrollment_token: enr_01JB2W9Z8X7V6T5S4R3Q2P1N0M
            schema:
              type: object
              required: [enrollment_token]
              properties:
                enrollment_token: { type: string }
      responses:
        '201':
          description: The root operator key, value shown once.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                key_id: key_01JB2WZ9E2G4J6L8N1Q3S5UWYA
                role: operator
                principal: platform-team/bootstrap
                default_workarea_id: null
                held_by: null
                label: root operator key
                expiry: null
                revoked_at: null
                rotated_from: null
                grants: []
                denials: []
                epoch: 1
                value: oml_7hJ4kM9sU2wXq5bD0eG3nW6zA1cY8vR2pL4fQ7xT9mK
              schema: { $ref: '#/components/schemas/KeyIssued' }
