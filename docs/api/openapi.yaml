openapi: 3.1.0
info:
  title: Open Memory Lab HTTP API
  version: 0.2.0-design
  summary: >-
    The two-ring JSON API of OML, an agentic external memory provider: /v1 the provider ring,
    /v2 the memory lab.
  description: >-
    Status: design draft for review — decided, not built. This spec is the machine-readable form
    of docs/api/http-api.md and declares the same contract; the typed error taxonomy is declared
    in docs/api/errors.md and mirrored here as the ErrorCode enum. One keyed listener carries two
    stability rings (ADR-0022): /v1 is the memory provider foundation — submit (plus the reserved
    POST /v1/memories:batch of FR-12), read own and promoted, recall, supersede, and the
    attachment upload/fetch flow — under the v1 compatibility covenant: once FR-21 declares v1
    stable, v1 changes are additive only (no field removed, no semantic changed, no status code
    repurposed); anything that would break a v1 client is, by definition, a v2 capability. /v2 is
    the memory lab — review and ratification ceremonies, claim edges, workarea, key and claim
    administration, simulations, exports, settings, tenants, bootstrap, the events tail,
    vocabularies — and evolves; it may re-version without ever touching /v1. On the provider ring
    the target workarea is never named in the request: it resolves from the key's journalled
    default_workarea, overridden by the X-OML-Workarea header within the key's grants
    (request.workarea_unresolved when neither is present); /v2 keeps explicit workarea ids in
    paths and bodies. Authorization model: bearer API
    keys carrying one role (reader, writer, dreamer, admin, operator); tenant is derived
    server-side from the key, never from the request. Roles do not nest. Read verbs require
    reader effective access on the named workarea; write verbs writer; propose/review verbs
    dreamer (two capability classes, one role); admin and operator verbs require that key role
    itself — the per-operation description states the ceiling ("Requires: ..."). A key's role
    admits a fixed set of grant roles, and every workarea-scoped verb refuses in one order
    (verb_ceiling, grant_refused on a readable node, not_found otherwise — declared in
    docs/architecture/roles-and-keys.md, ADR-0025 d1). The verb ceiling
    is constitutional (R1): no agent-facing role reaches promote, sign, demote, delete or any
    admin verb. Reads fail closed as absence (404 access.not_found). Every state-creating POST
    requires an Idempotency-Key header; replays return the stored response with header
    Idempotency-Replay: true. Field spellings are design identifiers — normative in shape,
    adjustable at implementation without a design change. Every response, success and error
    alike, carries the X-Request-Id header (declared in components.headers and attached to
    every 2xx; error bodies repeat it as request_id). An operation with a fixed request media type
    (application/json everywhere except the octet-stream part upload) refuses any other request
    media type with 415 request.unsupported_media. 429 limit.rate / limit.quota may be answered
    by any operation; it is declared explicitly only on the v1 ring and high-traffic v2 surfaces.
servers:
  - url: /
    description: Deployment-relative; OML is deployed per installation, there is no central host.
security:
  - bearerAuth: []
tags:
  - name: memories
  - name: attachments
  - name: claim-edges
  - name: workareas
  - name: events
  - name: vocab
  - name: review
  - name: keys
  - name: bans
  - name: simulations
  - name: claim-administration
  - name: exports
  - name: settings
  - name: tenants
  - name: health

paths:
  /v1/memories:
    post:
      tags: [memories]
      operationId: submitMemory
      summary: Submit a memory (remember or learn); held on arrival, scanned same-call.
      description: 'Requires: writer effective access on the resolved workarea; every derives_from ancestor must be readable by the key — promoted within its reader effective access, or its own row in any state — else 404 access.not_found, indistinguishable from a nonexistent id (ADR-0025 d3); lineage is attribution, not a verb of its own. The target workarea resolves from the token (default_workarea, or the X-OML-Workarea override; request.workarea_unresolved with neither — ADR-0022 d4). Journals submission.remember or submission.learn; verb learn with an empty or omitted derives_from is refused (submission.lineage_required).'
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/XOMLWorkarea' }
      requestBody:
        required: true
        content:
          application/json:
            example:
              verb: remember
              claim_key: supplier-quote-am-7741
              kind: memory
              body: Supplier Accra Metals quoted 412 USD/t for Q1-2027 delivery, valid until 2026-11-15. Quote ref AM-7741.
              attachments:
              - sha256:9f2c41aa7d0e8b64c3f2a19e5d87b4610c3e9f2a84d7b1c6e0f5a382947d1c5b
              derives_from:
              - art_01JB2WYT5H8K3N6Q9S2VX4ZC7B
            schema: { $ref: '#/components/schemas/SubmitRequest' }
      responses:
        '202':
          description: Held, visible to no one else until ratified (R3).
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                artifact_id: art_01JB2XF2R7M9W4K6T8Y1QZ3VH5
                claim_key: supplier-quote-am-7741
                version: 1
                state: held
                workarea_id: wa_01JB2XCQ4T8Z9K2M5P7R1VH3ND
                retirement: false
                replaces: null
                plaintext_digest: sha256:7c0f3e91ab5d2c48e6f1a09b83d47c25e9b160fa4d8c72035b1e6f94a2d8c310
                scan:
                  result: pass
                  scanner_version: ruleset-2026.10
                journal_seq: 4182
              schema: { $ref: '#/components/schemas/SubmitAccepted' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
    get:
      tags: [memories]
      operationId: searchMemories
      summary: Structured, paginated listing of memory summaries.
      description: 'Requires: reader effective access; own=true admits any tenant role except operator (access.verb_ceiling) for its own rows only — every row the calling key authored, in every state, across all workareas minus its globally denied subtrees, no grant needed (ADR-0025 d13). With own=true the listing resolves no workarea, and an X-OML-Workarea header is refused (request.validation). Without own, the listing returns promoted served tips within reader effective access, defaulting to the token workarea''s subtree (ADR-0022 d4) — a self_signed version only when the scope node is its own workarea; a retired claim''s tip, its retirement version, among them, flagged retirement true; others'' held rows are never returned (R3). workarea_id is a subtree filter (see the parameter). Ordered created_at descending, then artifact_id descending; the cursor is bound to the calling key and expires under api.cursor_ttl.'
      parameters:
        - { $ref: '#/components/parameters/XOMLWorkarea' }
        - { name: workarea_id, in: query, schema: { type: string }, description: "A subtree filter that must name a node the key may be told about, else access.not_found, indistinguishable from a nonexistent node. With own=true, a node the key holds some role on (the naming rule, docs/architecture/roles-and-keys.md, Own); it narrows the listing to the key's rows in that subtree whatever the key holds below it. Without own, a node where reader is effective; the listing is the intersection of its subtree with the scope's, and the scope still resolves from the token (request.workarea_unresolved for a key with neither a default nor X-OML-Workarea)." }
        - { name: claim_key, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string, enum: [held, promoted, demoted, rejected, erased] } }
        - { name: kind, in: query, schema: { type: string, enum: [memory, derived_fact, steering, term, term_mapping, vocab_release] } }
        - { name: own, in: query, schema: { type: boolean, default: false } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: One page of memory summaries.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                items:
                - artifact_id: art_01JB2XF2R7M9W4K6T8Y1QZ3VH5
                  claim_key: supplier-quote-am-7741
                  version: 1
                  tip: true
                  workarea_id: wa_01JB2XCQ4T8Z9K2M5P7R1VH3ND
                  workarea_path: universe.procurement.metals-crew
                  kind: memory
                  state: promoted
                  principal: crew-procure/agent-7
                  provenance: agent
                  simulation_id: null
                  self_signed: false
                  plaintext_digest: sha256:7c0f3e91ab5d2c48e6f1a09b83d47c25e9b160fa4d8c72035b1e6f94a2d8c310
                  tokens: 26
                  retirement: false
                  replaces: null
                  held_expires_at: null
                  derives_from:
                  - art_01JB2WYT5H8K3N6Q9S2VX4ZC7B
                  attachments:
                  - digest: sha256:9f2c41aa7d0e8b64c3f2a19e5d87b4610c3e9f2a84d7b1c6e0f5a382947d1c5b
                    media_type: application/pdf
                    size_bytes: 184233
                  created_at: '2026-10-27T13:58:20Z'
                  promoted_at: '2026-10-27T14:11:08Z'
                next_cursor: null
              schema: { $ref: '#/components/schemas/MemoryPage' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }

  /v1/memories/recall:
    post:
      tags: [memories]
      operationId: recallMemories
      summary: Ranked retrieval (FTS + vector) over promoted rows; steering rows precede hits, unranked.
      description: 'Requires: reader effective access on the subtree. Default scope is the token workarea''s subtree — the key''s default_workarea, or the X-OML-Workarea override (ADR-0022 d4); neither answers request.workarea_unresolved, with no tenant-wide fallback. Read-shaped POST: no Idempotency-Key. Applicable steering, the total hit order, own held rows and the max_tokens cut are declared in docs/architecture/retrieval.md (ADR-0025 d4, d7, d8). Logged with the ids served after truncation and the canonical request digest (D12, ADR-0025 d9). Recall quality unmeasured — FR-4.'
      parameters: [{ $ref: '#/components/parameters/XOMLWorkarea' }]
      requestBody:
        required: true
        content:
          application/json:
            example:
              query: current aluminium quote Accra Metals validity
              k: 8
            schema: { $ref: '#/components/schemas/RecallRequest' }
      responses:
        '200':
          description: Steering first and never ranked, then scored hits.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                steering:
                - artifact_id: art_01JB2V8K3M6P9R2T5W8Z1CF4HQ
                  claim_key: quote-validity-steering
                  version: 1
                  tip: true
                  workarea_id: wa_01JB2WQ8S1U3W5Y7A9C2E4G6JL
                  workarea_path: universe.procurement
                  kind: steering
                  state: promoted
                  tokens: 20
                  retirement: false
                  replaces: null
                  held_expires_at: null
                  created_at: '2026-10-02T09:20:41Z'
                  promoted_at: '2026-10-02T11:05:12Z'
                  body: Prefer quotes with an explicit validity date; treat undated quotes as expired.
                hits:
                - memory:
                    artifact_id: art_01JB2XF2R7M9W4K6T8Y1QZ3VH5
                    claim_key: supplier-quote-am-7741
                    version: 1
                    tip: true
                    workarea_id: wa_01JB2XCQ4T8Z9K2M5P7R1VH3ND
                    workarea_path: universe.procurement.metals-crew
                    kind: memory
                    state: promoted
                    principal: crew-procure/agent-7
                    provenance: agent
                    simulation_id: null
                    self_signed: false
                    plaintext_digest: sha256:7c0f3e91ab5d2c48e6f1a09b83d47c25e9b160fa4d8c72035b1e6f94a2d8c310
                    derives_from:
                    - art_01JB2WYT5H8K3N6Q9S2VX4ZC7B
                    attachments:
                    - digest: sha256:9f2c41aa7d0e8b64c3f2a19e5d87b4610c3e9f2a84d7b1c6e0f5a382947d1c5b
                      media_type: application/pdf
                      size_bytes: 184233
                    created_at: '2026-10-27T13:58:20Z'
                    promoted_at: '2026-10-27T14:11:08Z'
                    tokens: 26
                    retirement: false
                    replaces: null
                    held_expires_at: null
                    body: Supplier Accra Metals quoted 412 USD/t for Q1-2027 delivery, valid until 2026-11-15. Quote ref AM-7741.
                  score: 0.83
                query_digest: sha256:c4a91e0b7d2f6358a1c0e94d72b85f31d6c2e8a90b4f7135c8d0e2a6951b4d7f
              schema: { $ref: '#/components/schemas/RecallResponse' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }

  /v1/memories/{artifact_id}:
    get:
      tags: [memories]
      operationId: getMemory
      summary: One memory with body (decrypted on the serving path) and attachment descriptors.
      description: 'The calling key may fetch its own rows in any state, with no grant needed (global denials still mask). Anyone else needs reader effective access on the row''s workarea and sees promoted versions only — superseded versions and every version of a retired claim stay fetchable as history. Get takes the row''s own workarea as its implicit scope, so a non-own self_signed version is served to a key with reader effective access there. Anything else answers access.not_found (ADR-0025 d3). Erased answers 410 lifecycle.erased only to a key that could read the version immediately before its erasure — its author''s key set, or, when it was promoted then, a key with reader effective access on its workarea; readability is checked first, and every other key gets access.not_found. Resolves no workarea: an X-OML-Workarea header is request.validation. derives_from lists only ancestors the caller can read, replaces is null when the caller cannot read the replaced version, and workarea_id is null on an own row whose node the key holds no role on.'
      parameters: [{ $ref: '#/components/parameters/ArtifactId' }]
      responses:
        '200':
          description: The memory.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                artifact_id: art_01JB2XF2R7M9W4K6T8Y1QZ3VH5
                claim_key: supplier-quote-am-7741
                version: 1
                tip: true
                workarea_id: wa_01JB2XCQ4T8Z9K2M5P7R1VH3ND
                workarea_path: universe.procurement.metals-crew
                kind: memory
                state: promoted
                principal: crew-procure/agent-7
                provenance: agent
                simulation_id: null
                self_signed: false
                plaintext_digest: sha256:7c0f3e91ab5d2c48e6f1a09b83d47c25e9b160fa4d8c72035b1e6f94a2d8c310
                derives_from:
                - art_01JB2WYT5H8K3N6Q9S2VX4ZC7B
                attachments:
                - digest: sha256:9f2c41aa7d0e8b64c3f2a19e5d87b4610c3e9f2a84d7b1c6e0f5a382947d1c5b
                  media_type: application/pdf
                  size_bytes: 184233
                created_at: '2026-10-27T13:58:20Z'
                promoted_at: '2026-10-27T14:11:08Z'
                tokens: 26
                retirement: false
                replaces: null
                held_expires_at: null
                body: Supplier Accra Metals quoted 412 USD/t for Q1-2027 delivery, valid until 2026-11-15. Quote ref AM-7741.
              schema: { $ref: '#/components/schemas/Memory' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }

  /v2/memories/{artifact_id}/lineage:
    get:
      tags: [memories]
      operationId: getLineage
      summary: The derivation closure, pending and ratified edges, serialized as stored.
      description: 'Requires: reader effective access. Serialize, don''t compute (D13); out-of-scope nodes are elided to redacted ids.'
      parameters: [{ $ref: '#/components/parameters/ArtifactId' }]
      responses:
        '200':
          description: The lineage closure.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                artifact_id: art_01JB2XJH8K1M3P5R7T9W2YA4CE
                nodes:
                - artifact_id: art_01JB2XJH8K1M3P5R7T9W2YA4CE
                  claim_key: accra-metals-price-anchor
                  version: 1
                - artifact_id: art_01JB2XF2R7M9W4K6T8Y1QZ3VH5
                  claim_key: supplier-quote-am-7741
                  version: 1
                - artifact_id: art_01JB2M4N6P8R1T3V5X7Z9BD2FH
                  redacted: true
                edges:
                - from_artifact_id: art_01JB2XJH8K1M3P5R7T9W2YA4CE
                  to_artifact_id: art_01JB2XF2R7M9W4K6T8Y1QZ3VH5
                  kind: derives_from
                  state: ratified
                - from_artifact_id: art_01JB2XF2R7M9W4K6T8Y1QZ3VH5
                  to_artifact_id: art_01JB2M4N6P8R1T3V5X7Z9BD2FH
                  kind: claim_edge
                  state: pending
              schema: { $ref: '#/components/schemas/Lineage' }
        default: { $ref: '#/components/responses/Error' }

  /v1/memories/{artifact_id}/supersede:
    post:
      tags: [memories]
      operationId: proposeSupersession
      summary: Propose a replacement version, or with retirement true propose retiring the claim; a new attributed submission, held like any write.
      description: 'Requires: the supersede rule declared in docs/architecture/roles-and-keys.md (Grant admissibility and refusal order) — a writer on a target version it authored, a dreamer through edit-as-proposal. The target must be the current served tip: submission.tip_conflict, with details.current_tip when the caller can read it. The tip moves only at ratification, by compare-and-set; the tip, version-ordinal, competing-successor, retirement and retired-claim rules are declared in docs/architecture/audit-and-lineage.md (ADR-0025 d10, d11). X-OML-Workarea, if sent, must equal the target''s workarea (request.validation otherwise); that check, the tip, the kind and retirement checks and workarea.frozen are answered only after the target is known readable, in the order of step 5 of the supersede rule. Idempotency-Key is scoped to the key with a nil workarea; the record is looked up after step 1 of that rule and before step 2, so a committed supersession replays its stored response whatever the target''s state or the key''s access now, and it is claimed only after step 2 passes. Omitted attachments and terms leave the successor with none; only kind is inherited. A tainted replacement can never take the default tip (simulation.tip_refused at promotion): it shadows the tip for its simulation audience only.'
      parameters:
        - { $ref: '#/components/parameters/ArtifactId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/XOMLWorkarea' }
      requestBody:
        required: true
        content:
          application/json:
            examples:
              revise:
                value:
                  body: Supplier Accra Metals revised the quote to 408 USD/t for Q1-2027 delivery, valid until 2026-12-01. Quote ref AM-7741-r2.
                  reason: supplier issued a revised quote
              retire:
                value:
                  body: Superseded by the 2026 runbook; stop serving.
                  retirement: true
            schema: { $ref: '#/components/schemas/SupersedeRequest' }
      responses:
        '202':
          description: The proposed replacement, held.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                artifact_id: art_01JB2YN4P6R8TA1CW3EY5G7J9L
                claim_key: supplier-quote-am-7741
                version: 2
                state: held
                workarea_id: wa_01JB2XCQ4T8Z9K2M5P7R1VH3ND
                retirement: false
                replaces:
                  artifact_id: art_01JB2XF2R7M9W4K6T8Y1QZ3VH5
                  version: 1
                plaintext_digest: sha256:8d2c5f70e1a94b36c7d21e85f03a6b94d5c8e217a0f4b63d92c1e5a78f0b3c64
                journal_seq: 4293
              schema: { $ref: '#/components/schemas/SubmitAccepted' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        default: { $ref: '#/components/responses/Error' }

  /v2/memories/{artifact_id}/reassign:
    post:
      tags: [claim-administration]
      operationId: reassignClaim
      summary: Journalled move between workareas, recording both policy snapshots.
      description: 'Requires: admin key role. Stricter-policy destination re-enters held; refused into validated (workarea.frozen); claim_key collision refused without re_key.'
      parameters:
        - { $ref: '#/components/parameters/ArtifactId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            example:
              workarea_id: wa_01JB2Y5R7T9V2X4Z6BD8FH1KM3
              dry_run: false
            schema: { $ref: '#/components/schemas/ReassignRequest' }
      responses:
        '200':
          description: Moved (or the dry-run preview).
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                journal_seq: 4305
                event_id: evt_01JB2YR7S9UB2DX4FZ6H8KM1P3
                dry_run: false
              schema: { $ref: '#/components/schemas/ActResult' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        default: { $ref: '#/components/responses/Error' }

  /v2/memories/{artifact_id}/demote:
    post:
      tags: [claim-administration]
      operationId: demoteClaim
      summary: Journalled demotion; bytes are kept (R4).
      description: 'Requires: admin key role.'
      parameters:
        - { $ref: '#/components/parameters/ArtifactId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            example:
              version: 2
              reason: quote withdrawn by supplier
            schema: { $ref: '#/components/schemas/DemoteRequest' }
      responses:
        '200':
          description: Demoted.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                journal_seq: 4311
                event_id: evt_01JB2YS8TA1CW3EY5G7J9LN2Q4
                dry_run: false
              schema: { $ref: '#/components/schemas/ActResult' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        default: { $ref: '#/components/responses/Error' }

  /v2/memories/{artifact_id}/erase:
    post:
      tags: [claim-administration]
      operationId: eraseClaim
      summary: Journalled crypto-shred — erase event plus DEK destruction, scoped to body and attachment bytes.
      description: 'Requires: admin key role. dry_run returns the erasure inventory per copy class. Attribution metadata survives — FR-1.'
      parameters:
        - { $ref: '#/components/parameters/ArtifactId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            example:
              dry_run: true
            schema: { $ref: '#/components/schemas/EraseRequest' }
      responses:
        '202':
          description: Erase journalled, DEK destroyed (or the dry-run inventory).
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                journal_seq: null
                event_id: null
                dry_run: true
                preview:
                  copy_classes:
                  - copy_class: postgres_body
                    disposition: unreadable on DEK destruction
                  - copy_class: attachment_objects
                    count: 1
                    disposition: unreadable on DEK destruction
                  - copy_class: lake_derived
                    disposition: unreadable on DEK destruction
              schema: { $ref: '#/components/schemas/ActResult' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        default: { $ref: '#/components/responses/Error' }

  /v2/claims/tip-override:
    post:
      tags: [claim-administration]
      operationId: tipOverride
      summary: Designate an earlier promoted version as the served tip — explicit and journalled, never a silent re-rank.
      description: 'Requires: admin key role. Journals lifecycle.tip_override. Refused with simulation.tip_refused when the designated version is tainted — taint never captures the default tip.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            example:
              workarea_id: wa_01JB2XCQ4T8Z9K2M5P7R1VH3ND
              claim_key: supplier-quote-am-7741
              to_version: 1
              reason: revised quote promoted in error; serve v1 while it is re-reviewed
            schema: { $ref: '#/components/schemas/TipOverrideRequest' }
      responses:
        '200':
          description: Tip overridden.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                journal_seq: 4330
                event_id: evt_01JB2YT9UB2DX4FZ6H8KM1P3R5
                dry_run: false
              schema: { $ref: '#/components/schemas/ActResult' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        default: { $ref: '#/components/responses/Error' }

  /v1/attachments/uploads:
    post:
      tags: [attachments]
      operationId: createUploadSession
      summary: Open a resumable upload session recording the expected plaintext digest up front.
      description: 'Requires: writer effective access. The session is scoped to the uploading key and expires (D3).'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            example:
              expected_digest: sha256:9f2c41aa7d0e8b64c3f2a19e5d87b4610c3e9f2a84d7b1c6e0f5a382947d1c5b
              size_bytes: 184233
              media_type: application/pdf
            schema: { $ref: '#/components/schemas/UploadSessionCreate' }
      responses:
        '201':
          description: The session.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                session_id: ups_01JB2XD9W6E4T2Y8U1O3PA5SKF
                expected_digest: sha256:9f2c41aa7d0e8b64c3f2a19e5d87b4610c3e9f2a84d7b1c6e0f5a382947d1c5b
                size_bytes: 184233
                media_type: application/pdf
                state: open
                parts: []
                expires_at: '2026-10-29T18:40:00Z'
              schema: { $ref: '#/components/schemas/UploadSession' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }

  /v1/attachments/uploads/{session_id}/parts/{part_number}:
    put:
      tags: [attachments]
      operationId: putUploadPart
      summary: Upload one part; replaying a part is harmless (verified by digest at completion).
      description: 'Requires: writer, session owner. No Idempotency-Key — a part is addressed by (session, part_number). Parts are 5–64 MiB (http-api.md Limits); an oversized part answers 413 request.payload_too_large.'
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: string } }
        - { name: part_number, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '204':
          description: Part stored.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }

  /v1/attachments/uploads/{session_id}/complete:
    post:
      tags: [attachments]
      operationId: completeUploadSession
      summary: Assemble, hash, compare against the expected digest; store encrypted on match.
      description: 'Requires: writer, session owner. upload.digest_mismatch when the bytes are not what the session promised.'
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Content-addressed attachment stored, inert until a submission binds it.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                digest: sha256:9f2c41aa7d0e8b64c3f2a19e5d87b4610c3e9f2a84d7b1c6e0f5a382947d1c5b
                ciphertext_digest: sha256:52b8e04d7a1f3c96e2d50b84a7c91e36f40d82b5c6a1973e0f5d24c8a9b1e670
                state: complete
              schema: { $ref: '#/components/schemas/UploadComplete' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }

  /v1/attachments/{digest}:
    get:
      tags: [attachments]
      operationId: getAttachment
      summary: Fetch attachment bytes, decrypted on the serving path, plaintext digest verified before serving.
      description: 'Requires: reader access to a promoted claim binding the digest; the author for own held; a reviewer under a valid serve_id. Logged as a read.'
      parameters:
        - { name: digest, in: path, required: true, schema: { $ref: '#/components/schemas/Digest' } }
        - { name: serve_id, in: query, schema: { type: string }, description: Reviewer fetch under a serve binding. }
      responses:
        '200':
          description: The plaintext bytes.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }

  /v2/claim-edges:
    get:
      tags: [claim-edges]
      operationId: listClaimEdges
      summary: Paginated claim-graph read, pending and ratified, scoped to read access.
      description: 'Requires: reader effective access.'
      parameters:
        - { name: workarea_id, in: query, schema: { type: string } }
        - { name: artifact_id, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: One page of claim edges.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                items:
                - edge_id: ce_01JB2YA1C3E5G7J9L2N4Q6S8UW
                  from_artifact_id: art_01JB2XF2R7M9W4K6T8Y1QZ3VH5
                  to_artifact_id: art_01JB2M4N6P8R1T3V5X7Z9BD2FH
                  label: supports
                  state: pending
                  proposer_key_id: key_01JB2W1A3C5E7G9J2L4N6Q8SUW
                  ratifier_key_id: null
                next_cursor: null
              schema: { $ref: '#/components/schemas/ClaimEdgePage' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [claim-edges]
      operationId: proposeClaimEdge
      summary: Propose a claim-to-claim connection; pending until ratified.
      description: 'Requires: dreamer(propose). The claim-edge label vocabulary is not fixed by the design (open detail, roadmap).'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            example:
              from_artifact_id: art_01JB2XF2R7M9W4K6T8Y1QZ3VH5
              to_artifact_id: art_01JB2M4N6P8R1T3V5X7Z9BD2FH
              label: supports
            schema: { $ref: '#/components/schemas/ClaimEdgeProposal' }
      responses:
        '202':
          description: Pending edge.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                edge_id: ce_01JB2YA1C3E5G7J9L2N4Q6S8UW
                from_artifact_id: art_01JB2XF2R7M9W4K6T8Y1QZ3VH5
                to_artifact_id: art_01JB2M4N6P8R1T3V5X7Z9BD2FH
                label: supports
                state: pending
                proposer_key_id: key_01JB2W1A3C5E7G9J2L4N6Q8SUW
                ratifier_key_id: null
              schema: { $ref: '#/components/schemas/ClaimEdge' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        default: { $ref: '#/components/responses/Error' }

  /v2/claim-edges/{edge_id}/ratify:
    post:
      tags: [claim-edges]
      operationId: ratifyClaimEdge
      summary: Ratify a proposed claim edge.
      description: 'Requires: dreamer(review); never the proposer (review.ratifier_is_proposer) and refused on lineage collision (review.author_in_lineage) — R2. A held_by: service key is refused with access.verb_ceiling before any lookup (ADR-0025 d1).'
      parameters:
        - { name: edge_id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Ratified edge.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                edge_id: ce_01JB2YA1C3E5G7J9L2N4Q6S8UW
                from_artifact_id: art_01JB2XF2R7M9W4K6T8Y1QZ3VH5
                to_artifact_id: art_01JB2M4N6P8R1T3V5X7Z9BD2FH
                label: supports
                state: ratified
                proposer_key_id: key_01JB2W1A3C5E7G9J2L4N6Q8SUW
                ratifier_key_id: key_01JB2WV7C9E2G4J6L8N1QS3UWZ
              schema: { $ref: '#/components/schemas/ClaimEdge' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }

  /v2/workareas:
    get:
      tags: [workareas]
      operationId: resolveWorkarea
      summary: Resolve a workarea node by derived path (grants bind to node ids, never paths).
      description: 'Requires: reader effective access on the node.'
      parameters:
        - { name: path, in: query, required: true, schema: { type: string }, description: Derived ltree path. }
      responses:
        '200':
          description: The node.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                id: wa_01JB2XCQ4T8Z9K2M5P7R1VH3ND
                parent_id: wa_01JB2WQ8S1U3W5Y7A9C2E4G6JL
                path: universe.procurement.metals-crew
                status: committed
                crew:
                  name: metals-crew
                  charter_uri: https://crews.example.com/metals/charter.md
                  external_manager: crewd.example.com
                created_at: '2026-09-02T09:14:33Z'
              schema: { $ref: '#/components/schemas/Workarea' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [workareas]
      operationId: createWorkarea
      summary: Create a child workarea in development.
      description: 'Requires: admin key role. Refused under a validated parent (workarea.frozen); universe cannot be created or deleted.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            example:
              parent_id: wa_01JB2XCQ4T8Z9K2M5P7R1VH3ND
              name: q1-2027
              crew:
                name: metals-crew
                charter_uri: https://crews.example.com/metals/charter.md
                external_manager: crewd.example.com
            schema: { $ref: '#/components/schemas/WorkareaCreate' }
      responses:
        '201':
          description: The new node.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                id: wa_01JB2Y5R7T9V2X4Z6BD8FH1KM3
                parent_id: wa_01JB2XCQ4T8Z9K2M5P7R1VH3ND
                path: universe.procurement.metals-crew.q1-2027
                status: development
                crew:
                  name: metals-crew
                  charter_uri: https://crews.example.com/metals/charter.md
                  external_manager: crewd.example.com
                created_at: '2026-10-29T15:40:12Z'
              schema: { $ref: '#/components/schemas/Workarea' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        default: { $ref: '#/components/responses/Error' }

  /v2/workareas/{workarea_id}:
    get:
      tags: [workareas]
      operationId: getWorkarea
      summary: One node — id, parent, derived path, status, crew record — with the calling key's view of it.
      description: 'Requires: reader effective access (access.not_found otherwise). children, my_effective_verbs and permission_epoch are relative to the calling key: children (ordered by path_leaf, then id) and edges (ordered by edge_id) outside read access are absent; my_effective_verbs is the union over the grant roles effective on the node (the effective-verbs table in docs/architecture/roles-and-keys.md); permission_epoch is the calling key''s permission epoch as declared in docs/architecture/workareas.md (ADR-0025 d14). One call carries all of it.'
      parameters: [{ $ref: '#/components/parameters/WorkareaId' }]
      responses:
        '200':
          description: The node.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                id: wa_01JB2XCQ4T8Z9K2M5P7R1VH3ND
                parent_id: wa_01JB2WQ8S1U3W5Y7A9C2E4G6JL
                path: universe.procurement.metals-crew
                status: committed
                crew:
                  name: metals-crew
                  charter_uri: https://crews.example.com/metals/charter.md
                  external_manager: crewd.example.com
                created_at: '2026-09-02T09:14:33Z'
                children:
                - id: wa_01JB2Y5R7T9V2X4Z6BD8FH1KM3
                  path_leaf: q1-2027
                  status: development
                edges:
                - edge_id: we_01JB2Y6T8V1X3Z5B7D9FH2KM4P
                  from: wa_01JB2XCQ4T8Z9K2M5P7R1VH3ND
                  to: wa_01JB2V0B2D4F6H8K1M3P5R7TVX
                  label: continues
                  state: ratified
                my_effective_verbs: [recall, read, graph_read, events_tail, remember, learn, attach, supersede]
                permission_epoch: 815
              schema: { $ref: '#/components/schemas/WorkareaView' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /v2/workareas/{workarea_id}/tree:
    get:
      tags: [workareas]
      operationId: getWorkareaTree
      summary: The subtree, paginated; nodes outside read scope are omitted.
      description: 'Requires: reader effective access.'
      parameters:
        - { $ref: '#/components/parameters/WorkareaId' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: One page of nodes.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                items:
                - id: wa_01JB2XCQ4T8Z9K2M5P7R1VH3ND
                  parent_id: wa_01JB2WQ8S1U3W5Y7A9C2E4G6JL
                  path: universe.procurement.metals-crew
                  status: committed
                  crew:
                    name: metals-crew
                    charter_uri: https://crews.example.com/metals/charter.md
                    external_manager: crewd.example.com
                  created_at: '2026-09-02T09:14:33Z'
                - id: wa_01JB2Y5R7T9V2X4Z6BD8FH1KM3
                  parent_id: wa_01JB2XCQ4T8Z9K2M5P7R1VH3ND
                  path: universe.procurement.metals-crew.q1-2027
                  status: development
                  crew:
                    name: metals-crew
                    charter_uri: https://crews.example.com/metals/charter.md
                    external_manager: crewd.example.com
                  created_at: '2026-10-29T15:40:12Z'
                next_cursor: null
              schema: { $ref: '#/components/schemas/WorkareaPage' }
        default: { $ref: '#/components/responses/Error' }

  /v2/workareas/{workarea_id}/edges:
    get:
      tags: [workareas]
      operationId: listWorkareaEdges
      summary: Labelled related edges touching the node, pending and ratified; edges confer zero access.
      description: 'Requires: reader effective access.'
      parameters:
        - { $ref: '#/components/parameters/WorkareaId' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: One page of edges.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                items:
                - edge_id: we_01JB2Y6T8V1X3Z5B7D9FH2KM4P
                  from_workarea_id: wa_01JB2XCQ4T8Z9K2M5P7R1VH3ND
                  to_workarea_id: wa_01JB2Y5R7T9V2X4Z6BD8FH1KM3
                  label: continues
                  state: pending
                  proposer_key_id: key_01JB2W1A3C5E7G9J2L4N6Q8SUW
                  ratifier_key_id: null
                next_cursor: null
              schema: { $ref: '#/components/schemas/WorkareaEdgePage' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [workareas]
      operationId: proposeWorkareaEdge
      summary: Propose a labelled edge from this node; pending until ratified.
      description: 'Requires: dreamer(propose) effective access on at least one endpoint and reader on both (edge-authority rule, D7).'
      parameters:
        - { $ref: '#/components/parameters/WorkareaId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            example:
              to_workarea_id: wa_01JB2Y5R7T9V2X4Z6BD8FH1KM3
              label: continues
            schema: { $ref: '#/components/schemas/WorkareaEdgeProposal' }
      responses:
        '202':
          description: Pending edge.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                edge_id: we_01JB2Y6T8V1X3Z5B7D9FH2KM4P
                from_workarea_id: wa_01JB2XCQ4T8Z9K2M5P7R1VH3ND
                to_workarea_id: wa_01JB2Y5R7T9V2X4Z6BD8FH1KM3
                label: continues
                state: pending
                proposer_key_id: key_01JB2W1A3C5E7G9J2L4N6Q8SUW
                ratifier_key_id: null
              schema: { $ref: '#/components/schemas/WorkareaEdge' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        default: { $ref: '#/components/responses/Error' }

  /v2/workarea-edges/{edge_id}/ratify:
    post:
      tags: [workareas]
      operationId: ratifyWorkareaEdge
      summary: Ratify a proposed workarea edge.
      description: 'Requires: dreamer(review) effective access on BOTH endpoints; never the proposer (review.ratifier_is_proposer — R2 extends to edges). A held_by: service key is refused with access.verb_ceiling before any lookup (ADR-0025 d1).'
      parameters:
        - { name: edge_id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Ratified edge.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                edge_id: we_01JB2Y6T8V1X3Z5B7D9FH2KM4P
                from_workarea_id: wa_01JB2XCQ4T8Z9K2M5P7R1VH3ND
                to_workarea_id: wa_01JB2Y5R7T9V2X4Z6BD8FH1KM3
                label: continues
                state: ratified
                proposer_key_id: key_01JB2W1A3C5E7G9J2L4N6Q8SUW
                ratifier_key_id: key_01JB2WV7C9E2G4J6L8N1QS3UWZ
              schema: { $ref: '#/components/schemas/WorkareaEdge' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }

  /v2/workareas/{workarea_id}/status:
    get:
      tags: [workareas]
      operationId: getWorkareaStatus
      summary: Status, the review policy object in force, pending transitions.
      description: 'Requires: reader effective access.'
      parameters: [{ $ref: '#/components/parameters/WorkareaId' }]
      responses:
        '200':
          description: Status view.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                workarea_id: wa_01JB2XCQ4T8Z9K2M5P7R1VH3ND
                status: committed
                policy:
                  k: 1
                  required_roles:
                  - dreamer
                  human_required_classes:
                  - vocab.deprecation_replaced_by
                  - vocab.mapping_exactMatch
                  independence_axis: principal
                  held_item_expiry: 168h
                pending_transitions: []
              schema: { $ref: '#/components/schemas/WorkareaStatus' }
        default: { $ref: '#/components/responses/Error' }

  /v2/workareas/{workarea_id}/reparent:
    post:
      tags: [workareas]
      operationId: reparentWorkarea
      summary: Journalled single-transaction descendant path rewrite; dry_run previews paths and grants affected.
      description: 'Requires: admin key role. Re-parenting into a validated destination is refused (workarea.frozen).'
      parameters:
        - { $ref: '#/components/parameters/WorkareaId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            example:
              new_parent_id: wa_01JB2WQ8S1U3W5Y7A9C2E4G6JL
              dry_run: true
            schema: { $ref: '#/components/schemas/ReparentRequest' }
      responses:
        '200':
          description: Re-parented (or the dry-run preview).
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                journal_seq: null
                event_id: null
                dry_run: true
                preview:
                  paths_rewritten: 2
                  grants_affected: []
              schema: { $ref: '#/components/schemas/ActResult' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        default: { $ref: '#/components/responses/Error' }

  /v2/workareas/{workarea_id}/crew:
    post:
      tags: [workareas]
      operationId: updateCrewMetadata
      summary: Journalled crew-metadata update; allowed on validated areas (freeze covers claims, not metadata).
      description: 'Requires: admin key role.'
      parameters:
        - { $ref: '#/components/parameters/WorkareaId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: metals-crew
