        required: true
        content:
          application/json:
            example:
              role: writer
              name: procure-agent-7
              grants:
              - workarea: metals-crew
                role: writer
              - workarea: metals-crew
                role: reader
              default_workarea: metals-crew
              held_by: agent
              crew: metals-crew
              label: procure agent 7
              principal: crew-procure/agent-7
            schema: { $ref: '#/components/schemas/KeyIssueRequest' }
      responses:
