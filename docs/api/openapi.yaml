                  plaintext_digest: sha256:1e5a7c3902d8b6f44a0c2e917d3f58b62c90e1a74f6d2b85031c7e9a4b5d6f28
                  derives_from:
                  - art_01JB2XF2R7M9W4K6T8Y1QZ3VH5
                  - art_01JB2M4N6P8R1T3V5X7Z9BD2FH
                  attachments: []
                  tokens: 36
                  retirement: false
                  replaces: null
                  held_expires_at: null
                  created_at: '2026-10-29T16:02:51Z'
                  promoted_at: null
                  text: Accra Metals has undercut the next-best aluminium quote in three consecutive quarters; treat them as the price anchor for Q1-2027 negotiations.
                served_digests:
                  body: sha256:1e5a7c3902d8b6f44a0c2e917d3f58b62c90e1a74f6d2b85031c7e9a4b5d6f28
                  attachments: []
              schema: { $ref: '#/components/schemas/Serve' }
        '204':
          description: Nothing in scope waits.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
