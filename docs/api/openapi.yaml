      summary: Start an async export job — the signed evidence bundle, or the digest-only chain stream for client-side verification.
      description: 'Requires: admin key role. The export act is itself journalled; simulations are excluded unless asked for and then listed separately.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            example:
              kind: evidence
              from_seq: 1
            schema: { $ref: '#/components/schemas/ExportRequest' }
      responses:
        '202':
          description: Job accepted.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                export_id: exp_01JB2YD5F7H9K2M4P6R8TA1CWE
                kind: evidence
                state: running
                requested_at: '2026-10-29T16:30:00Z'
                finished_at: null
                bundle_bytes: null
              schema: { $ref: '#/components/schemas/ExportJob' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        default: { $ref: '#/components/responses/Error' }

  /v2/exports/{export_id}:
    get:
      tags: [exports]
      operationId: getExport
      summary: Job state — running, done or failed.
      description: 'Requires: admin key role.'
      parameters: [{ name: export_id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: The job.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                export_id: exp_01JB2YD5F7H9K2M4P6R8TA1CWE
                kind: evidence
                state: done
                requested_at: '2026-10-29T16:30:00Z'
                finished_at: '2026-10-29T16:34:10Z'
                bundle_bytes: 7340032
              schema: { $ref: '#/components/schemas/ExportJob' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /v2/exports/{export_id}/bundle:
    get:
      tags: [exports]
      operationId: downloadExportBundle
      summary: The signed bundle; export.not_ready before the job is done.
      description: 'Requires: admin key role.'
      parameters: [{ name: export_id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: The signed bundle.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

  /v2/settings:
    get:
      tags: [settings]
      operationId: getSettings
      summary: The configured document as last applied; effective=true adds running values with every divergence marked per key.
      description: 'Requires: admin key role.'
      parameters:
        - { name: effective, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Configured (and optionally effective) settings.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                configured:
                  search:
                    fts_config: simple
                  idempotency:
                    replay_window: 48h
                applied_at: '2026-10-28T08:12:00Z'
                applied_event_id: evt_01JB2Z4F6H8KM1P3R5T7V9X2ZB
                divergences: []
              schema: { $ref: '#/components/schemas/SettingsView' }
        default: { $ref: '#/components/responses/Error' }

  /v2/settings/validate:
    post:
      tags: [settings]
      operationId: validateSettings
      summary: Server-side validation without applying; a retired settings key is refused by name, with its replacement.
      description: 'Requires: admin key role. Read-shaped POST: no Idempotency-Key.'
      requestBody:
        required: true
        content:
          application/json:
            example:
              search:
                fts_config: simple
              idempotency:
                replay_window: 48h
            schema: { $ref: '#/components/schemas/SettingsDocument' }
      responses:
        '200':
          description: Findings, including settings.retired_key findings.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                valid: true
                findings: []
              schema: { $ref: '#/components/schemas/SettingsValidation' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        default: { $ref: '#/components/responses/Error' }

  /v2/settings/apply:
    post:
      tags: [settings]
      operationId: applySettings
      summary: Validate, journal, apply; refused whole on any validation error, and there is no force flag.
      description: 'Requires: admin key role. Journals system.settings_applied.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            example:
              search:
                fts_config: simple
              idempotency:
                replay_window: 48h
            schema: { $ref: '#/components/schemas/SettingsDocument' }
      responses:
        '200':
          description: Applied.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                journal_seq: 4401
                event_id: evt_01JB2Z5G7J9LN2Q4S6U8W1Y3AC
                dry_run: false
              schema: { $ref: '#/components/schemas/ActResult' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        default: { $ref: '#/components/responses/Error' }

  /v2/tenants:
    post:
      tags: [tenants]
      operationId: createTenant
      summary: Create a tenant; the operator then issues its first admin key and nothing else.
      description: 'Requires: operator key role. Operator keys never read, write or review content (access.verb_ceiling).'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: acme-industrial
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '201':
          description: The tenant.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                tenant_id: tn_01JB2YJ1L3N5Q7S9UB2DX4FZ6H
                name: acme-industrial
              schema:
                type: object
                properties:
                  tenant_id: { type: string }
                  name: { type: string }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        default: { $ref: '#/components/responses/Error' }

  /healthz:
    get:
      tags: [health]
      operationId: healthz
      summary: Liveness; unauthenticated, no tenant data.
      security: []
      responses:
        '200':
          description: The process runs.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                status: ok
              schema: { $ref: '#/components/schemas/Health' }

  /readyz:
    get:
      tags: [health]
      operationId: readyz
      summary: Readiness — Postgres reachable and the startup fork check passed; unauthenticated.
      security: []
      responses:
        '200':
          description: The replica can serve.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              example:
                status: ok
                checks:
                  postgres: ok
                  fork_check: ok
                build:
                  version: 0.2.0
                  commit: 779e7e4c1f0d8a5b2e6c9f3a7d1b4e8c2a5f9d03
                  commit_time: '2026-10-30T21:52:41Z'
                  build_time: '2026-10-30T22:40:12Z'
                  rustc: rustc 1.99.1 (4c7d2e1a9 2026-09-17)
                  target: x86_64-unknown-linux-gnu
                  profile: release
              schema: { $ref: '#/components/schemas/Ready' }
        '503':
          description: Not ready, with per-check detail and the build that answered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ready' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OML API key
      description: >-
        One key, one role (reader | writer | dreamer | admin | operator), grants scoping it to
        workarea subtrees. Tenant derives from the key server-side. Each operation's description
        states its ceiling; refusals are typed (access.verb_ceiling, access.grant_refused,
        access.not_found) per docs/api/errors.md. Key wire format: "oml_" followed by 43
        base62 characters (256 bits of randomness). At rest the service stores only the plain
        SHA-256 of the full key — defensible without salt or stretching because the key is
        high-entropy random, and it enables the UNIQUE-index lookup at authentication.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, maxLength: 256 }
      description: >-
        Claims an idempotency record (key_id, workarea, idem_key) before side effects. On the
        provider ring the workarea component is the RESOLVED target — the key's default_workarea
        or the X-OML-Workarea override (ADR-0022 d4); for supersede the workarea component is the
        fixed nil value (ADR-0025 d10), and the record is looked up after step 1 of the supersede
        rule and before step 2, so a committed supersession always replays, and claimed only after
        step 2 passes. The request digest is SHA-256 over the RFC 8785 JSON of {method, route,
        path_params, body} (docs/api/http-api.md, Idempotency). Replay of
        the same request returns the stored response with header Idempotency-Replay: true; the
        same key with a different request digest is refused (idempotency.digest_mismatch). A
        committed record is retained for at least 24 hours — the replay-window setting may only
        raise that floor — and after it expires the same key is processed as a fresh request
        (expiry-then-reprocess is documented behavior, not a defect).
    XOMLWorkarea:
      name: X-OML-Workarea
      in: header
      required: false
      schema: { type: string }
      description: >-
        Workarea node-id override for the provider ring (ADR-0022 d4). Omitted, the target (and
        recall's default scope) is the key's journalled default_workarea; present, it is honored
        only within the key's grants — plain-passable because it is authorization-checked data,
        never a secret. A provider-ring submit, recall or non-own listing from a key with neither
        a default nor this header is refused with 422 request.workarea_unresolved. Get, the
        own-work listing (own=true) and supersede never answer it: get and own=true resolve no
        workarea, so this header sent with either is request.validation, and supersede takes the
        target's workarea, which this header, if sent, must equal.
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      description: >-
        Page size, at most 200. Unless an endpoint states otherwise, listings order by
        created_at descending; the events tail is the deliberate exception (seq ascending).
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
      description: >-
        Opaque, from the previous page's next_cursor. Cursors are positional, not snapshots —
        rows written between pages can appear in later pages. A cursor is scoped to the key
        that obtained it and expires (the TTL is a named deployment setting); a stale or
        foreign cursor answers 400 request.validation.
    ArtifactId:
      name: artifact_id
      in: path
      required: true
      schema: { type: string }
    WorkareaId:
      name: workarea_id
      in: path
      required: true
      schema: { type: string }
    KeyId:
      name: key_id
      in: path
      required: true
      schema: { type: string }
    Curie:
      name: curie
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Curie' }

  headers:
    XRequestId:
      description: >-
        The request's correlation id. Every response carries it; error bodies repeat it as
        request_id, and it is the handle for the read log and support.
      schema: { type: string }
    RetryAfter:
      description: Seconds to wait before retrying; present on every retryable refusal.
      schema: { type: integer, minimum: 0 }

  responses:
    Error:
      description: Typed error envelope; code is one of ErrorCode (docs/api/errors.md).
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: auth.missing or auth.invalid.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: A 403-class refusal naming its rule (access.*, review.*, simulation.audience_refused).
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: access.not_found — absent or outside read scope, indistinguishable by design.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: A 409-class conflict (idempotency.*, submission.tip_conflict, workarea.frozen, review.serve_invalid, …).
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Gone:
      description: lifecycle.erased — a journalled crypto-shred, never a silent deletion.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    TooLarge:
      description: request.payload_too_large.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unprocessable:
      description: A 422-class refusal (submission.scan_veto, upload.digest_mismatch, settings.*, …).
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RateLimited:
      description: 429 limit.rate or limit.quota — retryable; Retry-After says when.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    UnsupportedMedia:
      description: >-
        415 request.unsupported_media — the request body's media type is not the
        application/json the operation declares; not retryable as sent.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  schemas:
    Digest:
      type: string
      pattern: '^sha256:[0-9a-f]{64}$'
      description: SHA-256 of plaintext unless a field says ciphertext.

    Role:
      type: string
      enum: [reader, writer, dreamer, admin, operator]

    ErrorCode:
      type: string
      description: The closed error vocabulary; identical to docs/api/errors.md by construction.
      enum:
        - auth.missing
        - auth.invalid
        - access.verb_ceiling
        - access.grant_refused
        - access.not_found
        - access.author_only
        - access.issuer_ceiling
        - access.role_exclusive
        - access.banned
        - request.validation
        - request.idempotency_key_required
        - request.payload_too_large
        - request.workarea_unresolved
        - request.unsupported_media
        - idempotency.in_progress
        - idempotency.digest_mismatch
        - submission.scan_veto
        - submission.attachment_missing
        - submission.simulation_id_required
        - submission.lineage_required
        - submission.tip_conflict
        - submission.claim_key_conflict
        - submission.universe_refused
        - workarea.frozen
        - workarea.transition_refused
        - review.author_in_lineage
        - review.ratifier_is_proposer
        - review.serve_invalid
        - simulation.audience_refused
        - simulation.ended
        - simulation.taint_refused
        - simulation.tip_refused
        - vocab.cycle_refused
        - vocab.prefix_conflict
        - vocab.unknown_curie
        - vocab.inactive_curie
        - upload.session_invalid
        - upload.digest_mismatch
        - lifecycle.erased
        - limit.rate
        - limit.quota
        - export.not_ready
        - settings.retired_key
        - settings.invalid
        - system.internal
        - system.unavailable

    ErrorEnvelope:
      type: object
      required: [error, request_id]
      properties:
        error:
          type: object
          required: [code, message, rule, retryable]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string, description: "Human-readable; unstable, never parsed." }
            rule: { type: string, description: The design rule the refusal names; stable per code. }
            details: { type: object, additionalProperties: true }
            retryable: { type: boolean, description: True only where the identical request can succeed later (Retry-After header present). }
        request_id: { type: string, description: Mirrors the X-Request-Id response header. }

    SubmitRequest:
      type: object
      description: >-
        Names no workarea: the target resolves from the key's default_workarea or the
        X-OML-Workarea header (ADR-0022 d4); neither present is refused with
        request.workarea_unresolved. This body, and its nested objects, stay open: ADR-0025 d16
        closes the recall, supersede, key-issuance and grant bodies only.
      required: [verb, claim_key, kind, body]
      properties:
        verb: { type: string, enum: [remember, learn], description: learn requires non-empty derives_from — refused with submission.lineage_required otherwise; a derived conclusion without nameable lineage is remember with kind derived_fact. }
        claim_key: { type: string, description: "Groups versions of one claim; one live claim per (tenant, workarea): a new claim collides with a held, promoted or demoted version (submission.claim_key_conflict), and a claim whose every version is rejected or erased releases the key (docs/architecture/audit-and-lineage.md)." }
        kind: { type: string, enum: [memory, derived_fact, steering, term, term_mapping, vocab_release] }
        body: { type: string, description: 'Text body — claim text, at most submission.max_body_size (shipped 1 MiB) UTF-8 bytes of the NFC-normalized body; larger is 413 request.payload_too_large (http-api.md Limits). Binary content goes through attachments.' }
        attachments:
          type: array
          maxItems: 64
          items: { $ref: '#/components/schemas/Digest' }
          description: At most 64 attachments per memory (http-api.md Limits). Each digest must name a completed upload session owned by this key.
        derives_from:
          type: array
          items: { type: string }
          description: Artifact ids; the declared lineage (omission is undetectable — honesty rule).
        simulation_id: { type: [string, 'null'], description: Required when derives_from touches a simulation row; key must be in the audience. }
        simulated_time: { type: [string, 'null'], format: date-time, description: "Declared data, never backdating — the journal keeps the real timestamp." }
        terms:
          type: array
          items: { $ref: '#/components/schemas/Curie' }
          description: 'CURIE annotations (ADR-0021 d8): clear, non-erasable metadata entering the signed bytes; checked by the vocab scanner under the workarea''s vocabulary_policy.'
        term_status: { type: string, enum: [active, deprecated], description: 'kind=term only. Structural payload field, never body text (ADR-0021 d1).' }
        successors:
          type: array
          items:
            type: object
            required: [curie, relation]
            properties:
              curie: { $ref: '#/components/schemas/Curie' }
              relation: { type: string, enum: [replaced_by, consider] }
          description: 'kind=term with term_status deprecated only — required then: exactly one replaced_by, or one-or-more consider. The ratified oml:replaced_by / oml:consider claim edges fold from this declaration, atomically with the submission (ADR-0021 d3).'
        mapping:
          type: object
          required: [subject, object, predicate, justification]
          properties:
            subject: { $ref: '#/components/schemas/Curie' }
            object: { $ref: '#/components/schemas/Curie' }
            predicate: { type: string, enum: [exactMatch, closeMatch, broadMatch, narrowMatch, relatedMatch] }
            justification: { type: string, enum: [human-curated, lexical, logical] }
            note: { type: string }
          description: 'kind=term_mapping only — required then. Structural payload fields (ADR-0021 d6): the scanner''s vocab.mapping_exactMatch routing and the mappings read surface depend on them, so they never ride erasable body bytes.'

    SubmitAccepted:
      type: object
      required: [artifact_id, claim_key, version, state, workarea_id, retirement, replaces]
      properties:
        artifact_id: { type: string }
        claim_key: { type: string }
        version: { type: integer, description: 'The ordinal within the claim_key; for a successor, 1 + the greatest version of the claim_key in any state, so it counts versions the key may not read — a stated residual, FR-31 (docs/architecture/audit-and-lineage.md).' }
        state: { type: string, const: held }
        workarea_id: { type: string, description: "The workarea the submission was captured in — the resolved target, or a supersession target's workarea." }
        retirement: { type: boolean, default: false, description: True when the submission is a retirement version. }
        replaces:
          type: [object, 'null']
          description: For a supersession, the version it replaces; null for a version 1.
          properties:
            artifact_id: { type: string }
            version: { type: integer }
        plaintext_digest: { $ref: '#/components/schemas/Digest' }
        scan:
          type: object
          properties:
            result: { type: string }
            scanner_version: { type: string }
        journal_seq: { type: integer }

    AttachmentDescriptor:
      type: object
      properties:
        digest: { $ref: '#/components/schemas/Digest' }
        media_type: { type: string }
        size_bytes: { type: integer }

    MemorySummary:
      type: object
      required: [artifact_id, claim_key, version, tip, workarea_id, workarea_path, kind, state, tokens, retirement, replaces, held_expires_at, created_at, promoted_at]
      properties:
        artifact_id: { type: string }
        claim_key: { type: string }
        version: { type: integer }
        tip: { type: boolean, description: "Whether this version is the served tip of its claim for the calling key, audience-scoped: for a key in a simulation's audience an overlay tip that shadows the default tip, which then reads tip false; for every other key the default tip (docs/architecture/audit-and-lineage.md). A superseded version is state promoted, tip false." }
        workarea_id: { type: [string, 'null'], description: "Null when the calling key holds no role on the node (naming a node, docs/architecture/roles-and-keys.md, Own) — possible only on an own row an admin moved there (ADR-0025 d3)." }
        workarea_path: { type: [string, 'null'], description: "Derived at read time; grants bind to node ids. Null wherever workarea_id is." }
        kind: { type: string, enum: [memory, derived_fact, steering, term, term_mapping, vocab_release] }
        state: { type: string, enum: [held, promoted, demoted, rejected, erased] }
        principal: { type: string }
        provenance: { type: string, enum: [agent, human, connector, simulation] }
        simulation_id: { type: [string, 'null'] }
        self_signed: { type: boolean, description: Marked rows under the bounded development exception; never promote beyond their workarea. }
        plaintext_digest: { $ref: '#/components/schemas/Digest' }
        derives_from: { type: array, items: { type: string }, description: "On get, recall and every listing, only the ancestors the caller can read — its own rows in any state, promoted rows within its reader effective access (ADR-0025 d3); the lineage read shows the full closure, elided where unreadable." }
        attachments: { type: array, items: { $ref: '#/components/schemas/AttachmentDescriptor' } }
        tokens: { type: integer, minimum: 0, description: 'Budget tokens of the body (counter oml-tc/1): ceil(UTF-8 bytes of the NFC body / 4); not any model''s count (docs/architecture/retrieval.md, Token budgets).' }
        retirement: { type: boolean, default: false, description: 'True on a retirement version; a claim whose served tip is one is a retired claim, which recall does not serve.' }
        replaces:
          type: [object, 'null']
          description: >-
            For a supersession, the version it replaces; null for a version 1. It obeys the same
            readability test as derives_from on every read, so it is also null when the caller
            cannot read the replaced version — after an admin moved that version into another
            workarea or back into held, say (ADR-0025 d3).
          properties:
            artifact_id: { type: string }
            version: { type: integer }
        held_expires_at: { type: [string, 'null'], format: date-time, description: 'For a held row, when held-item expiry dead-letters it under the workarea''s review policy; null on every other row, and on every row while held-item expiry is unbuilt (ADR-0025 d13).' }
        created_at: { type: string, format: date-time }
        promoted_at: { type: [string, 'null'], format: date-time }

    Memory:
      allOf:
        - { $ref: '#/components/schemas/MemorySummary' }
        - type: object
          properties:
            body: { type: string, description: Decrypted on the serving path only. }

    MemoryPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/MemorySummary' } }
        next_cursor: { type: [string, 'null'] }

    RecallRequest:
      type: object
      additionalProperties: false
      description: >-
        Names no workarea: the default scope is the token workarea's subtree — the key's
        default_workarea, or the X-OML-Workarea override (ADR-0022 d4). Unknown fields are
        refused (request.validation).
      required: [query]
      properties:
        query: { type: string }
        k: { type: integer, minimum: 1, maximum: 100, default: 8 }
        kinds: { type: array, minItems: 1, items: { type: string, enum: [memory, derived_fact] }, description: 'Filters hits only; an empty array is refused (request.validation), so only an absent kinds means no filter. Deliberately excludes steering (never ranked, always first) and the vocabulary kinds (excluded from the shared recall indexes by default — ADR-0021 d9); where a vocabulary workarea''s journalled policy opts them in, they are hits only of a recall that omits kinds.' }
        include_bodies: { type: boolean, default: true }
        include_own_held:
          type: boolean
          default: false
          description: >-
            When true, the calling key's own held rows (kind memory or derived_fact, never steering
            or retirement versions) inside subtree(scope) ∩ reader effective access, admitted by
            the kinds filter when one is sent as promoted hits are, join the hits, ranked in the
            same order, with memory.state held; they count against k and max_tokens.
            Rules: docs/architecture/retrieval.md.
        max_tokens:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: >-
            Recall budget in budget tokens (counter oml-tc/1), at most 2^53 - 1, the largest
            integer the request digest canonicalizes exactly under RFC 8785. Steering is never cut;
            hits are the longest rank prefix that fits. Refused with include_bodies false. Rules:
            docs/architecture/retrieval.md, Token budgets.
        terms:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Curie' }
          description: Filter to rows whose terms annotation cites any of these CURIEs; an unreadable CURIE matches nothing (fail closed). An empty array is refused with request.validation, and so is the field where unbuilt.
        expand_terms:
          type: string
          enum: [none, descendants]
          default: none
          description: >-
            descendants widens the terms filter before retrieval — per CURIE, resolved against
            the release pinned by the vocabulary that owns the expanded prefix (per-release
            closure lookup). Steering order and k are untouched; expansion changes the filter,
            never the ranking. Refused with request.validation where unbuilt.

    RecallResponse:
      type: object
      required: [steering, hits]
      properties:
        steering:
          type: array
          items: { $ref: '#/components/schemas/Memory' }
          description: 'Applicable steering, ordered structurally and never cut by a budget — membership and order declared in docs/architecture/retrieval.md (ADR-0025 d8).'
        hits:
          type: array
          items:
            type: object
            required: [memory, score]
            properties:
              memory: { $ref: '#/components/schemas/Memory' }
              score: { type: number, description: The store rank; ties break by artifact_id ascending. }
        budget:
          $ref: '#/components/schemas/RecallBudget'
          description: Present if and only if max_tokens was sent.
        query_digest: { $ref: '#/components/schemas/Digest' }

    RecallBudget:
      type: object
      additionalProperties: false
      description: >-
        How the max_tokens cut was applied (docs/architecture/retrieval.md, Token budgets). The
        example is steering [120] and hits [300, 250, 90] under max_tokens 500: one hit is served,
        and the 90-token hit is not, because the cut is a strict rank prefix.
      required: [max_tokens, counter, steering_tokens, used_tokens, truncated, hits_omitted, next_hit_tokens]
      properties:
        max_tokens: { type: integer, minimum: 1, maximum: 9007199254740991 }
        counter: { type: string, enum: [oml-tc/1] }
        steering_tokens: { type: integer, minimum: 0 }
        used_tokens: { type: integer, minimum: 0, description: Exceeds max_tokens only when steering alone does. }
        truncated: { type: boolean }
        hits_omitted: { type: integer, minimum: 0 }
        next_hit_tokens: { type: [integer, 'null'], description: Budget tokens of the first hit not served; null when nothing was cut. }
      example:
        max_tokens: 500
        counter: oml-tc/1
        steering_tokens: 120
        used_tokens: 420
        truncated: true
        hits_omitted: 2
        next_hit_tokens: 250

    Lineage:
      type: object
      required: [artifact_id, nodes, edges]
      properties:
        artifact_id: { type: string }
        nodes:
          type: array
          items:
            type: object
            properties:
              artifact_id: { type: string }
              claim_key: { type: string }
              version: { type: integer }
              redacted: { type: boolean, description: Outside the key's read scope; bare id only. }
        edges:
          type: array
          items:
            type: object
            properties:
              from_artifact_id: { type: string }
              to_artifact_id: { type: string }
              kind: { type: string, enum: [derives_from, claim_edge] }
              state: { type: string, enum: [pending, ratified] }

    SupersedeRequest:
      type: object
      additionalProperties: false
      description: >-
        Unknown fields are refused (request.validation). The body declares every submission field a
        successor can need — simulation_id, simulated_time, mapping and the term fields — so closing
        it refuses nothing a supersession must carry (ADR-0025 d16).
      required: [body]
      properties:
        body: { type: string, description: 'Claim text, at most submission.max_body_size (shipped 1 MiB) UTF-8 bytes of the NFC-normalized body; larger is 413 request.payload_too_large (http-api.md Limits). With retirement true, why the claim is retired.' }
        retirement: { type: boolean, default: false, description: 'true proposes retiring the claim, and body states why. Refused with request.validation when the target''s kind is term (terms deprecate), or when a kind is sent that differs from the target''s.' }
        kind: { type: string, enum: [memory, derived_fact, steering, term, term_mapping, vocab_release], description: 'Omitted, the successor takes the target''s kind — the one field inherited from the target. A memory, derived_fact or steering target admits any of those three; a vocabulary-kind target and a retirement keep the target''s kind; anything else is request.validation (docs/architecture/audit-and-lineage.md).' }
        attachments: { type: array, maxItems: 64, items: { $ref: '#/components/schemas/Digest' }, description: 'Omitted, the successor has no attachments; nothing is inherited from the target.' }
        derives_from: { type: array, items: { type: string }, description: The superseded target is included implicitly. }
        reason: { type: string }
        simulation_id: { type: [string, 'null'], description: 'Required when the target or derives_from touches a simulation row (submission.simulation_id_required otherwise); the key must be in the audience. A tainted successor shadows the tip for its simulation audience only.' }
        simulated_time: { type: [string, 'null'], format: date-time, description: "Declared data, never backdating — the journal keeps the real timestamp." }
        mapping:
          type: object
          additionalProperties: false
          required: [subject, object, predicate, justification]
          properties:
            subject: { $ref: '#/components/schemas/Curie' }
            object: { $ref: '#/components/schemas/Curie' }
            predicate: { type: string, enum: [exactMatch, closeMatch, broadMatch, narrowMatch, relatedMatch] }
            justification: { type: string, enum: [human-curated, lexical, logical] }
            note: { type: string }
          description: 'Successor of kind term_mapping only — required then, as on SubmitRequest. Structural payload fields (ADR-0021 d6).'
        terms: { type: array, items: { $ref: '#/components/schemas/Curie' }, description: 'CURIE annotations (ADR-0021 d8). Omitted, the successor has none; nothing is inherited from the target.' }
        term_status: { type: string, enum: [active, deprecated], description: 'kind=term only — a deprecation IS a supersession with term_status deprecated (ADR-0021 d3).' }
        successors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [curie, relation]
            properties:
              curie: { $ref: '#/components/schemas/Curie' }
              relation: { type: string, enum: [replaced_by, consider] }
          description: 'Required when term_status is deprecated: exactly one replaced_by, or one-or-more consider — the successor rides the deprecating submission atomically; one serve and one verdict cover both (ADR-0021 d3).'

    ReassignRequest:
      type: object
      required: [workarea_id]
      properties:
        workarea_id: { type: string, description: Destination node. }
        re_key: { type: [string, 'null'], description: New claim_key when the move would collide at the destination. }
        dry_run: { type: boolean, default: false }

    DemoteRequest:
      type: object
      required: [version, reason]
      properties:
        version: { type: integer }
        reason: { type: string }

    EraseRequest:
      type: object
      properties:
        dry_run: { type: boolean, default: false, description: Returns the erasure inventory — every copy class and its disposition. }

    TipOverrideRequest:
      type: object
      required: [workarea_id, claim_key, to_version, reason]
      properties:
        workarea_id: { type: string }
        claim_key: { type: string }
        to_version: { type: integer }
        reason: { type: string }

    ActResult:
      type: object
      description: Outcome of a journalled act, or a dry-run preview when dry_run was true.
      properties:
        journal_seq: { type: [integer, 'null'], description: Null for a dry run — nothing was journalled. }
        event_id: { type: [string, 'null'] }
        dry_run: { type: boolean }
        preview: { type: object, additionalProperties: true, description: "Reach preview for mass acts (paths rewritten, rows demoted, inventory)." }

    UploadSessionCreate:
      type: object
      required: [expected_digest, size_bytes, media_type]
      properties:
        expected_digest: { $ref: '#/components/schemas/Digest' }
        size_bytes: { type: integer, minimum: 1, maximum: 67108864, description: 'Attachments are at most 64 MiB (http-api.md Limits).' }
        media_type: { type: string }

    UploadSession:
      type: object
      required: [session_id, expected_digest, state]
      properties:
        session_id: { type: string }
        expected_digest: { $ref: '#/components/schemas/Digest' }
        size_bytes: { type: integer }
        media_type: { type: string }
        state: { type: string, enum: [open, complete, expired, aborted] }
        parts:
          type: array
          items:
            type: object
            properties:
              part_number: { type: integer }
              size_bytes: { type: integer }
        expires_at: { type: string, format: date-time }

    UploadComplete:
      type: object
      required: [digest, state]
      properties:
        digest: { $ref: '#/components/schemas/Digest' }
        ciphertext_digest: { $ref: '#/components/schemas/Digest' }
        state: { type: string, const: complete }

    ClaimEdgeProposal:
      type: object
      required: [from_artifact_id, to_artifact_id, label]
      properties:
        from_artifact_id: { type: string }
        to_artifact_id: { type: string }
        label: { type: string, description: Vocabulary not fixed by the design (open detail). }

    ClaimEdge:
      type: object
      required: [edge_id, from_artifact_id, to_artifact_id, state]
      properties:
        edge_id: { type: string }
        from_artifact_id: { type: string }
        to_artifact_id: { type: string }
        label: { type: string }
        state: { type: string, enum: [pending, ratified] }
        proposer_key_id: { type: string }
        ratifier_key_id: { type: [string, 'null'] }

    ClaimEdgePage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ClaimEdge' } }
        next_cursor: { type: [string, 'null'] }

    CrewRecord:
      type: object
      description: Recorded, not operated — OML never contacts the external manager.
      properties:
        name: { type: string }
        charter_uri: { type: string }
        external_manager: { type: string }

    Workarea:
      type: object
      required: [id, parent_id, path, status]
      properties:
        id: { type: string }
        parent_id: { type: [string, 'null'], description: Null only for the tenant universe root. }
        path: { type: string, description: Derived ltree path; never the grant target. }
        status: { type: string, enum: [development, committed, validated] }
        crew: { $ref: '#/components/schemas/CrewRecord' }
        created_at: { type: string, format: date-time }

    WorkareaView:
      description: One node with the calling key's view of it; every value below is relative to that key, and children outside read access are absent (ADR-0025 d14).
      allOf:
        - { $ref: '#/components/schemas/Workarea' }
        - type: object
          required: [children, edges, my_effective_verbs, permission_epoch]
          properties:
            children:
              type: array
              description: The readable immediate children, ordered by path_leaf ascending in byte order, then id.
              items:
                type: object
                additionalProperties: false
                required: [id, path_leaf, status]
                properties:
                  id: { type: string }
                  path_leaf: { type: string }
                  status: { type: string, enum: [development, committed, validated] }
            edges:
              type: array
              description: The workarea edges touching the node whose other endpoint the key can read, in either direction, ordered by edge_id ascending; edge_id is the id the events tail reports.
              items:
                type: object
                additionalProperties: false
                required: [edge_id, from, to, label, state]
                properties:
                  edge_id: { type: string }
                  from: { type: string }
                  to: { type: string }
                  label: { type: string, enum: [relates_to, continues, derived_from, mirrors] }
                  state: { type: string, enum: [pending, ratified] }
            my_effective_verbs:
              type: array
              description: The effective-verbs table of docs/architecture/roles-and-keys.md, unioned over the grant roles effective on the node and listed in table order (the reader, writer and dreamer rows, each left to right) without duplicates; the access conferred, not what this server build serves.
              items: { type: string, enum: [recall, read, graph_read, events_tail, remember, learn, attach, supersede, propose, review] }
            permission_epoch: { type: integer, description: 'The calling key''s permission epoch as declared in docs/architecture/workareas.md (ADR-0025 d14).' }

    WorkareaCreate:
      type: object
      required: [parent_id, name]
      properties:
        parent_id: { type: string }
        name: { type: string }
        crew: { $ref: '#/components/schemas/CrewRecord' }
        prefix: { type: string, description: 'Registers the node as a vocabulary workarea (ADR-0021): tenant-unique and permanent, never reused or reassigned. Conflict answers 409 vocab.prefix_conflict. A create carrying prefix requires crew — a vocabulary needs a named curator crew.' }

    WorkareaPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Workarea' } }
        next_cursor: { type: [string, 'null'] }

    WorkareaEdgeProposal:
      type: object
      required: [to_workarea_id, label]
      properties:
        to_workarea_id: { type: string }
        label: { type: string, enum: [relates_to, continues, derived_from, mirrors] }

    WorkareaEdge:
      type: object
      required: [edge_id, from_workarea_id, to_workarea_id, label, state]
      properties:
        edge_id: { type: string }
        from_workarea_id: { type: string }
        to_workarea_id: { type: string }
        label: { type: string, enum: [relates_to, continues, derived_from, mirrors] }
        state: { type: string, enum: [pending, ratified] }
        proposer_key_id: { type: string }
        ratifier_key_id: { type: [string, 'null'] }

    WorkareaEdgePage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/WorkareaEdge' } }
        next_cursor: { type: [string, 'null'] }

    ReviewPolicy:
      type: object
      description: The per-workarea review policy object (journalled record; admission page owns it).
      properties:
        k: { type: integer }
        required_roles: { type: array, items: { type: string } }
        human_required_classes: { type: array, items: { type: string } }
        independence_axis: { type: string }
        held_item_expiry: { type: string }

    WorkareaStatus:
      type: object
      required: [workarea_id, status]
      properties:
        workarea_id: { type: string }
        status: { type: string, enum: [development, committed, validated] }
        policy: { $ref: '#/components/schemas/ReviewPolicy' }
        pending_transitions: { type: array, items: { $ref: '#/components/schemas/Transition' } }

    ReparentRequest:
      type: object
      required: [new_parent_id]
      properties:
        new_parent_id: { type: string }
        dry_run: { type: boolean, default: false }

    TransitionProposal:
      type: object
      required: [to]
      properties:
        to: { type: string, enum: [committed, validated], description: Forward only; backward transitions do not exist. }

    Transition:
      type: object
      required: [transition_id, workarea_id, to, state]
      properties:
        transition_id: { type: string }
        workarea_id: { type: string }
        to: { type: string, enum: [committed, validated] }
        state: { type: string, enum: [pending, ratified] }
        proposed_by_key_id: { type: string }
        ratified_by_key_id: { type: [string, 'null'] }
        policy_snapshot: { $ref: '#/components/schemas/ReviewPolicy' }

    JournalEvent:
      type: object
      description: The event-catalog envelope; payloads are digest-only, never body plaintext (D1).
      required: [seq, event_id, event_type, at]
      properties:
        seq: { type: integer }
        event_id: { type: string }
        event_type: { type: string }
        prev_hash: { type: string }
        hash: { type: string }
        sig: { type: string }
        principal: { type: [string, 'null'], description: "Null on the events tail for a key outside the actor's own key set (docs/api/http-api.md, Events tail)." }
        api_key_id: { type: [string, 'null'], description: "The actor's key; null on the events tail for a key outside the actor's own key set, as is every payload field naming a key." }
        at: { type: string, format: date-time }
        payload: { type: object, additionalProperties: true }

    EventsPage:
      type: object
      required: [items, head_seq, next_after_seq]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/JournalEvent' } }
        head_seq: { type: integer, description: "Current per-tenant chain head, for measuring lag." }
        next_after_seq: { type: integer, minimum: 0, description: "The resume point declared in docs/api/http-api.md, Events tail — pass it back verbatim as after_seq. It advances even when every scanned event was filtered out." }

    Curie:
      type: string
      pattern: '^[A-Za-z][A-Za-z0-9_-]*:[^\s:]+$'
      description: 'PREFIX:localname over the tenant''s journalled prefix registry; permanent once minted (first promotion).'

    VocabSuggestion:
      type: object
      required: [curie, label, term_status]
      properties:
        curie: { $ref: '#/components/schemas/Curie' }
        label: { type: string }
        term_status: { type: string, enum: [active, deprecated] }

    VocabSuggestPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/VocabSuggestion' } }
        next_cursor: { type: [string, 'null'] }

    VocabTerm:
      type: object
      required: [curie, workarea_id, version, term_status]
      properties:
        curie: { $ref: '#/components/schemas/Curie' }
        workarea_id: { type: string, description: The owning vocabulary workarea. }
        version: { type: integer, description: The served tip version of the term claim. }
        term_status: { type: string, enum: [active, deprecated], description: Structural payload field — survives shredding, deterministically readable. }
        definition_state: { type: string, enum: [present, erased], description: The CURIE is permanent; the definition body is erasable (410 lifecycle.erased on fetch). }
        successors:
          type: array
          description: Ratified successor edges declared with the deprecation version; empty for an active term.
          items:
            type: object
            required: [curie, relation]
            properties:
              curie: { $ref: '#/components/schemas/Curie' }
              relation: { type: string, enum: [replaced_by, consider], description: replaced_by is safe for automated rewiring; consider requires judgment. }
        releases: { type: array, items: { type: string }, description: vocab_release ids whose pinned term set includes this term. }

    VocabHierarchyPage:
      type: object
      required: [items, release, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/VocabSuggestion' } }
        release: { type: string, description: The vocab_release the closure was read from. }
        next_cursor: { type: [string, 'null'] }

    TermMapping:
      type: object
      description: SSSOM-shaped ratified claim; revocable by supersession, never a merge.
      required: [subject, object, predicate, justification, ratified_at]
      properties:
        subject: { $ref: '#/components/schemas/Curie' }
        object: { $ref: '#/components/schemas/Curie' }
        predicate: { type: string, enum: [exactMatch, closeMatch, broadMatch, narrowMatch, relatedMatch] }
        justification: { type: string, enum: [human-curated, lexical, logical] }
        note: { type: string }
        ratified_at: { type: string, format: date-time }

    TermMappingPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/TermMapping' } }
        next_cursor: { type: [string, 'null'] }

    ReviewQueuePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              workarea_id: { type: string }
              workarea_path: { type: string }
              held: { type: integer }
              oldest_age_seconds: { type: integer }
        next_cursor: { type: [string, 'null'] }

    ServedDigests:
      type: object
      properties:
        body: { $ref: '#/components/schemas/Digest' }
        attachments: { type: array, items: { $ref: '#/components/schemas/Digest' } }
        replaces: { $ref: '#/components/schemas/Digest' }

    Serve:
      type: object
      required: [serve_id, expires_at, item, served_digests]
      properties:
        serve_id: { type: string, description: "Bound server-side to (reviewer key, artifact version, attachment digest set); consumed by its first verdict." }
        expires_at: { type: string, format: date-time }
        item: { $ref: '#/components/schemas/Memory' }
        replaces: { $ref: '#/components/schemas/Memory', description: "For a supersession, the version it replaces." }
        served_digests: { $ref: '#/components/schemas/ServedDigests' }

    VerdictRequest:
      type: object
      required: [serve_id, verdict]
      properties:
        serve_id: { type: string }
        verdict: { type: string, enum: [approve, reject] }
        reason: { type: string, description: Required to reject. }

    VerdictResult:
      type: object
      required: [artifact_id, version, verdict, state]
      properties:
        artifact_id: { type: string }
        version: { type: integer }
        verdict: { type: string, enum: [approve, reject] }
        state: { type: string, enum: [promoted, held, rejected], description: held means the policy's k needs more verdicts. }
        ratification_event_id: { type: [string, 'null'] }

    ReopenRequest:
      type: object
      required: [artifact_id, version, reason]
      properties:
        artifact_id: { type: string }
        version: { type: integer }
        reason: { type: string }

    GrantRequest:
      type: object
      additionalProperties: false
      required: [workarea_node_id, role]
      properties:
        workarea_node_id: { type: string, description: "Node id, never a path." }
        role: { type: string, enum: [reader, writer, dreamer], description: "A grant role, admissible under the key's role (the admissibility table in docs/architecture/roles-and-keys.md); never admin or operator." }
        deny:
          type: array
          items:
            type: object
            required: [subtree_node_id]
            additionalProperties: false
            properties:
              subtree_node_id: { type: string }
          description: Per-grant masks; each masks a subtree within this grant only and must lie inside it (request.validation otherwise).

    Grant:
      type: object
      description: A stored grant, as echoed at issuance and listed on a key.
      required: [grant_id, workarea_node_id, role, epoch]
      properties:
        grant_id: { type: string }
        workarea_node_id: { type: string, description: "Node id, never a path." }
        role: { type: string, enum: [reader, writer, dreamer] }
        deny:
          type: array
          items:
            type: object
            properties:
              subtree_node_id: { type: string }
        epoch: { type: integer, description: "The journal seq of this grant's grant.issued event." }

    DenialRequest:
      type: object
      required: [workarea_node_id]
      properties:
        workarea_node_id: { type: string }
        reason: { type: string }

    Denial:
      type: object
      required: [denial_id, workarea_node_id, epoch]
      properties:
        denial_id: { type: string }
        workarea_node_id: { type: string }
        epoch: { type: integer }
        lifted: { type: boolean }

    KeyIssueRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: { $ref: '#/components/schemas/Role' }
        grants: { type: array, items: { $ref: '#/components/schemas/GrantRequest' } }
        default_workarea_id: { type: string, description: "The provider-ring target (ADR-0022 d4); its validation and its default when omitted are declared in the issuance order of docs/architecture/roles-and-keys.md." }
        held_by: { type: string, enum: [agent, human, service], description: "The issuing admin's journalled attestation (ADR-0021); never verified as fact." }
        expiry: { type: string, format: date-time }
        label: { type: string }
        principal: { type: string }
        tenant_id: { type: string, description: "Operator keys only, for a tenant's first admin key." }

    Key:
      type: object
      required: [key_id, role, default_workarea_id, held_by]
      properties:
        key_id: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        principal: { type: string }
        default_workarea_id: { type: [string, 'null'], description: "The key's default workarea; for an issued key, as key.issued journals it — the one sent, else the first grant's node, null for a zero-grant key (docs/architecture/roles-and-keys.md, issuance order; ADR-0025 d2). The provider-ring target when no X-OML-Workarea is sent (ADR-0022 d4)." }
        held_by: { type: [string, 'null'], enum: [agent, human, service, null], description: "The issuing admin's attestation; for an issued key, as key.issued journals it, null when none was sent (ADR-0025 d2)." }
        label: { type: string }
        expiry: { type: [string, 'null'], format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }
        rotated_from: { type: [string, 'null'], description: The key_id this key succeeded by rotation, if any (key.rotated links the two). }
        grants: { type: array, items: { $ref: '#/components/schemas/Grant' } }
        denials: { type: array, items: { $ref: '#/components/schemas/Denial' } }
        epoch: { type: integer }

    KeyIssued:
      allOf:
        - { $ref: '#/components/schemas/Key' }
        - type: object
          required: [value]
          properties:
            value: { type: string, description: "The secret — returned exactly once, journalled as issued-without-value." }

    KeyPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Key' } }
        next_cursor: { type: [string, 'null'] }

    EffectiveAccess:
      type: object
      required: [key_id, epoch, entries]
      properties:
        key_id: { type: string }
        epoch: { type: integer }
        entries:
          type: array
          items:
            type: object
            properties:
              workarea_node_id: { type: string }
              path: { type: string }
              role: { $ref: '#/components/schemas/Role' }
              masked_by: { type: [string, 'null'], description: "The deny (per-grant or global) that produced a hole, when one does." }

    BanRequest:
      type: object
      required: [subject_kind, subject]
      properties:
        subject_kind: { type: string, enum: [principal, source] }
        subject: { type: string }
        reason: { type: string }
        dry_run: { type: boolean, default: false, description: Returns the reach preview without journalling. }

    Ban:
      type: object
      required: [ban_id, subject_kind, subject]
      properties:
        ban_id: { type: string }
        subject_kind: { type: string, enum: [principal, source] }
        subject: { type: string }
        reason: { type: string }
        imposed_by_key_id: { type: string }
        imposed_at: { type: string, format: date-time }
        lifted_by_key_id: { type: [string, 'null'] }
        lifted_at: { type: [string, 'null'], format: date-time }

    BanPreview:
      type: object
      description: Reach preview — nothing journalled.
      properties:
        keys_affected: { type: array, items: { type: string } }
        held_refusals: { type: integer }
        workareas_touched: { type: array, items: { type: string } }

    BanPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Ban' } }
        next_cursor: { type: [string, 'null'] }

    SimulationCreate:
      type: object
      required: [audience]
      properties:
        audience:
          type: array
          items:
            type: object
            properties:
              key_id: { type: string }
              grant_ref: { type: string }
        label: { type: string }

    AudienceEntry:
      type: object
      description: Exactly one of key_id / grant_ref names the audience member.
      properties:
        key_id: { type: string }
        grant_ref: { type: string }

    Simulation:
      type: object
      required: [simulation_id, state, audience]
      properties:
        simulation_id: { type: string }
        state: { type: string, enum: [open, ended] }
        audience:
          type: array
          items:
            type: object
            properties:
              key_id: { type: string }
              grant_ref: { type: string }
        label: { type: string }
        opened_at: { type: string, format: date-time }
        ended_at: { type: [string, 'null'], format: date-time }
        warnings: { type: array, items: { type: string }, description: E.g. no dreamer in the audience — nothing can promote (fail closed). }

    SimulationPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Simulation' } }
        next_cursor: { type: [string, 'null'] }

    ExportRequest:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [evidence, chain], description: "Signed evidence bundle, or digest-only chain stream for client-side verification." }
        from_seq: { type: integer }
        include_simulations: { type: boolean, default: false, description: "When true, simulation rows are listed separately by simulation_id." }

    ExportJob:
      type: object
      required: [export_id, kind, state]
      properties:
        export_id: { type: string }
        kind: { type: string, enum: [evidence, chain] }
        state: { type: string, enum: [running, done, failed] }
        requested_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        bundle_bytes: { type: [integer, 'null'] }

    ExportPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ExportJob' } }
        next_cursor: { type: [string, 'null'] }

    SettingsDocument:
      type: object
      description: The settings document; its schema is not fixed by this design — the contract is show/validate/apply and the retired-key refusal.
      additionalProperties: true

    SettingsView:
      type: object
      properties:
        configured: { $ref: '#/components/schemas/SettingsDocument' }
        applied_at: { type: string, format: date-time }
        applied_event_id: { type: string }
        effective: { $ref: '#/components/schemas/SettingsDocument' }
        divergences:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              configured: {}
              effective: {}
              cause: { type: string, description: "Defaulted value, not-yet-picked-up change, or per-replica variance." }

    SettingsValidation:
      type: object
      required: [valid, findings]
      properties:
        valid: { type: boolean }
        findings:
          type: array
          items:
            type: object
            properties:
              code: { type: string, description: settings.retired_key or settings.invalid. }
              key: { type: string }
              replacement: { type: [string, 'null'], description: "For a retired key, the setting that replaced it." }
              message: { type: string }

    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, const: ok }

    Ready:
      type: object
      required: [status, checks, build]
      properties:
        status: { type: string, enum: [ok, unavailable] }
        checks:
          type: object
          additionalProperties: { type: string }
          description: Per-check detail, e.g. postgres, fork_check.
        build: { $ref: '#/components/schemas/Build' }
    Build:
      type: object
      description: >-
        The build that answered (http-api.md "Health"). Times are UTC, YYYY-MM-DDTHH:MM:SSZ; a
        field nothing could supply is the string unknown.
      required: [version, commit, commit_time, build_time, rustc, target, profile]
      additionalProperties: false
      properties:
        version: { type: string, description: The workspace version the binary was built at. }
        commit: { type: string, description: The full 40-hex commit, or unknown. }
        commit_time: { type: string, description: The commit's committer time, or unknown. }
        build_time: { type: string, description: When the build captured these fields; SOURCE_DATE_EPOCH fixes it when set. }
        rustc: { type: string, description: The compiler's rustc -V line. }
        target: { type: string, description: The target triple. }
        profile: { type: string, enum: [release, debug, unknown] }
