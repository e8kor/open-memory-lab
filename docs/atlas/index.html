<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OML Live Atlas</title>
<meta name="description" content="Interactive 3D visualization of Open Memory Lab in a trading domain: crews recalling market data along grants, remembering signals, non-author review, supersession, a backtest simulation fenced off, and the signed journal chain. Every memory is clickable. Mocked data.">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="12" fill="%2304060d"/><rect x="20" y="20" width="24" height="24" transform="rotate(45 32 32)" fill="%23b48af2"/><circle cx="32" cy="32" r="5" fill="%234fd8c0"/></svg>'>
<meta name="theme-color" content="#0a0f1d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#04060d; --bg-raise:#0a0f1d; --bg-panel:#0e1526;
    --fg:#e9edf8; --fg-dim:#94a0c0; --fg-faint:#5c6584;
    --line:#1e2745; --line-soft:#161e38;
    --accent:#7aa2ff; --accent-2:#4fd8c0; --gold:#e8b45a; --grant:#ffdf9e; --edge:#5a74b8;
    --held:#e8b45a; --promoted:#46d684; --rejected:#f0716e;
    --superseded:#64748b; --demoted:#b08968; --sim:#b48af2;
    --recall:#4fd8c0; --remember:#e8b45a; --review:#8bd5ff;
    --lad-dev:#9fb0d8; --lad-com:#7aa2ff; --lad-val:#b6c5de;
    --sans:"Inter",system-ui,-apple-system,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans);
       display:flex;flex-direction:column;overflow:hidden;
       padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:11px max(16px,env(safe-area-inset-right,0px)) 11px max(16px,env(safe-area-inset-left,0px));
    border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--bg-raise),color-mix(in srgb,var(--bg-raise) 60%,var(--bg)))}
  .brand{display:inline-flex;align-items:center;gap:8px;font:700 15px/1 var(--sans);color:var(--fg)}
  .brand span{color:var(--fg-dim);font-weight:500}
  .back{font:500 12.5px/1 var(--sans);color:var(--fg-dim)}
  .back:hover{color:var(--fg);text-decoration:none}
  .crumb{display:flex;align-items:center;gap:8px;font:500 12.5px/1 var(--sans);color:var(--fg-dim)}
  .crumb b{color:var(--fg);font-weight:600}
  .badge{font:600 10px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;
    color:var(--held);border:1px solid color-mix(in srgb,var(--held) 40%,transparent);border-radius:999px;padding:5px 10px}
  header .spacer{flex:1}
  button{font:600 12px/1 var(--sans);color:var(--fg);background:var(--bg-panel);
    border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;transition:border-color .15s,color .15s,background .15s}
  button:hover{border-color:var(--accent)}
  button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
  button[hidden]{display:none!important}
  button.cta{border-color:color-mix(in srgb,var(--accent) 55%,transparent);
    background:color-mix(in srgb,var(--accent) 10%,var(--bg-panel));color:var(--fg)}
  button.cta:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--bg-panel))}
  main{position:relative;flex:1;min-height:0}
  main::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(130% 90% at 50% 40%, transparent 55%, rgba(2,4,10,.55) 100%)}
  canvas#gl{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
  canvas#gl:active{cursor:grabbing}
  canvas#gl.hover{cursor:pointer}
  #labels{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1}
  .lbl{position:absolute;left:0;top:0;transform:translate(-50%,-134%);will-change:transform;white-space:nowrap;
    font:600 12px/1.3 var(--sans);color:var(--fg);text-shadow:0 1px 8px #000d;opacity:.94}
  .lbl small{display:block;font:500 9.5px/1.5 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--fg-faint)}
  .lbl .st{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
  .lbl.minor{font-size:10.5px;opacity:.8}
  #tip{font:500 11px/1.4 var(--sans);color:var(--fg);background:color-mix(in srgb,var(--bg) 82%,transparent);
    border:1px solid var(--line);border-radius:7px;padding:5px 9px;transform:none}
  #tip small{display:block;font:500 9.5px/1.4 var(--mono);color:var(--fg-dim);text-transform:none;letter-spacing:0}
  .hud{position:absolute;z-index:2;top:12px;left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));
    display:flex;gap:8px;flex-wrap:wrap;align-items:center;pointer-events:none}
  .hud>*{pointer-events:auto}
  .tag{font:500 11.5px/1.45 var(--sans);color:var(--fg-dim);
    background:color-mix(in srgb,var(--bg) 74%,transparent);backdrop-filter:blur(6px);
    border:1px solid var(--line);border-radius:8px;padding:6px 11px}
  .tag b{color:var(--fg);font-weight:600}
  .tag .num{font-family:var(--mono);font-size:11px;color:var(--accent-2)}
  .hint,.tourcap{position:absolute;z-index:2;left:50%;transform:translateX(-50%);bottom:14px;
    font:500 12px/1 var(--sans);color:var(--fg-dim);background:color-mix(in srgb,var(--bg) 72%,transparent);
    backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:999px;padding:7px 15px;
    pointer-events:none;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
  .tourcap{bottom:48px;color:var(--fg);font-weight:600;border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
  .skip{position:absolute;z-index:3;right:max(14px,env(safe-area-inset-right,0px));bottom:14px;
    font:600 11px/1 var(--sans)}
  .panel{position:absolute;z-index:3;right:max(14px,env(safe-area-inset-right,0px));top:56px;width:min(300px,84%);
    background:color-mix(in srgb,var(--bg-panel) 92%,transparent);backdrop-filter:blur(10px);
    border:1px solid var(--line);border-radius:12px;padding:0;font-size:12.5px;color:var(--fg-dim);
    box-shadow:0 12px 40px -18px #000c;overflow:hidden;max-height:calc(100% - 70px);display:flex;flex-direction:column}
  .panel .head{padding:11px 14px 9px;border-bottom:1px solid var(--line-soft);
    background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 7%,transparent),transparent)}
  .panel .head h4{margin:0;font:700 13.5px/1.3 var(--sans);color:var(--fg);display:flex;align-items:center;gap:8px}
  .panel .head .chip{font:600 10px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;border-radius:999px;padding:4px 9px}
  .panel .head .crew{font:500 11px/1.4 var(--sans);color:var(--accent-2);margin-top:3px}
  .panel .body{padding:10px 14px 12px;overflow:auto}
  .panel .x{position:absolute;top:8px;right:8px;border:none;background:transparent;color:var(--fg-faint);font:600 14px/1 var(--sans);padding:4px 7px}
  .panel .x:hover{color:var(--fg)}
  .panel table{width:100%;border-collapse:collapse}
  .panel td{padding:3px 0;vertical-align:top}
  .panel td:first-child{color:var(--fg-faint);font-size:11px;letter-spacing:.02em;padding-right:10px;white-space:nowrap}
  .panel td:last-child{text-align:right;color:var(--fg)}
  .panel .claimtext{font:500 13px/1.55 var(--sans);color:var(--fg);margin:2px 0 9px}
  .panel .mono{font-family:var(--mono);font-size:10.5px;color:var(--fg-dim);word-break:break-all;text-align:right}
  .panel .terms{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end}
  .panel .terms i{font:500 10px/1 var(--mono);font-style:normal;color:var(--accent-2);
    border:1px solid color-mix(in srgb,var(--accent-2) 35%,transparent);border-radius:5px;padding:3px 6px}
  .panel .hist{margin:9px 0 0;padding:8px 0 0;border-top:1px solid var(--line-soft)}
  .panel .hist div{font:500 10.5px/1.7 var(--mono);color:var(--fg-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .panel .hist .k{color:var(--accent-2)}
  .panel .docsrow{margin-top:9px;font-size:11px;color:var(--fg-faint)}
  .panel .go{margin-top:11px;width:100%}
  .panel .bar{height:4px;border-radius:4px;background:var(--line-soft);margin:9px 0 3px;overflow:hidden}
  .panel .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--held),var(--promoted))}
  .steps{position:absolute;z-index:2;left:max(14px,env(safe-area-inset-left,0px));top:56px;width:min(262px,74%);
    background:color-mix(in srgb,var(--bg-panel) 92%,transparent);backdrop-filter:blur(10px);
    border:1px solid var(--line);border-radius:12px;padding:10px 13px;font-size:11.5px;color:var(--fg-dim);
    box-shadow:0 12px 40px -18px #000c}
  .steps h4{margin:0 0 6px;font:700 11px/1.3 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--fg);cursor:pointer}
  .steps h4::after{content:"";float:right;color:var(--fg-faint)}
  .steps ol{margin:0;padding-left:18px}
  .steps li{padding:1.5px 0;transition:color .2s}
  .steps li.on{color:var(--accent-2)}
  .steps li.bad{color:var(--rejected)}
  .steps .src{margin-top:8px;font-size:10.5px;color:var(--fg-faint)}
  .steps.collapsed ol,.steps.collapsed .src{display:none}
  .steps.collapsed h4::after{content:"▸"}
  .legend{display:flex;flex-wrap:wrap;gap:5px 13px;align-items:center;font:500 11.5px/1.5 var(--sans);color:var(--fg-dim);
    padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));
    border-top:1px solid var(--line);background:var(--bg-raise)}
  .legend .one{color:var(--fg);font-weight:600;margin-right:2px}
  .legend .one i{color:var(--accent-2);font-style:normal;font-weight:500}
  .legend .grp{font:600 9.5px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--fg-faint)}
  .legend i.sw{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
  .ticker{height:62px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer;
    padding:4px max(16px,env(safe-area-inset-right,0px)) 7px max(16px,env(safe-area-inset-left,0px));
    border-top:1px solid var(--line);background:var(--bg);
    font:500 11px/1.6 var(--mono);color:var(--fg-dim);transition:height .2s}
  .ticker.open{height:190px;overflow-y:auto;justify-content:flex-start}
  .ticker.paused{border-top-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
  .ticker div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ticker .k{color:var(--accent-2)}
  .ticker .s{color:var(--fg-faint)}
  .ticker .r{color:var(--fg-faint)}
  .ticker .r .k{color:var(--recall)}
  .fade{position:absolute;z-index:4;inset:0;background:var(--bg);opacity:0;pointer-events:none;transition:opacity .22s}
  .fade.on{opacity:1}
  @media (max-width:640px){
    .ticker{height:50px}
    header{gap:8px}
    .steps{width:min(234px,70%)}
    .legend{max-height:34px;overflow:hidden;cursor:pointer}
    .legend.open{max-height:none}
  }
  noscript{display:block;padding:24px}
</style>
</head>
<body>
<header>
  <span class="brand"><svg width="11" height="11" viewBox="0 0 10 10" aria-hidden="true"><rect x="2" y="2" width="6" height="6" transform="rotate(45 5 5)" fill="#4fd8c0"/></svg>Open Memory Lab<span> · Live Atlas</span></span>
  <a class="back" href="../">← docs</a>
  <nav class="crumb" aria-label="mode">
    <span id="crumbMode">universe</span>
  </nav>
  <span class="badge" title="Every journal line is generated client-side using the exact event types of data/event-catalog.md. The tenant, desks, instruments and prices are fictional; nothing calls a server. OML itself is a design with an M1 proof-of-concept.">mocked data · client-side</span>
  <span class="spacer"></span>
  <button id="btnBack" hidden>← universe</button>
  <button id="btnLive" aria-pressed="true">pause traffic</button>
</header>

<main id="main">
  <canvas id="gl" aria-label="Interactive 3D visualization: trading crews recalling market data along grants and remembering signals into their own workareas; every memory can be clicked and read"></canvas>
  <div id="labels"></div>
  <div class="hud" id="hud"></div>
  <div class="panel" id="panel" hidden></div>
  <div class="steps" id="steps" hidden></div>
  <div class="hint" id="hint">drag to orbit · scroll to zoom · click a memory, a workarea, or the core</div>
  <div class="tourcap" id="tourCap" hidden></div>
  <button class="skip" id="tourSkip" hidden>skip intro ✕</button>
  <div class="fade" id="fade"></div>
  <noscript>The Live Atlas needs JavaScript (and WebGL). The static story it tells lives in the
  <a href="../concepts/">concepts</a> and <a href="../architecture/overview/">architecture</a> pages.</noscript>
</main>

<div class="legend" id="legend"></div>
<div class="ticker" id="ticker" aria-live="off" title="hover to pause · click to expand"></div>

<script src="./three.min.js"></script>
<script>
(() => {
'use strict';
if (!window.THREE) { document.getElementById('hint').textContent = '3D library failed to load — three.min.js missing.'; return; }
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MOT = REDUCED?0:1;   /* decorative-motion gate: meaning still moves, decoration stops */

/* ═══ THEME — the one shared setting every scene draws from ═══════════════
   One law for color: warmth belongs to memory (amber held/remember, pale
   gold ceremony/permission, bronze kept-but-lowered); cool belongs to
   structure and verdicts; brightness tracks ACTIVITY, never age.          */
const THEME = {
  c: {held:0xe8b45a, prom:0x46d684, rej:0xf0716e, sup:0x64748b, dem:0xb08968, ers:0x232c48,
      sim:0xb48af2, agent:0x7aa2ff, human:0xffffff, gold:0xe8b45a, grant:0xffdf9e,
      edge:0x5a74b8, review:0x8bd5ff, recall:0x4fd8c0, remember:0xe8b45a, link:0x46d684},
  ladder: {development:0x9fb0d8, committed:0x7aa2ff, 'validated/frozen':0xb6c5de},
  fog:.005, dprMax:2,
  pt:{size:.62, glowSize:1.15, hubGlow:1.9, hubHalo:4.8, agent:.8, pulse:1.9},
  dur:{flow:1.5, remember:1.0, ceremony:1.15, fly:.9},
  op:{ring:.18, halo:.26, edge:.15, lane:.22, fence:.18},
};
const CLR=THEME.c, LADDER=THEME.ladder;

/* ═══ the mock market domain — all fictional ══════════════════════════════ */
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[(Math.random()*a.length)|0];
const hex=n=>Array.from({length:n},()=>'0123456789abcdef'[(Math.random()*16)|0]).join('');
const px=(a,b,d=4)=>rnd(a,b).toFixed(d);
const TERMS={
  'market-data':['mkt:eurusd','mkt:ust-10y','mkt:xau-usd','fin:spot-mid','fin:sofr-3m'],
  'trading-signals':['fin:momentum','fin:mean-reversion','fin:carry','mkt:eurusd','fin:conviction'],
  'risk-limits':['fin:var-95','fin:gross-exposure','fin:stop-loss','fin:concentration'],
  'ref-taxonomy':['fin:var-95','mkt:eurusd','fin:settlement-t2','fin:best-execution'],
  'compliance-vault':['fin:best-execution','fin:kyc','fin:audit-trail'],
};
const MAKERS={
  'market-data':()=>pick([
    ()=>[`eurusd-spot-${(900+Math.random()*300|0)}z`,`EURUSD spot ${px(1.07,1.10)} — venue mid, tick-filtered`],
    ()=>[`ust10y-close`,`UST 10Y yield ${px(3.9,4.4,2)}% at close — curve node refreshed`],
    ()=>[`xauusd-fix`,`XAU/USD ${(2300+Math.random()*160|0)} London fix — spread ${px(.2,.6,2)} bp`],
    ()=>[`sofr-3m`,`SOFR 3M ${px(5.1,5.4,2)}% — term structure anchor`],
    ()=>[`eurusd-vol-1w`,`EURUSD 1W implied vol ${px(6.8,8.4,1)}% — desk quote`],
  ])(),
  'trading-signals':()=>pick([
    ()=>[`sig-momo-eurusd`,`Momentum long EURUSD — conviction ${px(.4,.8,2)}, horizon 3d, entry ${px(1.07,1.09)}`],
    ()=>[`sig-mr-xau`,`Mean-reversion flat XAU after fix drift — z-score ${px(1.6,2.4,1)}`],
    ()=>[`sig-carry-basket`,`Carry basket: funding skew favors G10 longs — expected ${px(8,22,0)} bp/m`],
    ()=>[`sig-curve-steepener`,`2s10s steepener — regime filter on, sizing ${px(.2,.6,1)}x`],
  ])(),
  'risk-limits':()=>pick([
    ()=>[`var95-desk-cap`,`Desk VaR95 cap ${px(1.8,3.2,1)}m USD — breach escalates to held state`],
    ()=>[`gross-fx-overnight`,`FX overnight gross cap ${(30+Math.random()*30|0)}m — netting per counterparty`],
    ()=>[`single-name-cap`,`Single-name concentration limit ${px(3,6,1)}% of book`],
    ()=>[`stop-policy-momo`,`Momentum sleeve stop at ${px(.8,1.6,1)}x daily vol — hard, not advisory`],
  ])(),
  'ref-taxonomy':()=>pick([
    ()=>[`term-var95`,`fin:var-95 — one-day 95% value-at-risk, parametric unless stated`],
    ()=>[`term-eurusd`,`mkt:eurusd — EURUSD spot pair, venue-mid convention`],
    ()=>[`term-best-ex`,`fin:best-execution — the policy term audits cite; supersedes desk slang`],
    ()=>[`term-t2`,`fin:settlement-t2 — T+2 settlement window definition`],
  ])(),
  'compliance-vault':()=>pick([
    ()=>[`bestex-q2`,`Q2 best-execution attestation — sampled fills within tolerance`],
    ()=>[`kyc-acme-broker`,`Counterparty KYC refresh: acme-broker — approved, expiry 2027-04`],
    ()=>[`audit-pack-0729`,`Audit evidence pack 07-29 — journal export digest pinned`],
    ()=>[`steering-sim-prices`,`Steering: never act on sim-derived prices in live books`],
  ])(),
};
function mkClaim(w,status){
  const [key,text]=MAKERS[w.name]();
  return {key:`${key}-${hex(4)}`,text,status,wa:w.name,
    author:`key_${hex(6)} (${w.crew})`,
    terms:[pick(TERMS[w.name]),pick(TERMS[w.name])].filter((v,i,a)=>a.indexOf(v)===i),
    digest:`sha256:${hex(12)}…`,seq:null,supersedes:null,
    history:[]};
}

/* ═══ mock journal: exact event types; a paced, pausable desk ticker ══════ */
const tickerEl=document.getElementById('ticker');
let tickerPaused=false, tickerQueue=[], drainAcc=0;
tickerEl.addEventListener('pointerenter',()=>{tickerPaused=true;tickerEl.classList.add('paused');});
tickerEl.addEventListener('pointerleave',()=>{tickerPaused=false;tickerEl.classList.remove('paused');});
tickerEl.addEventListener('click',()=>tickerEl.classList.toggle('open'));
const journal = {
  seq: 1472, tenant: 'meridian-cap',  /* an old desk, not a toy: history exists */
  emit(event_type, detail, kind=false){
    if(!kind) this.seq++;
    const pre=kind?{read:'read log',refuse:'refused — not an event',note:'no new event'}[kind]:null;
    const html=kind?`${pre} · <span class="k">${event_type}</span> · ${detail}`
      :`<span class="s">seq ${this.seq}</span> · <span class="k">${event_type}</span> · ${detail}`;
    tickerQueue.push({html,kind});
    if(!kind){const h=document.getElementById('hudSeq');if(h)h.textContent=this.seq;}
    return this.seq;
  },
  drain(dt){
    if(tickerPaused||!tickerQueue.length)return;
    if((drainAcc+=dt)<(REDUCED?1.6:.9))return;
    drainAcc=0;
    const {html,kind}=tickerQueue.shift();
    const d=document.createElement('div');
    if(kind)d.className='r';
    d.innerHTML=html;
    tickerEl.appendChild(d);
    while(tickerEl.children.length>40)tickerEl.removeChild(tickerEl.firstChild);
    if(tickerEl.classList.contains('open'))tickerEl.scrollTop=tickerEl.scrollHeight;
  }
};
/* the desk was alive before you arrived */
[['workarea.create','wa:ref-taxonomy under the universe root',1468],
 ['grant.issued','reader on wa:market-data → key_a41f09 (crew:signal-desk)',1469],
 ['lifecycle.promote','eurusd-vol-1w-8c21 · wa:market-data · k=1',1470]].forEach(([k,d,s])=>{
  const el=document.createElement('div');
  el.innerHTML=`<span class="s">seq ${s}</span> · <span class="k">${k}</span> · ${d}`;
  tickerEl.appendChild(el);
});
let LIVE=true;
document.getElementById('btnLive').onclick=e=>{LIVE=!LIVE;
  e.currentTarget.setAttribute('aria-pressed',String(!LIVE));
  e.currentTarget.textContent=LIVE?'pause traffic':'resume traffic';
  journal.emit('recall',LIVE?'traffic resumed — the desk keeps working':'traffic paused — the scene holds, the journal holds with it','note');};

/* ═══ workareas: one desk crew per area; reads follow grants, never status ═ */
const WAS = [

function applyCam(){
  st.phi=Math.max(.15,Math.min(Math.PI-.15,st.phi));
  st.radius=Math.max(st.min,Math.min(st.max,st.radius));
  camera.position.set(
    st.target.x+st.radius*Math.sin(st.phi)*Math.sin(st.theta),
    st.target.y+st.radius*Math.cos(st.phi),
    st.target.z+st.radius*Math.sin(st.phi)*Math.cos(st.theta));
  camera.lookAt(st.target);
}
function flyTo(targetPos,radius,cb,dur){
  if(REDUCED){ if(cb)cb(); return; }
  tween.on=true;tween.t=0;tween.cb=cb;tween.dur=dur||THEME.dur.fly;
  tween.from={target:st.target.clone(),radius:st.radius};
  tween.to={target:targetPos.clone(),radius};
}
function tweenFrame(dt){
  if(!tween.on)return;
  tween.t+=dt/tween.dur;
  const k=Math.min(1,tween.t), e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2; /* easeInOutCubic */
  st.target.lerpVectors(tween.from.target,tween.to.target,e);
  st.radius=tween.from.radius+(tween.to.radius-tween.from.radius)*e;
  applyCam();
  if(k>=1){tween.on=false;const cb=tween.cb;tween.cb=null;if(cb)cb();}
}

function discTexture(stops){
  const c=document.createElement('canvas');c.width=c.height=256;
  const g=c.getContext('2d');const grad=g.createRadialGradient(128,128,0,128,128,128);
  stops.forEach(([o,col])=>grad.addColorStop(o,col));
  g.fillStyle=grad;g.fillRect(0,0,256,256);
  return new THREE.CanvasTexture(c);
}
function shapeTexture(kind){
  const c=document.createElement('canvas');c.width=c.height=256;
  const g=c.getContext('2d');g.translate(128,128);g.fillStyle='#fff';g.strokeStyle='#fff';
  if(kind==='core'){const gr=g.createRadialGradient(0,0,0,0,0,110);
    gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.55,'rgba(255,255,255,.95)');
    gr.addColorStop(.72,'rgba(255,255,255,.12)');gr.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=gr;g.fillRect(-128,-128,256,256);}
  if(kind==='ring'){g.lineWidth=26;g.beginPath();g.arc(0,0,74,0,Math.PI*2);g.stroke();
    g.globalAlpha=.25;g.lineWidth=44;g.beginPath();g.arc(0,0,74,0,Math.PI*2);g.stroke();}
  if(kind==='dia'){g.rotate(Math.PI/4);g.fillRect(-62,-62,124,124);
    g.globalAlpha=.22;g.fillRect(-84,-84,168,168);}
  if(kind==='sq'){g.fillRect(-58,-58,116,116);g.globalAlpha=.22;g.fillRect(-80,-80,160,160);}
  return new THREE.CanvasTexture(c);
}
function nebulaTexture(){
  const c=document.createElement('canvas');c.width=c.height=512;
  const g=c.getContext('2d');
  const blobs=[['#101b40',.7],['#1b1440',.6],['#0b2438',.65],['#140f2e',.55],['#101b40',.5],['#0b2438',.45]];
  blobs.forEach(([col,a],i)=>{
    const x=rnd(100,412),y=rnd(100,412),r=rnd(90,220);
    const gr=g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,col+Math.round(a*255).toString(16).padStart(2,'0'));
    gr.addColorStop(1,col+'00');
    g.fillStyle=gr;g.fillRect(0,0,512,512);
  });
  g.globalCompositeOperation='destination-out';
  for(let i=0;i<2;i++){const x=rnd(140,372),y=rnd(140,372),r=rnd(40,80);
    const gr=g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,'rgba(0,0,0,.55)');gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill();}
  return new THREE.CanvasTexture(c);
}
const SOFT=discTexture([[0,'rgba(255,255,255,1)'],[0.35,'rgba(255,255,255,.45)'],[1,'rgba(255,255,255,0)']]);
const HALO=discTexture([[0,'rgba(255,255,255,.9)'],[0.2,'rgba(255,255,255,.22)'],[1,'rgba(255,255,255,0)']]);
const CORE=shapeTexture('core'),RING=shapeTexture('ring'),DIA=shapeTexture('dia'),SQ=shapeTexture('sq');
function glow(color,s=2,opacity=.9,map=CORE){
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map,color,transparent:true,opacity,blending:THREE.AdditiveBlending,depthWrite:false}));
  sp.scale.setScalar(s);return sp;
}
function ringLine(r,color,opacity=THEME.op.ring,y=0,seg=128){
  const pts=[];for(let i=0;i<=seg;i++){const a=i/seg*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(a)*r,y,Math.sin(a)*r));}
  return new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color,transparent:true,opacity}));
}
/* dual-layer memory points: crisp alpha-tested data discs + a soft bloom
   child sharing the SAME geometry — status color stays legible under overlap */
function softPoints(n,fill){
  const pos=new Float32Array(n*3),col=new Float32Array(n*3);
  for(let i=0;i<n;i++){const {p,c}=fill(i);pos.set(p,i*3);col.set([c.r,c.g,c.b],i*3);}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  const data=new THREE.Points(g,new THREE.PointsMaterial({size:THEME.pt.size,map:CORE,vertexColors:true,
    alphaTest:.5,transparent:false,depthWrite:true,sizeAttenuation:true}));
  const bloom=new THREE.Points(g,new THREE.PointsMaterial({size:THEME.pt.glowSize,map:SOFT,vertexColors:true,
    transparent:true,opacity:.3,depthWrite:false,blending:THREE.AdditiveBlending,sizeAttenuation:true}));
  data.add(bloom);  /* child: rotation/color updates ride along; raycast hits the parent only */
  return data;
}
const colFor=s=>{const c=new THREE.Color(CLR[s]);if(s==='held')c.multiplyScalar(.62);return c;};
function disposeGroup(g){g.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)o.material.dispose();});}

function FlowField(group){
  const flows=[],bursts=[];
  return {
    count(){return flows.length;},
    send(from,toGetter,color,{arc=5,dur=THEME.dur.flow,onArrive,shape=CORE,burstScale=1}={}){
      const src=from.clone();
      const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(
        new Array(25).fill(0).map(()=>src.clone())),
        new THREE.LineBasicMaterial({color,transparent:true,opacity:0}));
      const head=glow(color,THEME.pt.pulse,1,shape);const tail=glow(color,1,.55);
      group.add(line,head,tail);
      flows.push({src,toGetter,t:0,dur,head,tail,line,onArrive,color,arc,burstScale});
    },
    burst(pos,color,s=3){const g=glow(color,s,1,HALO);g.position.copy(pos);group.add(g);bursts.push({g,t:0});},
    frame(dt){
      const tmp=new THREE.Vector3();
      for(let i=flows.length-1;i>=0;i--){const f=flows[i];f.t+=dt/f.dur;
        const dst=f.toGetter();
        const mid=f.src.clone().add(dst).multiplyScalar(.5);mid.y+=f.arc;
        const curve=new THREE.QuadraticBezierCurve3(f.src,mid,dst);
        const kr=Math.min(f.t,1);
        const k=kr<.5?2*kr*kr:1-Math.pow(-2*kr+2,2)/2;  /* easeInOutQuad */
        f.head.position.copy(curve.getPoint(k));
        f.tail.position.copy(curve.getPoint(Math.max(0,k-.07)));
        if(k>.85){const sw=1+((k-.85)/.15)*.5;f.head.scale.setScalar(THEME.pt.pulse*sw);
          f.tail.material.opacity=.55*(1-(k-.85)/.15);}
        const attr=f.line.geometry.attributes.position;
        for(let j=0;j<25;j++){curve.getPoint(j/24,tmp);attr.setXYZ(j,tmp.x,tmp.y,tmp.z);}
        attr.needsUpdate=true;
        f.line.material.opacity=.3*Math.sin(Math.PI*k);
        if(f.t>=1){group.remove(f.head,f.tail,f.line);f.line.geometry.dispose();f.line.material.dispose();
          f.head.material.dispose();f.tail.material.dispose();
          if(f.burstScale>0)this.burst(dst,f.color,2.4*f.burstScale);
          if(f.onArrive)f.onArrive();flows.splice(i,1);}}
      for(let i=bursts.length-1;i>=0;i--){const b=bursts[i];b.t+=dt*2.2;
        const e=1-Math.pow(1-Math.min(b.t,1),3);  /* easeOutCubic bloom */
        b.g.scale.setScalar(b.g.scale.x*(1+dt*(1.6+e)));b.g.material.opacity=Math.max(0,1-e);
        if(b.t>=1){group.remove(b.g);b.g.material.dispose();bursts.splice(i,1);}}
    }
  };
}

        const rate=.1+((w.r*7)%10)/80;               /* desynced idle spin */
        w.spin+=dt*rate*MOT*(w.hovered?0:1);          /* hovered clouds hold still */
        w.pts.rotation.y=w.spin;
        w.agents.forEach((a,i)=>{a._a+=dt*(.7+i*.13)*(REDUCED?.15:1);
          a.position.set(Math.cos(a._a)*a._r,Math.sin(a._a*1.7)*.5,Math.sin(a._a)*a._r);});
        if(w.childGroup){const ca=REDUCED?2.1:t*.35;w.childGroup.position.set(Math.cos(ca)*4.6,.9,Math.sin(ca)*4.6);}
        if(w.simGroup){const sa=REDUCED?4.2:t*.28+2;w.simGroup.position.set(Math.cos(sa)*4.9,-1.1,Math.sin(sa)*4.9);
          w.simKeys.forEach(kg=>{kg.position.set(Math.cos(t*.8*MOT+kg._a)*2.1,0,Math.sin(t*.8*MOT+kg._a)*2.1);});}
        const frozen=w.ladder==='validated/frozen';
        w.glowHalo.material.opacity=w.hovered?.55:(frozen?.1:THEME.op.halo+Math.sin(t*1.3+w.r)*.06*MOT);
      });
      /* labels: project through the tilted system */
      WAS.forEach(w=>{
        const wp=new THREE.Vector3();w.group.getWorldPosition(wp);
        placeLabel(w.lbl,wp,reveal.done?camera.position.distanceTo(wp):undefined);
        if(w.childGroup){const cp=new THREE.Vector3();w.childGroup.getWorldPosition(cp);placeLabel(w.childLbl,cp,reveal.done?camera.position.distanceTo(cp):undefined);}
        if(w.simGroup&&w.simLbl){const sp=new THREE.Vector3();w.simGroup.getWorldPosition(sp);placeLabel(w.simLbl,sp,reveal.done?camera.position.distanceTo(sp):undefined);}
      });
      placeLabel(coreLbl,core.position);
      updateCurves();
      flow.frame(dt);
      for(let i=fading.length-1;i>=0;i--){const f=fading[i];f.t+=dt/6;
        f.l.material.opacity=.5*(1-f.t);
        if(f.t>=1){f.parent.remove(f.l);f.l.geometry.dispose();f.l.material.dispose();fading.splice(i,1);}}
      core.rotation.y=t*.15*MOT;
      if(LIVE&&reveal.done&&!tour&&(acc+=dt)>next){acc=0;next=rnd(1.3,2.6)*(REDUCED?1.8:1);act();
        const ts=byName('trading-signals');
        if(ts&&ts.simGroup&&Math.random()<.3)
          journal.emit('simulation.write',`${ts.sim.id} · provenance: simulation · served only to the audience`);
        if((fenceAcc+=1)>=12){fenceAcc=0;fenceDemo();}
      }
    },
    onClick(ray){
      const sets=[];
      WAS.forEach(w=>{sets.push({pts:w.pts,claims:w.claims,w});
        if(w.childPts)sets.push({pts:w.childPts,claims:w.childClaims,w});
        if(w.simPts)sets.push({pts:w.simPts,claims:w.simClaims,w});});
      const ptHit=ray.intersectObjects(sets.map(s=>s.pts));
      if(ptHit.length){
        const set=sets.find(s=>s.pts===ptHit[0].object);
        const cl=set&&set.claims[ptHit[0].index];
        if(cl){
          const idx=ptHit[0].index,pts=set.pts;
          const vv=new THREE.Vector3();
          showClaim(cl,()=>{vv.fromBufferAttribute(pts.geometry.attributes.position,idx);return pts.localToWorld(vv.clone());});
          return;
        }
      }
      const hitCore=ray.intersectObject(coreHit,true);
      const hit=ray.intersectObjects(WAS.map(w=>w.hub));
      if(hit.length){
        const w=WAS.find(x=>x.hub===hit[0].object);
        const c={held:0,prom:0,sup:0,dem:0,ers:0};w.statuses.forEach(s=>c[s]=(c[s]||0)+1);
        const prog=w.ladder==='development'?Math.min(100,w.promotions/6*100)
                  :w.ladder==='committed'?Math.min(100,Math.max(0,w.promotions)/12*100):100;
        sel=null;selMarker.visible=false;
        panel.innerHTML=`<button class="x" id="pxw">✕</button>
          <div class="head"><h4>${w.name}</h4>
          <div class="crew">${w.crew} — writer keys with reader grants, plus dreamer keys</div></div>
          <div class="body"><table>
          <tr><td>status ladder</td><td>${w.ladder}</td></tr>
          ${w.child?`<tr><td>children</td><td>${w.child} (development)</td></tr>`:''}
          <tr><td>memories</td><td>${w.n}</td></tr>
          <tr><td>promoted / held</td><td>${c.prom} / ${c.held}</td></tr>
          <tr><td>superseded · demoted</td><td>${c.sup} · ${c.dem}</td></tr>
          ${w.sim?`<tr><td>simulation</td><td>${w.sim.id} · audience ${w.sim.audience}</td></tr>`:''}
          <tr><td>review policy</td><td>k=${w.k} (${w.k} approving verdict${w.k>1?'s':''})${w.vocab&&w.human?'<br>· human gate (vocab.*)':''}</td></tr>
          <tr><td>reads</td><td>own subtree + grants:<br>${w.grants.join(', ')||'—'}</td></tr>
          <tr><td>writes</td><td>own subtree (writer grant)</td></tr></table>
          <div class="bar"><i style="width:${prog}%"></i></div>
          ${w.ladder==='validated/frozen'?'<div class="docsrow">frozen: serves reads · refuses new writes · demote and erase stay journalled</div>'
            :w.child&&w.ladder==='committed'?`<div class="docsrow">validate blocked while child ${w.child} is development (child-status rule)</div>`
            :'<div class="docsrow">bar = promotions since last transition (mock pacing — transitions are propose + ratify acts)</div>'}
          <div class="docsrow">docs: <a href="../architecture/workareas/">workareas</a> · <a href="../architecture/admission/">admission</a> · <a href="../architecture/roles-and-keys/">roles &amp; keys</a></div>
          ${w.ladder!=='validated/frozen'?'<button class="go cta" id="goReactor">enter the admission pipeline →</button>':''}</div>`;
        panel.hidden=false;
        document.getElementById('pxw').onclick=clearSelection;
        const go=document.getElementById('goReactor');
        if(go)go.onclick=()=>{const wp=new THREE.Vector3();w.group.getWorldPosition(wp);switchMode('reactor',w,wp);};
      } else if(hitCore.length){ switchMode('ledger',null,core.position.clone()); }
      else clearSelection();
    }
  };
}

/* ════════════════════════ MODE: reactor (per workarea) ══════════════════ */
function Reactor(w){
  const group=new THREE.Group();
  const timers=[];
  const lane=new THREE.Mesh(new THREE.BoxGeometry(46,.18,12),new THREE.MeshBasicMaterial({color:0x0d142b}));
  lane.position.y=-2.4;group.add(lane);
  const scanWall=new THREE.Mesh(new THREE.PlaneGeometry(9,7),
    new THREE.MeshBasicMaterial({color:CLR.agent,transparent:true,opacity:.13,side:THREE.DoubleSide}));
  scanWall.rotation.y=Math.PI/2;scanWall.position.x=-8;group.add(scanWall);
  const scanGlow=glow(CLR.agent,6,.18,HALO);scanGlow.position.set(-8,1,0);group.add(scanGlow);
  const holdRing=ringLine(3.4,CLR.held,.55,0);group.add(holdRing);
  const revRing=ringLine(3.2,CLR.agent,.55,0);revRing.position.x=10;group.add(revRing);
  const humanGate=glow(CLR.human,1.8,.95);humanGate.position.set(10,6,0);group.add(humanGate);
  group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(10,.4,0),new THREE.Vector3(10,5.4,0)]),
    new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.22})));
  const dreamers=[];
  for(let i=0;i<3;i++){const d=glow(CLR.agent,1.2,.95);d._a=i/3*Math.PI*2;
    d.material.color.offsetHSL(i*.06,0,i*.04);  /* dreamers are individuals */
    const dot=glow(0xffffff,.28,.9);dot.position.set(0,.8,0);d.add(dot);
    group.add(d);dreamers.push(d);}
  const shelf=new THREE.Group();shelf.position.set(20,-1.9,0);group.add(shelf);let shelfN=0;
  const rejShelf=new THREE.Group();rejShelf.position.set(10,-1.9,-5);group.add(rejShelf);let rejN=0;
  const claims=new Set();
  let humanOn=w.human,kNeed=w.k;
  const counts={held:0,prom:0,rej:0};

  setHud(`<span class="tag">workarea <b>${w.name}</b> · ${w.crew} · writes <b>/v1</b>, verdicts <b>/v2</b></span>
    <span class="tag">held <b class="num" id="rHeld">0</b> · promoted <b class="num" id="rProm">0</b> · rejected <b class="num" id="rRej">0</b></span>
    <button id="rHuman" aria-pressed="${humanOn}">human_required: vocab.*</button>
    <button id="rK" aria-pressed="${kNeed===2}">k = 2 — two approving verdicts</button>
    <span class="tag">docs: <a href="../architecture/admission/">admission</a> · <a href="../architecture/roles-and-keys/">roles &amp; keys</a></span>`);
  document.getElementById('rHuman').onclick=e=>{humanOn=!humanOn;e.currentTarget.setAttribute('aria-pressed',humanOn);};
  document.getElementById('rK').onclick=e=>{kNeed=kNeed===2?1:2;e.currentTarget.setAttribute('aria-pressed',kNeed===2);};
  setLegend([
    {grp:'claims'},['var(--held)','◌ held'],['var(--promoted)','● promoted'],['var(--rejected)','◌ rejected / vetoed (kept in view)'],
    {grp:'actors'},['var(--accent)','dreamer'],['#fff','human'],
    {grp:'marks'},['var(--lad-dev)','■ attachment'],['var(--gold)','◆ vocab finding']]);
  hint.textContent=`write path of ${w.name} · click a claim to read it · a reject is journalled — a scan veto refuses before capture · Esc to go back`;

  const els={held:document.getElementById('rHeld'),prom:document.getElementById('rProm'),rej:document.getElementById('rRej')};
  function spawn(){
    const c=glow(CLR.held,1.05,.98,RING);c._phase='intake';c._t=0;
    c._cl=mkClaim(w,'held');c._name=c._cl.key;
    c._author=(Math.random()*3)|0;
    c._secret=Math.random()<.12;
    c._veto=!c._secret&&Math.random()<.06;
    c._vocab=!c._secret&&!c._veto&&w.vocab&&Math.random()<.15;
    c._reviews=0;c._served=false;c._rad=0;
    if(c._vocab){const vd=glow(CLR.gold,.42,.95,DIA);vd.position.set(-.5,.5,0);c.add(vd);}
    if(Math.random()<.2){const att=glow(LADDER.development,.45,.95,SQ);att.position.set(.5,.5,0);c.add(att);c._att=true;}
    c.position.set(-22,0,rnd(-3,3));group.add(c);claims.add(c);
    if(LIVE){c._cl.seq=journal.emit('submission.remember',`${c._name} · wa:${w.name} · by ${w.crew}${c._vocab?' · finding vocab.deprecation_replaced_by':''}`);
      note(c._cl,'submission.remember');
      if(c._att){journal.emit('submission.attach',`${c._name} · fills-sample.csv sha256:${hex(12)}… · 1 of 1`);note(c._cl,'submission.attach');}}
  }
  function reject(c,why){
    c._phase='rejected';c._t=0;c.material.color.set(CLR.rej);c._cl.status='rej';
    counts.held--;counts.rej++;els.held.textContent=counts.held;els.rej.textContent=counts.rej;
    if(LIVE){journal.emit('review.reject',`${c._name} · ${why} · journalled, bytes kept`);note(c._cl,'review.reject');}
  }
  function disposeClaim(c){c.material.dispose();c.children.forEach(ch=>{if(ch.material)ch.material.dispose();});}
  let spawnAcc=0;
  return {
    group,cam:{theta:0,phi:1.25,radius:30,min:12,max:60,target:new THREE.Vector3(0,0,0)},
    hoverables(){return [...claims];},
    onHover(hit){
      if(!hit){showTip(null);return;}
      let o=hit.object;while(o&&!o._cl)o=o.parent;
      showTip(o&&o._cl?`${o._cl.key}<small>${o._cl.status} · click to read</small>`:null);
    },
    exit(){timers.forEach(clearTimeout);showTip(null);},
    frame(t,dt){
      const sm=k=>1-Math.exp(-k*dt);   /* frame-rate-independent lerps */
      dreamers.forEach(d=>{d._a+=1.2*dt*(REDUCED?.2:1);d.position.set(10+Math.cos(d._a)*3.2,.2,Math.sin(d._a)*3.2);});
      humanGate.position.y=6+Math.sin(t*1.4)*.15*MOT;
      if(LIVE&&(spawnAcc+=dt)>(REDUCED?4:1.6)){spawnAcc=0;if(claims.size<26)spawn();}
      claims.forEach(c=>{
        if(!LIVE)return; /* paused traffic freezes the pipeline — state never outruns the journal */
        c._t+=dt;
        switch(c._phase){
          case 'intake': c.position.x+=5.6*dt;if(c.position.x>=-8){
              if(c._secret||c._veto){
                c._sv=true;c._phase='rejected';c._t=0;c.material.color.set(CLR.rej);c._cl.status='rej';
                counts.rej++;els.rej.textContent=counts.rej;
                if(LIVE)journal.emit('submission.scan_veto',`${c._name} · finding ${c._secret?'secret.api_token':'format.encoding'} · deterministic, same call`,'refuse');}
              else{c._phase='held';
                c._a=Math.atan2(c.position.z,c.position.x);           /* no teleport: */
                c._rad=Math.hypot(c.position.x,c.position.z);          /* blend into the ring */
                counts.held++;els.held.textContent=counts.held;}}break;
          case 'held': c._a+=1.5*dt;
              c._rad+= (3.4-c._rad)*sm(4);
              c.position.set(Math.cos(c._a)*c._rad,c.position.y*(1-sm(4)),Math.sin(c._a)*c._rad);
              if(c._t>rnd(4,7)){c._phase='review';c._t=0;}break;
          case 'review':{const tx=10+Math.cos(c._a)*2.2,tz=Math.sin(c._a)*2.2;
              c.position.x+=(tx-c.position.x)*sm(3.6);c.position.z+=(tz-c.position.z)*sm(3.6);
              if(!c._served){c._served=true;
                if(LIVE){journal.emit('review.serve',`${c._name} → dreamer · served_digests pinned${c._att?' · attachment served':''}`);note(c._cl,'review.serve');}}
              if(c._t>1.8){
                let reviewer=(Math.random()*3)|0;
                if(reviewer===c._author){
                  if(LIVE)journal.emit('review.author_in_lineage',`${c._name} · reviewer = author — verdict refused`,'refuse');
                  const d=dreamers[reviewer];const orig=d.material.color.clone();
                  d.material.color.set(CLR.rej);
                  timers.push(setTimeout(()=>d.material.color.copy(orig),600));
                  c._t=.9;break;
                }
                if(c._reviews===1&&reviewer===c._rev1){c._t=1.2;break;}
                c._rev1=c._reviews===0?reviewer:c._rev1;
                c._reviews++;c._served=false;
                const willReject=c._reviews===kNeed&&Math.random()<.15;
                if(LIVE&&!willReject){
                  journal.emit('review.approve',`${c._name} · dreamer ${reviewer} · verdict ${c._reviews} of ${kNeed}`);note(c._cl,'review.approve');}
                if(willReject){reject(c,`dreamer ${reviewer} verdict: reject`);break;}
                if(c._reviews<kNeed){c._t=0;break;}
                if(c._vocab&&humanOn){c._phase='human';c._t=0;}
                else{c._phase='out';c.material.color.set(CLR.prom);c.material.map=CORE;c._cl.status='prom';counts.held--;counts.prom++;
                  els.held.textContent=counts.held;els.prom.textContent=counts.prom;
                  if(LIVE){journal.emit('review.ratify',`${c._name} · policy satisfied (k=${kNeed})`);note(c._cl,'review.ratify');
                    journal.emit('lifecycle.promote',`${c._name} · wa:${w.name} · ratification ev_${hex(8)}`);note(c._cl,'lifecycle.promote');}}}break;}
          case 'human': c.position.y+=(5.6-c.position.y)*sm(4.8);
              if(c._t>2.2){
                if(Math.random()<.15){c.position.y=0;reject(c,'held_by:human verdict: reject');break;}
                c._phase='out';c.material.color.set(CLR.prom);c.material.map=CORE;c._cl.status='prom';counts.held--;counts.prom++;
                els.held.textContent=counts.held;els.prom.textContent=counts.prom;
                if(LIVE){journal.emit('review.approve',`${c._name} · held_by:human · finding vocab.deprecation_replaced_by`);note(c._cl,'review.approve');
                  journal.emit('review.ratify',`${c._name} · policy satisfied (human gate)`);note(c._cl,'review.ratify');
                  journal.emit('lifecycle.promote',`${c._name} · wa:${w.name} · ratification ev_${hex(8)}`);note(c._cl,'lifecycle.promote');}}break;
          case 'rejected':{const tx=10,tz=-5;
              c.position.x+=(tx-c.position.x)*sm(4.8);c.position.z+=(tz-c.position.z)*sm(4.8);c.position.y*=1-sm(4.8);
              if(c._t>2.5){claims.delete(c);group.remove(c);disposeClaim(c);
                const s=glow(CLR.rej,.8,.75,RING);s.position.set(rnd(-1,1),.3+(rejN%4)*.7,rnd(-1,1));
                rejShelf.add(s);if(++rejN>18){const old=rejShelf.children[0];rejShelf.remove(old);old.material.dispose();}
                if(LIVE&&!c._sv&&Math.random()<.25)timers.push(setTimeout(()=>{if(!LIVE)return;
                  journal.emit('review.reopen',`${c._name} · a non-author reopens it · back to held`);
                  const n2=glow(CLR.held,1.05,.98,RING);n2._phase='held';n2._t=0;n2._cl=c._cl;n2._name=c._name;
                  n2._cl.status='held';note(n2._cl,'review.reopen');
                  n2._vocab=c._vocab;n2._att=c._att;
                  if(n2._vocab){const vd=glow(CLR.gold,.42,.95,DIA);vd.position.set(-.5,.5,0);n2.add(vd);}
                  if(n2._att){const at2=glow(LADDER.development,.45,.95,SQ);at2.position.set(.5,.5,0);n2.add(at2);}
                  n2._author=(Math.random()*3)|0;n2._reviews=0;n2._served=false;n2._a=rnd(0,Math.PI*2);n2._rad=3.4;
                  n2.position.set(0,0,3.4);group.add(n2);claims.add(n2);
                  counts.held++;els.held.textContent=counts.held;},800));}break;}
          case 'out': c.position.x+=7.5*dt;c.position.y*=1-sm(4.8);
              if(c.position.x>=20){claims.delete(c);group.remove(c);disposeClaim(c);
                const s=glow(CLR.prom,.9,.9);s.position.set(rnd(-1.4,1.4),.4+(shelfN%5)*.85,rnd(-2.4,2.4));
                shelf.add(s);if(++shelfN>42){const old=shelf.children[0];shelf.remove(old);old.material.dispose();}}break;
        }
      });
    },
    onClick(ray){
      const hit=ray.intersectObjects([...claims]);
      if(hit.length){
        let o=hit[0].object;while(o&&!o._cl)o=o.parent;
        if(o&&o._cl){const c=o;showClaim(c._cl,()=>c.position.clone());return;}
      }
      clearSelection();
    }
  };
}

/* ════════════════════════ MODE: ledger ══════════════════════════════════ */
const VERIFY_STEPS=[
  'seq starts at 1, increments by one',
  'event 1 is tenant.genesis; prev_hash = 32 zero bytes',
  'Ed25519 verifies signed_bytes against the key set',
  'SHA-256(signed_bytes) equals the stored hash',
  'prev_hash equals the previous recomputed hash',
  'signed_bytes is RFC 8785 canonical',
  'parsed fields match the served envelope',
  'genesis references the provider chain (non-provider tenant)',
  'stated head matches the last event; head signature verifies'];
/* fake shading for flat boxes: vertex colors darken down-facing geometry */
function shadeGeo(geo){
  const n=geo.attributes.normal,count=geo.attributes.position.count;
  const col=new Float32Array(count*3);
  for(let i=0;i<count;i++){
    const f=.72+.28*Math.max(0,n.getY(i))+.1*Math.max(0,n.getX(i));
    col.set([f,f,f],i*3);
  }
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  return geo;
}
function Ledger(){
  const group=new THREE.Group();
  const HELIX_R=7,STEP=1.15,TURN=.62;
  let blocks=[],links=[],broken=-1,erased=false,growAcc=0;
  const REVIEW_BLUE=THEME.c.review;
  const KINDS=[['tenant.genesis',0xffffff],['workarea.create',CLR.agent],['key.issued',CLR.agent],
    ['submission.remember',CLR.held],['review.approve',REVIEW_BLUE],['review.ratify',REVIEW_BLUE],
    ['lifecycle.promote',CLR.prom],['lifecycle.supersede',CLR.sup],['submission.remember',CLR.held]];
  const GROW_DETAIL={'key.issued':()=>'role dreamer · held_by agent','submission.remember':()=>mkClaim(byName('trading-signals'),'held').key,
    'review.approve':()=>'verdict against a fresh serve','review.ratify':()=>'policy satisfied',
    'lifecycle.promote':()=>`${mkClaim(byName('market-data'),'prom').key} · ratification ev_${hex(8)}`,
    'lifecycle.supersede':()=>`tip moved · ratification ev_${hex(8)}`,
    'workarea.create':()=>'node under the universe root'};
  const posAt=i=>{const a=i*TURN;return new THREE.Vector3(Math.cos(a)*HELIX_R,i*STEP-8,Math.sin(a)*HELIX_R);};
  const helix=new THREE.Group();group.add(helix);
  const verifier=glow(0xffffff,1.1,.9);group.add(verifier);
  function addBlock(kind,color,detail){
    const i=blocks.length;
    const geo=kind==='tenant.genesis'?new THREE.OctahedronGeometry(.62)
      :kind.indexOf('review.')===0?new THREE.SphereGeometry(.5,14,12)
      :kind==='lifecycle.supersede'?new THREE.BoxGeometry(.9,.45,.9)
      :new THREE.BoxGeometry(.9,.9,.9);
    const b=new THREE.Mesh(shadeGeo(geo),new THREE.MeshBasicMaterial({color,vertexColors:true}));
    b.position.copy(posAt(i));b._kind=kind;b._born=0;
    b._env={type:kind,detail:detail||'',at:new Date().toISOString().replace(/\.\d+Z/,'Z'),
      prev:`sha256:${hex(10)}…`,hash:`sha256:${hex(10)}…`,sig:'ed25519 · verifies against the deployment key'};
    const h=glow(color,1.8,.3,HALO);h.position.copy(b.position);helix.add(h);b._halo=h;
    helix.add(b);blocks.push(b);
    if(i>0){const g=new THREE.BufferGeometry().setFromPoints([posAt(i-1),posAt(i)]);
      const l=new THREE.Line(g,new THREE.LineBasicMaterial({color:CLR.link,transparent:true,opacity:.85}));
      helix.add(l);links.push(l);}
    return b;
  }
  function thread(i,j){
    const a=posAt(i),b=posAt(j),mid=a.clone().add(b).multiplyScalar(.5).setLength(HELIX_R*1.9);
    const curve=new THREE.CatmullRomCurve3([a,mid,b]);
    helix.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(curve.getPoints(24)),
      new THREE.LineBasicMaterial({color:CLR.gold,transparent:true,opacity:.6})));
  }
  function build(){
    helix.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)o.material.dispose();});
    helix.clear();blocks=[];links=[];broken=-1;erased=false;
    KINDS.forEach(([k,c])=>addBlock(k,c,GROW_DETAIL[k]?GROW_DETAIL[k]():''));
    const base=journal.seq-blocks.length;
    blocks.forEach((b,i)=>{b._seq=base+i+1;b._env.seq=b._seq;b._born=1;});
    thread(3,6);thread(6,7);
    const bt=document.getElementById('lTamper');if(bt)bt.textContent=`tamper seq ${blocks[6]._seq}`;
    setVerdict(true);
  }
  function setVerdict(ok,atSeq){
    const el=document.getElementById('lVerdict');
    if(el)el.innerHTML=ok?'chain <b style="color:var(--promoted)">verified</b>'
      :`chain <b style="color:var(--rejected)">broken · steps 3–5 fail at seq ${atSeq}</b>`;
    [...stepsEl.querySelectorAll('li')].forEach((li,i)=>li.classList.toggle('bad',!ok&&i>=2&&i<=4));
  }
  setHud(`<span class="tag" id="lVerdict">chain <b style="color:var(--promoted)">verified</b></span>
    <button id="lTamper" class="cta">tamper</button>
    <button id="lErase" class="cta">erase artifact</button>
    <button id="lHeal">restore</button>
    <span class="tag">docs: <a href="../data/chain-format/">chain format</a></span>`);
  stepsEl.innerHTML=`<h4>verifier — the nine steps</h4><ol>${VERIFY_STEPS.map(s=>`<li>${s}</li>`).join('')}</ol>
    <div class="src">paraphrased one-to-one from <a href="../data/chain-format/">chain-format.md §Verification</a></div>`;
  stepsEl.hidden=false;
  if(matchMedia('(max-width:640px)').matches)stepsEl.classList.add('collapsed');
  stepsEl.querySelector('h4').onclick=()=>stepsEl.classList.toggle('collapsed');
  setLegend([
    {grp:'events'},['#fff','◆ genesis'],['var(--held)','■ submission'],['var(--review)','● review'],['var(--promoted)','■ lifecycle'],['var(--superseded)','▬ supersede / erased body'],
    {grp:'chain'},['var(--promoted)','verified link'],['var(--rejected)','broken link'],['var(--gold)','lineage thread']]);
  hint.textContent='click a block to read its envelope · gold threads = supersession lineage · verification is a read, not an event · Esc to go back';
  build();
  document.getElementById('lTamper').onclick=()=>{
    if(broken>=0)return;
    broken=6;
    links.forEach((l,i)=>l.material.color.set(i>=broken?CLR.rej:CLR.link));
    blocks.forEach((b,i)=>{if(i>broken){b.material.color.offsetHSL(0,0,-.18);b._halo.material.opacity=.12;}});
    blocks[broken].material.color.set(CLR.rej);blocks[broken]._halo.material.color.set(CLR.rej);
    const atSeq=blocks[broken]._seq;
    setVerdict(false,atSeq);
    journal.emit('verify-chain',`oml audit verify-chain → FAIL: rewritten signed_bytes at seq ${atSeq} — steps 3–5 fail; refusing ${atSeq}..head`,'read');
  };
  document.getElementById('lErase').onclick=()=>{
    if(erased)return;
    if(broken>=0){
      journal.emit('lifecycle.erase',`refused: chain verification failing — restore first (fork check)`,'refuse');
      return;
    }
    erased=true;
    const b=blocks[3];b.material.transparent=true;b.material.opacity=.22;b.material.color.set(CLR.sup);
    b._halo.material.opacity=.08;
    const wire=new THREE.Mesh(new THREE.BoxGeometry(1.2,1.2,1.2),new THREE.MeshBasicMaterial({color:CLR.sup,wireframe:true}));
    wire.position.copy(b.position);helix.add(wire);
    journal.emit('lifecycle.erase',`${b._env.detail||'artifact'} · DEK destroyed · digests + signature intact`);
    const nb=addBlock('lifecycle.erase',CLR.sup,'DEK destroyed · body unreadable, record intact');nb._seq=journal.seq;nb._env.seq=journal.seq;nb._born=0;
    setVerdict(true);
  };
  document.getElementById('lHeal').onclick=build;
  return {
    group,cam:{theta:.9,phi:1.15,radius:26,min:10,max:55,target:new THREE.Vector3(0,0,0)},
    hoverables(){return blocks;},
    onHover(hit){
      showTip(hit?`seq ${hit.object._seq} · ${hit.object._kind}<small>click to read the envelope</small>`:null);
    },
    exit(){stepsEl.hidden=true;showTip(null);},
    frame(t,dt){
      helix.rotation.y=t*(REDUCED?.02:.07);
      if(LIVE&&broken<0&&(growAcc+=dt)>3.2&&blocks.length<26){growAcc=0;
        const [k,c]=pick(KINDS.slice(2));
        const detail=GROW_DETAIL[k]();
        journal.emit(k,`${detail} · head sha256:${hex(8)}…`);
        const nb=addBlock(k,c,detail);nb._seq=journal.seq;nb._env.seq=journal.seq;}
      /* one 9s clock: the sweep walks the chain exactly while the checklist ticks its nine steps */
      const period=9, ph=(t/period)%1;
      const sweep=ph*blocks.length;
      blocks.forEach((b,i)=>{
        if(b._born<1){b._born=Math.min(1,b._born+dt*2.2);
          const e=1+.6*Math.sin(Math.min(1,b._born)*Math.PI); /* easeOutBack-ish entrance */
          b.scale.setScalar(b._born*e);
        } else {
          const d=Math.abs(i-sweep);b.scale.setScalar(d<1?1+(1-d)*.3:1);
        }});
      const fi=Math.floor(sweep);
      if(fi>0&&fi<=links.length&&broken<0){const l=links[fi-1];
        l.material.opacity=Math.min(1,l.material.opacity+.4);}
      links.forEach(l=>{l.material.opacity=Math.max(.85,l.material.opacity-dt*1.2);});
      verifier.position.copy(posAt(Math.floor(sweep)).lerp(posAt(Math.min(blocks.length-1,Math.ceil(sweep))),sweep%1));
      verifier.position.applyAxisAngle(new THREE.Vector3(0,1,0),helix.rotation.y);
      const li=stepsEl.querySelectorAll('li');
      const on=Math.floor(ph*9)%9;
      li.forEach((l,i)=>l.classList.toggle('on',i===on&&broken<0));
    },
    onClick(ray){
      const hit=ray.intersectObjects(blocks);
      if(hit.length){
        const b=hit[0].object,e=b._env;
        sel=null;selMarker.visible=false;
        panel.innerHTML=`<button class="x" id="pxe">✕</button>
          <div class="head"><h4>seq ${e.seq} <span class="chip" style="color:var(--accent-2);border:1px solid color-mix(in srgb,var(--accent-2) 45%,transparent)">${e.type}</span></h4>
          <div class="crew">tenant ${journal.tenant} · signed envelope</div></div>
          <div class="body">
          ${e.detail?`<div class="claimtext">${e.detail}</div>`:''}
          <table>
            <tr><td>at</td><td class="mono">${e.at}</td></tr>
            <tr><td>prev_hash</td><td class="mono">${e.prev}</td></tr>
            <tr><td>hash</td><td class="mono">${e.hash}</td></tr>
            <tr><td>signature</td><td class="mono">${e.sig}</td></tr>
          </table>
          <div class="docsrow">the byte-exact rules live in <a href="../data/chain-format/">chain-format.md</a></div>
          </div>`;
        panel.hidden=false;
        document.getElementById('pxe').onclick=clearSelection;
      } else clearSelection();
    }
  };
}

const MODES={universe:Universe,reactor:Reactor,ledger:Ledger};

/* ═══ main loop ═══════════════════════════════════════════════════════════ */
mode=MODES.universe();modeName='universe';scene.add(mode.group);
Object.assign(st,mode.cam);applyCam();
let prev=performance.now();
(function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-prev)/1000);prev=now;
  resize();
  tweenFrame(dt);
  hoverCheck();
  journal.drain(dt);
  if(sel){selMarker.position.copy(sel.getWorldPos());
    selMarker.scale.setScalar(1.3+Math.sin(now/1000*3)*.12*MOT);}
  if(mode)mode.frame(now/1000,dt);
  renderer.render(scene,camera);
})(prev);
})();
</script>
</body>
</html>
