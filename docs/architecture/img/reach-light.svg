<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" role="img" aria-labelledby="title desc">
<title id="title">Who sees what where: one agent key&#x27;s reach over nested workareas</title>
<desc id="desc">Euler view. Each workarea is a region nested in its parent. payments is a committed team root holding payments.dev, a development workarea in progress with two children, and payments.ops, a validated sibling. universe.dana is a person&#x27;s own root, drawn apart. Key A is an agent key bound to tip and scoped in payments.dev; its reach is the outlined region over payments. Inside the in-progress subtree key A reads held memories, marked unreviewed, and held skills, guardrails and steering once ADR-0080 d10 is built (designed). In the sibling it reads promoted items only; a held item there is not served to it. Nothing in universe.dana is in its reach. Held items are hollow circles, promoted items solid, items not served dotted and struck.</desc>
