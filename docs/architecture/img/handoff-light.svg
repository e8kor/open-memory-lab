<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img" aria-labelledby="title desc">
<title id="title">Produce, review, publish, and binding wins: two keys&#x27; overlapping reach</title>
<desc id="desc">Euler view in two panels. Panel 1: key A, an agent key bound to tip, writes skill v2 into payments.dev, in progress, where it is held. Key B, also bound to tip, reaches payments.dev too, so it reads key A&#x27;s held skill there, marked unreviewed. A person outside key A&#x27;s lineage approves it, and two persons cut and publish release payments.dev@1.4.0, which holds the promoted version (designed). Panel 2: key B is bound to latest instead (designed). Its scope is the same, but its reach is the release alone: it reads skill v2 as published, and neither the held v3 nor a memory promoted after the cut until the next release. Binding wins over in-progress.</desc>
