<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
<title id="title">Logical: one agent key and everything it is served</title>
<desc id="desc">An agent key in tenant acme, for person alice, with role writer and default workspace dev, whose tree path is universe.payments.dev, scopes to dev. It is served approved guardrails from dev and each ancestor it reads at session start, and steering from the same nodes first in every recall. It recalls from dev and its subtree, with held work marked unreviewed because dev is in progress, and from other protected or frozen workspaces it reads when the tenant enables federation and a recall asks. Nothing inside the in-progress subtree reaches readers outside it until a person commits it.</desc>
