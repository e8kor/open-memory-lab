<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="710" viewBox="0 0 1100 710" role="img" aria-labelledby="title desc">
<title id="title">Deployment: a request from the client to the disk</title>
<desc id="desc">Clients reach Caddy over HTTPS. Caddy serves the landing paths as static files, sends each console page to oml-web and every other path to oml-server-lead. oml-web holds no database access and no signing key and calls the lead's public API as the signed-in person. The lead alone holds the Ed25519 signing key and commits each write to PostgreSQL 17 in one transaction. oml-lakewriter, under a lease and a role of its own, reads the outbox from PostgreSQL and appends to the Delta lake, sealing bodies with its own key. Operations, on the production host: the deployer, metrics and logs, and a backup that is built and not installed.</desc>
