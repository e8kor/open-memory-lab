<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570" role="img" aria-labelledby="title desc">
<title id="title">Sharing: held work vertically inside an in-progress subtree, promoted work horizontally</title>
<desc id="desc">One workspace tree. payments.dev is an in-progress development root with two children. Tip keys scoped inside the subtree read its held work, marked unreviewed. Tip keys at an ancestor, payments, will read the subtree&#x27;s held items too, marked (designed). A sibling, payments.ops, reads nothing of the subtree until a person commits it or a release is published. Another branch, risk, reads across the tree only through federation: promoted rows of protected or frozen workspaces, and, designed, a published release of the in-progress subtree. A key bound to latest reads the release and never a held item (designed).</desc>
