site_name: Open Memory Lab
site_description: An external memory provider for AI agents — every memory is a claim under test.
site_url: https://e8kor.github.io/open-memory-lab/
repo_url: https://github.com/e8kor/open-memory-lab
edit_uri: edit/main/docs/
docs_dir: docs
exclude_docs: |
  assets/brand/tokens.md
  contributing/
  NUMBERS.md
copyright: >
  Code licensed <a href="https://github.com/e8kor/open-memory-lab/blob/main/LICENSE">Apache-2.0</a> ·
  documentation licensed <a href="https://github.com/e8kor/open-memory-lab/blob/main/LICENSE-docs">CC BY 4.0</a>

validation:
  nav:
    omitted_files: warn

theme:
  name: material
  logo: assets/brand/oml-mark.svg
  favicon: assets/brand/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.path
    - navigation.footer
    - navigation.top
    - navigation.instant
    - search.suggest
    - search.highlight
    - toc.follow
    - content.tabs.link
    - content.code.copy
    - content.action.edit
    - content.action.view

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true

