site_name: Open Memory Lab
site_description: An external memory provider for AI agents — every memory is a claim under test.
site_url: https://e8kor.github.io/open-memory-lab/
repo_url: https://github.com/e8kor/open-memory-lab
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.integrate

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Concepts: concepts.md
  - Review guide: review-guide.md
  - Product:
      - Positioning: product/positioning.md
      - Roadmap: product/roadmap.md
  - Architecture:
      - Overview: architecture/overview.md
      - Admission: architecture/admission.md
      - Workareas: architecture/workareas.md
      - Roles and keys: architecture/roles-and-keys.md
      - Simulations: architecture/simulations.md
      - Storage: architecture/storage.md
      - Retrieval: architecture/retrieval.md
      - Reconciliation: architecture/reconciliation.md
      - Audit and lineage: architecture/audit-and-lineage.md
      - Security: architecture/security.md
  - Data:
      - PostgreSQL schema: data/postgres-schema.md
      - Delta tables: data/delta-tables.md
      - Event catalog: data/event-catalog.md
  - API:
      - HTTP API: api/http-api.md
      - MCP plugin: api/mcp-plugin.md
      - Errors: api/errors.md
  - CLI:
      - Reference: cli/reference.md
      - Sessions: cli/sessions.md
  - Operations:
