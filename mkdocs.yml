site_name: Open Memory Lab
site_description: An external memory provider for AI agents. Every write is held until a different identity reviews it.
site_url: https://e8kor.github.io/open-memory-lab/
site_dir: _site
repo_url: https://github.com/e8kor/open-memory-lab
edit_uri: edit/main/docs/
docs_dir: docs
exclude_docs: |
  includes/
  assets/brand/tokens.md
  contributing/
  NUMBERS.md
  adr/
  legal/
hooks:
  - hooks/status_line.py

extra:
  oml_series: "0.6"

extra_css:
  - stylesheets/oml.css
  - assets/status.css

copyright: >
  Code licensed <a href="https://github.com/e8kor/open-memory-lab/blob/main/LICENSE">Apache-2.0</a> ·
  documentation licensed <a href="https://github.com/e8kor/open-memory-lab/blob/main/LICENSE-docs">CC BY 4.0</a>

validation:
  nav:
    omitted_files: warn
  anchors: warn

theme:
  name: material
  logo: assets/brand/oml-mark.svg
  font: false
  favicon: assets/brand/favicon.svg
  palette:
    # Colours come from docs/stylesheets/oml.css, generated from design/tokens.json (ADR-0069).
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to paper
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to night
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.path
    - navigation.footer
    - navigation.top
    - navigation.instant
    - search.suggest
    - search.highlight
    - toc.follow
    - content.tabs.link
    - content.code.copy
    - content.action.edit
    - content.action.view

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.snippets:
      base_path: [docs/includes]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true


