# The values CI installs the chart with on kind (.github/workflows/ci.yml, job
# chart): the image is the one CI built from the checkout and loaded into the
# cluster, so it is never pulled. The job's Secret, oml-postgres, carries both
# the serving URL and the owner URL, over the role pair its in-cluster
# Postgres creates (ADR-0034 d2, d10 step 2).
#
# The Ingress is on, through the Traefik controller the job installs, so the
# job reaches oml-web and the lead by path through the chart's own Ingress
# (ADR-0070 d4). A real install keeps it off until the first admin key is
# claimed (ADR-0033 d8); the job's cluster is its own. The web client Secret
# is one the job creates, the recommended path (values.yaml, web.clientSecret).
image:
  pullPolicy: Never
networkPolicy:
  enabled: true
ingress:
  enabled: true
  className: traefik
  hosts:
    - host: oml.test
      paths:
        - path: /
          pathType: Prefix
web:
  publicUrl: http://oml.test:8088
  clientSecret:
    existingSecret: oml-web-client
