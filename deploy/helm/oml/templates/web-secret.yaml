{{- if not .Values.web.clientSecret.existingSecret }}
{{- $name := include "oml.webClientSecret" . -}}
{{- $key := .Values.web.clientSecret.key -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $value := "" -}}
{{- if and $existing $existing.data (hasKey $existing.data $key) -}}
{{- $value = index $existing.data $key -}}
{{- else -}}
{{- $value = randAlphaNum 48 | b64enc -}}
{{- end }}
# web.client_secret for the lead and oml-web (ADR-0070 d2): random at the
# first install, read back on every upgrade so both pods keep one value.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "oml.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
type: Opaque
data:
  {{ $key }}: {{ $value }}
{{- end }}
