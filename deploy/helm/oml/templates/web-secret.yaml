{{- if not .Values.web.clientSecret.existingSecret }}
{{- $name := include "oml.webClientSecret" . -}}
{{- $key := .Values.web.clientSecret.key -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $data := dict -}}
{{- if and $existing $existing.data (hasKey $existing.data $key) -}}
{{- $data = $existing.data -}}
{{- else -}}
{{- $_ := set $data $key (randAlphaNum 48 | b64enc) -}}
{{- end }}
# web.client_secret for the lead and oml-web (ADR-0070 d2), when no
# web.clientSecret.existingSecret names one: random at the first install, read
# back on every upgrade so both pods keep one value, and kept on uninstall so
# a reinstall reads it back too, with every key an operator added for a
# rotation (web.clientSecret.previousKey, previousUntilKey; #230). A render
# without a cluster (helm template, GitOps) cannot read it back; use
# existingSecret there (values.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "oml.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
type: Opaque
data:
  {{- range $k, $v := $data }}
  {{ $k }}: {{ $v }}
  {{- end }}
{{- end }}
