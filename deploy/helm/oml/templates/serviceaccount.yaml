apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "oml.fullname" . }}-server
  labels:
    {{- include "oml.labels" . | nindent 4 }}
# The lead calls no Kubernetes API, so no pod of this account gets a token
# (ADR-0033 d5).
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "oml.fullname" . }}-web
  labels:
    {{- include "oml.labels" . | nindent 4 }}
# oml-web calls no Kubernetes API either.
automountServiceAccountToken: false
