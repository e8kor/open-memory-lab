# Open Memory Lab — the interim chart (docs/adr/ADR-0033-interim-helm-chart.md).
#
# It runs the one server binary the build has, oml-server-lead, as the one
# lead. The designed chart's other workloads — followers, the lake-writer, the
# reconciler, the indexer and the bootstrap Job — are decided, not built
# (docs/operations/deployment.md, "The interim chart").
#
# Not values, on purpose: the replica count and the strategy (one lead under
# Recreate, ADR-0033 d2), the security context (d4, d5) and the probes (d7).

image:
  repository: ghcr.io/e8kor/open-memory-lab
  # Empty: the chart's appVersion, which is the workspace version (ADR-0033 d9).
  tag: ""
  # sha256:… pins the image by digest; each release's notes print its index digest.
  digest: ""
  pullPolicy: IfNotPresent

# Postgres is external (ADR-0033 d6). The lead reads two connection URLs from
# two keys of this one Secret; the chart never takes a URL or a password as a
# value. secretKey holds the serving role's URL, a role that owns nothing, and
# ownerSecretKey the owner role's, which owns the database and runs the
# migrations at boot (ADR-0034 d2, d4). The lead refuses to start when the two
# log in as one role. Create it before the install:
#   kubectl create secret generic oml-postgres \
#     --from-literal=OML_POSTGRES__URL='postgres://SERVING_ROLE:PASSWORD@HOST:5432/DATABASE' \
#     --from-literal=OML_POSTGRES__OWNER_URL='postgres://OWNER_ROLE:PASSWORD@HOST:5432/DATABASE'
postgres:
  secretName: oml-postgres
  secretKey: OML_POSTGRES__URL
  ownerSecretKey: OML_POSTGRES__OWNER_URL

# The keyring claim holds the deployment signing key (ADR-0033 d3). helm
# uninstall leaves it; a reinstall under the same release name and namespace
# takes it back.
keyring:
  # The name of a claim that already holds a keyring, instead of a new one.
  existingClaim: ""
  # The keyring file is 65 bytes; a provisioner may round the request up.
  size: 64Mi
  # Empty: the cluster's default StorageClass.
  storageClassName: ""

# The web console, oml-web: its own process over the lead's HTTP API, a
# second Deployment from the same image under the entrypoint
# /usr/local/bin/oml-web (ADR-0070 d4). It reaches the lead at the lead's
# Service, never through the Ingress.
web:
  # The browser's origin, which a form's Origin must equal (web.public_url).
  # Empty: https:// and the first Ingress host below.
  publicUrl: ""
  # oml-web's identity to the lead, web.client_secret, at least 32
  # characters, set on both Deployments from this Secret's key (ADR-0070 d2).
  #
  # Recommended: create the Secret yourself and name it here, so the value
  # never depends on a render:
  #   kubectl create secret generic oml-web-client \
  #     --from-literal=OML_WEB__CLIENT_SECRET="$(openssl rand -hex 32)"
  # A GitOps controller (Argo CD, Flux) or `helm template` renders without a
  # cluster to read back from, so it must use existingSecret: the fallback
  # below would write a new value on every sync, and the lead and oml-web
  # would disagree until both restart.
  #
  # Empty existingSecret, with helm install and helm upgrade only: the chart
  # creates <release>-web-client once with a random value, reads it back on
  # every upgrade, and keeps it on uninstall (helm.sh/resource-policy: keep).
  clientSecret:
    existingSecret: ""
    key: OML_WEB__CLIENT_SECRET
  # The hop to the lead's Service carries session credentials in plain http
  # inside the cluster network; oml-web refuses plain http to a non-loopback
  # host unless this allows it (web.allow_plain_http_api). Set false only
  # with a TLS hop in front of the lead.
  allowPlainHttpApi: true
  # Ingress paths routed to oml-web, ahead of the lead's, per host: each page
  # oml-web serves has its own path under /web/ (oml_web::PAGES; ADR-0070
  # d7 (b)), and every other path goes to the lead. A page that moves in a
  # later release adds a row here.
  ingressPaths:
    - path: /web/guardrails
      pathType: Exact
    - path: /web/workareas
      pathType: Exact
    - path: /web/admin/workareas
      pathType: Exact
    - path: /web/memories
      pathType: Exact
    - path: /web/atlas
      pathType: Exact
    - path: /web/admin/memories
      pathType: Exact
    - path: /web/admin/atlas
      pathType: Exact
    - path: /web/data/memories
      pathType: Exact
    - path: /web/admin/data/memories
      pathType: Exact
    - path: /web/review
      pathType: Exact
    - path: /web/admin/review
      pathType: Exact
    - path: /web/keys
      pathType: Exact
    - path: /web/admin/keys
      pathType: Exact
    - path: /web/memory
      pathType: Exact
    - path: /web/admin/memory
      pathType: Exact
    - path: /web/admin/curate
      pathType: Exact
    # The Mermaid frame's document and its pinned bundle, one segment below
    # each (ADR-0056 d9).
    - path: /web/render
      pathType: Prefix
    - path: /web/assets
      pathType: Prefix
  # Hints, never claims (docs/operations/capacity.md).
  resources: {}

# Off until the first admin key is claimed through kubectl port-forward: until
# then, whoever presents the enrollment token from the pod log first receives
# that key (ADR-0033 d8; NOTES.txt prints the ceremony).
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: oml.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: oml-tls
  #    hosts:
  #      - oml.example.com

# Off by default: its peers are facts of the site (ADR-0033 d5).
networkPolicy:
  enabled: false
  # Who may open connections to the API port. The default admits pods in the
  # release's namespace; add the ingress controller's namespace before
  # enabling the Ingress. An empty list admits every source.
  ingressFrom:
    - podSelector: {}
  # Where the lead may open connections besides DNS (port 53): Postgres.
  postgres:
    port: 5432
    # Peers that narrow it, e.g. an ipBlock for a managed Postgres. Empty: any
    # destination, on that port alone.
    to: []

# Resource hints are comments, not claims: no number for them is measured
# (docs/operations/capacity.md). Set requests and limits from your own
# measurements.
resources: {}
#  requests:
#    cpu: …
#    memory: …
#  limits:
#    memory: …
