<path class="e acc" d="M560 153 H598" marker-end="url(#aa)"/>
<path class="e dash" d="M980 153 H1076" marker-end="url(#a)"/>
<text class="el" x="990" y="143">export</text>
<text class="el" x="990" y="176">(next view)</text>
<rect class="box" x="30" y="270" width="530" height="66" rx="5"/><text class="t" x="44" y="294">tip key</text><text class="s" x="44" y="313">the promoted tip, plus held work marked unreviewed inside an in-progress</text><text class="s" x="44" y="329">subtree; every key reads this way today</text>
<path class="e" d="M115 268 V196" marker-end="url(#a)"/>
<path class="e" d="M485 268 V196" marker-end="url(#a)"/>
<rect class="box plan" x="600" y="270" width="190" height="66" rx="5"/><text class="t" x="614" y="294">latest key</text><text class="s" x="614" y="313">the newest published release;</text><text class="s" x="614" y="329">never a held item</text><rect class="tag" x="716" y="262" width="64" height="16" rx="3"/><text class="tagt" x="748" y="274" text-anchor="middle">designed</text>
<rect class="box plan" x="860" y="270" width="220" height="66" rx="5"/><text class="t" x="874" y="294">pinned key</text><text class="s" x="874" y="313">one release by its label,</text><text class="s" x="874" y="329">such as payments.dev@1.3.0</text><rect class="tag" x="1006" y="262" width="64" height="16" rx="3"/><text class="tagt" x="1038" y="274" text-anchor="middle">designed</text>
