<rect class="plate" x="0.5" y="0.5" width="1099" height="559" rx="6"/>
<text class="lanet hi" x="30" y="34">DEVELOPMENT SCOPES: LOOSE</text>
<text class="s" x="30" y="54">the team reads held work, marked; own-root approval is marked same_user</text>
<text class="lanet hi" x="600" y="34">PRODUCTION SCOPES: STRICT</text>
<text class="s" x="600" y="54">another person decides; nothing unreviewed is served but a marked fix</text>
<path class="zone" d="M580 20 V500"/>
<text class="acct" x="580" y="84" text-anchor="middle">loose turns strict</text>
