<rect class="box plan" x="220" y="112" width="170" height="82" rx="5"/><text class="t" x="234" y="136">Test and verify</text><text class="s" x="234" y="155">test claims run on the</text><text class="s" x="234" y="171">candidate; impact report</text><rect class="tag" x="316" y="104" width="64" height="16" rx="3"/><text class="tagt" x="348" y="116" text-anchor="middle">designed</text>
<rect class="box" x="410" y="112" width="150" height="82" rx="5"/><text class="t" x="424" y="136">Review</text><text class="s" x="424" y="155">per item, another key;</text><text class="s" x="424" y="171">own root: same_user</text>
<rect class="box" x="600" y="112" width="180" height="82" rx="5"/><text class="t" x="614" y="136">Committed, validated</text><text class="s" x="614" y="155">one key proposes the</text><text class="s" x="614" y="171">rung, another ratifies</text>
<rect class="box acc plan" x="800" y="112" width="180" height="82" rx="5"/><text class="t" x="814" y="136">Release</text><text class="s" x="814" y="155">one person cuts, another</text><text class="s" x="814" y="171">publishes; a fixed list</text><rect class="tag" x="906" y="104" width="64" height="16" rx="3"/><text class="tagt" x="938" y="116" text-anchor="middle">designed</text>
<path class="e" d="M200 153 H218" marker-end="url(#a)"/>
