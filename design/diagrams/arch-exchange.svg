<!-- The architecture exchange view (docs/architecture/lifecycle.md). Every colour is a design token, referenced in the style element alone; scripts/gen_design_tokens.py resolves them per theme. A dashed box tagged designed is not built. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc">
<title id="title">Export and import: a release leaves as a signed bundle and lands held on the target</title>
<desc id="desc">On the source server a person exports a published release of payments.dev as an oml-bundle/1 file: claim versions of every kind, their verdicts as provenance under per-bundle pseudonyms, the signed source events and a signed manifest, encrypted to named age recipients. Keys, grants, crews, bindings and settings never travel. On the target a person&#x27;s writer key imports it into an in-progress development workarea; the target&#x27;s scan runs and every version lands held. A person on the target reviews it again, and two persons cut and publish a release there, which latest keys read. A rollback rejects the held versions or, as an admin fix, demotes what was promoted and retires what was created, marked and confirmed afterwards. On one server an import streams from a release into an in-progress copy. Everything in this view is designed and not built.</desc>
<style>
