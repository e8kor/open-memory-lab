<!-- The architecture gate view (docs/architecture/views.md). Every colour is a design token, referenced in the style element alone; scripts/gen_design_tokens.py resolves them per theme. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380" role="img" aria-labelledby="title desc">
<title id="title">Logical: one memory through the review gate</title>
<desc id="desc">A write is scanned in the same call; a veto, for a secret or a field over the scan's bound, refuses it and nothing is written. A passing or held write lands held, readable by its author, the reviewer it is served to and the journalled admin read. A reviewer who is not its author approves or rejects it. Approval promotes it and recall serves it in scope; a rejected version is kept and never served. Inside an in-progress workspace, a held version the scan did not hold is served to readers there, marked unreviewed. A new version or a retirement is a new held write, and the old version is kept.</desc>
<style>
.plate{fill:var(--ground);stroke:var(--rule)}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.box{fill:var(--ground-alt);stroke:var(--edge);stroke-width:1.3}
.box.soft{fill:var(--panel)}
.box.acc{fill:var(--held-soft);stroke:var(--star)}
.box.plan{fill:none;stroke-dasharray:5 4}
.box.acs{stroke:var(--star)}
.zone{fill:none;stroke:var(--star);stroke-width:1.3;stroke-dasharray:6 5}
.lane{fill:none;stroke:var(--rule);stroke-width:1}
.t{fill:var(--ink);font-size:13px;font-weight:700}
.t.big{font-size:15px}
.s{fill:var(--ink-dim);font-size:11.5px}
.s.hi{fill:var(--star);font-weight:700}
.lanet{fill:var(--ink-faint);font-size:11px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;letter-spacing:.06em}
.e{fill:none;stroke:var(--edge);stroke-width:1.3}
.e.acc{stroke:var(--star)}
.e.dash{stroke-dasharray:5 4}
.ah{fill:var(--edge)}
.aha{fill:var(--star)}
.el{fill:var(--ink);font-size:11.5px;paint-order:stroke;stroke:var(--ground);stroke-width:5px;stroke-linejoin:round}
.step{fill:var(--star-fill)}
.stept{fill:var(--on-star);font-size:11px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.acct{fill:var(--star);font-size:11.5px;font-weight:700;paint-order:stroke;stroke:var(--ground);stroke-width:5px;stroke-linejoin:round}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0 L10 5 L0 10 z"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aha" d="M0 0 L10 5 L0 10 z"/></marker></defs>
<rect class="plate" x="0.5" y="0.5" width="1099" height="379" rx="6"/>
<rect class="box" x="20" y="130" width="160" height="74" rx="5"/>
<text class="t" x="36" y="158">Writer</text><text class="s" x="36" y="178">agent or person key</text><text class="s" x="36" y="194">oml_write, CLI, console</text>
<rect class="box" x="240" y="130" width="160" height="74" rx="5"/>
<text class="t" x="256" y="158">Scan</text><text class="s" x="256" y="178">rules, not a model</text><text class="s" x="256" y="194">in the same call</text>
<rect class="box" x="460" y="130" width="180" height="74" rx="5"/>
<text class="t" x="476" y="158">Held</text><text class="s" x="476" y="178">its author, its reviewer,</text><text class="s" x="476" y="194">the admin read (R3)</text>
<rect class="box" x="700" y="130" width="160" height="74" rx="5"/>
<text class="t" x="716" y="158">Review</text><text class="s" x="716" y="178">a different identity</text><text class="s" x="716" y="194">(R2)</text>
<rect class="box acc" x="920" y="130" width="160" height="74" rx="5"/>
<text class="t" x="936" y="158">Promoted</text><text class="s" x="936" y="178">approval journalled</text><text class="s" x="936" y="194">served in scope</text>
<path class="e" d="M180 167 H238" marker-end="url(#a)"/>
<path class="e" d="M400 167 H458" marker-end="url(#a)"/>
<path class="e" d="M640 167 H698" marker-end="url(#a)"/>
<path class="e" d="M860 167 H918" marker-end="url(#a)"/>
<circle class="step" cx="209" cy="148" r="10"/><text class="stept" x="209" y="152" text-anchor="middle">1</text>
<circle class="step" cx="429" cy="148" r="10"/><text class="stept" x="429" y="152" text-anchor="middle">2</text>
<circle class="step" cx="669" cy="148" r="10"/><text class="stept" x="669" y="152" text-anchor="middle">3</text>
<circle class="step" cx="889" cy="148" r="10"/><text class="stept" x="889" y="152" text-anchor="middle">4</text>
<text class="el" x="190" y="190">submit</text>
<text class="el" x="406" y="190">pass</text>
<text class="el" x="406" y="204">or hold</text>
<text class="el" x="648" y="190">serve</text>
<text class="el" x="866" y="190">approve</text>
<path class="e" d="M1000 128 V70 H550 V128" marker-end="url(#a)"/>
<text class="el" x="600" y="62">a new version or a retirement is a new held write (R4: the old one is kept)</text>
<path class="e" d="M320 204 V266" marker-end="url(#a)"/>
<text class="el" x="328" y="240">veto: a secret, or a bound</text>
<rect class="box soft" x="240" y="268" width="160" height="62" rx="5"/>
<text class="t" x="256" y="294">Refused</text><text class="s" x="256" y="313">nothing is written</text>
<path class="e dash" d="M550 204 V266" marker-end="url(#a)"/>
<text class="el" x="558" y="240">in progress only</text>
<rect class="box acs" x="460" y="268" width="180" height="92" rx="5"/>
<text class="t" x="476" y="294">Served, unreviewed</text><text class="s" x="476" y="313">to readers inside the</text><text class="s" x="476" y="330">in-progress workspace;</text><text class="s" x="476" y="347">never a scan hold</text>
<path class="e" d="M780 204 V266" marker-end="url(#a)"/>
<text class="el" x="788" y="240">reject</text>
<rect class="box soft" x="700" y="268" width="160" height="62" rx="5"/>
<text class="t" x="716" y="294">Rejected</text><text class="s" x="716" y="313">kept, never served</text>
</svg>
