name: Practices

# The merge gates of docs/contributing/review-checklist.md that a script can enforce: the
# number registry, the changelog fragment, the three lints and the design tokens (ADR-0069),
# with the scripts' own tests.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: practices-${{ github.ref }}
  # A new push to a pull request replaces its stale run; main, merge groups and tags always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  script-tests:
    name: practice scripts pass their tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # check_release.py and check_contract_sync.py read YAML; their tests do too.
      - run: pip install --retry 5 --timeout 30 pyyaml==6.0.3
      - run: python -m unittest discover -s scripts/tests

  numbers:
    name: ADR and migration numbers are reserved
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # check_numbers.py lists open pull requests with gh, so a closed PR's branch holds no numbers
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
      - run: python scripts/check_numbers.py --base origin/main
        env:
          GH_TOKEN: ${{ github.token }}

  changelog-fragment:
    name: change adds a changelog fragment
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: git fetch --no-tags origin main
      - run: python scripts/check_changelog_fragment.py --base origin/main
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          HEAD_REF: ${{ github.head_ref }}

  lints:
    name: migration, port 5432 and LIKE lints
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/lint_practices.py migrations
      - run: python scripts/lint_practices.py ports
      - run: python scripts/lint_practices.py like

  design:
    name: design outputs match the tokens and every pair meets its contrast floor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/gen_design_tokens.py --check
      # The landing site, built from site/src/ and the outputs above, is what site/dist/ holds.
      - run: python site/build.py --check
      - run: python scripts/check_contrast.py

  # The one check to require: every job above succeeded or was skipped (numbers
  # and changelog-fragment run on pull requests only). These jobs are cheap and
  # run on every change, so there is no path filter here.
  ci-ok:
    name: ci ok (practices)
    if: always()
    needs: [script-tests, numbers, changelog-fragment, lints, design]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every job succeeded or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "a job finished: $r" >&2; exit 1 ;; esac
          done
