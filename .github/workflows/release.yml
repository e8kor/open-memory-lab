name: Release

# A release is a set of verifiable artifacts, not a tag
# (docs/engineering/ci-and-toolchain.md "Release artifacts"). One tag vX.Y.Z,
# equal to the workspace version, ships:
#   - oml-cli-X.Y.Z-<target>.tar.gz (.zip on Windows), the `oml` CLI alone, for
#     x86_64-unknown-linux-musl, aarch64-unknown-linux-musl (static, any
#     distro) and x86_64-pc-windows-msvc, each built on a native runner
#     (macOS paused: docs/engineering/ci-and-toolchain.md "Paused targets");
#   - oml-server-lead-X.Y.Z-<target>.tar.gz for x86_64-unknown-linux-gnu and
#     aarch64-unknown-linux-gnu;
#   - oml-lakewriter-X.Y.Z-<target>.tar.gz, the Delta lake writer, a separate
#     service (ADR-0060), for x86_64-unknown-linux-gnu and
#     aarch64-unknown-linux-gnu;
#   - one CycloneDX SBOM per archive (<archive stem>.cdx.json), one SHA256SUMS
#     over every archive and SBOM, each of them signed keyless with cosign;
#   - ghcr.io/e8kor/open-memory-lab:X.Y.Z (and :latest), one image index for
#     linux/amd64 and linux/arm64, each built on a native runner with buildx SBOM
#     and provenance attestations, the index signed by digest;
#   - the `oml` agent plugin, whose marketplace is this repository at the tag;
#   - oml-claude-plugins-X.Y.Z.tar.gz and .zip, the oml and oml-admin plugins
#     with a marketplace whose sources resolve inside the archive, and
#     oml-marketplace-X.Y.Z.json, the marketplace pinned to this tag;
#   - oml-agent-kit-X.Y.Z.tar.gz and .zip, MCP configurations for other agent
#     tools, an AGENTS.md block and a Gemini CLI session-start hook;
#     these five, written by scripts/package_agent_artifacts.py, are summed and
#     signed with the archives above;
#   - oml-site-X.Y.Z.tar.gz, the landing site as static files (site/README.md),
#     built by site/build.py and summed and signed with the archives above.
# The verification command the release notes carry is the one that page
# states; this file's path is the identity it pins.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  version:
    name: tag equals the workspace version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      # RELEASE-HOLD at the root holds every release; every other job needs
      # this one (scripts/check_release.py holds that).
      - name: no release hold
        run: python3 scripts/check_release_hold.py
      - id: v
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(python3 -c 'import tomllib;print(tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"])')"
          plugin="$(python3 -c 'import json;print(json.load(open("plugins/oml/.claude-plugin/plugin.json"))["version"])')"
          if [ "$tag" != "$crate" ] || [ "$tag" != "$plugin" ]; then
            echo "tag $tag, workspace $crate, plugin $plugin: all three must agree" >&2
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  # The runner labels are the ones GitHub lists for public repositories
  # (docs.github.com/en/actions/reference/runners/github-hosted-runners,
  # fetched 2026-11-03): each target builds on a runner of its own OS and
  # architecture, so `oml --version` runs on the binary it ships.
  cli:
    name: oml CLI, ${{ matrix.target }}
    needs: version
    strategy:
      matrix:
        include:
          # musl from Ubuntu's musl-tools for the C in ring; Rust links its
          # own self-contained musl, so the binary is static.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          # macOS targets are paused while GitHub's macOS runners are unreliable; see
          # docs/engineering/ci-and-toolchain.md "Paused targets".
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.target }}
      # ring's C, for each musl target, with the wrapper Ubuntu's musl-tools
      # ships for the runner's own architecture. On the arm64 runner cc counts
      # aarch64-unknown-linux-musl as a cross compile and would otherwise call
      # aarch64-linux-musl-gcc, which musl-tools does not ship
      # (packages.ubuntu.com/noble/arm64/musl-tools/filelist, fetched
      # 2026-11-03). The archiver falls back to the host's ar, and Rust links
      # its self-contained musl with the host's cc, both native here.
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
      - name: musl C toolchain
        if: endsWith(matrix.target, '-linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --bin oml --target "$TARGET"
      - name: Package, after the binary prints the tag's version
        run: |
          exe=""
          [ "${TARGET%-windows-msvc}" != "$TARGET" ] && exe=".exe"
          bin="target/$TARGET/release/oml$exe"
          got="$("$bin" --version | tr -d '\r')"
          [ "$got" = "oml $VERSION" ] || { echo "$TARGET: '$got', expected 'oml $VERSION'" >&2; exit 1; }
          if [ "${TARGET%-linux-musl}" != "$TARGET" ]; then
            # A static binary has no program interpreter to load it.
            if readelf -l "$bin" | grep -q INTERP; then echo "$TARGET: not static" >&2; exit 1; fi
          fi
          name="oml-cli-${VERSION}-${TARGET}"
          mkdir -p "dist/$name"
          cp "$bin" README.md LICENSE "dist/$name/"
          cp -r LICENSES "dist/$name/"
          if [ -n "$exe" ]; then
            (cd dist && 7z a -tzip "$name.zip" "$name" >/dev/null)
          else
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          fi
          rm -rf "dist/$name"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  server:
    name: oml-server-lead, ${{ matrix.target }}
    needs: version
    strategy:
      matrix:
        # Ubuntu 22.04's glibc, the oldest the listed runners carry, so the
        # binary loads on the widest set of glibc distributions.
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
      - run: cargo build --release --locked --bin oml-server-lead --target "$TARGET"
      - name: Package
        run: |
          name="oml-server-lead-${VERSION}-${TARGET}"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/oml-server-lead" README.md LICENSE "dist/$name/"
          cp -r LICENSES "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  lakewriter:
    name: oml-lakewriter, ${{ matrix.target }}
    needs: version
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
      - run: cargo build --release --locked --bin oml-lakewriter --target "$TARGET"
      - name: Package
        run: |
          name="oml-lakewriter-${VERSION}-${TARGET}"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/oml-lakewriter" README.md LICENSE "dist/$name/"
          cp -r LICENSES "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"
      - uses: actions/upload-artifact@v4
        with:
          name: lakewriter-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # The agent artifacts: plain files, so one runner writes them all
  # (scripts/package_agent_artifacts.py; docs/engineering/ci-and-toolchain.md
  # "Release artifacts"). The pinned marketplace names this tag and its commit.
  agents:
    name: Claude Code plugins and the agent kit
    needs: version
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Package, after the kit check passes
        run: |
          python scripts/check_agent_kit.py
          python scripts/package_agent_artifacts.py --out dist --version "$VERSION" \
            --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: agents-all
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # The landing site: static files Caddy serves, built from site/src/ and the
  # design system's outputs (site/README.md). The check proves the committed
  # site/dist/ is what the sources build, so the archive is the tag's sources.
  site:
    name: landing site archive
    needs: version
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Package, after site/dist is shown to match its sources
        run: |
          python scripts/gen_design_tokens.py --check
          python site/build.py --check
          name="oml-site-${VERSION}"
          mkdir -p "dist/$name"
          cp site/dist/* "dist/$name/"
          cp LICENSE LICENSE-docs "dist/$name/"
          tar -C dist --sort=name --owner=0 --group=0 --numeric-owner -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"
      - uses: actions/upload-artifact@v4
        with:
          name: site-all
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # One job signs everything, so every bundle carries this workflow's identity
  # from one runner, and SHA256SUMS is written once the set is complete.
  binaries:
    name: SBOMs, SHA256SUMS, signatures
    needs: [version, cli, server, lakewriter, agents, site]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CLI_TARGETS: >-
        x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-pc-windows-msvc
      SERVER_TARGETS: x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
      LAKEWRITER_TARGETS: x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx
      - uses: sigstore/cosign-installer@v3
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "{cli,server,lakewriter,agents,site}-*"
          merge-multiple: true
      - name: Every archive is here, and nothing else
        run: |
          want=""
          for t in $CLI_TARGETS; do
            case "$t" in
              *-windows-msvc) want="$want oml-cli-${VERSION}-$t.zip" ;;
              *) want="$want oml-cli-${VERSION}-$t.tar.gz" ;;
            esac
          done
          for t in $SERVER_TARGETS; do want="$want oml-server-lead-${VERSION}-$t.tar.gz"; done
          for t in $LAKEWRITER_TARGETS; do want="$want oml-lakewriter-${VERSION}-$t.tar.gz"; done
          want="$want oml-claude-plugins-${VERSION}.tar.gz oml-claude-plugins-${VERSION}.zip"
          want="$want oml-agent-kit-${VERSION}.tar.gz oml-agent-kit-${VERSION}.zip"
          want="$want oml-marketplace-${VERSION}.json"
          want="$want oml-site-${VERSION}.tar.gz"
          diff <(printf '%s\n' $want | sort) <(ls dist | sort)
      - name: One SBOM per archive, for its own target's dependency graph
        run: |
          # cargo-cyclonedx writes one SBOM per crate beside its manifest;
          # --target keeps the dependencies that target compiles.
          for t in $CLI_TARGETS; do
            cargo cyclonedx --format json --override-filename sbom --target "$t"
            cp crates/bins/oml-cli/sbom.json "dist/oml-cli-${VERSION}-$t.cdx.json"
          done
          for t in $SERVER_TARGETS; do
            cargo cyclonedx --format json --override-filename sbom --target "$t"
            cp crates/bins/oml-server-lead/sbom.json "dist/oml-server-lead-${VERSION}-$t.cdx.json"
          done
          for t in $LAKEWRITER_TARGETS; do
            cargo cyclonedx --format json --override-filename sbom --target "$t"
            cp crates/bins/oml-lakewriter/sbom.json "dist/oml-lakewriter-${VERSION}-$t.cdx.json"
          done
          (cd dist && sha256sum ./*.tar.gz ./*.zip ./*.cdx.json ./oml-marketplace-*.json > SHA256SUMS)
      - name: Sign (keyless, bound to this workflow)
        run: |
          cd dist
          for f in *.tar.gz *.zip *.cdx.json oml-marketplace-*.json SHA256SUMS; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  image:
    name: container image, ${{ matrix.platform }}
    needs: version
    strategy:
      matrix:
        # Each platform on a native runner. Should ubuntu-24.04-arm not serve
        # this repository, give the arm64 leg runner ubuntu-24.04: the QEMU
        # step then emulates it (docs/engineering/ci-and-toolchain.md).
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: X64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: ARM64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: QEMU, only on a runner not native to the platform
        if: runner.arch != matrix.arch
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
      # The image build has no .git, so the commit /readyz reports comes in
      # as build arguments (Dockerfile; docs/api/http-api.md "Health").
      - id: commit
        run: echo "time=$(TZ=UTC git show -s --date=format-local:%Y-%m-%dT%H:%M:%SZ --format=%cd HEAD)" >> "$GITHUB_OUTPUT"
      # Pushed by digest, untagged: the merge job tags the index, never a leg.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            OML_BUILD_COMMIT=${{ github.sha }}
            OML_BUILD_COMMIT_TIME=${{ steps.commit.outputs.time }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: image index, signed
    needs: [version, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    outputs:
      digest: ${{ steps.index.outputs.digest }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Assemble the index from the per-platform digests
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046 # one -t per tag, one source per digest
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)
      - id: index
        name: Assert both platforms are in the index
        run: |
          DIGEST="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)"
          docker buildx imagetools inspect --raw "$IMAGE@$DIGEST" \
            | jq -e '[.manifests[].platform|select(.os=="linux")|.architecture]|(index("amd64")!=null and index("arm64")!=null)'
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@v3
      # One signature on the index digest, and one on each platform image in it,
      # so the cosign verify of the release notes covers both architectures.
      - name: Sign the index by digest
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: cosign sign --yes --recursive "${IMAGE}@${DIGEST}"

  publish:
    name: GitHub release
    needs: [version, binaries, merge]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      DIGEST: ${{ needs.merge.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Release notes
        run: |
          identity='^https://github.com/${{ github.repository }}/\.github/workflows/release\.yml@refs/tags/.*$'
          cat > notes.md <<EOF
          ## Install

          Docker (Postgres + oml-server):

              curl -fsSLO https://raw.githubusercontent.com/${{ github.repository }}/v${VERSION}/docker-compose.yml
              OML_VERSION=${VERSION} docker compose up -d

          Then follow the quickstart in the README to claim the server and issue keys.

          On a new volume, compose creates two database roles: \`oml_owner\`, which owns the
          database and runs the migrations through \`OML_POSTGRES__OWNER_URL\`, and
          \`oml_server\`, which owns nothing and serves through \`OML_POSTGRES__URL\`. Postgres
          runs its init scripts only on an empty volume, so a volume an earlier release
          created holds neither role: split it once before this release starts, as decision d7 of
          https://e8kor.github.io/open-memory-lab/adr/ADR-0034-the-lead-serves-as-a-role-that-owns-nothing/
          describes. The server refuses to start while both URLs log in as one role.

          The agent plugin for Claude Code:

              claude plugin marketplace add ${{ github.repository }}
              claude plugin install oml@open-memory-lab

          To install exactly this release, pin the marketplace to its tag with
          \`claude plugin marketplace add ${{ github.repository }}#v${VERSION}\`, or verify
          \`oml-marketplace-${VERSION}.json\`, whose sources are this repository at \`v${VERSION}\`
          and its commit, and add it from a directory:

              mkdir -p oml-marketplace/.claude-plugin
              cp oml-marketplace-${VERSION}.json oml-marketplace/.claude-plugin/marketplace.json
              claude plugin marketplace add ./oml-marketplace

          Offline: verify and extract \`oml-claude-plugins-${VERSION}.tar.gz\` (or \`.zip\`), then
          \`claude plugin marketplace add ./oml-claude-plugins-${VERSION}\` and install as above.

          Other agent tools: \`oml-agent-kit-${VERSION}.tar.gz\` (or \`.zip\`) holds MCP
          configurations for OpenAI Codex CLI, Cursor, Gemini CLI, VS Code and Claude Desktop,
          an AGENTS.md block, and a Gemini CLI session-start hook; its README says what each
          tool's documentation does and does not settle.

          Image: \`${IMAGE}:${VERSION}\` (\`${IMAGE}@${DIGEST}\`), one index for
          linux/amd64 and linux/arm64.

          The \`oml\` CLI: \`oml-cli-${VERSION}-<target>.tar.gz\` for x86_64-unknown-linux-musl,
          aarch64-unknown-linux-musl (static, any distribution), and
          \`oml-cli-${VERSION}-x86_64-pc-windows-msvc.zip\`. No macOS build in this release: macOS
          targets are paused; on a Mac, build the CLI from source with \`cargo install\`.
          The server: \`oml-server-lead-${VERSION}-<target>.tar.gz\` for x86_64-unknown-linux-gnu
          and aarch64-unknown-linux-gnu.
          The lake writer, a separate service run on its own (docs/operations/lake.md):
          \`oml-lakewriter-${VERSION}-<target>.tar.gz\` for x86_64-unknown-linux-gnu and
          aarch64-unknown-linux-gnu.
          The landing site, static files for a web server (site/README.md):
          \`oml-site-${VERSION}.tar.gz\`.

          ## Verify

          Every archive, SBOM, the pinned marketplace and \`SHA256SUMS\` here, and the image, are
          signed keyless by this release workflow; the image's signature is on the index digest, and each platform image
          is signed too:

              cosign verify \\
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \\
                --certificate-identity-regexp '${identity}' \\
                ${IMAGE}@${DIGEST}

          Verify an archive, then extract it (Linux):

              cosign verify-blob \\
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \\
                --certificate-identity-regexp '${identity}' \\
                --bundle oml-cli-${VERSION}-x86_64-unknown-linux-musl.tar.gz.sigstore.json \\
                oml-cli-${VERSION}-x86_64-unknown-linux-musl.tar.gz
              tar -xzf oml-cli-${VERSION}-x86_64-unknown-linux-musl.tar.gz

          On Windows, in PowerShell:

              cosign verify-blob \`
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \`
                --certificate-identity-regexp '${identity}' \`
                --bundle oml-cli-${VERSION}-x86_64-pc-windows-msvc.zip.sigstore.json \`
                oml-cli-${VERSION}-x86_64-pc-windows-msvc.zip
              Expand-Archive oml-cli-${VERSION}-x86_64-pc-windows-msvc.zip -DestinationPath .

          \`SHA256SUMS\` lists every archive, SBOM and the pinned marketplace; verify its bundle the
          same way, then \`sha256sum --check --ignore-missing SHA256SUMS\`.

          Each binary has a CycloneDX SBOM (\`*.cdx.json\`), generated from the committed Cargo.lock.
          EOF
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Open Memory Lab ${VERSION}" \
            --notes-file notes.md \
            --verify-tag

  # The Helm chart (docs/adr/ADR-0033-interim-helm-chart.md d10): packaged at
  # the tag's version, signed keyless like every other artifact here, and
  # attached to the release the publish job created.
  chart:
    name: helm chart, packaged and signed
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.22.1
      - uses: sigstore/cosign-installer@v3
      - name: The chart's version and appVersion are the tag
        run: |
          chart="$(helm show chart deploy/helm/oml)"
          version="$(awk '/^version:/ {print $2}' <<<"$chart")"
          app="$(awk '/^appVersion:/ {gsub(/"/, "", $2); print $2}' <<<"$chart")"
          if [ "$version" != "$VERSION" ] || [ "$app" != "$VERSION" ]; then
            echo "tag $VERSION, chart version $version, appVersion $app: all three must agree" >&2
            exit 1
          fi
      - name: Package
        run: |
          helm lint --strict deploy/helm/oml
          helm package deploy/helm/oml --destination chart
          test -f "chart/oml-${VERSION}.tgz"
      - name: Sign (keyless, bound to this workflow)
        run: cosign sign-blob --yes --bundle "chart/oml-${VERSION}.tgz.sigstore.json" "chart/oml-${VERSION}.tgz"
      - uses: actions/upload-artifact@v4
        with:
          name: chart
          path: chart/

  chart-release:
    name: helm chart attached to the GitHub release
    needs: [version, merge, chart, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      DIGEST: ${{ needs.merge.outputs.digest }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chart
          path: chart
      - name: Upload the chart and its signature bundle
        run: |
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            "chart/oml-${VERSION}.tgz" "chart/oml-${VERSION}.tgz.sigstore.json"
      - name: The release notes name the chart
        run: |
          identity='^https://github.com/${{ github.repository }}/\.github/workflows/release\.yml@refs/tags/.*$'
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/oml-${VERSION}.tgz"
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          cat >> notes.md <<EOF

          ## Kubernetes

          The Helm chart runs this release's one lead, with Postgres you bring through a Secret
          that holds two URLs: \`OML_POSTGRES__OWNER_URL\` for the role that owns the database and
          runs the migrations, and \`OML_POSTGRES__URL\` for the role the lead serves under, which
          owns nothing. Each role holds LOGIN alone:

              kubectl create namespace oml
              kubectl --namespace oml create secret generic oml-postgres \\
                --from-literal=OML_POSTGRES__URL='postgres://SERVING_ROLE:PASSWORD@HOST:5432/DATABASE' \\
                --from-literal=OML_POSTGRES__OWNER_URL='postgres://OWNER_ROLE:PASSWORD@HOST:5432/DATABASE'
              helm install oml ${url} \\
                --namespace oml --create-namespace --set image.digest=${DIGEST}

          Claim the first admin key through \`kubectl port-forward\` before you enable any Ingress;
          the install notes print the commands. Verify the archive before installing it:

              cosign verify-blob \\
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \\
                --certificate-identity-regexp '${identity}' \\
                --bundle oml-${VERSION}.tgz.sigstore.json \\
                oml-${VERSION}.tgz
          EOF
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
