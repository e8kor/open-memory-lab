name: Release

# A release is a set of verifiable artifacts, not a tag
# (docs/engineering/ci-and-toolchain.md "Release artifacts"). One tag vX.Y.Z,
# equal to the workspace version, ships:
#   - oml-X.Y.Z-x86_64-linux.tar.gz (oml-server-lead + oml), its CycloneDX SBOM
#     and a SHA-256 sum, each signed keyless with cosign;
#   - ghcr.io/e8kor/open-memory-lab:X.Y.Z (and :latest), one image index for
#     linux/amd64 and linux/arm64, each built on a native runner with buildx SBOM
#     and provenance attestations, the index signed by digest;
#   - the `oml` agent plugin, whose marketplace is this repository at the tag.
# The verification command the release notes carry is the one that page
# states; this file's path is the identity it pins.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  version:
    name: tag equals the workspace version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(python3 -c 'import tomllib;print(tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"])')"
          plugin="$(python3 -c 'import json;print(json.load(open("plugins/oml/.claude-plugin/plugin.json"))["version"])')"
          if [ "$tag" != "$crate" ] || [ "$tag" != "$plugin" ]; then
            echo "tag $tag, workspace $crate, plugin $plugin: all three must agree" >&2
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  binaries:
    name: linux binaries, SBOM, signatures
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx
      - uses: sigstore/cosign-installer@v3
      - run: cargo build --release --locked --bin oml-server-lead --bin oml
      - name: Package
        run: |
          name="oml-${VERSION}-x86_64-linux"
          mkdir -p "dist/$name"
          cp target/release/oml-server-lead target/release/oml README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"
          # One SBOM per crate, written beside its manifest; ship the two binaries'.
          cargo cyclonedx --format json --override-filename sbom
          cp crates/bins/oml-server-lead/sbom.json "dist/oml-server-lead-${VERSION}.cdx.json"
          cp crates/bins/oml-cli/sbom.json "dist/oml-${VERSION}.cdx.json"
          (cd dist && sha256sum ./*.tar.gz ./*.cdx.json > SHA256SUMS)
      - name: Sign (keyless, bound to this workflow)
        run: |
          cd dist
          for f in *.tar.gz *.cdx.json SHA256SUMS; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  image:
    name: container image, ${{ matrix.platform }}
    needs: version
    strategy:
      matrix:
        # Each platform on a native runner. Should ubuntu-24.04-arm not serve
        # this repository, give the arm64 leg runner ubuntu-24.04: the QEMU
        # step then emulates it (docs/engineering/ci-and-toolchain.md).
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: X64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: ARM64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: QEMU, only on a runner not native to the platform
        if: runner.arch != matrix.arch
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
      # Pushed by digest, untagged: the merge job tags the index, never a leg.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: image index, signed
    needs: [version, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    outputs:
      digest: ${{ steps.index.outputs.digest }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Assemble the index from the per-platform digests
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046 # one -t per tag, one source per digest
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)
      - id: index
        name: Assert both platforms are in the index
        run: |
          DIGEST="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)"
          docker buildx imagetools inspect --raw "$IMAGE@$DIGEST" \
            | jq -e '[.manifests[].platform|select(.os=="linux")|.architecture]|(index("amd64")!=null and index("arm64")!=null)'
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@v3
      # One signature on the index digest, and one on each platform image in it,
      # so the cosign verify of the release notes covers both architectures.
      - name: Sign the index by digest
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: cosign sign --yes --recursive "${IMAGE}@${DIGEST}"

  publish:
    name: GitHub release
    needs: [version, binaries, merge]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      DIGEST: ${{ needs.merge.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Release notes
        run: |
          identity='^https://github.com/${{ github.repository }}/\.github/workflows/release\.yml@refs/tags/.*$'
          cat > notes.md <<EOF
          ## Install

          Docker (Postgres + oml-server):

              curl -fsSLO https://raw.githubusercontent.com/${{ github.repository }}/v${VERSION}/docker-compose.yml
              OML_VERSION=${VERSION} docker compose up -d

          Then follow the quickstart in the README to claim the server and issue keys.

          The agent plugin for Claude Code:

              claude plugin marketplace add ${{ github.repository }}
              claude plugin install oml@open-memory-lab

          Image: \`${IMAGE}:${VERSION}\` (\`${IMAGE}@${DIGEST}\`), one index for
          linux/amd64 and linux/arm64. The binary tarball is x86_64-linux only; on arm64,
          run the image.

          ## Verify

          Every artifact here and the image are signed keyless by this release workflow;
          the image's signature is on the index digest, and each platform image is signed too:

              cosign verify \\
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \\
                --certificate-identity-regexp '${identity}' \\
                ${IMAGE}@${DIGEST}

              cosign verify-blob \\
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \\
                --certificate-identity-regexp '${identity}' \\
                --bundle oml-${VERSION}-x86_64-linux.tar.gz.sigstore.json \\
                oml-${VERSION}-x86_64-linux.tar.gz

          Each binary has a CycloneDX SBOM (\`*.cdx.json\`), generated from the committed Cargo.lock.
          EOF
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Open Memory Lab ${VERSION}" \
            --notes-file notes.md \
            --verify-tag
