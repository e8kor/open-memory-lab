name: Recall benchmark

# The recall benchmark (eval/bench/README.md): the synthetic set and BEIR
# SciFact through the served oml_read, once per search pipeline. Weekly and on
# demand, never on a pull request: it downloads a third-party dataset (2.7 MB,
# CC BY-NC 2.0, cached between runs and never committed) and takes about ten
# minutes beyond the build. It reports and does not gate; the merge gate for
# recall stays the recall-eval job in ci.yml (ADR-0049 d9).

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      datasets:
        description: "datasets, space-separated (eval/bench/adapters.py ADAPTERS)"
        default: "synthetic scifact"

permissions:
  contents: read

jobs:
  bench:
    name: recall benchmark per search pipeline (served)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: oml
          POSTGRES_PASSWORD: oml_dev_only
          POSTGRES_DB: oml_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oml -d oml_dev"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - run: cargo build --release --locked --bin oml-server-lead --bin oml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --retries 5 --timeout 30 -r eval/bench/requirements.txt
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/bench-data
          key: bench-data-${{ hashFiles('eval/bench/adapters.py') }}
      - name: Run
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: oml
          PGPASSWORD: oml_dev_only
          BENCH_CACHE: ${{ runner.temp }}/bench-data
          BENCH_PYTHON: python
          # The five pipelines the booted lead serves without a model (eval/bench/boot.sh); bm25-rerank
          # and the sparse ones need model files this job does not fetch (eval/bench/README.md).
          BENCH_PIPELINES: keyword-all keyword-any bm25 bm25-trigram bm25-postings
          DATASETS: ${{ inputs.datasets || 'synthetic scifact' }}
        # shellcheck disable=SC2086 # one dataset per word
        run: bash eval/bench/run.sh "$RUNNER_TEMP/bench" $DATASETS
      - name: Export (oml-bench/1)
        env:
          BENCH_CACHE: ${{ runner.temp }}/bench-data
        run: >-
          python eval/bench/export.py --raw "$RUNNER_TEMP/bench" --commit "${GITHUB_SHA::7}"
          --date "$(date -u +%F)" --postgres 17 --host "GitHub ubuntu-latest"
          --cache "$BENCH_CACHE" --out "$RUNNER_TEMP/bench/oml-bench"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: recall-bench-results
          path: |
            ${{ runner.temp }}/bench/*.json
            ${{ runner.temp }}/bench/tables.md
            ${{ runner.temp }}/bench/oml-bench/

  # The timing halves of tests 7 and 4 (ADR-0072 d6, d13): wall-clock times
  # move with the host's load, so they run here, weekly and off the gating
  # suite, which keeps the deterministic halves: the same answers and the
  # same work, rows or tuples read, with and without the unreadable rows
  # (#278), and with an unreadable list name as with an absent one (#295).
  # A failure here is a measurement to read, not a red pull request.
  timing:
    name: federated recall timing measurements (tests 7 and 4)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: oml
          POSTGRES_PASSWORD: oml_dev_only
          POSTGRES_DB: oml_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oml -d oml_dev"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://oml:oml_dev_only@127.0.0.1:5432/oml_dev
      OML_TEST_REQUIRE_SPLIT: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - run: cargo test --locked -p oml-pg --test federation_timing -- --ignored --exact federated_recall_timing_does_not_depend_on_an_unreadable_workarea --nocapture
      - run: cargo test --locked -p oml-port-contracts --test doubles -- --ignored --exact federated_recall_double_timing_does_not_depend_on_an_unreadable_workarea --nocapture
      - run: cargo test --locked -p oml-pg --test federation_timing -- --ignored --exact a_lists_unreadable_name_refusal_takes_the_time_of_an_absent_names_refusal --nocapture
      - run: cargo test --locked -p oml-port-contracts --test doubles -- --ignored --exact a_lists_unreadable_name_refusal_takes_the_time_of_an_absent_names_refusal --nocapture
