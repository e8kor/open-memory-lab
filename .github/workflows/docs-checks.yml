name: Docs checks

# PR gate for the documentation set: the site must build clean under --strict,
# the generated benchmark pages must match the committed results, the three
# API contract surfaces (errors.md, openapi.yaml, http-api.md) must agree, and
# openapi.yaml must be a valid OpenAPI document, and the reference pages generated from
# the code and the contracts (CLI, HTTP API, MCP tools, settings, design records, the
# PostgreSQL schema) must match their sources. Deploy stays in
# pages.yml; this workflow never publishes anything.

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-checks-${{ github.ref }}
  # A new push to a pull request replaces its stale run; main, merge groups and tags always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which categories of path the pull request changed (scripts/ci_paths.py;
  # docs/contributing/ci-and-toolchain.md, "Which jobs a change runs"). A push,
  # a merge group, a pull request into another branch, a change to .github/,
  # Cargo.lock, rust-toolchain.toml or scripts/, and a path in no category all
  # turn every category on.
  changes:
    name: changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
      migrations: ${{ steps.paths.outputs.migrations }}
      api: ${{ steps.paths.outputs.api }}
      docs: ${{ steps.paths.outputs.docs }}
      cli_ref: ${{ steps.paths.outputs.cli_ref }}
      plugins: ${{ steps.paths.outputs.plugins }}
      sdk: ${{ steps.paths.outputs.sdk }}
      eval: ${{ steps.paths.outputs.eval }}
      release: ${{ steps.paths.outputs.release }}
      spikes: ${{ steps.paths.outputs.spikes }}
      schema_page: ${{ steps.paths.outputs.schema_page }}
      ci: ${{ steps.paths.outputs.ci }}
      cargo: ${{ steps.paths.outputs.cargo }}
      docs_tests: ${{ steps.paths.outputs.docs_tests }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: paths
        shell: bash  # -eo pipefail: a crashing classifier fails this job and so "ci ok"
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci_paths.py --event "$EVENT" --base-ref "$BASE_REF" --base "$BASE_SHA" --head "$HEAD_SHA" | tee -a "$GITHUB_OUTPUT"

  build-strict:
    name: mkdocs build --strict
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --retries 5 --timeout 30 -r requirements.txt
      - run: mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"

  bench-pages:
    name: benchmark pages match their results
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.eval == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # Standard library only: the pages are generated from the committed
      # oml-bench/1 results, and differ only when someone edited one side.
      - run: python scripts/gen_bench_pages.py --check

  contract-sync:
    name: contract surfaces agree
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.cargo == 'true' || needs.changes.outputs.plugins == 'true' || needs.changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --retries 5 --timeout 30 pyyaml==6.0.3
      - run: python scripts/check_contract_sync.py

  openapi-valid:
    name: openapi.yaml validates
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --retries 5 --timeout 30 openapi-spec-validator==0.9.0
      - run: openapi-spec-validator docs/api/openapi.yaml docs/api/openapi-designed.yaml

  remember-eval-data:
    name: remember eval data and offline run
    needs: changes
    if: needs.changes.outputs.eval == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -I eval/remember/run.py --check
      - run: python -I eval/remember/run.py

  generated-references:
    name: generated reference pages match their sources
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --retries 5 --timeout 30 pyyaml==6.0.3
      # openapi.yaml, mcp-tools.json, the KEY_* constants and the design records.
      - run: python scripts/gen_http_api_reference.py --check
      - run: python scripts/gen_mcp_reference.py --check
      - run: python scripts/gen_settings_reference.py --check
      - run: python scripts/gen_design_records.py --check

  schema-page:
    name: PostgreSQL schema page matches the migrations
    needs: changes
    if: needs.changes.outputs.schema_page == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # The deployment pin (docs/operations/deployment.md), as in ci.yml's Postgres jobs.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: oml
          POSTGRES_PASSWORD: oml_dev_only
          POSTGRES_DB: oml_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oml -d oml_dev"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # Standard library and the runner's psql: the page is read from the catalog after
      # migrations/ ran, so a page that differs prints the difference into this log.
      - run: psql --version
      # POSTGRES_USER is the container's superuser; the script mints and drops its own
      # database and roles, as the Postgres suites do (ADR-0034 d8).
      - run: python scripts/gen_postgres_schema.py --check
        env:
          OML_SCHEMA_DATABASE_URL: postgres://oml:oml_dev_only@127.0.0.1:5432/oml_dev
      - run: python -m unittest scripts/tests/test_postgres_schema_page.py
        env:
          OML_SCHEMA_DATABASE_URL: postgres://oml:oml_dev_only@127.0.0.1:5432/oml_dev

  cli-reference:
    name: CLI reference matches the oml binary's help
    needs: changes
    if: needs.changes.outputs.cargo == 'true' || needs.changes.outputs.cli_ref == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Reads rust-toolchain.toml: the one pinned toolchain.
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: cargo build -p oml-cli --locked
      - run: python scripts/gen_cli_reference.py --oml target/debug/oml --check

  # The one check to require: it succeeds when every job above succeeded or was
  # skipped by the filter, and fails when one failed or was cancelled.
  ci-ok:
    name: ci ok (docs)
    if: always()
    needs: [changes, build-strict, bench-pages, contract-sync, openapi-valid, remember-eval-data, generated-references, schema-page, cli-reference]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every job succeeded or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "a job finished: $r" >&2; exit 1 ;; esac
          done
