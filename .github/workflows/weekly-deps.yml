name: Weekly dependency pass

# Once a week: cargo deny, cargo audit, npm audit for the JavaScript that ships, the scanner's
# rule tests and the pinned actions that have a newer tag. The findings go to one issue, opened
# or updated in place. The job reports and never fails main.

on:
  schedule:
    # Wednesday 04:23 UTC, which is Tuesday evening in Pacific time, outside 06:00-09:00 PT.
    - cron: "23 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: weekly-deps
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never

jobs:
  pass:
    name: dependency pass
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny,cargo-audit
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      # check_action_updates.py reads the pins as the lint does, by parsing each workflow.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --retries 5 --timeout 30 pyyaml==6.0.3
      - name: Run the checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .tmp/weekly
          run() { # name, command...
            local n="$1"; shift
            if "$@" > ".tmp/weekly/$n.log" 2>&1; then echo "ok" > ".tmp/weekly/$n.status"; else echo "findings" > ".tmp/weekly/$n.status"; fi
          }
          run cargo-deny cargo deny check
          run cargo-audit cargo audit
          # Rules are compiled in; this picks up every test of the scanner by name.
          run scanner-rules cargo test --locked -p oml-domain -p oml-app -p oml-guardrail scan
          # A pinned action that is not its tag's commit, or has a newer tag of its own major, is a
          # finding; a newer major only prints. The log is printed here whatever the check returned:
          # the issue shows a log only for a finding, and the newer-major lines come with exit 0.
          run action-pins python3 scripts/check_action_updates.py
          cat .tmp/weekly/action-pins.log
          for lock in $(git ls-files '*package-lock.json' | grep -v node_modules); do
            d="$(dirname "$lock")"
            run "npm-audit-$(echo "$d" | tr '/' '-')" bash -c "cd '$d' && npm audit --omit=dev"
          done
      - name: Open or update the issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Weekly dependency pass"
          body=".tmp/weekly/body.md"
          bad=0
          {
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} ($(date -u +%F))"
            echo
            for s in .tmp/weekly/*.status; do
              n="$(basename "$s" .status)"
              if [ "$(cat "$s")" = findings ]; then
                bad=1
                echo "### $n: findings"
                echo '```'
                tail -n 60 ".tmp/weekly/$n.log"
                echo '```'
              else
                echo "### $n: ok"
              fi
            done
          } > "$body"
          num="$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq "[.[] | select(.title==\"$title\")][0].number // empty")"
          if [ -n "$num" ]; then
            gh issue edit "$num" --body-file "$body"
            [ "$bad" = 0 ] && gh issue comment "$num" --body "Latest pass: no findings." || true
          elif [ "$bad" = 1 ]; then
            gh issue create --title "$title" --body-file "$body"
          fi
          cat "$body" >> "$GITHUB_STEP_SUMMARY"
