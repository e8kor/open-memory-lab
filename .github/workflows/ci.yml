name: CI

# The merge gates of docs/engineering/ci-and-toolchain.md for the code, plus
# the two end-to-end paths a user takes: the release binaries (the PoC demo
# and the quickstart) and the docker profile (docker-compose.yml), and the
# release image built and run on each of its platforms. Docs keep their own
# gate in docs-checks.yml.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The integration suites create and drop throwaway databases through this
  # role (crates/adapters/oml-pg/tests/pg_store.rs).
  DATABASE_URL: postgres://oml:oml_dev_only@127.0.0.1:5432/oml_dev

jobs:
  lint:
    name: fmt, clippy, doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Reads rust-toolchain.toml: the one pinned toolchain.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: cargo test (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        # The deployment pin (docs/operations/deployment.md).
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: oml
          POSTGRES_PASSWORD: oml_dev_only
          POSTGRES_DB: oml_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oml -d oml_dev"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      # POSTGRES_USER is the container's superuser, so every Postgres suite
      # mints its owner/serving role pair; a suite that cannot fails here
      # rather than printing its did-not-run line (ADR-0034 d8).
      - run: cargo test --workspace --locked
        env:
          OML_TEST_REQUIRE_SPLIT: "1"

  e2e:
    name: demo and quickstart (release binaries)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: oml
          POSTGRES_PASSWORD: oml_dev_only
          POSTGRES_DB: oml_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oml -d oml_dev"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo build --release --locked --bin oml-server-lead --bin oml
      # POSTGRES_USER is the container's superuser, so the demo mints and
      # drops its own uniquely named role pair (ADR-0034 d8).
      - name: PoC demo
        run: bash scripts/poc-demo.sh
      # The service container is this job's own cluster, so the pair takes
      # the fixed names (ADR-0034 d2): the lead migrates as oml_owner and
      # serves as oml_server.
      - name: Quickstart, then the agent plugin over /mcp
        env:
          PGPASSWORD: oml_dev_only
        run: |
          state="$RUNNER_TEMP/quickstart"
          mkdir -p "$state"
          psql -h 127.0.0.1 -U oml -d oml_dev -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE oml_owner LOGIN PASSWORD 'oml_dev_only'" \
            -c "CREATE ROLE oml_server LOGIN PASSWORD 'oml_dev_only'" \
            -c "CREATE DATABASE oml_quickstart OWNER oml_owner"
          OML_POSTGRES__URL=postgres://oml_server:oml_dev_only@127.0.0.1:5432/oml_quickstart \
          OML_POSTGRES__OWNER_URL=postgres://oml_owner:oml_dev_only@127.0.0.1:5432/oml_quickstart \
          OML_SERVER__LISTEN=127.0.0.1:8080 \
          OML_KMS__KEYRING_PATH="$state/keyring" \
            ./target/release/oml-server-lead >"$state/stdout" 2>"$state/stderr" &
          for _ in $(seq 1 50); do
            grep -q 'enr_' "$state/stdout" 2>/dev/null && break
            sleep 0.2
          done
          OML_ENROLLMENT_TOKEN="$(grep -o 'enr_[0-9a-f]\{48\}' "$state/stdout" | head -1)"
          export OML_ENROLLMENT_TOKEN
          OML_CLI=./target/release/oml OML_CLI_CREDENTIALS="$state/credentials" \
            bash scripts/quickstart.sh || { tail -n 50 "$state/stderr"; exit 1; }

  compose:
    name: docker profile (compose up, quickstart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start
        run: docker compose up -d --build
      - name: Quickstart inside the container
        run: bash scripts/quickstart.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down -v

  image:
    name: release image (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        # The release workflow's native runners (release.yml, job image).
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: matrix.platform == 'linux/amd64'
        with:
          python-version: "3.12"
      - name: release.yml builds, merges and signs both platforms
        if: matrix.platform == 'linux/amd64'
        run: |
          pip install pyyaml
          python scripts/check_release.py
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: oml:ci
      - name: The image's oml prints the workspace version
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          want="oml $(python3 -c 'import tomllib;print(tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"])')"
          got="$(docker run --rm --platform "$PLATFORM" --entrypoint /usr/local/bin/oml oml:ci --version)"
          echo "$PLATFORM: $got"
          [ "$got" = "$want" ] || { echo "expected '$want'" >&2; exit 1; }

  # Every CLI target of release.yml (job cli), on the same native runner, so
  # a platform that stops building or testing fails here, before a tag.
  # Unit tests alone: the end-to-end suite needs Postgres, which only the
  # Linux runners serve (job test runs it).
  cli-matrix:
    name: oml CLI (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
      # ring's C, for each musl target, with the wrapper Ubuntu's musl-tools
      # ships for the runner's own architecture. On the arm64 runner cc counts
      # aarch64-unknown-linux-musl as a cross compile and would otherwise call
      # aarch64-linux-musl-gcc, which musl-tools does not ship
      # (packages.ubuntu.com/noble/arm64/musl-tools/filelist, fetched
      # 2026-11-03). The archiver falls back to the host's ar, and Rust links
      # its self-contained musl with the host's cc, both native here.
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
      - name: musl C toolchain
        if: endsWith(matrix.target, '-linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --locked --bin oml --target "$TARGET"
      - name: oml --version prints the workspace version
        run: |
          exe=""
          [ "${TARGET%-windows-msvc}" != "$TARGET" ] && exe=".exe"
          # Read through cargo, which every leg has set up; the pkgid ends in
          # the version after a '#' or an '@'.
          want="oml $(cargo pkgid -p oml-cli | sed 's/.*[#@]//')"
          got="$("target/$TARGET/debug/oml$exe" --version | tr -d '\r')"
          echo "$TARGET: $got"
          [ "$got" = "$want" ] || { echo "expected '$want'" >&2; exit 1; }
      - name: The CLI's unit tests
        run: cargo test --locked -p oml-cli --lib --bins --target "$TARGET"

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  plugin:
    name: agent plugin agrees with the server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_plugin.py
      - run: python scripts/check_agent_kit.py
      # Claude Code's own validator, which errors on a reference to an
      # undeclared option and on an MCP url that is not absolute; 2.1.281 is
      # the first that checks MCP entries (ADR-0040 d2, d5).
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: claude plugin validate --strict
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.312
          claude plugin validate --strict plugins/oml
          claude plugin validate --strict plugins/oml-admin

  chart:
    # The Helm chart (deploy/helm/oml; docs/adr/ADR-0033-interim-helm-chart.md
    # d10): rendered and checked, then installed on kind against Postgres in
    # the cluster, claimed through port-forward before anything else reaches
    # it, driven by the quickstart, then restarted, uninstalled and
    # reinstalled to show the keyring claim keeps the signing key.
    name: kubernetes chart (kind, helm install, quickstart)
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/e8kor/open-memory-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: azure/setup-helm@v4
        with:
          version: v3.22.1
      - name: The chart renders the lead ADR-0033 decides
        run: |
          pip install pyyaml
          python scripts/check_chart.py
      - name: Build the image from the checkout
        run: |
          version="$(python3 -c 'import tomllib;print(tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"])')"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          docker build --tag "$IMAGE:$version" .
      - name: The pod runs as the image's own user
        run: |
          user="$(docker run --rm --entrypoint id "$IMAGE:$VERSION" -u):$(docker run --rm --entrypoint id "$IMAGE:$VERSION" -g)"
          python scripts/check_chart.py --image-user "$user"
      - uses: helm/kind-action@v1
        with:
          cluster_name: oml
      - name: Load the image into kind
        run: kind load docker-image "$IMAGE:$VERSION" --name oml
      # The pod's init script creates the role pair, LOGIN alone, and gives
      # the database to oml_owner; the Secret carries both URLs (ADR-0034 d2,
      # d10 step 2). The probe goes over TCP, which the entrypoint's
      # init-time server does not listen on, so ready means initialised.
      - name: Postgres in the cluster (the deployment pin)
        run: |
          kubectl create namespace oml
          kubectl --namespace oml apply -f - <<'EOF'
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: postgres-init
          data:
            oml-role-pair.sql: |
              CREATE ROLE oml_owner LOGIN PASSWORD 'oml_dev_only';
              CREATE ROLE oml_server LOGIN PASSWORD 'oml_dev_only';
              ALTER DATABASE oml OWNER TO oml_owner;
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: postgres
          spec:
            replicas: 1
            selector:
              matchLabels: {app: postgres}
            template:
              metadata:
                labels: {app: postgres}
              spec:
                containers:
                  - name: postgres
                    image: pgvector/pgvector:pg17
                    env:
                      - {name: POSTGRES_USER, value: oml}
                      - {name: POSTGRES_PASSWORD, value: oml_dev_only}
                      - {name: POSTGRES_DB, value: oml}
                    ports:
                      - containerPort: 5432
                    volumeMounts:
                      - name: init
                        mountPath: /docker-entrypoint-initdb.d
                    readinessProbe:
                      exec:
                        command: [pg_isready, -h, 127.0.0.1, -U, oml, -d, oml]
                      periodSeconds: 2
                volumes:
                  - name: init
                    configMap:
                      name: postgres-init
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: postgres
          spec:
            selector: {app: postgres}
            ports:
              - port: 5432
          EOF
          kubectl --namespace oml rollout status deployment/postgres --timeout=300s
          kubectl --namespace oml create secret generic oml-postgres \
            --from-literal=OML_POSTGRES__URL=postgres://oml_server:oml_dev_only@postgres:5432/oml \
            --from-literal=OML_POSTGRES__OWNER_URL=postgres://oml_owner:oml_dev_only@postgres:5432/oml
      - name: helm install, then wait for readiness
        run: |
          helm install oml deploy/helm/oml --namespace oml \
            --values deploy/helm/oml/ci/kind-values.yaml --wait --timeout 5m
          kubectl --namespace oml rollout status deployment/oml-server-lead --timeout=300s
      - name: Claim the enrollment token through port-forward, then the quickstart
        run: |
          docker create --name oml-cli "$IMAGE:$VERSION" >/dev/null
          docker cp oml-cli:/usr/local/bin/oml "$RUNNER_TEMP/oml"
          docker rm oml-cli >/dev/null
          token="$(kubectl --namespace oml logs deployment/oml-server-lead | grep -o 'enr_[0-9a-f]\{48\}' | tail -1)"
          [ -n "$token" ] || { echo "no enrollment token in the lead's log" >&2; exit 1; }
          kubectl --namespace oml port-forward service/oml-server 8080:8080 >"$RUNNER_TEMP/port-forward.log" 2>&1 &
          forward=$!
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8080/readyz >/dev/null 2>&1 && break
            sleep 1
          done
          OML_URL=http://127.0.0.1:8080 OML_CLI="$RUNNER_TEMP/oml" \
          OML_CLI_CREDENTIALS="$RUNNER_TEMP/credentials" OML_ENROLLMENT_TOKEN="$token" \
            bash scripts/quickstart.sh
          kill "$forward"
      - name: A restarted lead keeps its signing key and prints no new token
        run: |
          public_key() {
            kubectl --namespace oml logs deployment/oml-server-lead \
              | sed 's/\x1b\[[0-9;]*m//g' | grep -o 'public_key=[0-9a-f]*' | tail -1
          }
          before="$(public_key)"
          kubectl --namespace oml rollout restart deployment/oml-server-lead
          kubectl --namespace oml rollout status deployment/oml-server-lead --timeout=300s
          after="$(public_key)"
          echo "before the restart: $before"
          echo "after the restart:  $after"
          if [ -z "$before" ] || [ "$before" != "$after" ]; then
            echo "the restarted lead loaded a different signing key" >&2
            exit 1
          fi
          if kubectl --namespace oml logs deployment/oml-server-lead | grep -q 'enr_'; then
            echo "the claimed deployment printed a new enrollment token" >&2
            exit 1
          fi
          kubectl --namespace oml port-forward service/oml-server 8080:8080 >"$RUNNER_TEMP/port-forward-2.log" 2>&1 &
          forward=$!
          code=""
          for _ in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/readyz || true)"
            [ "$code" = 200 ] && break
            sleep 1
          done
          kill "$forward"
          [ "$code" = 200 ] || { echo "/readyz answered '$code' after the restart" >&2; exit 1; }
      - name: helm uninstall keeps the keyring claim, and a reinstall takes it back
        run: |
          public_key() {
            kubectl --namespace oml logs deployment/oml-server-lead \
              | sed 's/\x1b\[[0-9;]*m//g' | grep -o 'public_key=[0-9a-f]*' | tail -1
          }
          before="$(public_key)"
          helm uninstall oml --namespace oml --wait --timeout 5m
          kubectl --namespace oml get persistentvolumeclaim oml-keyring
          helm install oml deploy/helm/oml --namespace oml \
            --values deploy/helm/oml/ci/kind-values.yaml --wait --timeout 5m
          after="$(public_key)"
          echo "before the reinstall: $before"
          echo "after the reinstall:  $after"
          if [ -z "$before" ] || [ "$before" != "$after" ]; then
            echo "the reinstalled lead loaded a different signing key" >&2
            exit 1
          fi
          if kubectl --namespace oml logs deployment/oml-server-lead | grep -q 'enr_'; then
            echo "the reinstalled lead printed a new enrollment token" >&2
            exit 1
          fi
      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl --namespace oml get all,pvc -o wide || true
          kubectl --namespace oml describe pods || true
          kubectl --namespace oml logs deployment/oml-server-lead --previous || true
          kubectl --namespace oml logs deployment/oml-server-lead || true
          cat "$RUNNER_TEMP"/port-forward*.log || true

  # The client SDKs of docs/engineering/sdks.md: each suite runs against the
  # server built from this checkout, on a throwaway database and role pair it
  # mints and drops itself, and the generated layers must be current with
  # openapi.yaml. POSTGRES_USER is the container's superuser, so a harness
  # that cannot mint fails here rather than printing its did-not-run line
  # (ADR-0034 d8).
  sdk-python:
    name: Python SDK against the release server
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: oml
          POSTGRES_PASSWORD: oml_dev_only
          POSTGRES_DB: oml_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oml -d oml_dev"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo build --release --locked --bin oml-server-lead --bin oml
      - uses: astral-sh/setup-uv@v6
      - name: Lint the hand-written code
        working-directory: sdks/python
        run: |
          uv run --locked --python 3.11 --group generate ruff check src tests
          uv run --locked --python 3.11 --group generate ruff format --check src tests
      - name: pytest on the Python floor
        working-directory: sdks/python
        env:
          OML_SERVER_BIN: ${{ github.workspace }}/target/release/oml-server-lead
          OML_CLI_BIN: ${{ github.workspace }}/target/release/oml
          OML_SDK_TEST_DATABASE_URL: postgres://oml:oml_dev_only@127.0.0.1:5432/oml_dev
          OML_TEST_REQUIRE_SPLIT: "1"
        run: uv run --locked --python 3.11 pytest -v

  sdk-typescript:
    name: TypeScript SDK against the release server
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: oml
          POSTGRES_PASSWORD: oml_dev_only
          POSTGRES_DB: oml_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oml -d oml_dev"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo build --release --locked --bin oml-server-lead --bin oml
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install, type-check and build
        working-directory: sdks/typescript
        run: |
          npm ci
          npm run check
          npm run build
      - name: node --test
        working-directory: sdks/typescript
        env:
          OML_SERVER_BIN: ${{ github.workspace }}/target/release/oml-server-lead
          OML_CLI_BIN: ${{ github.workspace }}/target/release/oml
          OML_SDK_TEST_DATABASE_URL: postgres://oml:oml_dev_only@127.0.0.1:5432/oml_dev
          OML_TEST_REQUIRE_SPLIT: "1"
        run: npm test

  sdk-generated:
    name: generated SDK code is current with openapi.yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
        working-directory: sdks/typescript
      - run: python scripts/generate_sdks.py --check
