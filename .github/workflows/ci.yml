name: CI

# The merge gates of docs/engineering/ci-and-toolchain.md for the code, plus
# the two end-to-end paths a user takes: the release binaries (the PoC demo
# and the quickstart) and the docker profile (docker-compose.yml), and the
# release image built and run on each of its platforms. Docs keep their own
# gate in docs-checks.yml.

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a pull request replaces its stale run; main, merge groups and tags always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The integration suites create and drop throwaway databases through this
  # role (crates/adapters/oml-pg/tests/pg_store.rs).
  DATABASE_URL: postgres://oml:oml_dev_only@127.0.0.1:5432/oml_dev

jobs:
  # Which categories of path the pull request changed (scripts/ci_paths.py;
  # docs/contributing/ci-and-toolchain.md, "Which jobs a change runs"). A push,
  # a merge group, a pull request into another branch, a change to .github/,
  # Cargo.lock, rust-toolchain.toml or scripts/, and a path in no category all
  # turn every category on.
  changes:
    name: changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
      migrations: ${{ steps.paths.outputs.migrations }}
      api: ${{ steps.paths.outputs.api }}
      docs: ${{ steps.paths.outputs.docs }}
      cli_ref: ${{ steps.paths.outputs.cli_ref }}
      plugins: ${{ steps.paths.outputs.plugins }}
      sdk: ${{ steps.paths.outputs.sdk }}
      eval: ${{ steps.paths.outputs.eval }}
      release: ${{ steps.paths.outputs.release }}
      spikes: ${{ steps.paths.outputs.spikes }}
      ci: ${{ steps.paths.outputs.ci }}
      cargo: ${{ steps.paths.outputs.cargo }}
      docs_tests: ${{ steps.paths.outputs.docs_tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        shell: bash  # -eo pipefail: a crashing classifier fails this job and so "ci ok"
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci_paths.py --event "$EVENT" --base-ref "$BASE_REF" --base "$BASE_SHA" --head "$HEAD_SHA" | tee -a "$GITHUB_OUTPUT"

  lint:
    name: fmt, clippy, doc
    needs: changes
    if: needs.changes.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Reads rust-toolchain.toml: the one pinned toolchain.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: cargo test (Postgres)
    needs: changes
    if: needs.changes.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        # The deployment pin (docs/operations/deployment.md).
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: oml
          POSTGRES_PASSWORD: oml_dev_only
          POSTGRES_DB: oml_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oml -d oml_dev"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      # The reranker's pinned files (ADR-0053 d3, d10), cached by revision and
      # fetched with their digests checked when the cache is cold.
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.tmp/oml-models/ms-marco-MiniLM-L6-v2
          key: rerank-ms-marco-MiniLM-L6-v2-233902d25c440f23af6f7d6e94d2946bac0bee0a
      - name: Fetch the reranker's pinned files
        run: bash scripts/fetch_rerank_model.sh ${{ github.workspace }}/.tmp/oml-models/ms-marco-MiniLM-L6-v2
      # The learned sparse encoder's pinned files (ADR-0052 d14), cached by
      # revision and fetched with their digests checked when the cache is cold.
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.tmp/oml-models/doc-v3-distill
          key: sparse-doc-v3-distill-babf71f3c48695e2e53a978208e8aba48335e3c0
      - name: Fetch the sparse encoder's pinned files
        run: bash scripts/fetch_sparse_model.sh ${{ github.workspace }}/.tmp/oml-models/doc-v3-distill
      # POSTGRES_USER is the container's superuser, so every Postgres suite
      # mints its owner/serving role pair; a suite that cannot fails here
      # rather than printing its did-not-run line (ADR-0034 d8).
      - run: cargo test --workspace --locked
        env:
          OML_TEST_REQUIRE_SPLIT: "1"
      # The adapter's real-model tests are ignored without the model; here
      # they run against the cached pinned files (ADR-0053 d10).
      - run: cargo test --locked -p oml-rerank -- --ignored
        env:
          OML_RERANK_MODEL_DIR: ${{ github.workspace }}/.tmp/oml-models/ms-marco-MiniLM-L6-v2
          OML_SPARSE_MODEL_DIR: ${{ github.workspace }}/.tmp/oml-models/doc-v3-distill

  # What a change to docs/ or eval/ alone still owes the Rust tests: the
  # targets that read those files, and nothing else. The full workspace run
  # (job test) covers them whenever the Rust build's own inputs changed too.
  #   oml-scan scan                          every page of docs/ and eval/recall/corpus.json
  #   oml-transport-http a_denial_on_an_admin_key  docs/architecture/roles-and-keys.md
  #   oml-server-lead oauth_endpoints        docs/reference/connect-page.md, word for word
  #   oml-cli cli_e2e the_cli_reference_...  docs/cli/reference.md
  #   oml-cli sync_extraction every_record   every record of docs/adr/
  #   oml-domain near_duplicates             eval/remember/near-duplicates/data.json
  #   oml-lakewriter lake_laws bench_results eval/bench/results
  # None of them starts Postgres. The files outside docs/ and eval/ that Rust
  # reads (docs/api/*.yaml and *.json, migrations/, testing/lake) are in the
  # categories that run job test.
  docs-reading-tests:
    name: cargo test, the targets that read docs and eval
    needs: changes
    if: needs.changes.outputs.docs_tests == 'true' && needs.changes.outputs.cargo != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ""  # none of these targets starts Postgres; a future one that does fails here, not hangs
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo test --locked -p oml-scan --test scan
      - run: cargo test --locked -p oml-transport-http --lib a_denial_on_an_admin_key_names_the_key_field
      - run: cargo test --locked -p oml-server-lead --test oauth_endpoints the_pages_sentences_match_connect_page_md_word_for_word
      - run: cargo test --locked -p oml-cli --test cli_e2e the_cli_reference_lists_every_built_verb
      - run: cargo test --locked -p oml-cli --test sync_extraction every_record_in_docs_adr_extracts_every_decision
      - run: cargo test --locked -p oml-domain --test near_duplicates
      - run: cargo test --locked -p oml-lakewriter --test lake_laws bench_results_load_once_however_often_they_are_loaded

  e2e:
    name: demo and quickstart (release binaries)
    needs: changes
    if: needs.changes.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: oml
          POSTGRES_PASSWORD: oml_dev_only
          POSTGRES_DB: oml_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oml -d oml_dev"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo build --release --locked --bin oml-server-lead --bin oml
      # POSTGRES_USER is the container's superuser, so the demo mints and
      # drops its own uniquely named role pair (ADR-0034 d8).
      - name: PoC demo
        run: bash scripts/poc-demo.sh
        env:
          # Named, never defaulted: the job's own service container.
          PGPORT: "5432"
      # The service container is this job's own cluster, so the pair takes
      # the fixed names (ADR-0034 d2): the lead migrates as oml_owner and
      # serves as oml_server.
      - name: Quickstart, then the agent plugin over /mcp
        env:
          PGPASSWORD: oml_dev_only
        run: |
          state="$RUNNER_TEMP/quickstart"
          mkdir -p "$state"
          psql -h 127.0.0.1 -U oml -d oml_dev -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE oml_owner LOGIN PASSWORD 'oml_dev_only'" \
            -c "CREATE ROLE oml_server LOGIN PASSWORD 'oml_dev_only'" \
            -c "CREATE DATABASE oml_quickstart OWNER oml_owner"
          OML_POSTGRES__URL=postgres://oml_server:oml_dev_only@127.0.0.1:5432/oml_quickstart \
          OML_POSTGRES__OWNER_URL=postgres://oml_owner:oml_dev_only@127.0.0.1:5432/oml_quickstart \
          OML_SERVER__LISTEN=127.0.0.1:8080 \
          OML_KMS__KEYRING_PATH="$state/keyring" \
            ./target/release/oml-server-lead >"$state/stdout" 2>"$state/stderr" &
          for _ in $(seq 1 50); do
            grep -q 'enr_' "$state/stdout" 2>/dev/null && break
            sleep 0.2
          done
          OML_ENROLLMENT_TOKEN="$(grep -o 'enr_[0-9a-f]\{48\}' "$state/stdout" | head -1)"
          export OML_ENROLLMENT_TOKEN
          OML_CLI=./target/release/oml OML_CLI_CREDENTIALS="$state/credentials" \
            bash scripts/quickstart.sh || { tail -n 50 "$state/stderr"; exit 1; }

  # The repository's compose file, then `oml quickstart`'s own (ADR-0041
  # d9): the image built here is tagged with the CLI's version, so the
  # compose file the verb writes, pinned to that version, starts it without
  # a pull.
  compose:
    name: docker profile (compose up, quickstart, oml quickstart)
    needs: changes
    if: needs.changes.outputs.cargo == 'true' || needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      # The docker profile with CI's sign-in double layered on
      # (testing/e2e/compose.e2e.yaml): the image carries the e2e-sign-in
      # feature, and the lead answers GitHub sign-ins itself.
      - name: Build and start
        env:
          COMPOSE_FILE: docker-compose.yml:testing/e2e/compose.e2e.yaml
        run: docker compose up -d --build
      - name: Quickstart inside the container
        env:
          COMPOSE_FILE: docker-compose.yml:testing/e2e/compose.e2e.yaml
        run: bash scripts/quickstart.sh
      # ADR-0070 d4: the router sends the moved page to oml-web, which sends
      # a signed-out browser to the lead's sign-in carrying the page, and
      # every other path to the lead; oml-web's doctor reaches the lead. Then
      # a person signs in and loads the page through the router.
      - name: oml-web behind the router, its doctor, and a signed-in page
        env:
          COMPOSE_FILE: docker-compose.yml:testing/e2e/compose.e2e.yaml
        run: |
          bash scripts/check_web_hop.sh http://127.0.0.1:8080 docker compose exec -T oml-web /usr/local/bin/oml-web --doctor
          docker compose exec -T oml-server oml web allow e2e@example.com --user e2e
          bash scripts/check_web_signed_in.sh http://127.0.0.1:8080 https://localhost:8080
      - name: Logs on failure
        if: failure()
        env:
          COMPOSE_FILE: docker-compose.yml:testing/e2e/compose.e2e.yaml
        run: docker compose logs
      - name: Stop
        if: always()
        env:
          COMPOSE_FILE: docker-compose.yml:testing/e2e/compose.e2e.yaml
        run: docker compose down -v
      - name: Build the CLI and tag the image with its version
        run: |
          cargo build --release --locked --bin oml
          version="$(./target/release/oml --version | awk '{print $2}')"
          docker tag ghcr.io/e8kor/open-memory-lab:latest "ghcr.io/e8kor/open-memory-lab:$version"
      - name: oml quickstart, then a second run refused as quickstart.exists
        run: |
          # Timed: the Docker tab of docs/start/quickstart.md, start (this step's
          # first command), first held write, first recall (next step).
          date +%s.%N > "$RUNNER_TEMP/qs_t0"
          ./target/release/oml quickstart --dir "$RUNNER_TEMP/oml"
          date +%s.%N > "$RUNNER_TEMP/qs_t1"
          for f in .env keys keys/agent keys/reviewer credentials; do
            stat -c '%a %n' "$RUNNER_TEMP/oml/$f"
          done
          if ./target/release/oml quickstart --dir "$RUNNER_TEMP/oml" 2>"$RUNNER_TEMP/again"; then
            echo "a second quickstart was not refused" >&2; exit 1
          fi
          grep -q quickstart.exists "$RUNNER_TEMP/again"
          bash scripts/check_web_hop.sh http://127.0.0.1:8080 \
            docker compose --project-directory "$RUNNER_TEMP/oml" exec -T oml-web /usr/local/bin/oml-web --doctor
      # The quickstart's stack with the sign-in double turned on (the image
      # above carries it): a person signs in and loads the moved page
      # through the quickstart's router.
      - name: oml quickstart's router serves a signed-in page from oml-web
        run: |
          cp testing/e2e/quickstart.override.yaml "$RUNNER_TEMP/oml/compose.override.yaml"
          docker compose --project-directory "$RUNNER_TEMP/oml" up --detach --wait
          bash scripts/check_web_hop.sh http://127.0.0.1:8080 \
            docker compose --project-directory "$RUNNER_TEMP/oml" exec -T oml-web /usr/local/bin/oml-web --doctor
          OML_CLI_CREDENTIALS="$RUNNER_TEMP/oml/credentials" ./target/release/oml web allow e2e@example.com --user e2e
          bash scripts/check_web_signed_in.sh http://127.0.0.1:8080 https://localhost:8080
      - name: Docker quickstart timing, first held write and first recall
        run: |
          export OML_URL=http://127.0.0.1:8080
          A="$(cat "$RUNNER_TEMP/oml/keys/agent")"
          t2=$(date +%s.%N)
          OML_API_KEY=$A ./target/release/oml write "We deploy on Tuesdays; Friday deploys need two approvals." | tee "$RUNNER_TEMP/write.out"
          grep -q held "$RUNNER_TEMP/write.out"
          OML_API_KEY=$A ./target/release/oml read --query "deploy Friday" --include-unreviewed | tee "$RUNNER_TEMP/read.out"
          grep -q "(held)" "$RUNNER_TEMP/read.out"
          t3=$(date +%s.%N)
          t0=$(cat "$RUNNER_TEMP/qs_t0"); t1=$(cat "$RUNNER_TEMP/qs_t1")
          start=$(echo "$t1 - $t0" | bc -l)
          rest=$(echo "$t3 - $t2" | bc -l)
          total=$(printf '%.0f' "$(echo "$start + $rest" | bc -l)")
          echo "QUICKSTART_DOCKER_SECONDS=$total"
          {
            echo "### Docker quickstart timing"
            echo "- start (oml quickstart, image already built): $(printf '%.1f' "$start") s"
            echo "- first held write and first recall: $(printf '%.1f' "$rest") s"
            echo "- total: ${total} s (QUICKSTART_DOCKER_SECONDS=${total})"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: oml quickstart's logs on failure
        if: failure()
        run: docker compose --project-directory "$RUNNER_TEMP/oml" logs
      - name: Stop oml quickstart's stack
        if: always()
        run: docker compose --project-directory "$RUNNER_TEMP/oml" down -v || true

  image:
    name: release image (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.cargo == 'true' || needs.changes.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        # The release workflow's native runners (release.yml, job image).
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: matrix.platform == 'linux/amd64'
        with:
          python-version: "3.12"
      - name: release.yml builds, merges and signs both platforms
        if: matrix.platform == 'linux/amd64'
        run: |
          pip install --retry 5 --timeout 30 pyyaml==6.0.3
          python scripts/check_release.py
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: oml:ci
      - name: The image's oml prints the workspace version
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          want="oml $(python3 -c 'import tomllib;print(tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"])')"
          got="$(docker run --rm --platform "$PLATFORM" --entrypoint /usr/local/bin/oml oml:ci --version)"
          echo "$PLATFORM: $got"
          [ "$got" = "$want" ] || { echo "expected '$want'" >&2; exit 1; }

  # Every CLI target of release.yml (job cli), on the same native runner, so
  # a platform that stops building or testing fails here, before a tag.
  # Unit tests alone: the end-to-end suite needs Postgres, which only the
  # Linux runners serve (job test runs it).
  cli-matrix:
    name: oml CLI (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.cargo == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          # macOS targets are paused; see docs/engineering/ci-and-toolchain.md "Paused targets".
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      TARGET: ${{ matrix.target }}
      # ring's C, for each musl target, with the wrapper Ubuntu's musl-tools
      # ships for the runner's own architecture, or, when Ubuntu's mirrors
      # cannot be reached, scripts/musl_toolchain.sh's one over Zig's. On the arm64 runner cc counts
      # aarch64-unknown-linux-musl as a cross compile and would otherwise call
      # aarch64-linux-musl-gcc, which musl-tools does not ship
      # (packages.ubuntu.com/noble/arm64/musl-tools/filelist, fetched
      # 2026-11-03). The archiver falls back to the host's ar, and Rust links
      # its self-contained musl with the host's cc, both native here.
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
      - name: musl C toolchain
        if: endsWith(matrix.target, '-linux-musl')
        run: scripts/musl_toolchain.sh
      - run: cargo build --locked --bin oml --target "$TARGET"
      - name: oml --version prints the workspace version
        run: |
          exe=""
          [ "${TARGET%-windows-msvc}" != "$TARGET" ] && exe=".exe"
          # Read through cargo, which every leg has set up; the pkgid ends in
          # the version after a '#' or an '@'.
          want="oml $(cargo pkgid -p oml-cli | sed 's/.*[#@]//')"
          got="$("target/$TARGET/debug/oml$exe" --version | tr -d '\r')"
          echo "$TARGET: $got"
          [ "$got" = "$want" ] || { echo "expected '$want'" >&2; exit 1; }
      - name: The CLI's unit tests
        run: cargo test --locked -p oml-cli --lib --bins --target "$TARGET"
      # The lake build (ADR-0062 d3): the reader and its parquet link on every
      # target the CLI ships for, its tests run on the fixture lake, and the
      # size it adds is printed for #161 against the default build's.
      - name: The lake build builds and reads the fixture lake
        run: |
          exe=""
          [ "${TARGET%-windows-msvc}" != "$TARGET" ] && exe=".exe"
          default_size="$(wc -c < "target/$TARGET/debug/oml$exe")"
          cargo build --locked --bin oml --features lake-sync --target "$TARGET"
          echo "$TARGET: default $default_size bytes, lake build $(wc -c < "target/$TARGET/debug/oml$exe") bytes (debug)"
          cargo test --locked -p oml-cli --features lake-sync --test lake_sync --test lake_build --target "$TARGET"

  # The installers of ADR-0041 against a real, published release, as a user
  # runs them: install.sh piped to sh on Linux and macOS, install.ps1 under
  # PowerShell 7 and, through Invoke-Expression, Windows PowerShell 5.1, each
  # into a user directory, then the installed `oml --version`. One Linux leg
  # has cosign and requires the signature; the others have no cosign and take
  # the checksum-only path.
  install-smoke:
    name: installer (${{ matrix.runner }}${{ matrix.cosign && ', cosign' || '' }})
    needs: changes
    if: needs.changes.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
          - runner: ubuntu-24.04
            cosign: true
          - runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      # The newest published release. The installers' default is the
      # workspace version, which has no release until its tag.
      OML_SMOKE_VERSION: 0.3.1
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v3
        if: matrix.cosign
      - name: shellcheck install.sh
        if: runner.os == 'Linux' && !matrix.cosign
        run: shellcheck -s sh scripts/install/install.sh
      - name: install.sh piped to sh, then oml --version
        if: runner.os != 'Windows'
        shell: bash
        run: |
          flags=(--version "$OML_SMOKE_VERSION" --dir "$RUNNER_TEMP/oml-bin")
          if [ "${{ matrix.cosign }}" = "true" ]; then flags+=(--require-signature); fi
          sh -s -- "${flags[@]}" < scripts/install/install.sh
          got="$("$RUNNER_TEMP/oml-bin/oml" --version)"
          [ "$got" = "oml $OML_SMOKE_VERSION" ] || { echo "got '$got'" >&2; exit 1; }
      - name: install.ps1 under PowerShell 7, then oml --version
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./scripts/install/install.ps1 -Version $env:OML_SMOKE_VERSION -Dir "$env:RUNNER_TEMP\oml-pwsh"
          $got = (& "$env:RUNNER_TEMP\oml-pwsh\oml.exe" --version | Out-String).Trim()
          if ($got -ne "oml $env:OML_SMOKE_VERSION") { throw "got '$got'" }
      - name: install.ps1 through Invoke-Expression under Windows PowerShell 5.1, then oml --version
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:OML_VERSION = $env:OML_SMOKE_VERSION
          $env:OML_INSTALL_DIR = "$env:RUNNER_TEMP\oml-ps51"
          Get-Content -Raw ./scripts/install/install.ps1 | Invoke-Expression
          $got = (& "$env:RUNNER_TEMP\oml-ps51\oml.exe" --version | Out-String).Trim()
          if ($got -ne "oml $env:OML_SMOKE_VERSION") { throw "got '$got'" }

  deny:
    name: cargo deny
    needs: changes
    if: needs.changes.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  plugin:
    name: agent plugin agrees with the server
    needs: changes
    if: needs.changes.outputs.plugins == 'true' || needs.changes.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_plugin.py
      - run: python scripts/check_agent_kit.py
      # The defects a linter finds without opinion: unused names, placeholder-less
      # f-strings, closures over a loop variable (F, E9, B023).
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.6"  # the version m0-spikes.yml pins
      - run: uvx ruff@0.17.4 check --isolated scripts --select F,E9,B023
      # Claude Code's own validator, which errors on a reference to an
      # undeclared option and on an MCP url that is not absolute; 2.1.281 is
      # the first that checks MCP entries (ADR-0040 d2, d5).
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: claude plugin validate --strict
        run: |
          npm install --global --fetch-retries 5 @anthropic-ai/claude-code@2.1.312
          claude plugin validate --strict plugins/oml
          claude plugin validate --strict plugins/oml-admin

  recall-eval:
    # The recall eval through the served oml_read, once per search pipeline,
    # gated (ADR-0049 d9): the job fails when the default pipeline misses
    # its gate or a category of it falls by more than one query against the
    # committed results, or when keyword-all does not reproduce v0.5.0.
    name: recall eval per search pipeline (served)
    needs: changes
    if: needs.changes.outputs.cargo == 'true' || needs.changes.outputs.eval == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: oml
          POSTGRES_PASSWORD: oml_dev_only
          POSTGRES_DB: oml_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oml -d oml_dev"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo build --release --locked --bin oml-server-lead --bin oml
      # The reranker's pinned files (ADR-0053 d3, d10), cached by revision.
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.tmp/oml-models/ms-marco-MiniLM-L6-v2
          key: rerank-ms-marco-MiniLM-L6-v2-233902d25c440f23af6f7d6e94d2946bac0bee0a
      # The learned sparse encoder's pinned files (ADR-0052 d14), cached by
      # revision.
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.tmp/oml-models/doc-v3-distill
          key: sparse-doc-v3-distill-babf71f3c48695e2e53a978208e8aba48335e3c0
      # The command a self-hoster runs (docs/operations/recall-eval.md), so
      # the documented path is the gated one: it fetches the model files the
      # cache missed, checking their digests, and measures every pipeline,
      # bm25-rerank with its deadline raised (ADR-0053 d9) and the sparse
      # pipelines after the encoder drains (ADR-0052 d15).
      - name: Run and gate
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: oml
          PGPASSWORD: oml_dev_only
          OML_BIN_DIR: target/release
          EVAL_MODELS: ${{ github.workspace }}/.tmp/oml-models
        run: bash eval/recall/selfhost.sh "$RUNNER_TEMP/recall-eval"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recall-eval-results
          path: ${{ runner.temp }}/recall-eval/*.json

  recall-eval-data:
    name: recall eval data parses and its labels resolve
    needs: changes
    if: needs.changes.outputs.eval == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python eval/recall/check_data.py

  chart:
    # The Helm chart (deploy/helm/oml; docs/adr/ADR-0033-interim-helm-chart.md
    # d10): rendered and checked, then installed on kind against Postgres in
    # the cluster, claimed through port-forward before anything else reaches
    # it, driven by the quickstart, then restarted, uninstalled and
    # reinstalled to show the keyring claim keeps the signing key.
    name: kubernetes chart (kind, helm install, quickstart)
    needs: changes
    if: needs.changes.outputs.cargo == 'true' || needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      IMAGE: ghcr.io/e8kor/open-memory-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: azure/setup-helm@v4
        with:
          version: v3.22.1
      - name: The chart renders the lead ADR-0033 decides
        run: |
          pip install --retry 5 --timeout 30 pyyaml==6.0.3
          python scripts/check_chart.py
      - name: Build the image from the checkout
        run: |
          version="$(python3 -c 'import tomllib;print(tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"])')"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          # With CI's sign-in double (crates/bins/oml-server-lead/src/e2e.rs),
          # off in every release build.
          docker build --tag "$IMAGE:$version" --build-arg OML_CARGO_FEATURES=oml-server-lead/e2e-sign-in .
      - name: The pod runs as the image's own user
        run: |
          user="$(docker run --rm --entrypoint id "$IMAGE:$VERSION" -u):$(docker run --rm --entrypoint id "$IMAGE:$VERSION" -g)"
          python scripts/check_chart.py --image-user "$user"
      - uses: helm/kind-action@v1
        with:
          cluster_name: oml
      - name: Load the image into kind
        run: kind load docker-image "$IMAGE:$VERSION" --name oml
      # The pod's init script creates the role pair, LOGIN alone, and gives
      # the database to oml_owner; the Secret carries both URLs (ADR-0034 d2,
      # d10 step 2). The probe goes over TCP, which the entrypoint's
      # init-time server does not listen on, so ready means initialised.
      - name: Postgres in the cluster (the deployment pin)
        run: |
          kubectl create namespace oml
          kubectl --namespace oml apply -f - <<'EOF'
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: postgres-init
          data:
            oml-role-pair.sql: |
              CREATE ROLE oml_owner LOGIN PASSWORD 'oml_dev_only';
              CREATE ROLE oml_server LOGIN PASSWORD 'oml_dev_only';
              ALTER DATABASE oml OWNER TO oml_owner;
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: postgres
          spec:
            replicas: 1
            selector:
              matchLabels: {app: postgres}
            template:
              metadata:
                labels: {app: postgres}
              spec:
                containers:
                  - name: postgres
                    image: pgvector/pgvector:pg17
                    env:
                      - {name: POSTGRES_USER, value: oml}
                      - {name: POSTGRES_PASSWORD, value: oml_dev_only}
                      - {name: POSTGRES_DB, value: oml}
                    ports:
                      - containerPort: 5432
                    volumeMounts:
                      - name: init
                        mountPath: /docker-entrypoint-initdb.d
                    readinessProbe:
                      exec:
                        command: [pg_isready, -h, 127.0.0.1, -U, oml, -d, oml]
                      periodSeconds: 2
                volumes:
                  - name: init
                    configMap:
                      name: postgres-init
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: postgres
          spec:
            selector: {app: postgres}
            ports:
              - port: 5432
          EOF
          kubectl --namespace oml rollout status deployment/postgres --timeout=300s
          kubectl --namespace oml create secret generic oml-postgres \
            --from-literal=OML_POSTGRES__URL=postgres://oml_server:oml_dev_only@postgres:5432/oml \
            --from-literal=OML_POSTGRES__OWNER_URL=postgres://oml_owner:oml_dev_only@postgres:5432/oml
          # The web client Secret, made outside the chart (the recommended
          # path; values.yaml web.clientSecret).
          kubectl --namespace oml create secret generic oml-web-client \
            --from-literal=OML_WEB__CLIENT_SECRET="$(openssl rand -hex 32)"
      # An Ingress controller, so the chart's own Ingress routes by path:
      # oml-web's pages to it, everything else to the lead (ADR-0070
      # d4). In the release's namespace, which the NetworkPolicy admits.
      - name: Traefik as the Ingress controller
        run: |
          helm repo add traefik https://traefik.github.io/charts
          # Reached through a port-forward; its Service stays a pending
          # LoadBalancer on kind, so wait on the Deployment, not helm --wait.
          helm install traefik traefik/traefik --version 42.1.3 --namespace oml
          kubectl --namespace oml rollout status deployment/traefik --timeout=300s
          echo "127.0.0.1 oml.test" | sudo tee -a /etc/hosts
      - name: helm install, then wait for readiness
        run: |
          helm install oml deploy/helm/oml --namespace oml \
            --values deploy/helm/oml/ci/kind-values.yaml --wait --timeout 5m
          kubectl --namespace oml rollout status deployment/oml-server-lead --timeout=300s
          kubectl --namespace oml rollout status deployment/oml-web --timeout=300s
      # CI's sign-in double on the lead, before the claim: oauth.issuer, a
      # GitHub client and the address every GitHub sign-in admits.
      - name: The lead's sign-in double
        run: |
          kubectl --namespace oml set env deployment/oml-server-lead \
            OML_OAUTH__ISSUER=https://oml.test:8088 OML_WEB__GITHUB__CLIENT_ID=e2e \
            OML_WEB__GITHUB__CLIENT_SECRET=e2e-double-not-a-secret OML_E2E_SIGN_IN_EMAIL=e2e@example.com
          kubectl --namespace oml rollout status deployment/oml-server-lead --timeout=300s
          # oml-web's public origin is the issuer, so its forms pass the
          # same-origin check the lead's pass (ADR-0045 d8).
          kubectl --namespace oml set env deployment/oml-web OML_WEB__PUBLIC_URL=https://oml.test:8088
          kubectl --namespace oml rollout status deployment/oml-web --timeout=300s
      - name: Claim the enrollment token through port-forward, then the quickstart
        run: |
          docker create --name oml-cli "$IMAGE:$VERSION" >/dev/null
          docker cp oml-cli:/usr/local/bin/oml "$RUNNER_TEMP/oml"
          docker rm oml-cli >/dev/null
          token="$(kubectl --namespace oml logs deployment/oml-server-lead | grep -o 'enr_[0-9a-f]\{48\}' | tail -1)"
          [ -n "$token" ] || { echo "no enrollment token in the lead's log" >&2; exit 1; }
          kubectl --namespace oml port-forward service/oml-server 8080:8080 >"$RUNNER_TEMP/port-forward.log" 2>&1 &
          forward=$!
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8080/readyz >/dev/null 2>&1 && break
            sleep 1
          done
          OML_URL=http://127.0.0.1:8080 OML_CLI="$RUNNER_TEMP/oml" \
          OML_CLI_CREDENTIALS="$RUNNER_TEMP/credentials" OML_ENROLLMENT_TOKEN="$token" \
            bash scripts/quickstart.sh
          OML_CLI_CREDENTIALS="$RUNNER_TEMP/credentials" "$RUNNER_TEMP/oml" web allow e2e@example.com --user e2e
          kill "$forward"
      # Through the chart's Ingress (ADR-0070 d4): oml-web is ready over the
      # hop and its doctor agrees; the moved page sends a signed-out browser
      # to the lead's sign-in; a signed-in person gets the pages from oml-web
      # and runs one act through it; the old ?view= URLs redirect to them.
      - name: The chart's Ingress routes oml-web's pages to it, signed out and signed in
        run: |
          kubectl --namespace oml port-forward service/traefik 8088:80 >"$RUNNER_TEMP/port-forward-ingress.log" 2>&1 &
          forward=$!
          kubectl --namespace oml port-forward service/oml-web 8091:8091 >"$RUNNER_TEMP/port-forward-web.log" 2>&1 &
          web=$!
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8091/readyz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8091/readyz | jq -e '.checks.api == "ok" and .checks.web_client == "secret"'
          bash scripts/check_web_hop.sh http://oml.test:8088 \
            kubectl --namespace oml exec deployment/oml-web -- /usr/local/bin/oml-web --doctor
          bash scripts/check_web_signed_in.sh http://oml.test:8088 https://oml.test:8088
          kill "$forward" "$web"
      - name: A restarted lead keeps its signing key and prints no new token
        run: |
          public_key() {
            kubectl --namespace oml logs deployment/oml-server-lead \
              | sed 's/\x1b\[[0-9;]*m//g' | grep -oE 'public_key"?[=:]"?[0-9a-f]{64}' | tail -1 | grep -oE '[0-9a-f]{64}$'
          }
          before="$(public_key)"
          kubectl --namespace oml rollout restart deployment/oml-server-lead
          kubectl --namespace oml rollout status deployment/oml-server-lead --timeout=300s
          after="$(public_key)"
          echo "before the restart: $before"
          echo "after the restart:  $after"
          if [ -z "$before" ] || [ "$before" != "$after" ]; then
            echo "the restarted lead loaded a different signing key" >&2
            exit 1
          fi
          if kubectl --namespace oml logs deployment/oml-server-lead | grep -q 'enr_'; then
            echo "the claimed deployment printed a new enrollment token" >&2
            exit 1
          fi
          kubectl --namespace oml port-forward service/oml-server 8080:8080 >"$RUNNER_TEMP/port-forward-2.log" 2>&1 &
          forward=$!
          code=""
          for _ in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/readyz || true)"
            [ "$code" = 200 ] && break
            sleep 1
          done
          kill "$forward"
          [ "$code" = 200 ] || { echo "/readyz answered '$code' after the restart" >&2; exit 1; }
      - name: helm uninstall keeps the keyring claim, and a reinstall takes it back
        run: |
          public_key() {
            kubectl --namespace oml logs deployment/oml-server-lead \
              | sed 's/\x1b\[[0-9;]*m//g' | grep -oE 'public_key"?[=:]"?[0-9a-f]{64}' | tail -1 | grep -oE '[0-9a-f]{64}$'
          }
          before="$(public_key)"
          helm uninstall oml --namespace oml --wait --timeout 5m
          kubectl --namespace oml get persistentvolumeclaim oml-keyring
          helm install oml deploy/helm/oml --namespace oml \
            --values deploy/helm/oml/ci/kind-values.yaml --wait --timeout 5m
          after="$(public_key)"
          echo "before the reinstall: $before"
          echo "after the reinstall:  $after"
          if [ -z "$before" ] || [ "$before" != "$after" ]; then
            echo "the reinstalled lead loaded a different signing key" >&2
            exit 1
          fi
          if kubectl --namespace oml logs deployment/oml-server-lead | grep -q 'enr_'; then
            echo "the reinstalled lead printed a new enrollment token" >&2
            exit 1
          fi
      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl --namespace oml get all,pvc -o wide || true
          kubectl --namespace oml describe pods || true
          kubectl --namespace oml logs deployment/oml-server-lead --previous || true
          kubectl --namespace oml logs deployment/oml-server-lead || true
          kubectl --namespace oml logs deployment/oml-web || true
          cat "$RUNNER_TEMP"/port-forward*.log || true

  # The client SDKs of docs/engineering/sdks.md: each suite runs against the
  # server built from this checkout, on a throwaway database and role pair it
  # mints and drops itself, and the generated layers must be current with
  # openapi.yaml. POSTGRES_USER is the container's superuser, so a harness
  # that cannot mint fails here rather than printing its did-not-run line
  # (ADR-0034 d8).
  sdk-python:
    name: Python SDK against the release server
    needs: changes
    if: needs.changes.outputs.sdk == 'true' || needs.changes.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: oml
          POSTGRES_PASSWORD: oml_dev_only
          POSTGRES_DB: oml_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oml -d oml_dev"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo build --release --locked --bin oml-server-lead --bin oml
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.6"  # the version m0-spikes.yml pins
      - name: Lint the hand-written code
        working-directory: sdks/python
        run: |
          uv run --locked --python 3.11 --group generate ruff check src tests
          uv run --locked --python 3.11 --group generate ruff format --check src tests
      - name: pytest on the Python floor
        working-directory: sdks/python
        env:
          OML_SERVER_BIN: ${{ github.workspace }}/target/release/oml-server-lead
          OML_CLI_BIN: ${{ github.workspace }}/target/release/oml
          OML_SDK_TEST_DATABASE_URL: postgres://oml:oml_dev_only@127.0.0.1:5432/oml_dev
          OML_TEST_REQUIRE_SPLIT: "1"
        run: uv run --locked --python 3.11 pytest -v

  sdk-typescript:
    name: TypeScript SDK against the release server
    needs: changes
    if: needs.changes.outputs.sdk == 'true' || needs.changes.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: oml
          POSTGRES_PASSWORD: oml_dev_only
          POSTGRES_DB: oml_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oml -d oml_dev"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo build --release --locked --bin oml-server-lead --bin oml
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install, type-check and build
        working-directory: sdks/typescript
        run: |
          npm ci
          npm run check
          npm run build
      - name: node --test
        working-directory: sdks/typescript
        env:
          OML_SERVER_BIN: ${{ github.workspace }}/target/release/oml-server-lead
          OML_CLI_BIN: ${{ github.workspace }}/target/release/oml
          OML_SDK_TEST_DATABASE_URL: postgres://oml:oml_dev_only@127.0.0.1:5432/oml_dev
          OML_TEST_REQUIRE_SPLIT: "1"
        run: npm test

  sdk-generated:
    name: generated SDK code is current with openapi.yaml
    needs: changes
    if: needs.changes.outputs.sdk == 'true' || needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.6"  # the version m0-spikes.yml pins
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
        working-directory: sdks/typescript
      - run: python scripts/generate_sdks.py --check

  # The one check to require: it succeeds when every job above succeeded or was
  # skipped by the filter, and fails when one failed or was cancelled.
  ci-ok:
    name: ci ok (ci)
    if: always()
    needs: [changes, lint, test, docs-reading-tests, e2e, compose, image, cli-matrix, install-smoke, deny, plugin, recall-eval, recall-eval-data, chart, sdk-python, sdk-typescript, sdk-generated]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every job succeeded or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "a job finished: $r" >&2; exit 1 ;; esac
          done
