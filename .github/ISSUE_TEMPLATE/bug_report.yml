name: Bug report
description: Something in Open Memory Lab doesn't work as documented
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search existing issues first.
        Security problems go through private reporting instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps, commands or requests that shows the problem.
      placeholder: |
        1. docker compose up -d
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release you run, from `oml --version` or the image tag.
      placeholder: v0.3.0
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where does it happen?
      multiple: true
      options:
        - Server
        - oml CLI
        - Claude Code plugin or MCP tools
        - Python SDK
        - TypeScript SDK
        - Documentation
        - Other
    validations:
      required: true
  - type: dropdown
    id: profile
    attributes:
      label: How do you run OML?
      options:
        - One host
        - Compose
        - Cluster
        - Built from source
  - type: textarea
    id: logs
    attributes:
      label: Logs and error output
      description: Paste relevant output. Remove any keys or tokens first.
      render: shell
