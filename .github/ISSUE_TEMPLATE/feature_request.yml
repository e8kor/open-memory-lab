name: Feature request
description: Suggest a capability or an improvement
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation and who it affects before proposing a solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Memory store and recall
        - Workareas and access
        - Artifact store
        - Vocabularies
        - Trusted memory
        - Simulations
        - Datasets
        - Plugins
        - SDKs and integrations
        - Operations and deployment
        - Documentation
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
