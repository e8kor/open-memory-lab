# Workspace manifest — layout and policy per docs/engineering/workspace-plan.md.
# Later phases append members; versions live only in [workspace.dependencies].
[workspace]
resolver = "2"
members = [
    "crates/oml-domain",
    "crates/oml-app",
    "crates/adapters/oml-pg",
    "crates/adapters/oml-fetch",
    "crates/transports/oml-transport-http",
    "crates/bins/oml-server-lead",
    "crates/bins/oml-cli",
    "testing/oml-port-contracts",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
# MSRV = pinned stable minus two minor releases (ci-and-toolchain.md MSRV window)
rust-version = "1.97"
license = "Apache-2.0"

[workspace.dependencies]
oml-app = { path = "crates/oml-app" }
oml-domain = { path = "crates/oml-domain" }
oml-port-contracts = { path = "testing/oml-port-contracts" }
# Dev-dependency surface only: the oml-cli end-to-end test composes the real
# lead in-process; the CLI binary itself depends on no server crate.
oml-server-lead = { path = "crates/bins/oml-server-lead" }
oml-transport-http = { path = "crates/transports/oml-transport-http" }
oml-pg = { path = "crates/adapters/oml-pg" }
oml-fetch = { path = "crates/adapters/oml-fetch" }
axum = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
getrandom = "0.2"
# /metrics on its own listener (ADR-0042 d11, d12): the Prometheus
# project's Rust client, pure Rust.
prometheus-client = "0.25"
# OTLP trace export behind server.otlp_endpoint (ADR-0042 d13): the
# OpenTelemetry API, SDK and protocol crates release together and
# tracing-opentelemetry trails them, so an upgrade moves all four at once.
# Server-only: the CLI depends on none of them.
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
# The OTLP/HTTP protobuf messages and the SDK-to-message transform. The
# lead posts them itself rather than through opentelemetry-otlp, whose
# builder reads OTEL_EXPORTER_OTLP_HEADERS and _COMPRESSION whatever the
# code sets, and d13 reads no OTEL_* variable.
opentelemetry-proto = { version = "0.33", default-features = false, features = [
    "gen-tonic-messages",
    "trace",
] }
prost = { version = "0.14", default-features = false, features = ["std"] }
tracing-opentelemetry = { version = "0.34", default-features = false }
# The exporter's HTTP client, built here so an https collector is reached
# over rustls with ring, the provider sqlx already uses: the exporter's own
# rustls feature would add aws-lc, a C library (ADR-0006 pure Rust).
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "rustls-no-provider",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# The request body counter of the traffic layer (ADR-0042 d2): the trait
# axum's body implements, already in the graph through axum and hyper.
http-body = "1"
# The authorization request's sealed handle (ADR-0031 d9): ChaCha20-Poly1305
# under a key held in memory. Already in the graph through sqlx's
# tls-rustls-ring.
ring = "0.17"
# Blocking HTTP client for the thin-client CLI (ADR-0006 d6: the CLI reaches
# the hexagon only over the network).
ureq = { version = "2.12", features = ["json"] }
toml = "0.8"
# `oml login` reads the key without echo from the terminal (ADR-0039 d15): std
# has no no-echo read, and no crate in the graph offers one. Its libc and
# windows-sys 0.61 are already in the graph.
rpassword = "7.5"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = "0.3"
ed25519-dalek = "2.2"
hex = "0.4"
proptest = "1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
# Runtime query API only — no compile-time checked query macros, so no
# DATABASE_URL at build (workspace-plan.md; the migrate! macro embeds files
# and needs no database).
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "uuid",
    "json",
    "migrate",
    "macros",
] }
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread"] }
# Pure Rust NFC for capture's normalization step (oml-domain; admission.md,
# ADR-0025 d6). Already in the graph through sqlx-postgres's stringprep.
unicode-normalization = "0.1"
# serde feature: idempotency-stored responses serialize ids (oml-app); the
# domain stays deterministic — no v4 feature (workspace-plan.md).
uuid = { version = "1.18", features = ["serde"] }
# The CLI's owner-only files on Windows (oml-cli src/owner_only.rs): std sets
# no DACL, so the Win32 security calls come from Microsoft's bindings, the
# version already in the graph through tokio, mio and clap's anstyle-query.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[workspace.lints.rust]
warnings = "deny"
# forbidden (not just denied) in oml-domain/oml-app via crate-level attribute;
# the workspace floor is deny (workspace-plan.md, workspace manifest policy)
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
