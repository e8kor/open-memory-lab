# Workspace manifest — layout and policy per docs/engineering/workspace-plan.md.
# Later phases append members; versions live only in [workspace.dependencies].
[workspace]
resolver = "2"
members = [
    "crates/shared/oml-page",
    "crates/shared/oml-web-credential",
    "sdks/rust",
    "crates/clients/oml-web",
    "crates/oml-guardrail",
    "crates/oml-scan",
    "crates/oml-domain",
    "crates/oml-app",
    "crates/adapters/oml-pg",
    "crates/adapters/oml-fetch",
    "crates/adapters/oml-delta-log",
    "crates/adapters/oml-rerank",
    "crates/adapters/oml-format",
    "crates/adapters/oml-lake",
    "crates/transports/oml-transport-http",
    "crates/bins/oml-server-lead",
    "crates/bins/oml-cli",
    "crates/bins/oml-lakewriter",
    "testing/oml-port-contracts",
    "testing/oml-test-pg",
]

[workspace.package]
version = "0.7.3"
edition = "2024"
# MSRV = pinned stable minus two minor releases (ci-and-toolchain.md MSRV window)
rust-version = "1.97"
license = "Apache-2.0"

[workspace.dependencies]
oml-page = { path = "crates/shared/oml-page" }
oml-web-credential = { path = "crates/shared/oml-web-credential" }
oml-sdk = { path = "sdks/rust" }
oml-web = { path = "crates/clients/oml-web" }
oml-app = { path = "crates/oml-app" }
oml-domain = { path = "crates/oml-domain" }
oml-guardrail = { path = "crates/oml-guardrail" }
oml-scan = { path = "crates/oml-scan" }
oml-port-contracts = { path = "testing/oml-port-contracts" }
# Throwaway databases for the Postgres suites; a dev-dependency only.
oml-test-pg = { path = "testing/oml-test-pg" }
# Dev-dependency surface only: the oml-cli end-to-end test composes the real
# lead in-process; the CLI binary itself depends on no server crate.
oml-server-lead = { path = "crates/bins/oml-server-lead", default-features = false }
oml-transport-http = { path = "crates/transports/oml-transport-http" }
oml-pg = { path = "crates/adapters/oml-pg" }
# The lake adapter (ADR-0003, ADR-0060): only oml-lakewriter depends on it, so
# neither the lead nor the CLI builds delta-rs (ADR-0060 d1).
oml-lake = { path = "crates/adapters/oml-lake" }
oml-fetch = { path = "crates/adapters/oml-fetch" }
# The claim format adapters (ADR-0056 d3): pure, no I/O.
oml-format = { path = "crates/adapters/oml-format" }
# The minimal Delta `_delta_log` reader (ADR-0062 d3): linked into the CLI only
# under its `lake-sync` feature, which the default `oml` never enables.
oml-delta-log = { path = "crates/adapters/oml-delta-log" }
# Checkpoint reading by column projection, without arrow and without any codec
# but snappy (ADR-0062 d3): only oml-delta-log names it.
parquet = { version = "59", default-features = false, features = ["snap"] }
# Without its `model` feature unless a member asks for it (the lead does,
# by its `rerank` feature), so no graph builds candle by inheritance.
oml-rerank = { path = "crates/adapters/oml-rerank", default-features = false }
axum = "0.8"
expectrl = "0.9"  # dev: drives `oml setup claude-code` on a pseudo-terminal (ADR-0076 d10)
# delta-rs, the whole lake interface (ADR-0006 d2), with DataFusion for
# MERGE and the operator's named queries (ADR-0060 d11). Its 1.x core
# hard-enables the rustls feature, which reaches aws-lc through reqwest
# 0.12: the one C library in the graph, confined to oml-lakewriter
# (ADR-0060 d17). Only oml-lake names it.
deltalake = { version = "1.1.2", default-features = false, features = ["datafusion", "rustls"] }
url = "2.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# The local cross-encoder of the reranking stage (ADR-0053 d2): candle runs
# the model on the CPU in pure Rust (ADR-0006), and tokenizers reads the
# model's own tokenizer.json with its pure-Rust regex backend, never the
# C oniguruma or the C++ esaxx defaults. Only oml-rerank, which only the
# lead depends on, names them, so the CLI's targets never build them.
candle-core = { version = "0.11", default-features = false }
candle-nn = { version = "0.11", default-features = false }
candle-transformers = { version = "0.11", default-features = false }
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
# The reranker's own thread pool (ADR-0053 d5): candle's matrix products and
# the tokenizer split their work over the pool they run in, so the stage's
# CPU is bounded by the pool, never by the host's cores.
rayon = "1.12"
clap = { version = "4.5", features = ["derive", "env"] }
getrandom = "0.2"
# /metrics on its own listener (ADR-0042 d11, d12): the Prometheus
# project's Rust client, pure Rust.
prometheus-client = "0.25"
# OTLP trace export behind server.otlp_endpoint (ADR-0042 d13): the
# OpenTelemetry API, SDK and protocol crates release together and
# tracing-opentelemetry trails them, so an upgrade moves all four at once.
# Server-only: the CLI depends on none of them.
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
# The OTLP/HTTP protobuf messages and the SDK-to-message transform. The
# lead posts them itself rather than through opentelemetry-otlp, whose
# builder reads OTEL_EXPORTER_OTLP_HEADERS and _COMPRESSION whatever the
# code sets, and d13 reads no OTEL_* variable.
opentelemetry-proto = { version = "0.33", default-features = false, features = [
    "gen-tonic-messages",
    "trace",
] }
prost = { version = "0.14", default-features = false, features = ["std"] }
tracing-opentelemetry = { version = "0.34", default-features = false }
# The exporter's HTTP client, built here so an https collector is reached
# over rustls with ring, the provider sqlx already uses: the exporter's own
# rustls feature would add aws-lc, a C library (ADR-0006 pure Rust).
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "rustls-no-provider",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# The request body counter of the traffic layer (ADR-0042 d2): the trait
# axum's body implements, already in the graph through axum and hyper.
http-body = "1"
# The authorization request's sealed handle (ADR-0031 d9): ChaCha20-Poly1305
# under a key held in memory. Already in the graph through sqlx's
# tls-rustls-ring.
ring = "0.17"
# Blocking HTTP client for the thin-client CLI (ADR-0006 d6: the CLI reaches
# the hexagon only over the network).
ureq = { version = "2.12", features = ["json"] }
toml = "0.8"
# The test oracle of the `rust` adapter's prefix lexer (ADR-0061 d3): a
# dev-dependency of oml-cli, which never links into the shipped binary.
syn = { version = "2.0", default-features = false, features = ["full", "parsing"] }
# `oml login` reads the key without echo from the terminal (ADR-0039 d15): std
# has no no-echo read, and no crate in the graph offers one. Its libc and
# windows-sys 0.61 are already in the graph.
rpassword = "7.5"
# The web client secret file's owner is checked against the process's
# effective user (#262): std has no geteuid, and rustix answers it without
# unsafe code. Already in the graph through tempfile.
rustix = { version = "1.1", default-features = false, features = ["std", "process"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = "0.3"
ed25519-dalek = "2.2"
hex = "0.4"
proptest = "1.6"
# The deterministic scan's rule set (ADR-0065 d1): linear-time matching, no
# backtracking, pure Rust; already in the graph through tokenizers.
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
# Runtime query API only — no compile-time checked query macros, so no
# DATABASE_URL at build (workspace-plan.md; the migrate! macro embeds files
# and needs no database).
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "uuid",
    "json",
    "migrate",
    "macros",
] }
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread"] }
# Pure Rust NFC for capture's normalization step (oml-domain; admission.md,
# ADR-0025 d6). Already in the graph through sqlx-postgres's stringprep.
unicode-normalization = "0.1"
# serde feature: idempotency-stored responses serialize ids (oml-app); the
# domain stays deterministic — no v4 feature (workspace-plan.md).
uuid = { version = "1.18", features = ["serde"] }
# The CLI's owner-only files on Windows (oml-cli src/owner_only.rs): std sets
# no DACL, so the Win32 security calls come from Microsoft's bindings, the
# version already in the graph through tokio, mio and clap's anstyle-query.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[workspace.lints.rust]
warnings = "deny"
# forbidden (not just denied) in oml-domain/oml-app via crate-level attribute;
# the workspace floor is deny (workspace-plan.md, workspace manifest policy)
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# The reranker's numerics at opt-level 3 in test builds too (ADR-0053 d10):
# unoptimised matrix products made CI's real-model tests minutes long. Only
# these packages; the workspace's own code stays at the dev profile.
[profile.dev.package.gemm-common]
opt-level = 3
[profile.dev.package.gemm-f32]
opt-level = 3
[profile.dev.package.gemm]
opt-level = 3
[profile.dev.package.candle-core]
opt-level = 3
[profile.dev.package.candle-nn]
opt-level = 3
[profile.dev.package.candle-transformers]
opt-level = 3
[profile.dev.package.tokenizers]
opt-level = 3
# The scan's matcher (ADR-0065 d9): its tests scan the documentation set as
# the false-positive corpus, a minute long unoptimised.
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.regex-syntax]
opt-level = 3
[profile.dev.package.aho-corasick]
opt-level = 3
[profile.dev.package.memchr]
opt-level = 3
