[package]
name = "oml-rerank"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The local cross-encoder behind oml-app's Reranker port (ADR-0053): a BERT-class model on the CPU through candle, pure Rust, under a concurrency cap and a deadline; the lead alone depends on it, so the CLI never carries it."

[dependencies]
oml-app.workspace = true
candle-core.workspace = true
candle-nn.workspace = true
candle-transformers.workspace = true
tokenizers.workspace = true
rayon.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
sha2.workspace = true
hex.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt"] }

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "time", "rt", "macros", "rt-multi-thread"] }
oml-port-contracts.workspace = true

[lints]
workspace = true
