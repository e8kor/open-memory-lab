# Written by `oml quickstart` (ADR-0041 d9): the docker profile of
# docs/operations/deployment.md ("The docker profile", ADR-0023 d7) on one
# machine, reachable from this machine alone: Postgres, one lead, the web
# console as its own process (oml-web), and a path router that gives the
# browser one origin, routing as a production proxy does (ADR-0070 d4).
#
# The image is pinned to the version of the CLI that wrote this file. The
# passwords are in .env beside it, generated by the same run and owner-only:
# the cluster's superuser stays the administrator, and the lead migrates as
# oml_owner and serves as oml_server, which owns nothing (ADR-0034 d2, d4).
# The lead and oml-web read one more value from it, the web client secret
# (ADR-0070 d2).
# The stack is one trust domain; TLS and exposure beyond 127.0.0.1 are the
# deployment guide's, not this file's.
#
# The project name is derived from this directory's absolute path, so a
# second quickstart in another directory of the same name is a project, and
# volumes, of its own.
name: @@PROJECT@@

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: oml
      POSTGRES_PASSWORD: ${OML_POSTGRES_PASSWORD:?run oml quickstart, which writes .env}
      POSTGRES_DB: oml
    configs:
      # Run by the image's entrypoint on an empty volume only.
      - source: oml-role-pair
        target: /docker-entrypoint-initdb.d/oml-role-pair.sql
    volumes:
      - oml-pgdata:/var/lib/postgresql/data
    healthcheck:
      # Over TCP, so the check passes only once the init script ran.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U oml -d oml"]
      interval: 5s
      timeout: 3s
      retries: 10

  oml-server:
    image: ghcr.io/e8kor/open-memory-lab:@@VERSION@@
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      OML_POSTGRES__URL: postgres://oml_server:${OML_SERVER_PASSWORD:?run oml quickstart, which writes .env}@postgres:5432/oml
      OML_POSTGRES__OWNER_URL: postgres://oml_owner:${OML_OWNER_PASSWORD:?run oml quickstart, which writes .env}@postgres:5432/oml
      OML_SERVER__LISTEN: 0.0.0.0:8080
      OML_KMS__KEYRING_PATH: /var/lib/oml/keyring/signing.key
      OML_WEB__CLIENT_SECRET: ${OML_WEB_CLIENT_SECRET:?run oml quickstart, which writes .env}
    volumes:
      # The signing keyring: the lead is the only service that mounts it.
      - oml-keyring:/var/lib/oml/keyring

  # The web console, from the same image under its own entrypoint. It
  # reaches the lead on this stack's own network, so plain http to the
  # service name is allowed explicitly (ADR-0070 d4).
  oml-web:
    image: ghcr.io/e8kor/open-memory-lab:@@VERSION@@
    entrypoint: ["/usr/local/bin/oml-web"]
    depends_on:
      - oml-server
    environment:
      OML_WEB__API_URL: http://oml-server:8080
      OML_WEB__ALLOW_PLAIN_HTTP_API: "true"
      OML_WEB__LISTEN: 0.0.0.0:8091
      OML_WEB__CLIENT_SECRET: ${OML_WEB_CLIENT_SECRET:?run oml quickstart, which writes .env}
      OML_WEB__PUBLIC_URL: http://127.0.0.1:@@PORT@@

  # The one published port: each page oml-web serves goes to it, every other
  # path (the API, /mcp, /oauth, sign-in, /readyz) to the lead.
  router:
    image: caddy:2.11.9
    depends_on:
      - oml-server
      - oml-web
    configs:
      - source: oml-router
        target: /etc/caddy/Caddyfile
    ports:
      - "127.0.0.1:@@PORT@@:8080"

configs:
  oml-router:
    content: |
      {
      	admin off
      	auto_https off
      }
      :8080 {
      	@oml_web {
      		method GET
      		path /web
      		query view=guardrails
      	}
      	reverse_proxy @oml_web oml-web:8091
      	reverse_proxy oml-server:8080
      }
  oml-role-pair:
    content: |
      CREATE ROLE oml_owner LOGIN PASSWORD '${OML_OWNER_PASSWORD}';
      CREATE ROLE oml_server LOGIN PASSWORD '${OML_SERVER_PASSWORD}';
      ALTER DATABASE oml OWNER TO oml_owner;

volumes:
  oml-pgdata:
  oml-keyring:
