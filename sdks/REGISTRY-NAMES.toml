# The names the SDKs are published under on PyPI and npm. The operator chose `open-memory-lab-sdk`
# for both on 2026-11-12; neither registry reserves a name before the first upload. The names in the
# two manifests (`name` in sdks/python/pyproject.toml and sdks/typescript/package.json) are what
# the packages are called, and must equal `python` and `npm` below.
#
# release.yml's publish-sdk-pypi and publish-sdk-npm jobs run scripts/check_sdk_registry_names.py
# first and stop while `decided` is false, or while `python` and `npm` below are not exactly the
# names in the manifests. Changing a name is one reviewed change: the manifests, the lock entries,
# the Python client's metadata call and this file (docs/contributing/releasing.md, "Publishing the
# SDKs"). Publishing also needs the repository variable PUBLISH_SDKS, which the operator sets.
decided = true
python = "open-memory-lab-sdk"
npm = "open-memory-lab-sdk"
