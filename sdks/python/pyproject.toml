[project]
name = "oml-sdk"
version = "0.7.1"
description = "Python client for the Open Memory Lab HTTP API: a client generated from openapi.yaml and a thin hand-written wrapper."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "e8kor" }]
keywords = ["memory", "agents", "mcp", "open-memory-lab", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "attrs>=22.2.0",
    "httpx>=0.23.1,<0.29.0",
]

[project.urls]
Homepage = "https://e8kor.github.io/open-memory-lab/"
Documentation = "https://e8kor.github.io/open-memory-lab/engineering/sdks/"
Repository = "https://github.com/e8kor/open-memory-lab"
Issues = "https://github.com/e8kor/open-memory-lab/issues"
Changelog = "https://e8kor.github.io/open-memory-lab/changelog/"

# docs/engineering/sdks.md: the generator is pinned here and locked, with its
# whole tree (ruff included), in uv.lock.
[dependency-groups]
dev = ["pytest==9.1.1"]
generate = ["openapi-python-client==0.29.1"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oml_sdk"]

# What a release ships (scripts/build_sdk_packages.py checks it): the source
# and the licence, not the tests, which need a server and a database, nor
# the lock file, which pins the generator's tree.
[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Skip reasons in the summary, so a local run without a superuser shows its
# `did not run: <role> cannot create roles` line (tests/conftest.py).
addopts = "-rs"

# The hand-written code only; the generated layer is formatted by the
# generator's own post-hooks (openapi-python-client.yaml).
[tool.ruff]
line-length = 100
extend-exclude = ["src/oml_sdk/generated"]

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]
